apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sovara-sovereign-intelligence-court
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      serviceAccountName: REPLACE_WITH_SOVARA_RUNTIME_SERVICE_ACCOUNT
      containerConcurrency: 16
      timeoutSeconds: 900
      containers:
        - image: REPLACE_WITH_IMMUTABLE_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          env:
            - name: SOVARA_STATE_BACKEND
              value: gcs
            - name: SOVARA_STATE_BUCKET
              value: REPLACE_WITH_PRIVATE_DURABLE_STATE_BUCKET
            - name: SOVARA_STATE_PREFIX
              value: sovara/sic-v2
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_OPENROUTER_SECRET_NAME
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
