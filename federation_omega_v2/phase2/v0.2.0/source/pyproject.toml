[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federation-omega-v2-core"
version = "0.2.0"
description = "Event-sourced Federation Omega canonical graph and bounded reference mission."
requires-python = ">=3.11"

[project.scripts]
federation-omega-v2 = "federation_omega_v2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["federation_omega_v2*"]
