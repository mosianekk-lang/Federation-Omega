[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realityguard"
version = "0.4.1"
description = "Deterministic truth protection, reuse-first routing and governed material-cycle upgrades"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
realityguard = "realityguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
