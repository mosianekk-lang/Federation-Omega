apiVersion: apps/v1
kind: Deployment
metadata:
  name: seb-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: seb-api}
  template:
    metadata:
      labels: {app: seb-api}
    spec:
      serviceAccountName: seb-api
      containers:
        - name: api
          image: registry.example.invalid/seb-omega:1.0.0
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: seb-api}
spec:
  selector: {app: seb-api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: seb-api}
