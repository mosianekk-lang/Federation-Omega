apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: seb-default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: seb-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: seb-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
