version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-runtime:
        patterns:
          - fastapi
          - uvicorn*
          - pydantic
          - httpx
      provider-clients:
        patterns:
          - openai
          - google-cloud-firestore

# GitHub Actions updates are intentionally excluded while this public source
# repository remains under Airlock execution quarantine. Action upgrades must
# be focused, SHA-pinned changes limited to active allowlisted workflows and
# independently pass Airlock and public-leak-guard admission.
