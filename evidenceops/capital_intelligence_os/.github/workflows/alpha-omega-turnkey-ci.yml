name: Alpha Omega Turnkey CI

on:
  push:
    paths:
      - 'systems/alpha-omega-turnkey/**'
      - '.github/workflows/alpha-omega-turnkey-ci.yml'
  pull_request:
    paths:
      - 'systems/alpha-omega-turnkey/**'
      - '.github/workflows/alpha-omega-turnkey-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: systems/alpha-omega-turnkey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: alpha-omega examples/concept.json --workspace ./ci-workspace --build
      - name: Verify generated operational artifacts
        run: |
          test -d ci-workspace/receipts
          test "$(find ci-workspace -name architecture.json | wc -l)" -ge 1
          test "$(find ci-workspace -name work_packets.json | wc -l)" -ge 1
          test "$(find ci-workspace -name maintenance.json | wc -l)" -ge 1
