name: IPEP Consensus Transcription v3 CI

on:
  push:
    branches: [main]
    paths:
      - 'ipep/audio_engine_v3/**'
      - '.github/workflows/ipep-consensus-transcription-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipep-consensus-transcription-v3-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consensus proof suite
        working-directory: ipep/audio_engine_v3
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest discover -s tests -v
          python -m compileall -q evidenceops_consensus
      - name: Build immutable source package
        run: |
          set -euo pipefail
          mkdir -p /tmp/ipep-consensus-v3
          cp -R ipep/audio_engine_v3 /tmp/ipep-consensus-v3/source
          find /tmp/ipep-consensus-v3/source -type d -name __pycache__ -prune -exec rm -rf {} +
          cd /tmp/ipep-consensus-v3
          zip -X -r ipep-consensus-transcription-v3-source.zip source >/dev/null
          sha256sum ipep-consensus-transcription-v3-source.zip > ipep-consensus-transcription-v3-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ipep-consensus-transcription-v3-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/ipep-consensus-v3/ipep-consensus-transcription-v3-source.zip
            /tmp/ipep-consensus-v3/ipep-consensus-transcription-v3-source.zip.sha256
