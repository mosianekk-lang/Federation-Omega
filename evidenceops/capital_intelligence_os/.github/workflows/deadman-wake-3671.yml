name: Deadman Wake 3671

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadman-wake-3671
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FO_DEADMAN_WEBAPP_URL: ${{ secrets.FO_DEADMAN_WEBAPP_URL }}
      FO_DEADMAN_SIGNATURE: ${{ secrets.FO_DEADMAN_SIGNATURE }}
    steps:
      - name: Preflight secret-backed route
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FO_DEADMAN_WEBAPP_URL:-}" || {
            echo "FO_DEADMAN_WEBAPP_URL is not configured; wake remains held."
            exit 78
          }
          test -n "${FO_DEADMAN_SIGNATURE:-}" || {
            echo "FO_DEADMAN_SIGNATURE is not configured; wake remains held."
            exit 78
          }

      - name: Post signed deadman generation 3671
        shell: bash
        run: |
          set -euo pipefail
          body=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "version": "FO_SIGNED_DEADMAN_RECEIPTS_V2_20260719",
              "action": "QUEUE_DEADMAN_TICK",
              "jobName": "projects/sov-hybrid-suite/locations/europe-west1/jobs/fo-apps-script-queue-deadman",
              "generation": 3671,
              "signature": os.environ["FO_DEADMAN_SIGNATURE"],
          }, separators=(",", ":")))
          PY
          )

          code=$(curl -sS -L \
            --connect-timeout 10 \
            --max-time 30 \
            -D response.headers \
            -o response.body \
            -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$body" \
            "$FO_DEADMAN_WEBAPP_URL")

          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{value=$0} END{sub(/^[^:]*:[[:space:]]*/,"",value); gsub(/\r/,"",value); print value}' response.headers)
          echo "HTTP $code"
          echo "Content-Type: ${content_type:-unknown}"

          test "$code" -ge 200
          test "$code" -lt 300

          if grep -Eqi 'Access Denied|You need access|Sign in' response.body; then
            echo "Deadman endpoint rejected the unauthenticated GitHub runner; no queue action is proven."
            exit 77
          fi

          if [[ "${content_type,,}" != application/json* ]]; then
            echo "Deadman endpoint returned a non-JSON response; action semantics remain unverified."
            exit 76
          fi

          python - <<'PY'
          import json
          with open("response.body", "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          print(json.dumps(payload, sort_keys=True))
          if not any(payload.get(key) for key in ("ok", "success", "queued", "receiptId", "result")):
              raise SystemExit("No action-specific success field was returned.")
          PY
