name: PFRD Omega Cloud Run Canary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pfrd-omega-cloudrun-canary.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: pfrd-omega-cloudrun-canary
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  AR_REPOSITORY: federation-omega
  SERVICE: pfrd-omega-gateway-canary
  BASELINE_SERVICE: architron9
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  SOURCE_IMAGE: ghcr.io/mosianekk-lang/federation-omega-pfrd-omega@sha256:37cd7b0a90e07772958c277ee26847c7373c194e06f469752990a8dbf0ff5d75
  SOURCE_IMAGE_DIGEST: sha256:37cd7b0a90e07772958c277ee26847c7373c194e06f469752990a8dbf0ff5d75
  SOURCE_ARCHIVE_SHA256: dea38b047eb6ebfd5983d31bd1d4c94e0d7e2c9af1eb264d9ca8864c89b8d19e
  PFRD_VERSION: 2.1.0

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud through keyless OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify established WIF and deployment controls
        run: |
          set -euo pipefail
          SERVICE="$BASELINE_SERVICE" ./ops/bootstrap_github_wif.sh --verify | tee /tmp/wif-receipt.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/wif-receipt.json', encoding='utf-8'))
          assert payload['receipt'] == 'FEDOMEGA-WIF-CLOUD-VERIFIED', payload
          assert payload['state'] == 'VERIFIED', payload
          assert payload['mutation_performed'] is False, payload
          PY

      - name: Capture isolated-service baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/pfrd-deploy
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/pfrd-deploy/baseline-service.json 2>/dev/null; then
            echo EXISTING > /tmp/pfrd-deploy/baseline-state.txt
          else
            echo NOT_FOUND > /tmp/pfrd-deploy/baseline-state.txt
            printf '{}\n' > /tmp/pfrd-deploy/baseline-service.json
          fi

      - name: Copy qualified image into Artifact Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          TARGET_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/pfrd-omega-gateway:${GITHUB_SHA}"
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_TAG"
          docker push "$TARGET_TAG"

          TARGET_DIGEST=$(gcloud artifacts docker images describe "$TARGET_TAG" \
            --project "$PROJECT_ID" --format='value(image_summary.digest)')
          test -n "$TARGET_DIGEST"
          printf '%s\n' "$TARGET_TAG" > /tmp/pfrd-deploy/target-image.txt
          printf '%s\n' "$TARGET_DIGEST" > /tmp/pfrd-deploy/target-digest.txt
          printf '%s@%s\n' "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/pfrd-omega-gateway" "$TARGET_DIGEST" > /tmp/pfrd-deploy/target-ref.txt

      - name: Generate canary-only separated secrets
        run: |
          set -euo pipefail
          umask 077
          random_secret() { openssl rand -hex 32; }
          cat > /tmp/pfrd-env.yaml <<EOF
          PFRD_PUBLIC_API_KEY: "$(random_secret)"
          PFRD_ADMIN_API_KEY: "$(random_secret)"
          PFRD_SERVICE_TOKEN: "$(random_secret)"
          PFRD_PROOF_SIGNING_KEY: "$(random_secret)"
          PFRD_APPROVAL_SIGNING_KEY: "$(random_secret)"
          PFRD_CAPABILITY_SIGNING_KEY: "$(random_secret)"
          PFRD_RELEASE_SIGNING_KEY: "$(random_secret)"
          DATABASE_URL: "sqlite+pysqlite:////tmp/pfrd-omega.db"
          OPENAI_API_KEY: ""
          OPENAI_MODEL: "gpt-5.6-sol"
          OPENAI_REASONING_EFFORT: "high"
          PFRD_ACTIVATION_MODE: "POLICY_ONLY"
          PFRD_POLICY_VERSION: "2.1.0"
          PFRD_PROVIDER_ALLOWLIST: "localhost,127.0.0.1"
          PFRD_DEV_MODE: "false"
          PFRD_REQUIRE_OPA: "false"
          PFRD_DISTRIBUTED_MODE: "false"
          EOF

      - name: Deploy isolated zero-traffic Cloud Run canary
        run: |
          set -euo pipefail
          TARGET_REF=$(cat /tmp/pfrd-deploy/target-ref.txt)
          CANARY_TAG="pfrd-v210-${GITHUB_SHA:0:8}"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$TARGET_REF" \
            --service-account "$RUNTIME_SA" \
            --platform managed \
            --execution-environment gen2 \
            --port 8080 \
            --command uvicorn \
            --args services.gateway:app,--host,0.0.0.0,--port,8080 \
            --env-vars-file /tmp/pfrd-env.yaml \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 20 \
            --timeout 60s \
            --min-instances 0 \
            --max-instances 1 \
            --ingress all \
            --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=5,failureThreshold=12 \
            --deploy-health-check \
            --tag "$CANARY_TAG" \
            --no-traffic \
            --quiet

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/pfrd-deploy/service-after.json

          python - "$CANARY_TAG" <<'PY' > /tmp/pfrd-deploy/provider-state.json
          import json, sys
          tag = sys.argv[1]
          service = json.load(open('/tmp/pfrd-deploy/service-after.json', encoding='utf-8'))
          status = service.get('status', {})
          created = status.get('latestCreatedRevisionName', '')
          ready = status.get('latestReadyRevisionName', '')
          conditions = status.get('conditions', [])
          tagged = next((item for item in status.get('traffic', []) if item.get('tag') == tag), {})
          default_traffic = [item for item in status.get('traffic', []) if item.get('percent', 0)]
          if not created or created != ready:
              raise SystemExit(f'Cloud Run canary not ready: created={created!r} ready={ready!r}')
          if not tagged.get('url'):
              raise SystemExit(f'Cloud Run tag URL missing for {tag!r}')
          if any(item.get('revisionName') == created and item.get('percent', 0) > 0 for item in default_traffic):
              raise SystemExit('Canary revision received non-zero production traffic')
          print(json.dumps({
              'service': service.get('metadata', {}).get('name'),
              'revision': created,
              'latest_ready_revision': ready,
              'tag': tag,
              'tag_url': tagged.get('url'),
              'canary_percent': tagged.get('percent', 0),
              'production_traffic': default_traffic,
              'conditions': conditions,
              'startup_probe': '/health',
              'deploy_health_check': True,
              'ready': True,
              'production_traffic_unchanged': True,
          }, sort_keys=True))
          PY

      - name: Build provider-native deployment receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p deployments/pfrd-omega /tmp/pfrd-deploy
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path, default):
              p = Path(path)
              if not p.exists(): return default
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc: return {'read_error': type(exc).__name__}

          def read_text(path):
              p = Path(path)
              return p.read_text(encoding='utf-8').strip() if p.exists() else None

          provider = read_json('/tmp/pfrd-deploy/provider-state.json', {})
          wif = read_json('/tmp/wif-receipt.json', {})
          receipt = {
              'receipt': 'PFRD-OMEGA-CLOUDRUN-CANARY-RECEIPT',
              'version': os.environ['PFRD_VERSION'],
              'classification': 'CLOUD_RUN_ZERO_TRAFFIC_CANARY_DEPLOYED' if provider.get('ready') else 'CLOUD_RUN_DEPLOYMENT_NOT_PROVEN',
              'workflow_job_status': '${{ job.status }}',
              'project': os.environ['PROJECT_ID'],
              'region': os.environ['REGION'],
              'service': os.environ['SERVICE'],
              'source_image': os.environ['SOURCE_IMAGE'],
              'source_image_digest': os.environ['SOURCE_IMAGE_DIGEST'],
              'source_archive_sha256': os.environ['SOURCE_ARCHIVE_SHA256'],
              'artifact_registry_image': read_text('/tmp/pfrd-deploy/target-image.txt'),
              'artifact_registry_digest': read_text('/tmp/pfrd-deploy/target-digest.txt'),
              'artifact_registry_immutable_ref': read_text('/tmp/pfrd-deploy/target-ref.txt'),
              'baseline_state': read_text('/tmp/pfrd-deploy/baseline-state.txt'),
              'provider_state': provider,
              'wif_receipt': wif,
              'activation_mode': 'POLICY_ONLY',
              'distributed_mode': False,
              'openai_key_injected': False,
              'traffic_promoted': False,
              'existing_services_modified': False,
              'qualified_runtime_evidence': {
                  'github_distributed_kernel_run': 30437804050,
                  'github_qualification_artifact_sha256': 'a0ef580f60e08fcd6eccb5b462472ad1ca5a6c88138987d31f9625958d470791',
                  'ci_classification': 'CI_DISTRIBUTED_KERNEL_QUALIFIED',
              },
              'not_claimed': [
                  'PRODUCTION_SEALED',
                  'KERNEL_ENFORCED on Cloud Run',
                  'persistent database durability',
                  'live OpenAI model execution',
                  'production traffic promotion',
              ],
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_sha': os.environ['GITHUB_SHA'],
          }
          out = Path('deployments/pfrd-omega/CLOUD_RUN_CANARY_RECEIPT.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('/tmp/pfrd-deploy/CLOUD_RUN_CANARY_RECEIPT.json').write_text(out.read_text(encoding='utf-8'), encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist deployment receipt to main
        if: always()
        run: |
          set -euo pipefail
          git config user.name "pfrd-omega-deployer[bot]"
          git config user.email "pfrd-omega-deployer[bot]@users.noreply.github.com"
          git add deployments/pfrd-omega/CLOUD_RUN_CANARY_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Deployment receipt unchanged"
          else
            git commit -m "Record PFRD Omega Cloud Run canary receipt"
            git push origin HEAD:main
          fi

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfrd-omega-cloudrun-canary-receipt
          if-no-files-found: error
          retention-days: 30
          path: /tmp/pfrd-deploy/CLOUD_RUN_CANARY_RECEIPT.json
