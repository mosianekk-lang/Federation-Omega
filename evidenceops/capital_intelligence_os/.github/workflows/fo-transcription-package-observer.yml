name: Observe FO Transcription Package

on:
  workflow_run:
    workflows: ['Package FO Transcription Bridge']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-package-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture package run and artifact identifiers
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/run.json
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY' > deployment_receipts/fo-transcription-package-latest.json
          import json, os
          from datetime import datetime, timezone
          run = json.load(open('/tmp/run.json', encoding='utf-8'))
          raw = json.load(open('/tmp/artifacts.json', encoding='utf-8'))
          artifacts = [{
              'id': a.get('id'),
              'name': a.get('name'),
              'size_in_bytes': a.get('size_in_bytes'),
              'expired': a.get('expired'),
              'created_at': a.get('created_at'),
              'expires_at': a.get('expires_at'),
          } for a in raw.get('artifacts', [])]
          payload = {
              'receipt': 'FO-TRANSCRIPTION-PACKAGE-WORKFLOW-OBSERVATION',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'run_id': int(os.environ['RUN_ID']),
              'run_url': os.environ['RUN_URL'],
              'conclusion': os.environ['RUN_CONCLUSION'],
              'source_sha': os.environ['SOURCE_SHA'],
              'run_attempt': run.get('run_attempt'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'artifacts': artifacts,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Publish package receipt to main
        run: |
          set -euo pipefail
          git config user.name 'federation-omega-package-observer'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add deployment_receipts/fo-transcription-package-latest.json
          git commit -m 'Record FO transcription package observation [skip ci]' || exit 0
          git push origin HEAD:main
