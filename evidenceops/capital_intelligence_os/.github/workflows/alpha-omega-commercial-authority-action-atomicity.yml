name: Alpha Omega Commercial Authority Action Atomicity Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-atomicity.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-action-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run authority action atomicity regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute authority action atomicity proof
        run: >-
          python -m alpha_omega_commercial.prove_authority_action_atomicity
          --output artifacts

      - name: Validate contract checkpoint API and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'authority_action_atomicity_contract.json').read_text())
          checkpoint = json.loads((root / 'authority_action_atomicity_checkpoint.json').read_text())
          api = json.loads((root / 'canonical_commercial_api.json').read_text())
          receipt = json.loads(Path('artifacts/authority-action-atomicity-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-ATOMICITY-V6'
          assert contract['stage_scope'] == ['C03', 'C11', 'C12', 'C13', 'C15']
          rules = contract['atomic_action_rules']
          assert rules['commercial_ledger_restored_on_failure'] is True
          assert rules['commercial_state_restored_on_failure'] is True
          assert rules['external_evidence_state_restored_on_failure'] is True
          assert rules['governed_owner_receipt_state_restored_on_failure'] is True
          assert rules['nested_transactions_rejected'] is True
          assert rules['partial_state_visible_after_failure'] is False
          assert rules['provider_authority_held_for_full_action'] is True
          assert rules['successful_action_sealed_to_transaction'] is True
          assert rules['transaction_ledger_hash_linked'] is True
          assert rules['transaction_ledger_restart_safe'] is True
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          assert api['api_id'] == 'AO-COMMERCIAL-CANONICAL-API-V3'
          assert 'AO-COMMERCIAL-AUTHORITY-ACTION-ATOMICITY-V6' in api['capability_lineage']
          assert 'AtomicAuthoritySnapshotCommercialControlPlane' in api['canonical_lineage']
          assert api['canonical_class'] == 'AuthoritySnapshotCommercialControlPlane'
          assert api['capability_revision'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-BINDING-V5'
          assert api['current_canonical_class'] in api['canonical_lineage']
          assert api['current_capability_revision'] in api['capability_lineage']
          assert api['authority_use']['atomic_action_commit_required'] is True
          assert api['authority_use']['partial_state_visible_after_failure'] is False
          assert api['authority_use']['provider_authority_held_for_full_action'] is True
          assert api['persistence']['authority_action_transaction'] == 'HASH_LINKED_PREPARE_COMMIT_ROLLBACK_RESTART_SAFE'
          assert api['service_first_strategy'] == 'SERVICE_ENABLED_PLATFORM_BEFORE_SELF_SERVICE_SAAS'
          assert api['verified_live_revenue_events'] == 0
          assert api['full_commercial_maturity'] is False

          assert checkpoint['dependency_checkpoint']['preceding_pull_request'] == 126
          assert checkpoint['dependency_checkpoint']['preceding_merge_commit'] == '35331349e2e9f24db96cdc299db3f3f817670ab6'
          assert checkpoint['status'] in {
              'AUTHORITY_ACTION_ATOMICITY_IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'AUTHORITY_ACTION_ATOMICITY_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED',
          }
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert receipt['status'] == 'AUTHORITY_ACTION_ATOMICITY_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          assert receipt['atomicity']['provider_authority_held_for_full_action'] is True
          assert receipt['atomicity']['partial_state_visible_after_failure'] is False
          assert receipt['atomicity']['exact_file_restoration_on_failure'] is True
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_action_atomicity.py'),
              Path('alpha_omega_commercial/prove_authority_action_atomicity.py'),
              Path('alpha_omega_commercial/test_authority_action_atomicity.py'),
              Path('alpha_omega_commercial/authority_action_atomicity_contract.json'),
              Path('alpha_omega_commercial/authority_action_atomicity_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable authority action atomicity proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-authority-action-atomicity-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
