name: Alpha Omega Commercial Authority Snapshot Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-snapshot-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-snapshot-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-snapshot-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial release package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run authority snapshot and release regression tests
        working-directory: alpha_omega_commercial
        run: >-
          python -m unittest -v
          test_authority_snapshot_control_plane.py
          test_authority_snapshot_release.py
          test_governed_commercial_assurance.py
          test_authority_refresh.py

      - name: Execute release reconciliation proof
        run: >-
          python alpha_omega_commercial/prove_authority_snapshot_release.py
          --output alpha_omega_commercial/artifacts/c15/authority-snapshot-release/reconciliation-receipt.json

      - name: Validate release proof and commercial boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          release = json.loads((root / 'authority_snapshot_release_receipt.json').read_text())
          checkpoint = json.loads((root / 'authority_snapshot_checkpoint.json').read_text())
          proof = json.loads((root / 'artifacts/c15/authority-snapshot-release/reconciliation-receipt.json').read_text())
          api = json.loads((root / 'canonical_commercial_api.json').read_text())

          assert release['status'] == 'AUTHORITY_SNAPSHOT_RELEASE_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert release['receipt_sha256'] == '8eb6acd0ce3ed3307a01de470d0d5377fc8a4b2dcc903e834362fdf403c1141c'
          assert release['final_head_provider_proof']['artifact_id'] == 8879850560
          assert release['google_drive_release']['file_id'] == '1cTzy5o0kn4SzDBYm5cZRGKh6_kgZb-392H0dSMPSzRY'
          assert release['google_drive_release']['export_sha256'] == '6e9f729df19691bcc08a0432365c9d5dbaa98a79aaad49621cd816a53c7508f2'
          assert release['google_drive_release']['readback_verified'] is True
          assert release['google_drive_release']['shared'] is False
          assert all(value is False for value in release['external_gates'].values())
          assert release['commercial_truth']['verified_live_revenue_events'] == 0
          assert release['commercial_truth']['full_commercial_maturity'] is False

          assert checkpoint['status'] == 'AUTHORITY_SNAPSHOT_RELEASE_RECONCILIATION_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert checkpoint['provider_proof']['state'] == 'FINAL_HEAD_PROVIDER_NATIVE_CI_VERIFIED'
          assert checkpoint['provider_proof']['artifact_id'] == 8879850560
          assert checkpoint['release_receipt']['receipt_sha256'] == release['receipt_sha256']
          assert checkpoint['release_receipt']['google_drive_readback_verified'] is True
          assert checkpoint['release_receipt']['google_drive_shared'] is False

          assert proof['status'] == 'AUTHORITY_SNAPSHOT_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert len(proof['checks']) == 17
          assert all(proof['checks'].values())
          assert proof['release_receipt_sha256'] == release['receipt_sha256']
          assert proof['google_drive_readback_verified'] is True
          assert proof['google_drive_shared'] is False
          assert proof['verified_live_revenue_events'] == 0
          assert proof['external_gate_effect'] == 'UNCHANGED'
          assert proof['full_commercial_maturity'] is False

          assert api['api_id'] == 'AO-COMMERCIAL-CANONICAL-API-V3'
          assert api['canonical_class'] == 'AuthoritySnapshotCommercialControlPlane'
          assert api['authority_snapshot']['raw_authority_dictionary_grants_live_authority'] is False
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_snapshot_release.py'),
              Path('alpha_omega_commercial/test_authority_snapshot_release.py'),
              Path('alpha_omega_commercial/prove_authority_snapshot_release.py'),
              Path('alpha_omega_commercial/authority_snapshot_release_receipt.json'),
              Path('alpha_omega_commercial/authority_snapshot_checkpoint.json'),
              Path('alpha_omega_commercial/artifacts/c15/authority-snapshot-release'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable authority snapshot release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-authority-snapshot-release-proof
          path: alpha_omega_commercial/artifacts/c15/authority-snapshot-release
          if-no-files-found: error
          retention-days: 90
