name: PFRD Omega Operator Schema Probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pfrd-omega-operator-schema-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfrd-omega-operator-schema-probe
  cancel-in-progress: false

env:
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover public operator schemas
        run: |
          set -euo pipefail
          mkdir -p deployments/pfrd-omega /tmp/pfrd-schema
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = os.environ['OPERATOR_URL'].rstrip('/')
          paths = [
              '/', '/health', '/openapi.json', '/openapi.yaml', '/docs',
              '/swagger.json', '/api-docs', '/.well-known/openapi.json',
              '/actions/DEPLOY_SOLUTION5_LOCKED', '/contract'
          ]

          results = {}
          for path in paths:
              req = urllib.request.Request(base + path, headers={'accept': 'application/json, application/yaml, text/plain, text/html'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read(100000).decode('utf-8', 'replace')
                      results[path] = {
                          'http_status': response.status,
                          'content_type': response.headers.get('content-type'),
                          'body': raw,
                      }
              except urllib.error.HTTPError as exc:
                  raw = exc.read(5000).decode('utf-8', 'replace')
                  results[path] = {'http_status': exc.code, 'content_type': exc.headers.get('content-type'), 'body': raw}
              except Exception as exc:
                  results[path] = {'transport_error': type(exc).__name__, 'message': str(exc)[:500]}

          receipt = {
              'receipt': 'PFRD-OMEGA-OPERATOR-SCHEMA-PROBE',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'operator_url': base,
              'mutation_attempted': False,
              'results': results,
          }
          path = Path('deployments/pfrd-omega/OPERATOR_SCHEMA_PROBE_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('/tmp/pfrd-schema/OPERATOR_SCHEMA_PROBE_RECEIPT.json').write_text(path.read_text(), encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist schema receipt
        run: |
          set -euo pipefail
          git config user.name "pfrd-omega-schema-probe[bot]"
          git config user.email "pfrd-omega-schema-probe[bot]@users.noreply.github.com"
          git add deployments/pfrd-omega/OPERATOR_SCHEMA_PROBE_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record PFRD Omega operator schema probe"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pfrd-omega-operator-schema-probe
          if-no-files-found: error
          retention-days: 30
          path: /tmp/pfrd-schema/OPERATOR_SCHEMA_PROBE_RECEIPT.json
