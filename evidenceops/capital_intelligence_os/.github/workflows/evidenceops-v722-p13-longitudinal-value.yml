name: EvidenceOps v7.2.2 P13 Longitudinal Value Ledger

on:
  push:
    branches: [main]
    paths:
      - "runtime/evidenceops_v722/p13/**"
      - ".github/workflows/evidenceops-v722-p13-longitudinal-value.yml"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidenceops-v722-p13-longitudinal
  cancel-in-progress: false

jobs:
  value-ledger-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute bounded longitudinal cycle
        run: |
          mkdir -p runtime/evidenceops_v722/state
          python runtime/evidenceops_v722/p13/p13_longitudinal_value.py run \
            --ledger runtime/evidenceops_v722/state/p13_longitudinal_value_ledger.jsonl \
            --summary runtime/evidenceops_v722/state/p13_longitudinal_value_latest.json

      - name: Verify hash and semantic readback
        run: |
          python runtime/evidenceops_v722/p13/p13_longitudinal_value.py verify \
            --ledger runtime/evidenceops_v722/state/p13_longitudinal_value_ledger.jsonl \
            --summary runtime/evidenceops_v722/state/p13_longitudinal_value_latest.json

      - name: Upload immutable cycle proof
        uses: actions/upload-artifact@v4
        with:
          name: evidenceops-v722-p13-longitudinal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/evidenceops_v722/state/p13_longitudinal_value_ledger.jsonl
            runtime/evidenceops_v722/state/p13_longitudinal_value_latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist ledger on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "federation-omega-value-ledger"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/evidenceops_v722/state/p13_longitudinal_value_ledger.jsonl \
                  runtime/evidenceops_v722/state/p13_longitudinal_value_latest.json
          if git diff --cached --quiet; then
            echo "No longitudinal state change"
          else
            git commit -m "Persist EvidenceOps v7.2.2 P13 longitudinal cycle [skip p13-ledger]"
            git push origin HEAD:main
          fi
