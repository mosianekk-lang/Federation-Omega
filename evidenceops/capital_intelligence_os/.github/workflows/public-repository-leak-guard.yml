name: Public Repository Leak Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scan tracked public content
        run: python evidenceops/security/public_repository_leak_guard.py
      - name: Verify OpenAI credential rotation contract
        run: python -m unittest tests.test_openai_rotation_contract -v
