version: 1.0.0
status: SOURCE_DISCOVERED_PROVIDER_INVENTORY_PENDING
owner: Kim Kagiso Mosiane
parent_estate: KIM_DATAVERSE
classification: PUBLIC_SAFE_PRIVATE_POINTERS_REDACTED

estate_role:
  - gemini_prompt_experimentation
  - model_and_parameter_evaluation
  - multimodal_prototyping
  - candidate_application_generation
  - preproduction_workflow_design
  - governed_export_to_cloud_or_github

canonical_for: []
not_canonical_for:
  - mission_state
  - evidence_source_of_truth
  - authority_ledger
  - secrets
  - production_runtime_state
  - final_release_receipts

source_discovered_assets:
  dedicated_drive_folder: true
  artefact_aliases:
    - MODISA_AI_STUDIO_AUTOMATION_BLUEPRINT
    - MODISA_AI_STUDIO_DEPLOYABLE_SOURCE_PACKAGE
    - MODISA_AI_STUDIO_AUTOMATION_REGISTRY
    - NX10_AI_STUDIO_APP_EXTRACTION
    - GOOGLE_AI_STUDIO_AUTOMATION_LAYER_TEMPLATE_EXTENSION
    - MASTER_GOOGLE_SURFACES_CAPABILITY_MATRIX
    - MASTER_GOOGLE_SURFACES_EXECUTION_ROUTER
    - FEDERATION_DIRECT_RUNTIME_PROOF_LEDGERS

inventory_domains:
  projects_and_workspaces:
    required_fields:
      - project_alias
      - owner
      - collaborators
      - created_at
      - last_used_at
      - mission_id
      - google_cloud_project_alias
      - github_export_target
      - data_classification
      - lifecycle_state
  models_and_configurations:
    required_fields:
      - model_family
      - model_version
      - modality
      - generation_parameters
      - safety_settings
      - grounding_and_tools
      - evaluation_state
      - deprecation_risk
  prompts_and_system_instructions:
    required_fields:
      - prompt_id
      - version
      - mission_id
      - owner
      - system_instruction_hash
      - input_schema
      - output_schema
      - fixtures
      - evaluation_evidence
      - approved_scope
      - export_target
      - supersession_state
  files_and_source_data:
    required_fields:
      - file_alias
      - source_pointer
      - data_owner
      - classification
      - sensitivity
      - raw_evidence_uploaded
      - residency
      - retention
      - permitted_reuse
      - destruction_state
  generated_apps_and_exports:
    required_fields:
      - application_alias
      - export_timestamp
      - destination
      - commit_or_artifact_hash
      - dependencies
      - security_review
      - test_result
      - production_target
      - deployment_receipt
  credentials_and_access:
    metadata_only: true
    required_fields:
      - credential_reference
      - owning_cloud_project_alias
      - runtime_consumer
      - vault_location_alias
      - created_at
      - rotation_state
      - revocation_state
      - least_privilege_binding
      - audit_evidence

trust_boundaries:
  - id: TB_FOUNDER_AI_STUDIO
    control: exact_mission_and_approved_experiment_scope
  - id: TB_AI_STUDIO_SOURCE_DATA
    control: minimum_necessary_data_and_classification_review
  - id: TB_AI_STUDIO_GOOGLE_CLOUD
    control: verified_project_binding_and_credential_isolation
  - id: TB_AI_STUDIO_GITHUB
    control: export_hash_review_ci_and_provenance
  - id: TB_AI_STUDIO_PRODUCTION
    control: tests_security_deployment_readback_receipt
  - id: TB_PUBLIC_PRIVATE
    control: public_aliases_private_pointer_bridge

proof_state:
  resource_pool_membership: FOUNDER_CONFIRMED
  supporting_drive_assets: DISCOVERED
  dedicated_drive_folder: DISCOVERED
  provider_project_inventory: UNVERIFIED
  model_prompt_inventory: UNVERIFIED
  collaborator_access_inventory: UNVERIFIED
  file_data_inventory: UNVERIFIED
  google_cloud_bindings: UNVERIFIED
  credential_lifecycle: UNVERIFIED
  production_deployments: UNVERIFIED

required_provider_readback:
  - project_and_workspace_list
  - owners_and_collaborators
  - prompts_models_and_configurations
  - uploaded_files_and_classifications
  - generated_apps_and_export_destinations
  - linked_google_cloud_projects
  - credential_references_without_secret_values
  - deployment_bindings_and_receipts
  - audit_and_last_use_metadata
  - inactive_duplicate_and_abandoned_resources

maturity: GOOGLE_AI_STUDIO_RESOURCE_CONFIRMED_DRIVE_SUPPORT_DISCOVERED_PROVIDER_NATIVE_INVENTORY_PENDING
