name: IPEP CI
on:
  push:
    paths: ['ipep/**']
  pull_request:
    paths: ['ipep/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ipep/apps/audio-worker/requirements.txt
      - run: python -m py_compile ipep/apps/audio-worker/main.py
      - name: Secret-pattern guard
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY)' ipep
