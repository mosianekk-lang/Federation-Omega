openapi: 3.1.0
info:
  title: EvidenceOps Capital Intelligence OS Local Canary API
  version: 1.0.0-rc5
  description: >-
    Local/reference A1 API for durable events, bounded deal-document ingestion,
    search, diligence status and tenant workspace export. This is not a public
    production API, production VDR contract, legal opinion or transaction authority.
servers:
  - url: http://127.0.0.1:{port}
security:
  - bearerAuth: []
paths:
  /health:
    get:
      responses:
        "200": {description: Runtime, vault and audit health}
  /ready:
    get:
      responses:
        "200": {description: Local/reference readiness and static runtime roles}
  /v1/verify:
    get:
      responses:
        "200": {description: Cumulative release and constitutional verification}
  /v1/events:
    post:
      parameters:
        - {in: header, name: X-Tenant-ID, required: true, schema: {type: string}}
        - {in: header, name: X-User-ID, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Idempotent durable event receipt}
        "400": {description: Invalid event}
        "401": {description: Authentication/context failure}
        "403": {description: Default-deny/authority failure}
  /v1/documents:
    post:
      description: >-
        Hash, parse where supported, classify and ingest one tenant-scoped document.
        Direct raw document bytes are bounded to 5 MB and transported as base64.
        PDF text must be supplied by an explicit external extraction route at this maturity.
      parameters:
        - {in: header, name: X-Tenant-ID, required: true, schema: {type: string}}
        - {in: header, name: X-User-ID, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logical_key, filename, document_type, content_type, content_base64, information_class, source_id]
              properties:
                logical_key: {type: string}
                filename: {type: string}
                document_type: {type: string}
                content_type: {type: string}
                content_base64: {type: string, contentEncoding: base64}
                information_class:
                  type: string
                  enum: [PUBLIC, CONFIDENTIAL, CLEAN_TEAM, POTENTIALLY_MNPI, RESTRICTED, PRIVILEGED]
                source_id: {type: string}
                extracted_text: {type: string}
                tags: {type: array, items: {type: string}}
      responses:
        "200": {description: Ingestion, parser and diligence receipt}
        "400": {description: Invalid/unsupported document or classification access failure}
        "401": {description: Authentication/context failure}
        "403": {description: Route/authority failure}
  /v1/search:
    post:
      description: Search only documents visible to the configured runtime role set for the tenant.
      parameters:
        - {in: header, name: X-Tenant-ID, required: true, schema: {type: string}}
        - {in: header, name: X-User-ID, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
                limit: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200": {description: Metadata-only tenant-scoped search results}
  /v1/diligence:
    get:
      description: Compute standard diligence completeness and missing-document questions from accessible ingested evidence.
      parameters:
        - {in: header, name: X-Tenant-ID, required: true, schema: {type: string}}
        - {in: header, name: X-User-ID, required: true, schema: {type: string}}
      responses:
        "200": {description: Diligence status}
  /v1/workspace:
    get:
      description: Export a deterministic digest-bound tenant workspace inventory without raw document text.
      parameters:
        - {in: header, name: X-Tenant-ID, required: true, schema: {type: string}}
        - {in: header, name: X-User-ID, required: true, schema: {type: string}}
      responses:
        "200": {description: Metadata-only workspace bundle; human decision remains required}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
