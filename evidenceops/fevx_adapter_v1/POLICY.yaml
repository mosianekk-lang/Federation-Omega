version: "EvidenceOps-FEVX-Adapter-1.0"
owner: "Kagiso Kim Mosiane"
canonical_owner_system: "Federation Omega"
domain_consumer: "EvidenceOps"
status: "EXECUTABLE_READ_ONLY_INTEGRATION_POLICY"

role:
  fevx: "Shared cognitive-governance and assurance service"
  evidenceops: "Evidence, legal, forensic and procedural domain engine"
  adapter: "Only permitted integration boundary"

input_boundary:
  mode: "READ_ONLY_CASE_WALLED_PACKET"
  permitted:
    - source identifiers and hashes
    - verified-fact identifiers and source references
    - claims, chronology, contradictions and missing-record schedules
    - stakeholder, strategy and outcome-chain structures
  prohibited:
    - cross-case data
    - raw credential material
    - external-action mandates
    - source mutation requests
    - verified-fact write requests

output_boundary:
  record_type: "DERIVED_ANALYTICAL_RECORD"
  release_state: "HELD_FOR_EVIDENCEOPS_REVIEW"
  fact_status: "DERIVED_NOT_FACT"
  separate_storage_required: true
  prohibited:
    - automatic promotion to verified fact
    - source overwrite
    - case-wall crossing
    - legal filing
    - external sending
    - payment
    - public publication
    - destructive action
    - sensitive-data disclosure
    - production deployment

proof:
  required:
    - exact input hash
    - source-manifest hash
    - verified-facts hash
    - combined 20-module execution
    - case-wall verification
    - source and fact immutability
    - semantic readback
    - idempotency
    - derived-ledger integrity
    - tamper detection
    - rollback and reapply
    - provider-native execution
    - desired-versus-actual drift
  truth_boundary: >
    Provider verification proves the adapter control plane and actual CSE runtime
    on its canary data. It does not prove legal accuracy, a real case outcome, or
    authority for a consequential action.

autonomy:
  evidenceops_adapter_level: 4
  inherited_cse_provider_level: 5
  level_6_eligible: false
  trust_inheritance: false
  owner_grant_required_for_any_expansion: true
