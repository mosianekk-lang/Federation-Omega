openapi: 3.1.0
info:
  title: EvidenceOps eCertify ZA Assurance API
  version: 0.9.0
  description: >-
    Launch-now and full-assurance API. Launch-now mode provides zero-possession
    document-integrity receipts and legal routing without requiring an IDV contract.
    Statutory certified/commissioned labels remain commissioner-event gated.
paths:
  /health:
    get:
      responses:
        '200': {description: Service mode and capability state}
  /v1/launch/route:
    post:
      summary: Resolve the citizen request to the lowest lawful launchable route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_status]
              properties:
                requested_status: {type: string}
                issuer_or_source_verified: {type: boolean, default: false}
      responses:
        '200': {description: Launch-now route with citizen experience and truth boundary}
  /v1/integrity/receipt/issue:
    post:
      summary: Issue a server-signed zero-possession document-integrity receipt
      description: >-
        The client computes SHA-256 locally. This endpoint accepts the digest and a
        client nonce only. It rejects document bytes/content and never labels the
        result a certified copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_sha256, client_nonce]
              additionalProperties: false
              properties:
                document_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
                client_nonce: {type: string, minLength: 16, maxLength: 256}
      responses:
        '200': {description: Signed EvidenceOps Document Integrity Receipt}
        '400': {description: Invalid hash/nonce or attempted document-byte submission}
  /v1/integrity/receipt/verify:
    post:
      summary: Verify an EvidenceOps integrity receipt against the active signing key
      responses:
        '200': {description: Signature validity result}
  /v1/route:
    post:
      summary: Determine the base legal assurance lane without client trust shortcuts
      description: >-
        Client-controlled recipient acceptance is rejected. Final certified/commissioned
        labels are never emitted by this route.
      responses:
        '200': {description: Base route decision}
        '400': {description: Client-controlled recipient-acceptance assertion rejected}
  /v1/identity/receipt/assess:
    post:
      summary: Authenticate and assess a signed identity-provider receipt when Track B is activated
      description: >-
        This module is optional in launch-now mode. When configured, provider allowlist,
        key ID, receipt signature, freshness and replay are verified before identity policy.
      responses:
        '200': {description: Authenticated identity-receipt decision}
        '400': {description: Invalid, expired, replayed or untrusted receipt}
        '503': {description: Full-assurance identity module not activated; launch-now remains available}
