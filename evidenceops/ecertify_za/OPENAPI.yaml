openapi: 3.1.0
info:
  title: EvidenceOps eCertify ZA Private Assurance API
  version: 0.6.0
  description: Private identity-receipt and legal-routing API. Recipient acceptance is server-verified evidence only; client-controlled acceptance flags are rejected. Final certified/commissioned labels are internal commissioner-authority/event completions, not public API assertions.
paths:
  /health:
    get:
      responses:
        '200': {description: Private service health, provider-auth, recipient-evidence and legal-completion state}
  /v1/route:
    post:
      summary: Determine the base document-assurance lane without client-supplied trust shortcuts
      description: Lane 5 is selected only inside the trusted service path after a RecipientAcceptanceAssessment has been verified against the exact recipient/use-case/document rule. Sending recipient_accepts_digital_assurance or recipient_acceptance here is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_status]
              additionalProperties: true
              properties:
                requested_status: {type: string}
      responses:
        '200': {description: Base route decision}
        '400': {description: Invalid or client-controlled recipient-acceptance assertion}
  /v1/identity/receipt/assess:
    post:
      summary: Authenticate and assess a signed identity-provider verification receipt
      description: The server verifies provider allowlist, key ID, receipt signature, freshness and replay state before identity policy is evaluated. EvidenceOps does not perform biometric matching or ingest raw biometric media through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, key_id, signature_hex, payload, consent_granted]
              properties:
                provider: {type: string}
                key_id: {type: string}
                signature_hex: {type: string}
                payload: {type: object}
                consent_granted: {type: boolean}
      responses:
        '200': {description: Authenticated identity-receipt decision}
        '400': {description: Invalid, expired, replayed or untrusted receipt}
        '503': {description: Identity provider authenticator not configured}
