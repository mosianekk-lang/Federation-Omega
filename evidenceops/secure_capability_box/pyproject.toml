[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceops-secure-capability-box"
version = "0.4.0"
description = "Short-lived, policy-scoped secret capability broker for EvidenceOps"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = ["google-cloud-secret-manager>=2.20,<3", "google-crc32c>=1.5,<2"]
federation = ["httpx>=0.28,<1"]
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["secure_capability_box*"]
