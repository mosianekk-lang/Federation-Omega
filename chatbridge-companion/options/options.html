<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatBridge Companion settings</title><style>body{max-width:720px;margin:40px auto;padding:0 20px;font:16px/1.5 system-ui;color:#17211f}label{display:block;margin:18px 0}input[type=number]{width:180px;padding:7px}button{padding:9px 15px;border:0;border-radius:8px;background:#10a37f;color:white}small{display:block;color:#52605d}</style></head>
<body><h1>ChatBridge Companion</h1><p>The extension stores the full handoff capsule only in browser session storage. A transcript-free summary is retained locally.</p><form id="settings"><label><input id="autoSend" type="checkbox"> Automatically send the restore prompt after opening the successor chat</label><label>Maximum capsule characters <input id="maxCapsuleChars" type="number" min="8000" max="200000" step="1000"><small>Default: 60,000</small></label><label>Pre-limit token estimate <input id="tokenThreshold" type="number" min="8000" max="200000" step="1000"></label><label>Pre-limit rendered message count <input id="messageThreshold" type="number" min="20" max="500" step="10"></label><button type="submit">Save settings</button> <span id="status" role="status"></span></form><script src="options.js"></script></body></html>
