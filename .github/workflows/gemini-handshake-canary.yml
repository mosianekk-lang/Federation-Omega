name: Gemini OAuth Handshake Canary

on:
  push:
    branches:
      - "probe/gemini-handshake-canary-20260828"
    paths:
      - ".github/workflows/gemini-handshake-canary.yml"

permissions:
  contents: read
  id-token: write

jobs:
  oauth-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: sov-hybrid-suite
      WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
      SERVICE_ACCOUNT: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
      BRIDGE_ID: CG-BRIDGE-20260828-023812-SAST
      BRIDGE_DOC_ID: 1nEtTJVutY1lUch8krbUthJEPEg7ebVk5GtXFVoG3TkM
      SOURCE_PROMPT_ID: 1Kpn5SQ05bgmPTorb6-wmBhTuu8mwvPen
    steps:
      - name: Obtain keyless Google access token
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/generative-language.retriever
          create_credentials_file: false

      - name: Call Gemini with OAuth bearer token
        if: always()
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          token=os.environ.get('GOOGLE_ACCESS_TOKEN','').strip()
          project=os.environ['PROJECT_ID']
          bridge=os.environ['BRIDGE_ID']
          doc=os.environ['BRIDGE_DOC_ID']
          prompt_id=os.environ['SOURCE_PROMPT_ID']
          receipt={'schema':'CHATGPT-GEMINI-OAUTH-CANARY-1','recorded_at_utc':datetime.now(timezone.utc).isoformat(),'auth_outcome':os.environ.get('AUTH_OUTCOME'),'oauth_token_present':bool(token),'bridge_id':bridge,'bridge_doc_id':doc,'source_prompt_id':prompt_id,'inference_verified':False,'native_google_provider_verified':False,'route':'GOOGLE_GEMINI_OAUTH_WIF','model':None,'handshake_text':None,'attempts':[]}
          def call(url,method='GET',payload=None):
              headers={'Authorization':f'Bearer {token}','x-goog-user-project':project,'Content-Type':'application/json'}
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: return r.status,json.loads(r.read().decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: obj=json.loads(body)
                  except Exception: obj={'error_text':body[:1000]}
                  return e.code,obj
          def es(obj):
              if isinstance(obj,dict) and isinstance(obj.get('error'),dict):
                  e=obj['error']; return {'code':e.get('code'),'status':e.get('status'),'message':str(e.get('message',''))[:500]}
              return {'message':str(obj)[:500]}
          if not token:
              receipt['attempts'].append({'stage':'WIF_AUTH','result':'NO_ACCESS_TOKEN'})
          else:
              s,mo=call('https://generativelanguage.googleapis.com/v1/models')
              if s==200:
                  usable=[m for m in mo.get('models',[]) if 'generateContent' in (m.get('supportedGenerationMethods') or []) and 'gemini' in (m.get('name') or '').lower()]
                  names=[m['name'] for m in usable if m.get('name')]
                  prefs=['models/gemini-3.1-pro-preview','models/gemini-3.1-pro','models/gemini-3-pro-preview','models/gemini-2.5-pro','models/gemini-2.5-flash']
                  model=next((x for x in prefs if x in names),names[0] if names else None)
                  receipt['attempts'].append({'stage':'MODEL_LIST','status':s,'result':'PASS','model_count':len(names)})
                  if model:
                      prompt=('Return JSON only. cockpit=GEMINI. Confirm this bounded handshake without claiming external reads. '+f'bridge_id={bridge}; bridge_doc_id={doc}; source_prompt_id={prompt_id}. Return cockpit, model_actually_used, bridge_id, bridge_doc_id, source_prompt_id, read_state=HANDSHAKE_RECEIVED, gaps, provider_timestamp_utc.')
                      cs,co=call(f'https://generativelanguage.googleapis.com/v1/{model}:generateContent',method='POST',payload={'contents':[{'role':'user','parts':[{'text':prompt}]}],'generationConfig':{'temperature':0}})
                      if cs==200:
                          parts=(((co.get('candidates') or [{}])[0].get('content') or {}).get('parts') or [])
                          text=''.join(p.get('text','') for p in parts if isinstance(p,dict)).strip()
                          if text:
                              receipt.update(inference_verified=True,native_google_provider_verified=True,model=model,handshake_text=text[:6000],handshake_sha256=hashlib.sha256(text.encode()).hexdigest())
                              receipt['attempts'].append({'stage':'GENERATE_CONTENT','status':cs,'result':'PASS'})
                          else: receipt['attempts'].append({'stage':'GENERATE_CONTENT','status':cs,'result':'EMPTY'})
                      else: receipt['attempts'].append({'stage':'GENERATE_CONTENT','status':cs,'result':'HTTP_ERROR','error':es(co)})
                  else: receipt['attempts'].append({'stage':'MODEL_SELECT','result':'NO_MODEL'})
              else: receipt['attempts'].append({'stage':'MODEL_LIST','status':s,'result':'HTTP_ERROR','error':es(mo)})
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          with open('OAUTH_HANDSHAKE_RECEIPT.json','w',encoding='utf-8') as f: json.dump(receipt,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({'auth_outcome':receipt['auth_outcome'],'oauth_token_present':receipt['oauth_token_present'],'inference_verified':receipt['inference_verified'],'model':receipt['model'],'attempts':receipt['attempts'],'receipt_sha256':receipt['receipt_sha256']},sort_keys=True))
          PY

      - name: Upload OAuth handshake receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-oauth-handshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: OAUTH_HANDSHAKE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce native Google inference proof
        if: always()
        run: |
          test -f OAUTH_HANDSHAKE_RECEIPT.json
          python3 - <<'PY'
          import json
          r=json.load(open('OAUTH_HANDSHAKE_RECEIPT.json',encoding='utf-8'))
          if not (r.get('inference_verified') and r.get('native_google_provider_verified')):
              raise SystemExit('Native Google Gemini inference not verified')
          PY
