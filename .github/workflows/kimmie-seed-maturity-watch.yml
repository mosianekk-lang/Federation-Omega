name: Kimmie Seed Maturity Watch

on:
  push:
    branches: [main]
    paths:
      - 'kimmie_seed/genome.json'
      - 'kimmie_seed/environment_profile.json'
      - 'kimmie_seed/registry.json'
      - 'kimmie_seed/maturity_assessor.py'
      - 'kimmie_seed/tests/**'
      - '.github/workflows/kimmie-seed-maturity-watch.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kimmie-seed-maturity-watch
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run maturity regression tests
        run: python -m unittest discover -s kimmie_seed/tests -p 'test_*.py' -v

      - name: Verify seed maturity
        run: python kimmie_seed/maturity_assessor.py

      - name: Create first durable workflow receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import os

          assessment_path = Path('kimmie_seed/monitoring/latest_assessment.json')
          receipt_path = Path('kimmie_seed/monitoring/first_successful_workflow_receipt.json')
          if receipt_path.exists():
              print('Durable first-success receipt already exists; preserving it.')
              raise SystemExit(0)

          assessment = json.loads(assessment_path.read_text(encoding='utf-8'))
          receipt = {
              'seed_id': assessment['seed_id'],
              'workflow': '.github/workflows/kimmie-seed-maturity-watch.yml',
              'workflow_result': 'PASS',
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'workflow_run_attempt': os.environ['WORKFLOW_RUN_ATTEMPT'],
              'workflow_event': os.environ['WORKFLOW_EVENT'],
              'source_sha': os.environ['SOURCE_SHA'],
              'executed_at': datetime.now(timezone.utc).isoformat(),
              'assessment_sha256': assessment['assessment_sha256'],
              'assessment_status': assessment['status'],
              'registry_stage': assessment['registry_stage'],
              'verified_stage': assessment['verified_stage'],
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload proof assessment
        uses: actions/upload-artifact@v7
        with:
          name: kimmie-seed-maturity-assessment
          path: |
            kimmie_seed/monitoring/latest_assessment.json
            kimmie_seed/monitoring/first_successful_workflow_receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist durable workflow readback
        run: |
          git config user.name "kimmie-seed-maturity-watch"
          git config user.email "actions@users.noreply.github.com"
          git add kimmie_seed/monitoring/latest_assessment.json
          git add kimmie_seed/monitoring/first_successful_workflow_receipt.json
          git diff --cached --quiet || git commit -m "Record Kimmie Seed maturity workflow assessment"
          git pull --rebase
          git push
