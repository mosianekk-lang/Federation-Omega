name: SOVARA Google AI Credential Census

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sovara-google-ai-credential-census.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sovara-google-ai-credential-census
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate through existing keyless Google WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read credential metadata and exact authority only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/sovara-google-ai-census
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          export ACCESS_TOKEN
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request,urllib.error
          from pathlib import Path

          project=os.environ['PROJECT_ID']; number=os.environ['PROJECT_NUMBER']; token=os.environ['ACCESS_TOKEN']
          def run(args):
              p=subprocess.run(args,text=True,capture_output=True)
              return {'ok':p.returncode==0,'code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()[:1200]}
          def http(url,method='GET',body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'authorization':f'Bearer {token}','content-type':'application/json','x-goog-user-project':project})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace'); return {'status':r.status,'body':json.loads(raw) if raw else {}}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: b=json.loads(raw)
                  except Exception: b={'text_sha256':hashlib.sha256(raw.encode()).hexdigest()}
                  return {'status':e.code,'body':b}
          acct=run(['gcloud','auth','list','--filter=status:ACTIVE','--format=value(account)'])
          proj=run(['gcloud','projects','describe',project,'--format=json(projectId,projectNumber,lifecycleState)'])
          secrets=run(['gcloud','secrets','list','--project',project,'--format=json(name,createTime,replication)'])
          enabled=run(['gcloud','services','list','--enabled','--project',project,'--format=json(config.name,state)'])
          perms=['apikeys.keys.create','apikeys.keys.get','apikeys.keys.list','apikeys.keys.update','apikeys.keys.getKeyString','secretmanager.secrets.create','secretmanager.versions.add','secretmanager.versions.access','serviceusage.services.enable','serviceusage.services.use']
          iam=http(f'https://cloudresourcemanager.googleapis.com/v1/projects/{project}:testIamPermissions','POST',{'permissions':perms})
          keys=http(f'https://apikeys.googleapis.com/v2/projects/{project}/locations/global/keys?pageSize=100')
          # Never persist keyString. Key-list metadata is safe; aggressively strip any accidental sensitive fields.
          def scrub(v):
              if isinstance(v,dict):
                  out={}
                  for k,x in v.items():
                      if k.lower() in {'keystring','apikey','api_key','access_token','token','privatekey','private_key'}: out[k]='[REDACTED]'
                      else: out[k]=scrub(x)
                  return out
              if isinstance(v,list): return [scrub(x) for x in v]
              return v
          enabled_names=[]
          if enabled['ok']:
              try: enabled_names=[x.get('config',{}).get('name') for x in json.loads(enabled['stdout'])]
              except Exception: pass
          secret_names=[]
          if secrets['ok']:
              try: secret_names=[x.get('name') for x in json.loads(secrets['stdout'])]
              except Exception: pass
          receipt={
            'schema':'SOVARA_GOOGLE_AI_CREDENTIAL_CENSUS_V1',
            'source_sha':os.environ.get('GITHUB_SHA'),
            'project_id':project,
            'project_number':number,
            'active_account':acct['stdout'] if acct['ok'] else None,
            'project_read_ok':proj['ok'],
            'secret_names':secret_names,
            'gemini_secret_name_present':any((x or '').endswith('/secrets/gemini-api-key') or x=='gemini-api-key' for x in secret_names),
            'enabled_generativelanguage_api':'generativelanguage.googleapis.com' in enabled_names,
            'enabled_apikeys_api':'apikeys.googleapis.com' in enabled_names,
            'tested_permissions':perms,
            'granted_permissions':(iam.get('body') or {}).get('permissions') or [],
            'apikeys_list_http_status':keys.get('status'),
            'apikeys_metadata':scrub((keys.get('body') or {}).get('keys') or []),
            'credential_values_recorded':False,
            'provider_mutation_performed':False,
            'case_data_processed':False,
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('/tmp/sovara-google-ai-census/CREDENTIAL_CENSUS.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'gemini_secret_name_present':receipt['gemini_secret_name_present'],'enabled_generativelanguage_api':receipt['enabled_generativelanguage_api'],'enabled_apikeys_api':receipt['enabled_apikeys_api'],'apikeys_list_http_status':receipt['apikeys_list_http_status'],'granted_permissions':receipt['granted_permissions'],'receipt_sha256':receipt['receipt_sha256']},sort_keys=True))
          PY
          unset ACCESS_TOKEN

      - name: Upload immutable redacted census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-google-ai-credential-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sovara-google-ai-census/CREDENTIAL_CENSUS.json
          if-no-files-found: error
          retention-days: 90
