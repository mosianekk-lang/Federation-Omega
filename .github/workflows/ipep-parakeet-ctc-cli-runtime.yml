name: Package IPEP Parakeet CTC CLI Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipep-parakeet-ctc-cli-runtime.yml'
      - 'ipep/audio_engine_v3/parakeet-cli-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipep-parakeet-ctc-cli-runtime
  cancel-in-progress: false

env:
  SHERPA_ONNX_VERSION: '1.13.2'
  MODEL_ARCHIVE: sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2
  MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2

jobs:
  package-cli-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official binary wheel and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ipep-parakeet-cli/wheels /tmp/ipep-parakeet-cli/runtime/bin /tmp/ipep-parakeet-cli/runtime/model deployment_receipts
          python -m pip download --only-binary=:all: --no-deps --dest /tmp/ipep-parakeet-cli/wheels \
            "sherpa-onnx-bin==${SHERPA_ONNX_VERSION}"
          BIN_WHEEL=$(find /tmp/ipep-parakeet-cli/wheels -type f -name 'sherpa_onnx_bin*.whl' -print -quit)
          test -n "$BIN_WHEEL"
          unzip -q "$BIN_WHEEL" -d /tmp/ipep-parakeet-cli/runtime/bin-wheel
          CLI=$(find /tmp/ipep-parakeet-cli/runtime/bin-wheel -type f -name 'sherpa-onnx-offline' -print -quit)
          test -n "$CLI"
          chmod +x "$CLI"
          cp -a "$(dirname "$CLI")"/. /tmp/ipep-parakeet-cli/runtime/bin/
          curl --fail --location --retry 5 --retry-delay 5 "$MODEL_URL" \
            -o "/tmp/ipep-parakeet-cli/runtime/model/${MODEL_ARCHIVE}"
          tar -xjf "/tmp/ipep-parakeet-cli/runtime/model/${MODEL_ARCHIVE}" -C /tmp/ipep-parakeet-cli/runtime/model

      - name: Run official model sample canary through packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          CLI=/tmp/ipep-parakeet-cli/runtime/bin/sherpa-onnx-offline
          MODEL_DIR=/tmp/ipep-parakeet-cli/runtime/model/sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8
          WAV=$(find "$MODEL_DIR/test_wavs" -type f -name '*.wav' -print -quit)
          test -x "$CLI" -a -f "$WAV"
          START=$(date +%s%N)
          "$CLI" \
            --nemo-ctc-model="$MODEL_DIR/model.int8.onnx" \
            --tokens="$MODEL_DIR/tokens.txt" \
            --num-threads=2 \
            --decoding-method=greedy_search \
            --debug=false \
            "$WAV" > /tmp/cli-canary.log 2>&1
          END=$(date +%s%N)
          grep -qi 'love you' /tmp/cli-canary.log
          export START END WAV
          python - <<'PY' > /tmp/cli-canary.json
          import json, os
          from pathlib import Path
          log=Path('/tmp/cli-canary.log').read_text(errors='replace')
          print(json.dumps({
              'contract':'IPEP_PARAKEET_CTC_CLI_CANARY_V1',
              'passed':'love you' in log.lower(),
              'elapsed_seconds':round((int(os.environ['END'])-int(os.environ['START']))/1e9,3),
              'sample_file':Path(os.environ['WAV']).name,
              'log_tail':log[-4000:],
          },indent=2,sort_keys=True))
          PY

      - name: Build runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/ipep-parakeet-cli/runtime')
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          cli=root/'bin'/'sherpa-onnx-offline'
          archive=root/'model'/os.environ['MODEL_ARCHIVE']
          model=root/'model'/'sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8'/'model.int8.onnx'
          tokens=model.parent/'tokens.txt'
          manifest={
              'contract':'IPEP_PARAKEET_CTC_CLI_RUNTIME_V1',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'source_commit':'${{ github.sha }}',
              'run_id':${{ github.run_id }},
              'sherpa_onnx_version':os.environ['SHERPA_ONNX_VERSION'],
              'architecture_family':'nvidia_fastconformer_ctc',
              'official_model_url':os.environ['MODEL_URL'],
              'canary':json.loads(Path('/tmp/cli-canary.json').read_text()),
              'files':[
                  {'path':str(cli.relative_to(root)),'size':cli.stat().st_size,'sha256':sha(cli)},
                  {'path':str(archive.relative_to(root)),'size':archive.stat().st_size,'sha256':sha(archive)},
                  {'path':str(model.relative_to(root)),'size':model.stat().st_size,'sha256':sha(model)},
                  {'path':str(tokens.relative_to(root)),'size':tokens.stat().st_size,'sha256':sha(tokens)},
              ],
              'evidence_included':False,
              'credentials_included':False,
              'truth_boundary':'Python-independent CLI runtime and public model only; no hearing transcription claim.',
          }
          (root/'runtime-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          Path('deployment_receipts/ipep-parakeet-ctc-cli-runtime-latest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -C /tmp/ipep-parakeet-cli -czf /tmp/IPEP_Parakeet_CTC_CLI_Runtime.tar.gz runtime
          sha256sum /tmp/IPEP_Parakeet_CTC_CLI_Runtime.tar.gz > /tmp/IPEP_Parakeet_CTC_CLI_Runtime.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ipep-parakeet-ctc-cli-runtime-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            /tmp/IPEP_Parakeet_CTC_CLI_Runtime.tar.gz
            /tmp/IPEP_Parakeet_CTC_CLI_Runtime.tar.gz.sha256
            /tmp/ipep-parakeet-cli/runtime/runtime-manifest.json
            /tmp/cli-canary.json

      - name: Publish redacted receipt
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name 'ipep-parakeet-cli[bot]'
          git config user.email 'ipep-parakeet-cli[bot]@users.noreply.github.com'
          git add deployment_receipts/ipep-parakeet-ctc-cli-runtime-latest.json
          git commit -m 'Record Parakeet CTC CLI runtime receipt [skip ci]' || exit 0
          git push origin HEAD:main
