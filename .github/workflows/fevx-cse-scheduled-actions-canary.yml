name: FEVX CSE Scheduled Actions Canary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fevx-cse-scheduled-actions-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write scheduler receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments/fevx-cse
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              "receipt": "FEVX-CSE-SCHEDULED-ACTIONS-CANARY",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "status": "EXECUTED",
              "provider_contact_attempted": False,
              "provider_mutation_attempted": False,
          }
          Path("deployments/fevx-cse/SCHEDULED_ACTIONS_CANARY_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Persist scheduler receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fevx-cse-scheduler[bot]"
          git config user.email "fevx-cse-scheduler[bot]@users.noreply.github.com"
          git add deployments/fevx-cse/SCHEDULED_ACTIONS_CANARY_RECEIPT.json
          git commit -m "Record FEVX CSE scheduler canary [skip cse-scheduler]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: fevx-cse-scheduled-actions-canary
          path: deployments/fevx-cse/SCHEDULED_ACTIONS_CANARY_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
