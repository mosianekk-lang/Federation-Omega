name: NEXUS Secret Access Diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nexus-secret-access-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: sov-hybrid-suite
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  SECRET_ID: fo-operator-admin-token

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate through WIF
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Diagnose secret access without exposing secret value
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p deployments/nexus /tmp/nexus
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1 || true)"
          ACCESS_TOKEN_RC=0
          gcloud auth print-access-token >/dev/null 2>/tmp/nexus/access-token-error.txt || ACCESS_TOKEN_RC=$?
          SECRET_ACCESS_RC=0
          gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT_ID" >/dev/null 2>/tmp/nexus/secret-access-error.txt || SECRET_ACCESS_RC=$?
          export ACCOUNT ACCESS_TOKEN_RC SECRET_ACCESS_RC
          export ACCESS_TOKEN_ERROR="$(tail -c 3000 /tmp/nexus/access-token-error.txt 2>/dev/null || true)"
          export SECRET_ACCESS_ERROR="$(tail -c 3000 /tmp/nexus/secret-access-error.txt 2>/dev/null || true)"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt={
            'receipt':'NEXUS-SECRET-ACCESS-DIAGNOSTIC',
            'recorded_at':datetime.now(timezone.utc).isoformat(),
            'project':os.environ['PROJECT_ID'],
            'deployer_service_account':os.environ['DEPLOYER_SA'],
            'active_gcloud_account':os.environ.get('ACCOUNT') or None,
            'oidc_identity_materialized':bool(os.environ.get('ACCOUNT')),
            'access_token_command_exit_code':int(os.environ.get('ACCESS_TOKEN_RC','99')),
            'access_token_error':os.environ.get('ACCESS_TOKEN_ERROR')[:3000] or None,
            'secret_id':os.environ['SECRET_ID'],
            'secret_access_exit_code':int(os.environ.get('SECRET_ACCESS_RC','99')),
            'secret_access_error':os.environ.get('SECRET_ACCESS_ERROR')[:3000] or None,
            'secret_value_recorded':False,
            'mutation_attempted':False,
            'classification':'SECRET_ACCESS_PROVEN' if os.environ.get('SECRET_ACCESS_RC')=='0' else ('WIF_IDENTITY_PROVEN_SECRET_ACCESS_DENIED' if os.environ.get('ACCOUNT') else 'WIF_IDENTITY_NOT_MATERIALIZED')
          }
          path=Path('deployments/nexus/NEXUS_SECRET_ACCESS_DIAGNOSTIC_RECEIPT.json')
          path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Persist diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexus-secret-diagnostic[bot]"
          git config user.email "nexus-secret-diagnostic[bot]@users.noreply.github.com"
          git add deployments/nexus/NEXUS_SECRET_ACCESS_DIAGNOSTIC_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record NEXUS secret access diagnostic"
            git push origin HEAD:main
          fi
