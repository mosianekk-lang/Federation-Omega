name: Federation Omega GitHub Control Plane

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.gitignore'
      - 'governance/github_control_plane_policy.json'
      - 'tools/github_control_plane.py'
      - 'tests/test_github_control_plane.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.gitignore'
      - 'governance/github_control_plane_policy.json'
      - 'tools/github_control_plane.py'
      - 'tests/test_github_control_plane.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: federation-omega-github-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-authority-and-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run control-plane regression tests
        run: python -m unittest discover -s tests -p 'test_github_control_plane.py' -v

      - name: Enforce changed-workflow authority policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane-output
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ -z "${BASE_SHA:-}" ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            python tools/github_control_plane.py \
              --all \
              --report control-plane-output/github-control-plane-report.json
          else
            python tools/github_control_plane.py \
              --changed-from "$BASE_SHA" \
              --changed-to "$HEAD_SHA" \
              --report control-plane-output/github-control-plane-report.json
          fi

      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f control-plane-output/github-control-plane-report.json ]]; then
            echo '## Federation Omega GitHub Control Plane' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat control-plane-output/github-control-plane-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable control-plane report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: federation-omega-github-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane-output/github-control-plane-report.json
          if-no-files-found: error
          retention-days: 90
