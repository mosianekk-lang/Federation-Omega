name: PFRD Omega Operator Auth Probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pfrd-omega-operator-auth-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfrd-omega-operator-auth-probe
  cancel-in-progress: false

env:
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe public contract and authenticated read actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pfrd-operator deployments/pfrd-omega
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = os.environ['OPERATOR_URL'].rstrip('/')
          token = os.environ.get('FO_ADMIN_TOKEN', '')

          def request(path, *, body=None, authenticated=False):
              headers = {'accept': 'application/json'}
              data = None
              if body is not None:
                  headers['content-type'] = 'application/json'
                  data = json.dumps(body, separators=(',', ':')).encode()
              if authenticated:
                  headers['x-fo-admin-token'] = token
              req = urllib.request.Request(base + path, data=data, headers=headers, method='POST' if body is not None else 'GET')
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8', 'replace')
                      return {'http_status': response.status, 'body': json.loads(raw)}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  try: body_out = json.loads(raw)
                  except Exception: body_out = {'text': raw[:1000]}
                  return {'http_status': exc.code, 'body': body_out}
              except Exception as exc:
                  return {'transport_error': type(exc).__name__, 'message': str(exc)[:300]}

          health = request('/health')
          contract = request('/')
          allowed = set(contract.get('body', {}).get('allowedActions', []))

          receipt = {
              'receipt': 'PFRD-OMEGA-OPERATOR-AUTH-PROBE',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'operator_url': base,
              'health': health,
              'contract': contract,
              'token_present': bool(token),
              'token_value_recorded': False,
              'mutation_attempted': False,
              'authenticated_status': None,
              'authenticated_cloud_read': None,
              'classification': 'PUBLIC_OPERATOR_ONLY',
          }

          if not token:
              receipt['classification'] = 'BLOCKED_MISSING_FO_ADMIN_TOKEN_REPOSITORY_SECRET'
          elif not {'STATUS', 'READ_CLOUD_RUN_SERVICE'}.issubset(allowed):
              receipt['classification'] = 'BLOCKED_LIVE_ALLOWLIST_MISMATCH'
          else:
              status = request('/execute', body={'action': 'STATUS', 'payload': {'purpose': 'PFRD Omega deployment authority probe', 'mutation': 'NONE'}}, authenticated=True)
              cloud_read = request('/execute', body={'action': 'READ_CLOUD_RUN_SERVICE', 'payload': {'project': 'sov-hybrid-suite', 'region': 'africa-south1', 'service': 'architron9', 'purpose': 'PFRD Omega read-only deployment preflight'}}, authenticated=True)
              receipt['authenticated_status'] = status
              receipt['authenticated_cloud_read'] = cloud_read
              status_ok = status.get('http_status') == 200 and status.get('body', {}).get('ok') is True
              read_ok = cloud_read.get('http_status') == 200 and cloud_read.get('body', {}).get('ok') is True
              receipt['classification'] = 'AUTHENTICATED_OPERATOR_READS_PROVEN' if status_ok and read_ok else 'AUTHENTICATED_OPERATOR_READS_FAILED'

          path = Path('deployments/pfrd-omega/OPERATOR_AUTH_PROBE_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('/tmp/pfrd-operator/OPERATOR_AUTH_PROBE_RECEIPT.json').write_text(path.read_text(), encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist operator probe receipt
        run: |
          set -euo pipefail
          git config user.name "pfrd-omega-operator-probe[bot]"
          git config user.email "pfrd-omega-operator-probe[bot]@users.noreply.github.com"
          git add deployments/pfrd-omega/OPERATOR_AUTH_PROBE_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record PFRD Omega operator auth probe"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pfrd-omega-operator-auth-probe
          if-no-files-found: error
          retention-days: 30
          path: /tmp/pfrd-operator/OPERATOR_AUTH_PROBE_RECEIPT.json

