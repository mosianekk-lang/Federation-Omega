name: PFRD Omega Operator Auth Probe

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pfrd-omega-operator-auth-probe.yml"
      - "governance/github_airlock_policy.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfrd-omega-operator-auth-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  SERVICE: federation-omega-operator
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app
  PROBE_SCHEMA: SOVARA-OPERATOR-AUTH-RECOVERY-V2

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GOOGLE_GHA_CREDS_JSON: ${{ secrets.GOOGLE_GHA_CREDS_JSON }}
      GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
      HAS_GCP_WIF_PAIR: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '') && (secrets.GCP_SERVICE_ACCOUNT != '' || vars.GCP_SERVICE_ACCOUNT != '') }}
      HAS_GENERIC_WIF_PAIR: ${{ (secrets.WIF_PROVIDER != '' || vars.WIF_PROVIDER != '') && (secrets.DEPLOYER_SA != '' || vars.DEPLOYER_SA != '') }}
    steps:
      - name: Recover existing authority routes and run bounded semantic readback
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/pfrd-operator
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from typing import Any

          PROJECT = os.environ["PROJECT_ID"]
          PROJECT_NUMBER = os.environ["PROJECT_NUMBER"]
          REGION = os.environ["REGION"]
          SERVICE = os.environ["SERVICE"]
          OPERATOR = os.environ["OPERATOR_URL"].rstrip("/")
          SCHEMA = os.environ["PROBE_SCHEMA"]
          DIRECT_OPERATOR_TOKEN = os.environ.get("FO_ADMIN_TOKEN", "")
          DIRECT_GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
          SOURCE_SHA = os.environ.get("GITHUB_SHA", "")
          SOURCE_REF = os.environ.get("GITHUB_REF", "")

          STATIC_CREDENTIAL_NAMES = (
              "GCP_SA_KEY",
              "GCP_SERVICE_ACCOUNT_KEY",
              "GOOGLE_CREDENTIALS",
              "GOOGLE_SERVICE_ACCOUNT_KEY",
              "GCP_CREDENTIALS",
              "GOOGLE_GHA_CREDS_JSON",
              "GOOGLE_CLOUD_CREDENTIALS",
          )

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          def safe_http_json(
              url: str,
              *,
              method: str = "GET",
              headers: dict[str, str] | None = None,
              data: bytes | None = None,
              timeout: int = 30,
          ) -> dict[str, Any]:
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers or {},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", "replace")
                      try:
                          body = json.loads(raw)
                      except Exception:
                          body = {"text_sha256": hashlib.sha256(raw.encode()).hexdigest()}
                      return {"http_status": response.status, "body": body}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"text_sha256": hashlib.sha256(raw.encode()).hexdigest()}
                  return {"http_status": exc.code, "body": body}
              except Exception as exc:
                  return {
                      "transport_error": type(exc).__name__,
                      "message_sha256": hashlib.sha256(str(exc).encode()).hexdigest(),
                  }

          def redact(value: Any, *, operator_token: str = "", gemini_key: str = "") -> Any:
              sensitive_keys = {
                  "access_token",
                  "refresh_token",
                  "id_token",
                  "token",
                  "authorization",
                  "private_key",
                  "private_key_data",
                  "client_secret",
                  "secret_value",
                  "credentials_json",
                  "api_key",
                  "key",
              }
              if isinstance(value, dict):
                  output = {}
                  for key, item in value.items():
                      if str(key).lower() in sensitive_keys:
                          output[key] = "[REDACTED]"
                      else:
                          output[key] = redact(
                              item,
                              operator_token=operator_token,
                              gemini_key=gemini_key,
                          )
                  return output
              if isinstance(value, list):
                  return [
                      redact(item, operator_token=operator_token, gemini_key=gemini_key)
                      for item in value
                  ]
              if isinstance(value, str):
                  if operator_token:
                      value = value.replace(operator_token, "[REDACTED]")
                  if gemini_key:
                      value = value.replace(gemini_key, "[REDACTED]")
                  return value
              return value

          def operator_call(
              path: str,
              *,
              body: dict[str, Any] | None = None,
              token: str = "",
              authenticated: bool = False,
          ) -> dict[str, Any]:
              headers = {"accept": "application/json"}
              data = None
              if body is not None:
                  headers["content-type"] = "application/json"
                  data = json.dumps(body, separators=(",", ":")).encode()
              if authenticated and token:
                  headers["x-fo-admin-token"] = token
              result = safe_http_json(
                  OPERATOR + path,
                  method="POST" if body is not None else "GET",
                  headers=headers,
                  data=data,
                  timeout=45,
              )
              return redact(result, operator_token=token, gemini_key="")

          def mint_service_account_access_token(
              credential: dict[str, Any],
          ) -> tuple[str, dict[str, Any]]:
              client_email = str(credential.get("client_email", ""))
              private_key = str(credential.get("private_key", ""))
              token_uri = str(
                  credential.get("token_uri", "https://oauth2.googleapis.com/token")
              )
              project_id = str(credential.get("project_id", ""))
              if credential.get("type") != "service_account":
                  raise ValueError("credential_type_not_service_account")
              if project_id != PROJECT:
                  raise ValueError("credential_project_mismatch")
              if not client_email.endswith(f"@{PROJECT}.iam.gserviceaccount.com"):
                  raise ValueError("credential_identity_outside_project")
              parsed = urllib.parse.urlparse(token_uri)
              if parsed.scheme != "https" or parsed.hostname != "oauth2.googleapis.com":
                  raise ValueError("untrusted_token_uri")
              if not private_key.startswith("-----BEGIN PRIVATE KEY-----"):
                  raise ValueError("missing_private_key")

              now = int(time.time())
              header = b64url(
                  json.dumps(
                      {"alg": "RS256", "typ": "JWT"},
                      separators=(",", ":"),
                  ).encode()
              )
              claims = b64url(
                  json.dumps(
                      {
                          "iss": client_email,
                          "scope": "https://www.googleapis.com/auth/cloud-platform",
                          "aud": token_uri,
                          "iat": now,
                          "exp": now + 600,
                      },
                      separators=(",", ":"),
                  ).encode()
              )
              signing_input = f"{header}.{claims}".encode()
              key_path = ""
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      encoding="utf-8",
                      delete=False,
                  ) as handle:
                      handle.write(private_key)
                      key_path = handle.name
                  os.chmod(key_path, 0o600)
                  signed = subprocess.run(
                      [
                          "openssl",
                          "dgst",
                          "-sha256",
                          "-sign",
                          key_path,
                          "-binary",
                      ],
                      input=signing_input,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True,
                      timeout=10,
                  ).stdout
              finally:
                  if key_path:
                      pathlib.Path(key_path).unlink(missing_ok=True)
              assertion = f"{header}.{claims}.{b64url(signed)}"
              form = urllib.parse.urlencode(
                  {
                      "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                      "assertion": assertion,
                  }
              ).encode()
              response = safe_http_json(
                  token_uri,
                  method="POST",
                  headers={"content-type": "application/x-www-form-urlencoded"},
                  data=form,
                  timeout=30,
              )
              token = str(response.get("body", {}).get("access_token", ""))
              if response.get("http_status") != 200 or not token:
                  raise RuntimeError(
                      f"oauth_exchange_failed_{response.get('http_status', 'transport')}"
                  )
              return token, {
                  "client_email": client_email,
                  "project_id": project_id,
                  "oauth_http_status": response.get("http_status"),
              }

          def google_get_json(
              access_token: str,
              url: str,
          ) -> dict[str, Any]:
              return safe_http_json(
                  url,
                  headers={
                      "authorization": f"Bearer {access_token}",
                      "accept": "application/json",
                      "x-goog-user-project": PROJECT,
                  },
                  timeout=30,
              )

          def secret_access(
              access_token: str,
              secret_name: str,
          ) -> tuple[str, dict[str, Any]]:
              quoted = urllib.parse.quote(secret_name, safe="")
              url = (
                  f"https://secretmanager.googleapis.com/v1/projects/{PROJECT}/"
                  f"secrets/{quoted}/versions/latest:access"
              )
              result = google_get_json(access_token, url)
              payload = result.get("body", {}).get("payload", {}).get("data", "")
              value = ""
              if result.get("http_status") == 200 and payload:
                  value = base64.b64decode(payload).decode("utf-8").strip()
              return value, {
                  "secret": secret_name,
                  "http_status": result.get("http_status"),
                  "accessible": bool(value),
                  "transport_error": result.get("transport_error"),
              }

          def cloud_run_readback(access_token: str) -> dict[str, Any]:
              url = (
                  f"https://run.googleapis.com/v2/projects/{PROJECT}/locations/"
                  f"{REGION}/services/{SERVICE}"
              )
              result = google_get_json(access_token, url)
              body = result.get("body", {})
              if result.get("http_status") != 200:
                  return {
                      "http_status": result.get("http_status"),
                      "transport_error": result.get("transport_error"),
                      "error_status": body.get("error", {}).get("status"),
                  }
              template = body.get("template", {})
              return {
                  "http_status": 200,
                  "name": body.get("name"),
                  "uid": body.get("uid"),
                  "generation": body.get("generation"),
                  "uri": body.get("uri"),
                  "latest_ready_revision": body.get("latestReadyRevision"),
                  "latest_created_revision": body.get("latestCreatedRevision"),
                  "service_account": template.get("serviceAccount"),
                  "ingress": body.get("ingress"),
                  "reconciling": body.get("reconciling"),
              }

          def extract_gemini_text(body: Any) -> str:
              try:
                  parts = body["candidates"][0]["content"]["parts"]
                  return "".join(str(part.get("text", "")) for part in parts).strip()
              except Exception:
                  return ""

          def gemini_semantic_canary(api_key: str, nonce: str) -> dict[str, Any]:
              if not api_key:
                  return {"classification": "GEMINI_KEY_UNAVAILABLE"}
              query_key = urllib.parse.quote(api_key, safe="")
              models_url = (
                  "https://generativelanguage.googleapis.com/v1beta/models"
                  f"?key={query_key}"
              )
              model_result = safe_http_json(models_url, timeout=30)
              models = model_result.get("body", {}).get("models", [])
              candidates: list[dict[str, Any]] = []
              for model in models:
                  methods = model.get("supportedGenerationMethods", [])
                  name = str(model.get("name", ""))
                  lowered = name.lower()
                  if (
                      "generateContent" in methods
                      and "gemini" in lowered
                      and all(
                          blocked not in lowered
                          for blocked in (
                              "embedding",
                              "image",
                              "vision",
                              "tts",
                              "aqa",
                          )
                      )
                  ):
                      candidates.append(model)

              def rank(model: dict[str, Any]) -> tuple[int, int, str]:
                  name = str(model.get("name", "")).lower()
                  stable_penalty = int(
                      any(
                          marker in name
                          for marker in ("preview", "experimental", "exp-", "latest")
                      )
                  )
                  flash_penalty = 0 if "flash" in name else 1
                  return (stable_penalty, flash_penalty, name)

              candidates.sort(key=rank)
              if model_result.get("http_status") != 200 or not candidates:
                  return {
                      "classification": "GEMINI_MODEL_DISCOVERY_FAILED",
                      "models_http_status": model_result.get("http_status"),
                      "candidate_count": len(candidates),
                  }

              selected = str(candidates[0].get("name", ""))
              prompt = "Return exactly this token and nothing else: " + nonce
              body = json.dumps(
                  {
                      "contents": [
                          {
                              "role": "user",
                              "parts": [{"text": prompt}],
                          }
                      ],
                      "generationConfig": {
                          "temperature": 0,
                          "maxOutputTokens": 32,
                      },
                  },
                  separators=(",", ":"),
              ).encode()
              generate_url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"{selected}:generateContent?key={query_key}"
              )
              generate = safe_http_json(
                  generate_url,
                  method="POST",
                  headers={"content-type": "application/json"},
                  data=body,
                  timeout=45,
              )
              text = extract_gemini_text(generate.get("body", {}))
              exact = generate.get("http_status") == 200 and text == nonce
              return {
                  "classification": (
                      "GEMINI_SEMANTIC_READBACK_PROVEN"
                      if exact
                      else "GEMINI_SEMANTIC_READBACK_FAILED"
                  ),
                  "models_http_status": model_result.get("http_status"),
                  "candidate_count": len(candidates),
                  "selected_model": selected,
                  "generate_http_status": generate.get("http_status"),
                  "semantic_exact_match": exact,
                  "response_sha256": (
                      hashlib.sha256(text.encode()).hexdigest() if text else None
                  ),
              }

          recorded_at = datetime.now(timezone.utc).isoformat()
          nonce = "SOVARA_GEMINI_CANARY_" + hashlib.sha256(
              f"{SOURCE_SHA}:{recorded_at}".encode()
          ).hexdigest()[:16]

          presence = {
              "FO_ADMIN_TOKEN": bool(DIRECT_OPERATOR_TOKEN),
              "GEMINI_API_KEY": bool(DIRECT_GEMINI_KEY),
              **{
                  name: bool(os.environ.get(name, ""))
                  for name in STATIC_CREDENTIAL_NAMES
              },
              "GCP_WIF_PAIR_CONFIGURED_NOT_USED": (
                  os.environ.get("HAS_GCP_WIF_PAIR") == "true"
              ),
              "GENERIC_WIF_PAIR_CONFIGURED_NOT_USED": (
                  os.environ.get("HAS_GENERIC_WIF_PAIR") == "true"
              ),
          }

          receipt: dict[str, Any] = {
              "schema": SCHEMA,
              "receipt": "PFRD-OMEGA-OPERATOR-AUTH-RECOVERY",
              "recorded_at": recorded_at,
              "source_sha": SOURCE_SHA,
              "source_ref": SOURCE_REF,
              "project_id": PROJECT,
              "project_number": PROJECT_NUMBER,
              "region": REGION,
              "service": SERVICE,
              "operator_url": OPERATOR,
              "permissions": {
                  "contents": "read",
                  "id_token": "none",
                  "provider_mutation": False,
                  "repository_mutation": False,
              },
              "credential_alias_presence": presence,
              "google_machine_auth": {
                  "attempted": False,
                  "source_alias": None,
                  "authenticated": False,
                  "identity": None,
                  "attempts": [],
              },
              "secret_manager": {
                  "operator_token": None,
                  "gemini_key": None,
              },
              "provider_readback": {
                  "cloud_run": None,
              },
              "operator": {
                  "public_health": None,
                  "public_contract": None,
                  "unauthenticated_execute": None,
                  "token_source": None,
                  "token_present": False,
                  "authenticated_status": None,
                  "authenticated_cloud_read": None,
                  "bind_action_visible": False,
                  "classification": "NOT_EVALUATED",
              },
              "gemini": {
                  "key_source": None,
                  "semantic": None,
              },
              "overall_classification": "NOT_EVALUATED",
              "secret_values_recorded": False,
              "mutation_attempted": False,
          }

          google_access_token = ""
          for alias in STATIC_CREDENTIAL_NAMES:
              raw = os.environ.get(alias, "")
              if not raw:
                  continue
              receipt["google_machine_auth"]["attempted"] = True
              attempt: dict[str, Any] = {"alias": alias, "success": False}
              try:
                  credential = json.loads(raw)
                  access_token, identity = mint_service_account_access_token(credential)
                  google_access_token = access_token
                  attempt["success"] = True
                  attempt["identity"] = identity
                  receipt["google_machine_auth"].update(
                      {
                          "source_alias": alias,
                          "authenticated": True,
                          "identity": identity,
                      }
                  )
                  receipt["google_machine_auth"]["attempts"].append(attempt)
                  break
              except Exception as exc:
                  attempt["error_type"] = type(exc).__name__
                  attempt["error_code"] = str(exc)[:120]
                  receipt["google_machine_auth"]["attempts"].append(attempt)

          if google_access_token:
              receipt["provider_readback"]["cloud_run"] = cloud_run_readback(
                  google_access_token
              )
              operator_secret, operator_meta = secret_access(
                  google_access_token,
                  "fo-operator-admin-token",
              )
              receipt["secret_manager"]["operator_token"] = operator_meta
              gemini_secret, gemini_meta = secret_access(
                  google_access_token,
                  "gemini-api-key",
              )
              receipt["secret_manager"]["gemini_key"] = gemini_meta
          else:
              operator_secret = ""
              gemini_secret = ""

          operator_token = DIRECT_OPERATOR_TOKEN or operator_secret
          operator_token_source = (
              "github_actions_secret"
              if DIRECT_OPERATOR_TOKEN
              else ("google_secret_manager" if operator_secret else "none")
          )

          public_health = operator_call("/health")
          public_contract = operator_call("/")
          unauth_execute = operator_call(
              "/execute",
              body={
                  "action": "STATUS",
                  "payload": {
                      "purpose": "SOVARA unauthenticated boundary canary",
                      "mutation": "NONE",
                  },
              },
          )
          receipt["operator"]["public_health"] = public_health
          receipt["operator"]["public_contract"] = public_contract
          receipt["operator"]["unauthenticated_execute"] = {
              "http_status": unauth_execute.get("http_status"),
              "private_access_denied": unauth_execute.get("http_status") in (401, 403),
              "transport_error": unauth_execute.get("transport_error"),
          }
          allowed = set(public_contract.get("body", {}).get("allowedActions", []))
          receipt["operator"]["bind_action_visible"] = (
              "BIND_CFRE_PRIVATE_RUNTIME" in allowed
          )
          receipt["operator"]["token_present"] = bool(operator_token)
          receipt["operator"]["token_source"] = operator_token_source

          required_reads = {"STATUS", "READ_CLOUD_RUN_SERVICE"}
          if not operator_token:
              receipt["operator"]["classification"] = "OPERATOR_TOKEN_UNAVAILABLE"
          elif not required_reads.issubset(allowed):
              receipt["operator"]["classification"] = "OPERATOR_ALLOWLIST_MISMATCH"
          elif unauth_execute.get("http_status") not in (401, 403):
              receipt["operator"]["classification"] = "OPERATOR_PRIVATE_BOUNDARY_NOT_PROVEN"
          else:
              status = operator_call(
                  "/execute",
                  body={
                      "action": "STATUS",
                      "payload": {
                          "purpose": "SOVARA authenticated authority canary",
                          "mutation": "NONE",
                      },
                  },
                  token=operator_token,
                  authenticated=True,
              )
              cloud_read = operator_call(
                  "/execute",
                  body={
                      "action": "READ_CLOUD_RUN_SERVICE",
                      "payload": {
                          "project": PROJECT,
                          "region": REGION,
                          "service": SERVICE,
                          "purpose": "SOVARA provider-native operator readback",
                      },
                  },
                  token=operator_token,
                  authenticated=True,
              )
              receipt["operator"]["authenticated_status"] = status
              receipt["operator"]["authenticated_cloud_read"] = cloud_read
              reads_ok = all(
                  result.get("http_status") == 200
                  and result.get("body", {}).get("ok") is True
                  for result in (status, cloud_read)
              )
              if not reads_ok:
                  receipt["operator"]["classification"] = "AUTHENTICATED_OPERATOR_READS_FAILED"
              elif receipt["operator"]["bind_action_visible"]:
                  receipt["operator"]["classification"] = "AUTHENTICATED_OPERATOR_READS_PROVEN_BIND_VISIBLE"
              else:
                  receipt["operator"]["classification"] = "AUTHENTICATED_OPERATOR_READS_PROVEN_BIND_ABSENT"

          gemini_key = DIRECT_GEMINI_KEY or gemini_secret
          receipt["gemini"]["key_source"] = (
              "github_actions_secret"
              if DIRECT_GEMINI_KEY
              else ("google_secret_manager" if gemini_secret else "none")
          )
          receipt["gemini"]["semantic"] = gemini_semantic_canary(
              gemini_key,
              nonce,
          )

          cloud_run = receipt["provider_readback"]["cloud_run"] or {}
          google_read_ok = (
              receipt["google_machine_auth"]["authenticated"]
              and cloud_run.get("http_status") == 200
              and cloud_run.get("name")
              == f"projects/{PROJECT}/locations/{REGION}/services/{SERVICE}"
          )
          operator_ok = receipt["operator"]["classification"] in {
              "AUTHENTICATED_OPERATOR_READS_PROVEN_BIND_VISIBLE",
              "AUTHENTICATED_OPERATOR_READS_PROVEN_BIND_ABSENT",
          }
          gemini_ok = (
              receipt["gemini"]["semantic"].get("classification")
              == "GEMINI_SEMANTIC_READBACK_PROVEN"
          )

          if google_read_ok and operator_ok and gemini_ok:
              receipt["overall_classification"] = "SOVARA_CLOUD_OPERATOR_GEMINI_READ_MESH_PROVEN"
          elif operator_ok and gemini_ok:
              receipt["overall_classification"] = "SOVARA_OPERATOR_GEMINI_READ_MESH_PROVEN_GOOGLE_ADMIN_UNPROVEN"
          elif google_read_ok and operator_ok:
              receipt["overall_classification"] = "SOVARA_CLOUD_OPERATOR_READ_MESH_PROVEN_GEMINI_UNPROVEN"
          elif operator_ok:
              receipt["overall_classification"] = "SOVARA_OPERATOR_READ_MESH_PROVEN"
          elif google_read_ok:
              receipt["overall_classification"] = "SOVARA_GOOGLE_PROVIDER_READ_PROVEN_OPERATOR_UNPROVEN"
          else:
              receipt["overall_classification"] = "SOVARA_PROVIDER_AUTHORITY_NOT_REESTABLISHED"

          output = pathlib.Path("/tmp/pfrd-operator/OPERATOR_AUTH_RECOVERY_RECEIPT.json")
          output.write_text(
              json.dumps(
                  redact(
                      receipt,
                      operator_token=operator_token,
                      gemini_key=gemini_key,
                  ),
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "overall_classification": receipt["overall_classification"],
                      "operator_classification": receipt["operator"]["classification"],
                      "google_machine_authenticated": receipt["google_machine_auth"]["authenticated"],
                      "gemini_classification": receipt["gemini"]["semantic"].get("classification"),
                      "bind_action_visible": receipt["operator"]["bind_action_visible"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Upload immutable redacted authority receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pfrd-omega-operator-auth-recovery
          if-no-files-found: error
          retention-days: 30
          path: /tmp/pfrd-operator/OPERATOR_AUTH_RECOVERY_RECEIPT.json
