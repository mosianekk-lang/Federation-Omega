name: Alpha Omega Commercial Canonical API v10 Reconciliation

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-canonical-api-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-canonical-api-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-canonical-api-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run reconciliation and dependency regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_canonical_api_reconciliation
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_effective_state
          alpha_omega_commercial.test_institution_reconciliation
          alpha_omega_commercial.test_programme_integrity

      - name: Execute canonical API reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_canonical_api_reconciliation
          --output artifacts

      - name: Validate checkpoint and commercial truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          projection = json.loads((root / 'canonical_commercial_api_effective_v10.json').read_text())
          checkpoint = json.loads((root / 'canonical_api_reconciliation_checkpoint.json').read_text())
          receipt = json.loads(Path('artifacts/canonical-api-effective-v10-reconciliation-receipt.json').read_text())

          assert projection['projection_id'] == 'AO-COMMERCIAL-CANONICAL-API-EFFECTIVE-V10'
          assert projection['effective_api']['capability_revision'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-IDEMPOTENCY-V10'
          assert projection['effective_api']['canonical_class'] == 'IdempotentCoordinatedAuthoritySnapshotCommercialControlPlane'
          assert projection['effective_api']['idempotency_controls']['distributed_provider_exactly_once_proven'] is False
          assert projection['dependency']['preceding_release_pull_request'] == 137
          assert projection['dependency']['preceding_release_merge_commit'] == 'c3a1f14f2da79901c3d8e2d628f914f0beaf5a7d'
          assert all(value is False for value in projection['external_gates'].values())
          assert projection['commercial_truth']['verified_live_revenue_events'] == 0
          assert projection['commercial_truth']['full_commercial_maturity'] is False

          assert checkpoint['checkpoint_id'] == 'AO-COMMERCIAL-CANONICAL-API-EFFECTIVE-V10-CHECKPOINT'
          assert checkpoint['status'] in {
              'CANONICAL_API_EFFECTIVE_V10_RECONCILIATION_IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'CANONICAL_API_EFFECTIVE_V10_PROVIDER_PROOF_VERIFIED',
          }
          assert checkpoint['dependency_checkpoint']['programme_dependency_order_verified'] is True
          assert checkpoint['dependency_checkpoint']['preceding_drive_readback_verified'] is True
          assert checkpoint['effective_api']['package_export_verified'] is True
          assert checkpoint['effective_api']['distributed_provider_exactly_once_proven'] is False
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert receipt['status'] == 'CANONICAL_API_EFFECTIVE_V10_PROVIDER_PROOF_VERIFIED'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          assert receipt['verified_live_revenue_events'] == 0
          assert receipt['full_commercial_maturity'] is False
          assert len(receipt['proof_sha256']) == 64
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/canonical_api_reconciliation.py'),
              Path('alpha_omega_commercial/prove_canonical_api_reconciliation.py'),
              Path('alpha_omega_commercial/test_canonical_api_reconciliation.py'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v10.json'),
              Path('alpha_omega_commercial/canonical_api_reconciliation_checkpoint.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable canonical API reconciliation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-canonical-api-v10-reconciliation-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
