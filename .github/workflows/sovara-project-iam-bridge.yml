name: SOVARA Project IAM Bridge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sovara-project-iam-bridge.yml"
      - "governance/sovara_project_iam_binding_request_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovara-project-iam-bridge-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REQUEST_FILE: governance/sovara_project_iam_binding_request_v1.json
  HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
  HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
  HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
  HAS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
  HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
  HAS_GOOGLE_GHA_CREDS_JSON: ${{ secrets.GOOGLE_GHA_CREDS_JSON != '' }}
  HAS_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS != '' }}

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$REQUEST_FILE" <<'PY' > /tmp/request-mode.txt
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p.get('schema') == 'SOVARA_PROJECT_IAM_BINDING_REQUEST_V1', p
          assert p.get('execute') is True, p
          assert p.get('project_id') == 'sov-hybrid-suite', p
          assert p.get('project_number') == '257649435135', p
          assert p.get('runtime_service_account') == 'superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com', p
          assert p.get('deployer_service_account') == 'superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com', p
          expected={
            ('roles/aiplatform.user','serviceAccount:superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com'),
            ('roles/serviceusage.serviceUsageConsumer','serviceAccount:superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com'),
            ('roles/run.developer','serviceAccount:superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com'),
          }
          actual={(x.get('role'),x.get('member')) for x in p.get('required_bindings',[])}
          assert actual == expected, {'actual':actual,'expected':expected}
          mode=p.get('mode')
          if mode == 'AUTHORITY_PROBE':
              assert p.get('provider_mutation_allowed') is False, p
          elif mode == 'APPLY_VERIFY':
              assert p.get('provider_mutation_allowed') is True, p
              assert p.get('owner_authority') == 'EXPLICIT_CURRENT_CHAT_2026-08-29', p
          else:
              raise AssertionError(f'unsupported mode: {mode!r}')
          print(mode)
          PY
          MODE="$(cat /tmp/request-mode.txt)"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Validated SOVARA project IAM request mode=$MODE"

      - name: Authenticate existing GCP_SA_KEY route
        id: auth_gcp_sa
        if: ${{ env.HAS_GCP_SA_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GCP_SERVICE_ACCOUNT_KEY route
        id: auth_gcp_service_account
        if: ${{ env.HAS_GCP_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GOOGLE_CREDENTIALS route
        id: auth_google_credentials
        if: ${{ env.HAS_GOOGLE_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GOOGLE_SERVICE_ACCOUNT_KEY route
        id: auth_google_service_account
        if: ${{ env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GCP_CREDENTIALS route
        id: auth_gcp_credentials
        if: ${{ env.HAS_GCP_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GOOGLE_GHA_CREDS_JSON route
        id: auth_google_gha
        if: ${{ env.HAS_GOOGLE_GHA_CREDS_JSON == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_GHA_CREDS_JSON }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate existing GOOGLE_CLOUD_CREDENTIALS route
        id: auth_google_cloud
        if: ${{ env.HAS_GOOGLE_CLOUD_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Probe or apply exact three project IAM bindings
        id: bridge
        shell: bash
        env:
          MODE: ${{ steps.request.outputs.mode }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth_gcp_sa.outputs.access_token || steps.auth_gcp_service_account.outputs.access_token || steps.auth_google_credentials.outputs.access_token || steps.auth_google_service_account.outputs.access_token || steps.auth_gcp_credentials.outputs.access_token || steps.auth_google_gha.outputs.access_token || steps.auth_google_cloud.outputs.access_token }}
          OUTCOME_GCP_SA_KEY: ${{ steps.auth_gcp_sa.outcome }}
          OUTCOME_GCP_SERVICE_ACCOUNT_KEY: ${{ steps.auth_gcp_service_account.outcome }}
          OUTCOME_GOOGLE_CREDENTIALS: ${{ steps.auth_google_credentials.outcome }}
          OUTCOME_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ steps.auth_google_service_account.outcome }}
          OUTCOME_GCP_CREDENTIALS: ${{ steps.auth_gcp_credentials.outcome }}
          OUTCOME_GOOGLE_GHA_CREDS_JSON: ${{ steps.auth_google_gha.outcome }}
          OUTCOME_GOOGLE_CLOUD_CREDENTIALS: ${{ steps.auth_google_cloud.outcome }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/sovara-project-iam
          python3 - <<'PY'
          from __future__ import annotations
          import copy, hashlib, json, os, pathlib, urllib.error, urllib.request
          from datetime import datetime, timezone

          PROJECT='sov-hybrid-suite'
          MODE=os.environ['MODE']
          TOKEN=os.environ.get('GOOGLE_ACCESS_TOKEN','')
          ROUTES=(
            'GCP_SA_KEY','GCP_SERVICE_ACCOUNT_KEY','GOOGLE_CREDENTIALS',
            'GOOGLE_SERVICE_ACCOUNT_KEY','GCP_CREDENTIALS','GOOGLE_GHA_CREDS_JSON',
            'GOOGLE_CLOUD_CREDENTIALS'
          )
          outcomes={r:os.environ.get('OUTCOME_'+r,'skipped') for r in ROUTES}
          route=next((r for r in ROUTES if outcomes.get(r)=='success'), None)
          required=[
            ('roles/aiplatform.user','serviceAccount:superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com'),
            ('roles/serviceusage.serviceUsageConsumer','serviceAccount:superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com'),
            ('roles/run.developer','serviceAccount:superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com'),
          ]
          out=pathlib.Path('/tmp/sovara-project-iam/IAM_BRIDGE_RECEIPT.json')

          def digest(obj):
              return hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          def call(url, body):
              data=json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,method='POST',headers={
                  'authorization':f'Bearer {TOKEN}',
                  'content-type':'application/json',
                  'accept':'application/json',
                  'x-goog-user-project':PROJECT,
              })
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except Exception: body={'message_sha256':hashlib.sha256(raw.encode()).hexdigest()}
                  return e.code, body

          receipt={
            'schema':'SOVARA_PROJECT_IAM_BRIDGE_RECEIPT_V1',
            'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
            'source_sha':os.environ.get('GITHUB_SHA',''),
            'mode':MODE,
            'project_id':PROJECT,
            'credential_alias_presence':{r:os.environ.get('HAS_'+r)=='true' for r in ROUTES},
            'auth_outcomes':outcomes,
            'selected_credential_alias':route,
            'secret_values_recorded':False,
            'service_account_key_created':False,
            'provider_mutation_performed':False,
            'required_bindings':[{'role':r,'member':m} for r,m in required],
            'authority':{},
            'apply':{},
          }
          if not TOKEN or not route:
              receipt['state']='NO_EXISTING_GOOGLE_AUTH_ROUTE'
              receipt['receipt_sha256']=digest(receipt)
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
              raise SystemExit(2)

          perm_url=f'https://cloudresourcemanager.googleapis.com/v1/projects/{PROJECT}:testIamPermissions'
          status,perm=call(perm_url,{'permissions':['resourcemanager.projects.getIamPolicy','resourcemanager.projects.setIamPolicy']})
          granted=set(perm.get('permissions') or []) if status==200 else set()
          can_set='resourcemanager.projects.setIamPolicy' in granted
          receipt['authority']={
            'test_http_status':status,
            'granted_permissions':sorted(granted),
            'project_set_iam_policy':can_set,
          }
          if MODE=='AUTHORITY_PROBE':
              receipt['state']='AUTHORITY_VERIFIED' if can_set else 'AUTHORITY_NOT_VERIFIED'
              receipt['receipt_sha256']=digest(receipt)
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
              raise SystemExit(0 if can_set else 3)

          if MODE!='APPLY_VERIFY' or not can_set:
              receipt['state']='APPLY_BLOCKED_NO_VERIFIED_AUTHORITY'
              receipt['receipt_sha256']=digest(receipt)
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
              raise SystemExit(4)

          get_url=f'https://cloudresourcemanager.googleapis.com/v1/projects/{PROJECT}:getIamPolicy'
          set_url=f'https://cloudresourcemanager.googleapis.com/v1/projects/{PROJECT}:setIamPolicy'
          gs,pre=call(get_url,{})
          if gs!=200 or not isinstance(pre.get('bindings'),list):
              receipt['state']='PRE_POLICY_READ_FAILED'
              receipt['apply']['pre_read_http_status']=gs
              receipt['receipt_sha256']=digest(receipt)
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
              raise SystemExit(5)

          desired=copy.deepcopy(pre)
          additions=[]
          for role,member in required:
              binding=next((b for b in desired['bindings'] if b.get('role')==role and not b.get('condition')),None)
              if binding is None:
                  binding={'role':role,'members':[]}
                  desired['bindings'].append(binding)
              members=binding.setdefault('members',[])
              if member not in members:
                  members.append(member); members.sort(); additions.append({'role':role,'member':member})
          desired['bindings']=sorted(desired['bindings'],key=lambda b:(b.get('role',''),json.dumps(b.get('condition',{}),sort_keys=True)))
          receipt['apply']['pre_policy_bindings_sha256']=digest(pre.get('bindings',[]))
          receipt['apply']['planned_additions']=additions

          if additions:
              ss,set_result=call(set_url,{'policy':desired,'updateMask':'bindings,etag'})
              receipt['apply']['set_http_status']=ss
              if ss!=200:
                  receipt['state']='SET_IAM_POLICY_FAILED'
                  receipt['receipt_sha256']=digest(receipt)
                  out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
                  raise SystemExit(6)
              receipt['provider_mutation_performed']=True
          else:
              receipt['apply']['set_http_status']='NOT_NEEDED_ALREADY_BOUND'

          rs,post=call(get_url,{})
          receipt['apply']['post_read_http_status']=rs
          bindings=post.get('bindings',[]) if rs==200 else []
          def present(role,member):
              return any(b.get('role')==role and not b.get('condition') and member in (b.get('members') or []) for b in bindings)
          verified={f'{role}|{member}':present(role,member) for role,member in required}
          receipt['apply']['binding_readback']=verified
          receipt['apply']['post_policy_bindings_sha256']=digest(bindings)
          if rs==200 and all(verified.values()):
              receipt['state']='VERIFIED'
              receipt['receipt_sha256']=digest(receipt)
              out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
              raise SystemExit(0)

          # Roll back only bindings introduced by this run if verification fails.
          rollback_success=False
          if receipt['provider_mutation_performed']:
              cs,current=call(get_url,{})
              if cs==200:
                  rollback=copy.deepcopy(pre)
                  rollback['etag']=current.get('etag')
                  bs,_=call(set_url,{'policy':rollback,'updateMask':'bindings,etag'})
                  rollback_success=(bs==200)
          receipt['apply']['rollback_attempted']=receipt['provider_mutation_performed']
          receipt['apply']['rollback_success']=rollback_success
          receipt['state']='VERIFY_FAILED_ROLLED_BACK' if rollback_success else 'VERIFY_FAILED'
          receipt['receipt_sha256']=digest(receipt)
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          raise SystemExit(7)
          PY

      - name: Upload immutable redacted IAM receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-project-iam-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: /tmp/sovara-project-iam/IAM_BRIDGE_RECEIPT.json
