name: Bubbles Command Bus

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      command_json:
        description: "BUBBLES-CONTROL-COMMAND-V1 JSON envelope"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bubbles-command-bus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify Bubbles control-plane, command-bus and private-queue contracts
        run: |
          python -m unittest tests.test_bubbles_control_plane -v
          python -m unittest tests.test_bubbles_command_bus -v
          python -m unittest tests.test_bubbles_private_queue_adapter -v
          python -m unittest tests.test_fogas_v23_security_contract -v
          python -m unittest tests.test_bubbles_provider_edge_watch -v
          python -m unittest tests.test_bubbles_heartbeat_surface_sync -v
          python -m unittest tests.test_bubbles_platform_specialist_corps -v
          python -m unittest tests.test_bubbles_provider_surface_elevation -v

  command:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[BUBBLES-CMD]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize workflow-dispatch command
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMAND_JSON: ${{ inputs.command_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          Path('bubbles-command.json').write_text(os.environ['COMMAND_JSON'], encoding='utf-8')
          PY

      - name: Materialize ChatGPT pull-request command
        if: github.event_name == 'pull_request'
        env:
          COMMAND_JSON: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          Path('bubbles-command.json').write_text(os.environ.get('COMMAND_JSON', ''), encoding='utf-8')
          PY

      - name: Execute proof-bound Bubbles command
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GIT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bubbles-command-output
          source_ref="${PR_URL:-$GIT_REF}"
          python -m bubbles.command_bus \
            --command-file bubbles-command.json \
            --actor "$ACTOR" \
            --event-name "$EVENT_NAME" \
            --source-ref "$source_ref" \
            --output bubbles-command-output/receipt.json

      - name: Publish Bubbles receipt summary
        if: always() && hashFiles('bubbles-command-output/receipt.json') != ''
        shell: bash
        run: |
          echo '## Bubbles Command Bus' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bubbles-command-output/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable Bubbles command receipt
        if: always() && hashFiles('bubbles-command-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-command-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: bubbles-command-output/receipt.json
          if-no-files-found: error
          retention-days: 90

  provider-surface-readback:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Attempt canonical keyless Google Cloud identity
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: sov-hybrid-suite
          workload_identity_provider: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
          service_account: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

      - name: Install gcloud for readback
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sov-hybrid-suite

      - name: Run Bubbles read-only provider surface probe
        env:
          FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
          ARCHON_ADMIN_TOKEN: ${{ secrets.ARCHON_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bubbles-provider-probe-output
          python -m bubbles.provider_surface_probe --output bubbles-provider-probe-output/receipt.json

      - name: Publish provider readback summary
        if: always() && hashFiles('bubbles-provider-probe-output/receipt.json') != ''
        shell: bash
        run: |
          echo '## Bubbles Provider Surface Readback' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bubbles-provider-probe-output/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable provider readback receipt
        if: always() && hashFiles('bubbles-provider-probe-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-provider-surface-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: bubbles-provider-probe-output/receipt.json
          if-no-files-found: error
          retention-days: 90
