name: Bubbles Command Bus

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      command_json:
        description: "BUBBLES-CONTROL-COMMAND-V1 JSON envelope"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bubbles-command-bus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify Bubbles control-plane, command-bus and private-queue contracts
        run: |
          python -m unittest tests.test_bubbles_control_plane -v
          python -m unittest tests.test_bubbles_command_bus -v
          python -m unittest tests.test_bubbles_private_queue_adapter -v
          python -m unittest tests.test_fogas_v23_security_contract -v
          python -m unittest tests.test_bubbles_provider_edge_watch -v
          python -m unittest tests.test_bubbles_heartbeat_surface_sync -v
          python -m unittest tests.test_bubbles_platform_specialist_corps -v
          python -m unittest tests.test_bubbles_provider_surface_elevation -v
          python -m unittest tests.test_bubbles_apps_script_deployment_probe -v

  command:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[BUBBLES-CMD]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize workflow-dispatch command
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMAND_JSON: ${{ inputs.command_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          Path('bubbles-command.json').write_text(os.environ['COMMAND_JSON'], encoding='utf-8')
          PY

      - name: Materialize ChatGPT pull-request command
        if: github.event_name == 'pull_request'
        env:
          COMMAND_JSON: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          Path('bubbles-command.json').write_text(os.environ.get('COMMAND_JSON', ''), encoding='utf-8')
          PY

      - name: Execute proof-bound Bubbles command
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GIT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bubbles-command-output
          source_ref="${PR_URL:-$GIT_REF}"
          python -m bubbles.command_bus \
            --command-file bubbles-command.json \
            --actor "$ACTOR" \
            --event-name "$EVENT_NAME" \
            --source-ref "$source_ref" \
            --output bubbles-command-output/receipt.json

      - name: Publish Bubbles receipt summary
        if: always() && hashFiles('bubbles-command-output/receipt.json') != ''
        shell: bash
        run: |
          echo '## Bubbles Command Bus' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bubbles-command-output/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable Bubbles command receipt
        if: always() && hashFiles('bubbles-command-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-command-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: bubbles-command-output/receipt.json
          if-no-files-found: error
          retention-days: 90

  provider-surface-readback:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHATBRIDGE_LIVE_PROOF_REQUESTED: ${{ startsWith(github.event.head_commit.message, '[CHATBRIDGE-LIVE-PROOF]') }}
      REALITYGUARD_LIVE_BINDING_REQUESTED: ${{ startsWith(github.event.head_commit.message, '[REALITYGUARD-LIVE-BINDING]') }}
      HAS_DIRECT_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      PROJECT_ID: sov-hybrid-suite
      REGION: africa-south1
      SERVICE_NAME: architron9
      WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
      DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
      CANARY_NAMESPACE: aaa-provider-live-canary
      CANARY_BRANCH_NAMESPACE: aaa-provider-live-canary-branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run Bubbles read-only provider surface probe
        env:
          FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
          ARCHON_ADMIN_TOKEN: ${{ secrets.ARCHON_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bubbles-provider-probe-output
          python -m bubbles.provider_surface_probe --output bubbles-provider-probe-output/receipt.json
          python -m bubbles.apps_script_deployment_probe --receipt bubbles-provider-probe-output/receipt.json

      - name: Publish provider readback summary
        if: always() && hashFiles('bubbles-provider-probe-output/receipt.json') != ''
        shell: bash
        run: |
          echo '## Bubbles Provider Surface Readback' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bubbles-provider-probe-output/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable provider readback receipt
        if: always() && hashFiles('bubbles-provider-probe-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-provider-surface-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: bubbles-provider-probe-output/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Authenticate RealityGuard read-only canary through Google WIF
        id: realityguard_gcp_auth
        if: ${{ env.REALITYGUARD_LIVE_BINDING_REQUESTED == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare gcloud for RealityGuard read-only canary
        id: realityguard_gcloud
        if: ${{ env.REALITYGUARD_LIVE_BINDING_REQUESTED == 'true' && steps.realityguard_gcp_auth.outcome == 'success' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Invoke RealityGuard and build live-binding receipt
        if: ${{ always() && env.REALITYGUARD_LIVE_BINDING_REQUESTED == 'true' }}
        env:
          GCP_AUTH_OUTCOME: ${{ steps.realityguard_gcp_auth.outcome }}
          GCLOUD_SETUP_OUTCOME: ${{ steps.realityguard_gcloud.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realityguard-live-binding-output
          set +e
          PYTHONPATH=realityguard_v0.4.0/src python -m realityguard.cli federation-upgrade \
            --input realityguard_v0.4.0/examples/material_cycle_upgrade.json \
            --capabilities realityguard_v0.4.0/examples/federation_capabilities.json \
            --adapter-contract realityguard_v0.4.0/federation/REALITYGUARD_AUTO_UPGRADE_ADAPTER.v1.json \
            > realityguard-live-binding-output/adapter.json \
            2> realityguard-live-binding-output/adapter.stderr
          adapter_exit=$?
          set -e
          export ADAPTER_EXIT="$adapter_exit"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def safe_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          def read_only(command):
              completed = subprocess.run(command, text=True, capture_output=True, check=False)
              stdout = completed.stdout.strip()
              try:
                  parsed = json.loads(stdout) if stdout else None
              except json.JSONDecodeError:
                  parsed = stdout[:1000]
              return {
                  'ok': completed.returncode == 0,
                  'returncode': completed.returncode,
                  'result': parsed,
                  'stderr': completed.stderr.strip()[:1000],
              }

          adapter = safe_json('realityguard-live-binding-output/adapter.json')
          adapter_state = adapter.get('federation_adapter', {})
          adapter_invoked = (
              int(os.environ.get('ADAPTER_EXIT', '1')) == 0
              and adapter_state.get('adapter_invocation_observed') is True
              and adapter_state.get('system_id') == 'SYS-FEDERATION-OMEGA'
          )
          auth_ok = os.environ.get('GCP_AUTH_OUTCOME') == 'success'
          setup_ok = os.environ.get('GCLOUD_SETUP_OUTCOME') == 'success'
          provider = {}
          if auth_ok and setup_ok:
              provider['identity'] = read_only([
                  'gcloud', 'config', 'get-value', 'account', '--quiet'
              ])
              provider['project'] = read_only([
                  'gcloud', 'projects', 'describe', os.environ['PROJECT_ID'],
                  '--format=json(projectId,projectNumber,lifecycleState)'
              ])
              provider['service'] = read_only([
                  'gcloud', 'run', 'services', 'describe', os.environ['SERVICE_NAME'],
                  '--region', os.environ['REGION'], '--project', os.environ['PROJECT_ID'],
                  '--format=json(metadata.name,status.url,status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)'
              ])
              provider['revisions'] = read_only([
                  'gcloud', 'run', 'revisions', 'list',
                  '--service', os.environ['SERVICE_NAME'],
                  '--region', os.environ['REGION'], '--project', os.environ['PROJECT_ID'],
                  '--limit=5', '--format=json(metadata.name,status.conditions,status.serviceName)'
              ])

          identity = provider.get('identity', {})
          project = provider.get('project', {})
          service = provider.get('service', {})
          revisions = provider.get('revisions', {})
          identity_ok = identity.get('ok') is True and identity.get('result') == os.environ['DEPLOYER_SA']
          project_result = project.get('result') if isinstance(project.get('result'), dict) else {}
          service_result = service.get('result') if isinstance(service.get('result'), dict) else {}
          project_ok = (
              project.get('ok') is True
              and project_result.get('projectId') == os.environ['PROJECT_ID']
              and project_result.get('lifecycleState') == 'ACTIVE'
          )
          service_ok = (
              service.get('ok') is True
              and service_result.get('metadata', {}).get('name') == os.environ['SERVICE_NAME']
              and bool(service_result.get('status', {}).get('latestReadyRevisionName'))
          )
          revisions_ok = revisions.get('ok') is True and isinstance(revisions.get('result'), list)
          host_binding_verified = all((
              adapter_invoked, identity_ok, project_ok, service_ok, revisions_ok
          ))
          receipt = {
              'schema': 'REALITYGUARD-LIVE-HOST-BINDING-1',
              'system_id': 'SYS-FEDERATION-OMEGA',
              'host_workflow': '.github/workflows/bubbles-command-bus.yml',
              'host_job': 'provider-surface-readback',
              'adapter_invocation_observed': adapter_invoked,
              'adapter_reported_integration_state': adapter_state.get('integration_state'),
              'source_adapter_supported': adapter_state.get('source_adapter_supported') is True,
              'gcp_auth_outcome': os.environ.get('GCP_AUTH_OUTCOME') or 'skipped',
              'gcloud_setup_outcome': os.environ.get('GCLOUD_SETUP_OUTCOME') or 'skipped',
              'identity_ok': identity_ok,
              'project_ok': project_ok,
              'service_read_ok': service_ok,
              'revision_read_ok': revisions_ok,
              'host_binding_verified': host_binding_verified,
              'provider_reads': provider,
              'provider_mutation_attempted': False,
              'secret_values_recorded': False,
              'manual_user_tasks': [],
              'truth_boundary': (
                  'This receipt proves marker-gated RealityGuard invocation inside the active '
                  'Bubbles host and read-only access to the named Cloud Run runtime. It does not '
                  'claim traffic mutation or binding of the other registered logical systems.'
              ),
          }
          unsigned = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(unsigned.encode()).hexdigest()
          Path('realityguard-live-binding-output/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'host_binding_verified': host_binding_verified,
              'receipt_sha256': receipt['receipt_sha256'],
          }, sort_keys=True))
          PY

      - name: Upload immutable RealityGuard live-binding receipt
        if: ${{ always() && env.REALITYGUARD_LIVE_BINDING_REQUESTED == 'true' && hashFiles('realityguard-live-binding-output/receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realityguard-live-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            realityguard-live-binding-output/adapter.json
            realityguard-live-binding-output/adapter.stderr
            realityguard-live-binding-output/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce RealityGuard semantic live-binding gate
        if: ${{ always() && env.REALITYGUARD_LIVE_BINDING_REQUESTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          receipt = json.load(open('realityguard-live-binding-output/receipt.json', encoding='utf-8'))
          if receipt.get('host_binding_verified') is not True:
              raise SystemExit(
                  'RealityGuard live binding remains unproven: '
                  + 'auth=' + str(receipt.get('gcp_auth_outcome'))
                  + ' gcloud=' + str(receipt.get('gcloud_setup_outcome'))
                  + ' identity=' + str(receipt.get('identity_ok'))
                  + ' project=' + str(receipt.get('project_ok'))
                  + ' service=' + str(receipt.get('service_read_ok'))
                  + ' revisions=' + str(receipt.get('revision_read_ok'))
              )
          print('REALITYGUARD_LIVE_HOST_BINDING_VERIFIED')
          PY

      - name: Bind approved OpenAI key for ChatBridge canary
        id: chatbridge_bind_key
        if: ${{ env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' }}
        shell: bash
        env:
          DIRECT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p chatbridge-provider-live-output
          source_kind='NONE'
          key=''
          if [ -n "${DIRECT_OPENAI_API_KEY:-}" ]; then
            key="$DIRECT_OPENAI_API_KEY"
            source_kind='GITHUB_ACTIONS_SECRET'
          fi
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            printf 'OPENAI_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"
            echo 'bound=true' >> "$GITHUB_OUTPUT"
            bound=true
          else
            echo 'bound=false' >> "$GITHUB_OUTPUT"
            bound=false
          fi
          export KEY_BOUND_CURRENT="$bound"
          export KEY_SOURCE_CURRENT="$source_kind"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'schema':'CHATBRIDGE-PROVIDER-LIVE-BINDING-PREFLIGHT-1',
            'key_bound':os.environ.get('KEY_BOUND_CURRENT')=='true',
            'key_source':os.environ.get('KEY_SOURCE_CURRENT') or 'NONE',
            'direct_secret_present':bool(os.environ.get('DIRECT_OPENAI_API_KEY','')),
            'gcp_auth_outcome':'not_configured_in_bubbles',
            'gcloud_outcome':'not_configured_in_bubbles',
            'secret_values_recorded':False,
            'truth_boundary':'Bubbles consumes only the proven GitHub Actions secret binding. Alternate provider-secret bindings require their own separately admitted execution home and provider proof.'
          }
          Path('chatbridge-provider-live-output/binding.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Install admitted Agents SDK for ChatBridge canary
        if: ${{ env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' && steps.chatbridge_bind_key.outputs.bound == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r evidenceops/ai_ict_durable/requirements-sdk.txt

      - name: Execute existing ChatBridge provider-live canary
        id: chatbridge_live_canary
        if: ${{ env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' && steps.chatbridge_bind_key.outputs.bound == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          CHATBRIDGE_OPENAI_MODEL: gpt-5.4-mini
          CHATBRIDGE_OWNER: Kim Kagiso Mosiane
        run: |
          set -euo pipefail
          set +x
          mkdir -p .chatbridge chatbridge-provider-live-output
          python -m bubbles.chatbridge_omega4.live_canary \
            --db .chatbridge/aaa_provider_live_canary.sqlite3 \
            --namespace "$CANARY_NAMESPACE" \
            prove --branch-namespace "$CANARY_BRANCH_NAMESPACE" \
            > chatbridge-provider-live-output/canary.json

      - name: Build ChatBridge fail-closed provider-live receipt
        if: ${{ always() && env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' }}
        shell: bash
        env:
          KEY_BOUND: ${{ steps.chatbridge_bind_key.outputs.bound }}
          CANARY_OUTCOME: ${{ steps.chatbridge_live_canary.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base={
            'schema':'CHATBRIDGE-AAA-PROVIDER-LIVE-PROOF-2',
            'namespace':os.environ.get('CANARY_NAMESPACE'),
            'branch_namespace':os.environ.get('CANARY_BRANCH_NAMESPACE'),
            'execution_lane':'BUBBLES_COMMAND_BUS_TRUSTED_PROVIDER_SURFACE',
            'key_bound':os.environ.get('KEY_BOUND')=='true',
            'canary_step_outcome':os.environ.get('CANARY_OUTCOME') or 'skipped',
            'gcp_auth_outcome':'not_configured_in_bubbles',
            'api_key_logged':False,
            'provider_live_verified':False,
          }
          p=Path('chatbridge-provider-live-output/canary.json')
          canary={}
          if p.exists():
            try: canary=json.loads(p.read_text())
            except Exception: canary={'state':'UNREADABLE_CANARY_RECEIPT'}
          base['canary']=canary
          expected=(
            base['key_bound'] and
            base['canary_step_outcome']=='success' and
            canary.get('state')=='PROVIDER_LIVE_CANARY_PHASES_VERIFIED' and
            canary.get('duplicate_resume_rejected') is True and
            canary.get('branch_provider_lineage_independent') is True and
            bool(canary.get('conversation_id'))
          )
          base['provider_live_verified']=bool(expected)
          if expected:
            base['classification']='PROVIDER_LIVE_VERIFIED'
          elif not base['key_bound']:
            base['classification']='KEY_CREATION_SEPARATE__RUNTIME_KEY_BINDING_UNPROVEN'
          else:
            base['classification']='RUNTIME_KEY_BOUND__PROVIDER_LIVE_CANARY_FAILED_OR_INCOMPLETE'
          unsigned=json.dumps(base,sort_keys=True,separators=(',',':'))
          base['receipt_sha256']=hashlib.sha256(unsigned.encode()).hexdigest()
          Path('chatbridge-provider-live-output/receipt.json').write_text(json.dumps(base,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:base[k] for k in ['classification','provider_live_verified','receipt_sha256']},sort_keys=True))
          PY

      - name: Resolve Federation provider trust state
        if: ${{ always() && env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' && hashFiles('chatbridge-provider-live-output/receipt.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f chatbridge-provider-live-output/canary.json ]; then
            printf '{}\n' > chatbridge-provider-live-output/canary.json
          fi
          python -m federation_consolidation.provider_trust_resolver from-chatbridge \
            --contract governance/provider_trust_contract_v1.json \
            --binding chatbridge-provider-live-output/binding.json \
            --canary chatbridge-provider-live-output/canary.json \
            --provider-receipt chatbridge-provider-live-output/receipt.json \
            --output chatbridge-provider-live-output/provider-trust-resolution.json

      - name: Upload immutable ChatBridge provider-live receipt
        if: ${{ always() && env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' && hashFiles('chatbridge-provider-live-output/receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatbridge-provider-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            chatbridge-provider-live-output/binding.json
            chatbridge-provider-live-output/canary.json
            chatbridge-provider-live-output/receipt.json
            chatbridge-provider-live-output/provider-trust-resolution.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce ChatBridge semantic provider-live gate
        if: ${{ always() && env.CHATBRIDGE_LIVE_PROOF_REQUESTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          provider=json.load(open('chatbridge-provider-live-output/receipt.json'))
          trust=json.load(open('chatbridge-provider-live-output/provider-trust-resolution.json'))
          provider_live=provider.get('provider_live_verified') is True
          trust_live=trust.get('state')=='PROVIDER_LIVE_VERIFIED' and trust.get('ready') is True
          if provider_live != trust_live:
              raise SystemExit('Provider proof/trust resolver contradiction: provider='+str(provider.get('classification'))+' trust='+str(trust.get('state')))
          if not provider_live:
              raise SystemExit('Provider-live proof gate remains OPEN: '+str(provider.get('classification'))+' / TRUST='+str(trust.get('state'))+' / NEXT='+str(trust.get('next_action')))
          print('PROVIDER_LIVE_VERIFIED / FEDERATION_PROVIDER_TRUST_VERIFIED')
          PY
