name: Alpha Omega Commercial Live Provider Expansion

on:
  push:
    branches:
      - alpha-omega-commercial-canonical-authority-reconciliation
    paths:
      - 'alpha_omega_commercial/canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/prove_canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/test_canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/canonical_authority_reconciliation_receipt.json'
      - 'alpha_omega_commercial/provider_authority_requirements.json'
      - 'alpha_omega_commercial/programme.json'
      - 'sol_61_runtime/canonical_live_authority_manifest.json'
      - 'sol_61_runtime/provider_certification_register.json'
      - '.github/workflows/alpha-omega-commercial-live-provider-expansion.yml'
  pull_request:
    paths:
      - 'alpha_omega_commercial/canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/prove_canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/test_canonical_authority_reconciliation.py'
      - 'alpha_omega_commercial/canonical_authority_reconciliation_receipt.json'
      - 'alpha_omega_commercial/provider_authority_requirements.json'
      - 'alpha_omega_commercial/programme.json'
      - 'sol_61_runtime/canonical_live_authority_manifest.json'
      - 'sol_61_runtime/provider_certification_register.json'
      - '.github/workflows/alpha-omega-commercial-live-provider-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: sov-hybrid-suite
  REGION: africa-south1
  SERVICE: federation-omega-operator
  SERVICE_PATH: /execute

jobs:
  provider-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run commercial regression tests
        working-directory: alpha_omega_commercial
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -p 'test_*.py' -v

      - name: Reconcile canonical provider authority
        working-directory: alpha_omega_commercial
        run: |
          set -euo pipefail
          python prove_canonical_authority_reconciliation.py \
            --output artifacts/canonical-authority-reconciliation-proof

      - name: Verify persisted receipt and fail-closed boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('alpha_omega_commercial/artifacts/canonical-authority-reconciliation-proof')
          receipt=json.loads((root/'canonical-authority-reconciliation-receipt.json').read_text())
          projection=json.loads((root/'programme.updated.json').read_text())
          programme=json.loads(Path('alpha_omega_commercial/programme.json').read_text())
          persisted=json.loads(Path('alpha_omega_commercial/canonical_authority_reconciliation_receipt.json').read_text())
          assert receipt['status'] == 'CANONICAL_PROVIDER_ROUTE_ALIGNED_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert all(receipt['gates'].values())
          assert receipt['cloud_run']['service'] == 'federation-omega-operator'
          assert receipt['cloud_run']['path'] == '/execute'
          assert not receipt['cloud_run']['live_invocation_proven']
          assert not receipt['cloud_run']['cloud_mutation_performed']
          assert projection['external_gate_evidence'] == {}
          assert programme['external_gate_evidence'] == {}
          checkpoint=programme['canonical_authority_reconciliation']
          assert checkpoint['status'] == receipt['status']
          assert checkpoint['receipt_sha256'] == receipt['receipt_sha256']
          assert checkpoint['receipt_file'] == 'alpha_omega_commercial/canonical_authority_reconciliation_receipt.json'
          assert checkpoint['provider_proof']['workflow_run'] == 30861303534
          assert checkpoint['provider_proof']['artifact_id'] == 8874423157
          assert checkpoint['provider_proof']['artifact_digest'] == 'sha256:6ba9dd485b177b6889ae5e21c2e53e6f44ba2f8c363c4d7f0f033f8edaad1fbd'
          assert persisted['receipt_sha256'] == receipt['receipt_sha256']
          assert persisted['provider_proof'] == checkpoint['provider_proof']
          assert persisted['verified_revenue_events'] == 0
          assert not persisted['full_commercial_maturity']
          truth=receipt['truth_boundary']
          assert truth['service_enabled_platform_priority_preserved']
          for key in (
              'customer_demand_proven','signed_contract_proven','payment_or_revenue_proven',
              'subscription_or_invoice_proven','cloud_run_operation_proven',
              'enterprise_attestation_proven','partner_adoption_proven',
              'external_case_study_proven','production_scale_proven',
              'owner_reserved_authority_bypassed',
          ):
              assert not truth[key], (key, truth)
          PY

      - name: Upload canonical authority proof
        uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-commercial-canonical-authority-reconciliation-proof
          path: alpha_omega_commercial/artifacts/canonical-authority-reconciliation-proof
          retention-days: 90
          if-no-files-found: error
