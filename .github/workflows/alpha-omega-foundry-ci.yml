name: Alpha Omega Foundry CI
on:
  push:
    paths:
      - 'alpha_omega_v2/**'
      - '.github/workflows/alpha-omega-foundry-ci.yml'
  pull_request:
    paths:
      - 'alpha_omega_v2/**'
      - '.github/workflows/alpha-omega-foundry-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: ao-foundry examples/concept.json --workspace ./ci_workspace
      - run: test -f ./ci_workspace/operational/*/operational_receipt.json
