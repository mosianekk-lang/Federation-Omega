name: Probe ARCHITRON Execute Route for FO Transcription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fo-transcription-architron-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe public health and bounded execute actions
        env:
          ARCHITRON_URL: https://architron9-7ujkyfl36q-bq.a.run.app
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          curl --silent --show-error --location --max-time 30 \
            -w '\n%{http_code}' "$ARCHITRON_URL/health" > /tmp/health.raw || true
          curl --silent --show-error --location --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'x-approval-key: APPROVED' \
            -d '{"action":"STATUS","approvalKey":"APPROVED","payload":{"purpose":"FO transcription bridge provider route discovery","readOnly":true,"noMutation":true}}' \
            -w '\n%{http_code}' "$ARCHITRON_URL/execute" > /tmp/status.raw || true
          curl --silent --show-error --location --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'x-approval-key: APPROVED' \
            -d '{"action":"CAPABILITIES","approvalKey":"APPROVED","payload":{"purpose":"Discover authorised deployment and Apps Script execution routes","readOnly":true,"noMutation":true}}' \
            -w '\n%{http_code}' "$ARCHITRON_URL/execute" > /tmp/capabilities.raw || true
          python - <<'PY' > deployment_receipts/fo-transcription-architron-probe.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse(path):
              raw=Path(path).read_text(errors='replace')
              body, _, code=raw.rpartition('\n')
              try: payload=json.loads(body)
              except Exception: payload={'raw':body[:12000]}
              return {'http_status':int(code) if code.isdigit() else None,'body':payload}

          print(json.dumps({
              'receipt':'FO-TRANSCRIPTION-ARCHITRON-EXECUTE-PROBE',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'health':parse('/tmp/health.raw'),
              'status_action':parse('/tmp/status.raw'),
              'capabilities_action':parse('/tmp/capabilities.raw'),
              'mutation_requested':False,
          }, indent=2, sort_keys=True))
          PY

      - name: Publish probe receipt
        run: |
          set -euo pipefail
          git config user.name 'fo-transcription-route-probe'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add deployment_receipts/fo-transcription-architron-probe.json
          git commit -m 'Record ARCHITRON execute-route probe [skip ci]' || exit 0
          git push origin HEAD:main
