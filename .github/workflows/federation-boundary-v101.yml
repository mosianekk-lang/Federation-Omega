name: Federation Boundary Resolution v1.0.1

on:
  pull_request:
    paths:
      - "federation_consolidation/releases/v1.0.1/**"
      - ".github/workflows/federation-boundary-v101.yml"
  push:
    branches:
      - main
    paths:
      - "federation_consolidation/releases/v1.0.1/**"
      - ".github/workflows/federation-boundary-v101.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify v1.0.1 release descriptors
        run: python federation_consolidation/releases/v1.0.1/verify_release.py
      - name: Run consolidation regressions
        run: |
          python -m pip install pytest
          pytest -q tests/test_federation_consolidation.py
      - name: Enforce no-effect boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('federation_consolidation/releases/v1.0.1')
          status = json.loads((root / 'FINAL_STATUS.json').read_text())
          receipt = json.loads((root / 'RELEASE_RECEIPT.json').read_text())
          assert status['external_effects'] == 0
          assert receipt['external_effects'] == 0
          assert receipt['authority_ceiling'] == 'A1_REVERSIBLE_INTERNAL'
          print('NO_EFFECT_BOUNDARY_OK')
          PY
