name: EvidenceOps In-Place Audit Omega

on:
  push:
    paths:
      - 'evidenceops/in_place_audit_omega/**'
      - 'evidenceops/tests/test_in_place_audit_omega.py'
      - '.github/workflows/evidenceops-in-place-audit-omega.yml'
  pull_request:
    paths:
      - 'evidenceops/in_place_audit_omega/**'
      - 'evidenceops/tests/test_in_place_audit_omega.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q evidenceops/tests/test_in_place_audit_omega.py
      - name: Emit capability receipt
        run: |
          mkdir -p audit-receipt
          python - <<'PY'
          import hashlib, json, pathlib, time
          files = [
              pathlib.Path('evidenceops/in_place_audit_omega/engine.py'),
              pathlib.Path('evidenceops/in_place_audit_omega/README.md'),
              pathlib.Path('evidenceops/tests/test_in_place_audit_omega.py'),
          ]
          receipt = {
              'capability': 'EVIDENCEOPS_IN_PLACE_AUDIT_OMEGA',
              'status': 'TESTS_PASSED',
              'generated_at': int(time.time()),
              'files': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          pathlib.Path('audit-receipt/receipt.json').write_text(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidenceops-in-place-audit-omega-receipt
          path: audit-receipt/receipt.json
