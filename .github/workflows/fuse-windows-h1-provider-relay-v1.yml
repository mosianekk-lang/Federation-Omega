name: FUSE Windows H1 Provider Relay v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: fuse-windows-h1-provider-relay-v1
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: fuse-windows-relay-h1
  ARTIFACT_REPOSITORY: federation-omega
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  WINDOWS_POLICY_EPOCH: FUSE_WINDOWS_H1_TPM_PAIRING_V1

jobs:
  provider-relay-court:
    if: github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_H1_PROVIDER_RELAY_V1' && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact signed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate keyless deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight exact identity and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/dev/null
          gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(name)' >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" --format='value(email)' >/dev/null
          gcloud run services list --project "$PROJECT_ID" --region "$REGION" --limit=1 --format='value(metadata.name)' >/dev/null
          echo 'PROVIDER_PREREQS_QUALIFIED=true' >> "$GITHUB_ENV"

      - name: Build and publish exact source image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay:$GITHUB_SHA"
          docker build --file windows_federation_plane/Dockerfile --tag "$IMAGE" windows_federation_plane
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          IMAGE_DIGEST_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay@$DIGEST"
          echo "IMAGE_DIGEST_URI=$IMAGE_DIGEST_URI" >> "$GITHUB_ENV"
          echo "VERIFIED_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo 'ARTIFACT_REGISTRY_PUSH_PERFORMED=true' >> "$GITHUB_ENV"

      - name: Deploy dedicated lightweight H1 relay
        shell: bash
        run: |
          set -euo pipefail
          PREEXISTED=false
          PREVIOUS_REVISION=''
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
            PREEXISTED=true
            PREVIOUS_REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          fi
          echo "SERVICE_PREEXISTED=$PREEXISTED" >> "$GITHUB_ENV"
          echo "PREVIOUS_REVISION=$PREVIOUS_REVISION" >> "$GITHUB_ENV"
          echo 'CLOUD_RUN_DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
          echo 'PRODUCTION_TRAFFIC_CHANGED=false' >> "$GITHUB_ENV"

          ENVVARS="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FUSE_AGENT_ONLY_BOOTSTRAP=true,FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY,FUSE_WINDOWS_SOURCE_EPOCH=$GITHUB_SHA,FUSE_WINDOWS_POLICY_EPOCH=$WINDOWS_POLICY_EPOCH"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_DIGEST_URI" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --ingress all \
            --default-url \
            --no-invoker-iam-check \
            --set-env-vars="$ENVVARS" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$SERVICE_URL" && test -n "$REVISION"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "CANARY_REVISION=$REVISION" >> "$GITHUB_ENV"
          printf 'ROLLBACK_DELETE=gcloud run services delete %q --project %q --region %q --quiet\n' "$SERVICE" "$PROJECT_ID" "$REGION" >> "$GITHUB_ENV"

      - name: Provider-native semantic relay court
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_CODE='000'
          for attempt in $(seq 1 18); do
            HEALTH_CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /tmp/h1-health.json --write-out '%{http_code}' "$SERVICE_URL/healthz" || true)"
            if [[ "$HEALTH_CODE" == '200' ]] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); raise SystemExit(0 if d.get("status")=="ok" and d.get("device_auth")=="ECDSA_P256" else 1)' /tmp/h1-health.json; then
              break
            fi
            sleep 5
          done
          test "$HEALTH_CODE" = '200'
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("status")=="ok"; assert d.get("device_auth")=="ECDSA_P256"' /tmp/h1-health.json

          NODE_CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /tmp/h1-node.html --write-out '%{http_code}' "$SERVICE_URL/node" || true)"
          test "$NODE_CODE" = '200'
          grep -F 'CONNECT THIS PC' /tmp/h1-node.html >/dev/null

          MCP_CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /tmp/h1-mcp.txt --write-out '%{http_code}' "$SERVICE_URL/mcp" || true)"
          case "$MCP_CODE" in 401|403|404) ;; *) echo "MCP_FAIL_CLOSED_REQUIRED:$MCP_CODE" >&2; exit 51 ;; esac

          PAIR_START_CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 10 -X POST -H 'content-type: application/json' -d '{}' --output /tmp/h1-pair-start.json --write-out '%{http_code}' "$SERVICE_URL/agent/enroll/start" || true)"
          case "$PAIR_START_CODE" in 400|401|403) ;; *) echo "PAIR_ROUTE_FAIL_CLOSED_REQUIRED:$PAIR_START_CODE" >&2; exit 52 ;; esac

          echo 'RELAY_PROVIDER_VERIFIED=true' >> "$GITHUB_ENV"
          echo 'MCP_FAIL_CLOSED_CHECKED=true' >> "$GITHUB_ENV"
          echo 'PAIR_ROUTE_PRESENT_FAIL_CLOSED=true' >> "$GITHUB_ENV"
          echo "HEALTH_CODE=$HEALTH_CODE" >> "$GITHUB_ENV"
          echo "NODE_CODE=$NODE_CODE" >> "$GITHUB_ENV"
          echo "MCP_CODE=$MCP_CODE" >> "$GITHUB_ENV"
          echo "PAIR_START_CODE=$PAIR_START_CODE" >> "$GITHUB_ENV"
          echo "HEALTH_SHA256=$(sha256sum /tmp/h1-health.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NODE_SHA256=$(sha256sum /tmp/h1-node.html | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Emit bounded provider receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuse-windows-h1-provider-receipt
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          truth=lambda n: os.environ.get(n,'').lower()=='true'
          r={
            'schema':'FUSE-WINDOWS-H1-PROVIDER-RECEIPT-V1',
            'source_sha':os.environ.get('GITHUB_SHA'),
            'project_id':os.environ.get('PROJECT_ID'),
            'region':os.environ.get('REGION'),
            'service':os.environ.get('SERVICE'),
            'service_url':os.environ.get('SERVICE_URL'),
            'revision':os.environ.get('CANARY_REVISION'),
            'image_digest':os.environ.get('VERIFIED_IMAGE_DIGEST'),
            'provider_prereqs_qualified':truth('PROVIDER_PREREQS_QUALIFIED'),
            'artifact_registry_push_performed':truth('ARTIFACT_REGISTRY_PUSH_PERFORMED'),
            'cloud_run_deploy_attempted':truth('CLOUD_RUN_DEPLOY_ATTEMPTED'),
            'relay_provider_verified':truth('RELAY_PROVIDER_VERIFIED'),
            'mcp_fail_closed_checked':truth('MCP_FAIL_CLOSED_CHECKED'),
            'pair_route_present_fail_closed':truth('PAIR_ROUTE_PRESENT_FAIL_CLOSED'),
            'health_code':os.environ.get('HEALTH_CODE'),
            'node_code':os.environ.get('NODE_CODE'),
            'mcp_code':os.environ.get('MCP_CODE'),
            'pair_start_code':os.environ.get('PAIR_START_CODE'),
            'health_sha256':os.environ.get('HEALTH_SHA256'),
            'node_sha256':os.environ.get('NODE_SHA256'),
            'source_epoch':os.environ.get('GITHUB_SHA'),
            'policy_epoch':os.environ.get('WINDOWS_POLICY_EPOCH'),
            'gcp_heavy_compute':'DENY',
            'heavy_compute_performed':False,
            'production_traffic_changed':False,
            'secret_value_recorded':False,
            'rollback_delete':os.environ.get('ROLLBACK_DELETE'),
            'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
          }
          b=json.dumps(r,sort_keys=True,separators=(',',':')).encode()
          r['receipt_sha256']=hashlib.sha256(b).hexdigest()
          open('/tmp/fuse-windows-h1-provider-receipt/receipt.json','w',encoding='utf-8').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload provider receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-h1-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fuse-windows-h1-provider-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
