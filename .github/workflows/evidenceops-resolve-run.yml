name: EvidenceOps RESOLVE Job

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository path to a RESOLVE job manifest
        required: true
        default: evidenceops/resolve/examples/job.json

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate system
        working-directory: evidenceops/resolve
        run: python -m unittest discover -s tests -v
      - name: Validate manifest exists
        run: test -f "${{ inputs.manifest_path }}"
      - name: Record bounded execution note
        run: |
          echo 'This workflow validates and stages the job contract.'
          echo 'Provider adapters and credentials must be explicitly supplied by the deployment environment.'
