name: EvidenceOps MCP Adapter CI
on:
  pull_request:
    paths:
      - 'evidenceops-mcp-adapter/**'
      - '.github/workflows/evidenceops-mcp-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidenceops-mcp-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evidenceops-mcp-adapter/package.json
      - run: npm install
      - run: npm run check
      - run: docker build -t evidenceops-mcp-adapter:test .
