name: NEXUS Direct Runtime Target Executor

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "deployments/nexus/trigger-direct-runtime.txt"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nexus-direct-runtime-target
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: fo-automation-agent@sov-hybrid-suite.iam.gserviceaccount.com
  REPOSITORY: fo-runtime
  SERVICE: nexus-codex-runtime
  SOURCE_SERVICE: architron9
  SQL_INSTANCE: nexus-codex-pg

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run fixed proof-only deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments/nexus /tmp/nexus-preflight
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          project=os.environ['PROJECT_ID']; region=os.environ['REGION']
          def run(args):
              p=subprocess.run(args,text=True,capture_output=True)
              return {'ok':p.returncode==0,'exit_code':p.returncode,'stdout':p.stdout.strip()[:5000],'stderr':p.stderr.strip()[:2000]}
          def gcloud(*args): return run(['gcloud',*args,'--project',project])

          account=run(['gcloud','auth','list','--filter=status:ACTIVE','--format=value(account)'])
          project_info=gcloud('projects','describe',project,'--format=json(projectId,projectNumber,lifecycleState)')
          runtime_sa=gcloud('iam','service-accounts','describe',os.environ['RUNTIME_SA'],'--format=json(email,disabled,oauth2ClientId)')
          repository=gcloud('artifacts','repositories','describe',os.environ['REPOSITORY'],'--location',region,'--format=json(name,format,mode,createTime)')
          api_states={}
          for api in ['run.googleapis.com','cloudbuild.googleapis.com','artifactregistry.googleapis.com','secretmanager.googleapis.com','sqladmin.googleapis.com','drive.googleapis.com','docs.googleapis.com','sheets.googleapis.com']:
              api_states[api]=gcloud('services','describe',api,'--format=value(state)')
          secrets={}
          for secret in ['OPENAI_API_KEY','NEXUS_DATABASE_URL','fo-operator-admin-token','archon-admin-plane-token']:
              desc=gcloud('secrets','describe',secret,'--format=json(name,createTime,replication)')
              versions=gcloud('secrets','versions','list',secret,'--filter=state=ENABLED','--format=value(name)','--limit=5')
              access=gcloud('secrets','versions','access','latest','--secret',secret,'--out-file=/dev/null')
              secrets[secret]={
                  'metadata':desc,
                  'enabled_version_present':bool(versions.get('stdout')),
                  'versions_probe':{'ok':versions['ok'],'exit_code':versions['exit_code'],'stderr':versions['stderr']},
                  'access_probe':{'ok':access['ok'],'exit_code':access['exit_code'],'stderr':access['stderr']},
              }
          sql=gcloud('sql','instances','describe',os.environ['SQL_INSTANCE'],'--format=json(name,region,state,databaseVersion,connectionName,settings.tier)')
          target=gcloud('run','services','describe',os.environ['SERVICE'],'--region',region,'--format=json(metadata.name,status.url,status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)')
          source=gcloud('run','services','describe',os.environ['SOURCE_SERVICE'],'--region',region,'--format=json(metadata.name,status.url,status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)')
          builds=gcloud('builds','list','--limit=3','--format=json(id,status,createTime,finishTime,images)')
          receipt={
              'receipt':'NEXUS-DIRECT-TARGET-PREFLIGHT',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'event_name':os.environ.get('GITHUB_EVENT_NAME'),
              'ref':os.environ.get('GITHUB_REF'),
              'mutation_attempted':False,
              'secret_values_recorded':False,
              'active_account':account,
              'project':project_info,
              'runtime_service_account':runtime_sa,
              'artifact_repository':repository,
              'api_states':api_states,
              'secrets':secrets,
              'sql_instance':sql,
              'target_service':target,
              'source_service':source,
              'recent_builds':builds,
          }
          prerequisites={
              'identity_active':account['ok'] and os.environ['DEPLOYER_SA'] in account['stdout'],
              'project_match':project_info['ok'] and os.environ['PROJECT_NUMBER'] in project_info['stdout'],
              'runtime_sa_exists':runtime_sa['ok'],
              'artifact_repo_exists':repository['ok'],
              'openai_secret_ready':secrets['OPENAI_API_KEY']['metadata']['ok'] and secrets['OPENAI_API_KEY']['enabled_version_present'],
              'database_secret_ready':secrets['NEXUS_DATABASE_URL']['metadata']['ok'] and secrets['NEXUS_DATABASE_URL']['enabled_version_present'],
              'sql_instance_exists':sql['ok'],
              'source_service_readable':source['ok'],
              'cloud_build_readable':builds['ok'],
          }
          receipt['prerequisites']=prerequisites
          receipt['classification']='DIRECT_DEPLOYMENT_PREFLIGHT_READY' if all(prerequisites.values()) else 'DIRECT_DEPLOYMENT_PREFLIGHT_PARTIAL'
          path=Path('deployments/nexus/NEXUS_DIRECT_TARGET_PREFLIGHT_RECEIPT.json')
          path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Persist redacted preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexus-direct-target[bot]"
          git config user.email "nexus-direct-target[bot]@users.noreply.github.com"
          git add deployments/nexus/NEXUS_DIRECT_TARGET_PREFLIGHT_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record NEXUS direct target preflight"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-direct-target-preflight
          path: deployments/nexus/NEXUS_DIRECT_TARGET_PREFLIGHT_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
