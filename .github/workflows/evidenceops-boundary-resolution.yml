name: EvidenceOps Boundary Resolution

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'evidenceops/runtime/boundary_resolution_state.json'
      - 'evidenceops/runtime/boundary_resolution_controller.py'
      - 'evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json'
      - 'evidenceops/runtime/kim_dataverse_inplace_bridge.json'
      - 'evidenceops/tests/test_boundary_resolution_controller.py'
      - '.github/workflows/evidenceops-boundary-resolution.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Test controller and private-reference model
        run: python -m pytest -q evidenceops/tests/test_boundary_resolution_controller.py
      - name: Run boundary controller
        env:
          EVIDENCEOPS_CHAT_BRIDGE_URL: ${{ secrets.EVIDENCEOPS_CHAT_BRIDGE_URL }}
          EVIDENCEOPS_CLOUD_RUN_URL: ${{ secrets.EVIDENCEOPS_CLOUD_RUN_URL }}
          EVIDENCEOPS_RUNTIME_DEPLOYMENT_RECEIPT: ${{ secrets.EVIDENCEOPS_RUNTIME_DEPLOYMENT_RECEIPT }}
          EVIDENCEOPS_RUNTIME_HEALTH_VERIFIED: ${{ secrets.EVIDENCEOPS_RUNTIME_HEALTH_VERIFIED }}
          EVIDENCEOPS_RUNTIME_WRITEBACK_RECEIPT: ${{ secrets.EVIDENCEOPS_RUNTIME_WRITEBACK_RECEIPT }}
          KIM_CANONICAL_BACKEND_ID: ${{ secrets.KIM_CANONICAL_BACKEND_ID }}
          KIM_CANONICAL_RECEIPT_ID: ${{ secrets.KIM_CANONICAL_RECEIPT_ID }}
          KIM_CANONICAL_BACKEND_STATUS: ${{ secrets.KIM_CANONICAL_BACKEND_STATUS }}
          KIM_DATAVERSE_URL: ${{ secrets.KIM_DATAVERSE_URL }}
          KIM_DATAVERSE_CLIENT_ID: ${{ secrets.KIM_DATAVERSE_CLIENT_ID }}
          KIM_DATAVERSE_SECRET_REF: ${{ secrets.KIM_DATAVERSE_SECRET_REF }}
        run: python evidenceops/runtime/boundary_resolution_controller.py
      - name: Assert receipt contains no private values
        shell: bash
        env:
          CHECK_CHAT_BRIDGE_URL: ${{ secrets.EVIDENCEOPS_CHAT_BRIDGE_URL }}
          CHECK_CLOUD_RUN_URL: ${{ secrets.EVIDENCEOPS_CLOUD_RUN_URL }}
          CHECK_CANONICAL_BACKEND_ID: ${{ secrets.KIM_CANONICAL_BACKEND_ID }}
          CHECK_CANONICAL_RECEIPT_ID: ${{ secrets.KIM_CANONICAL_RECEIPT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('evidenceops/runtime/receipts/boundary_resolution_latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['private_values_persisted'] is False
          serialised = json.dumps(data, sort_keys=True)
          for name in (
              'CHECK_CHAT_BRIDGE_URL',
              'CHECK_CLOUD_RUN_URL',
              'CHECK_CANONICAL_BACKEND_ID',
              'CHECK_CANONICAL_RECEIPT_ID',
          ):
              secret = os.getenv(name, '')
              if secret:
                  assert secret not in serialised
          PY
      - name: Upload boundary receipt
        uses: actions/upload-artifact@v7
        with:
          name: evidenceops-boundary-resolution
          path: evidenceops/runtime/receipts/boundary_resolution_latest.json
