name: EvidenceOps Boundary Resolution

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'evidenceops/runtime/boundary_resolution_state.json'
      - 'evidenceops/runtime/boundary_resolution_controller.py'
      - 'evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json'
      - 'evidenceops/runtime/kim_dataverse_inplace_bridge.json'
      - 'evidenceops/tests/test_boundary_resolution_controller.py'
      - '.github/workflows/evidenceops-boundary-resolution.yml'

permissions:
  contents: read

jobs:
  resolve-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Test controller and in-place bridge
        run: python -m pytest -q evidenceops/tests/test_boundary_resolution_controller.py
      - name: Run boundary controller
        env:
          EVIDENCEOPS_CHAT_BRIDGE_URL: ${{ secrets.EVIDENCEOPS_CHAT_BRIDGE_URL }}
          KIM_DATAVERSE_URL: ${{ secrets.KIM_DATAVERSE_URL }}
          KIM_DATAVERSE_CLIENT_ID: ${{ secrets.KIM_DATAVERSE_CLIENT_ID }}
          KIM_DATAVERSE_SECRET_REF: ${{ secrets.KIM_DATAVERSE_SECRET_REF }}
        run: python evidenceops/runtime/boundary_resolution_controller.py
      - name: Upload boundary receipt
        uses: actions/upload-artifact@v4
        with:
          name: evidenceops-boundary-resolution
          path: evidenceops/runtime/receipts/boundary_resolution_latest.json
