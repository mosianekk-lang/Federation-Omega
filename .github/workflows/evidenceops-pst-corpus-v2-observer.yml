name: EvidenceOps PST Corpus v2 Observer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidenceops-pst-corpus-v2-observer.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  CANONICAL_EXTRACTION_RUN_ID: '30865146610'

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cancel only later queued duplicate extractions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/evidenceops-pst-corpus-v2-extract.yml/runs?per_page=20" \
            > /tmp/runs-before.json
          python - <<'PY' > /tmp/cancel-ids.txt
          import json, os
          payload=json.load(open('/tmp/runs-before.json', encoding='utf-8'))
          canonical=int(os.environ['CANONICAL_EXTRACTION_RUN_ID'])
          cancellable={'queued','requested','waiting','pending'}
          for row in payload.get('workflow_runs', []):
              run_id=int(row.get('id') or 0)
              if run_id and run_id != canonical and row.get('status') in cancellable:
                  print(run_id)
          PY
          while read -r run_id; do
            [[ -z "$run_id" ]] && continue
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            echo "cancelled queued duplicate: $run_id"
          done < /tmp/cancel-ids.txt
      - name: Capture extraction workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/evidenceops-pst-corpus-v2-extract.yml/runs?per_page=20" \
            > /tmp/runs.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload=json.load(open('/tmp/runs.json', encoding='utf-8'))
          canonical=int(os.environ['CANONICAL_EXTRACTION_RUN_ID'])
          runs=[]
          for row in payload.get('workflow_runs', []):
              runs.append({
                  'id': row.get('id'),
                  'canonical': row.get('id') == canonical,
                  'run_number': row.get('run_number'),
                  'run_attempt': row.get('run_attempt'),
                  'event': row.get('event'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'head_sha': row.get('head_sha'),
                  'created_at': row.get('created_at'),
                  'updated_at': row.get('updated_at'),
                  'html_url': row.get('html_url'),
              })
          receipt={
              'receipt':'EVIDENCEOPS-PST-CORPUS-V2-ACTIONS-OBSERVER',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'repository':os.environ['GITHUB_REPOSITORY'],
              'canonical_run_id':canonical,
              'runs':runs,
          }
          Path('deployment_receipts/evidenceops-pst-corpus-v2-observer.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Commit observer receipt
        run: |
          set -euo pipefail
          git config user.name 'evidenceops-pst-bot'
          git config user.email 'evidenceops-pst-bot@users.noreply.github.com'
          git add deployment_receipts/evidenceops-pst-corpus-v2-observer.json
          git commit -m 'Record EvidenceOps PST v2 workflow state [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
