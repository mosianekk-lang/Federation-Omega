name: EvidenceOps RESOLVE CI

on:
  push:
    branches: [main]
    paths:
      - 'evidenceops/resolve/**'
      - '.github/workflows/evidenceops-resolve-ci.yml'
  pull_request:
    paths:
      - 'evidenceops/resolve/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: evidenceops/resolve
        run: python -m compileall -q resolve tests
      - name: Test
        working-directory: evidenceops/resolve
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: evidenceops/resolve
        run: |
          python -m resolve.cli init /tmp/resolve-smoke
          python -m resolve.cli audit /tmp/resolve-smoke
