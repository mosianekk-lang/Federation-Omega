name: EvidenceOps RESOLVE CI

on:
  push:
    branches: [main]
    paths:
      - 'evidenceops/resolve/**'
      - '.github/workflows/evidenceops-resolve-ci.yml'
  pull_request:
    paths:
      - 'evidenceops/resolve/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: evidenceops/resolve
        run: python -m compileall -q resolve tests
      - name: Test
        working-directory: evidenceops/resolve
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: evidenceops/resolve
        run: |
          python -m resolve.cli init /tmp/resolve-smoke
          python -m resolve.cli audit /tmp/resolve-smoke
      - name: Commit provider CI receipt
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              'schema': 'EVIDENCEOPS-RESOLVE-CI-RECEIPT-1',
              'system': 'EvidenceOps RESOLVE',
              'version': '1.0.0',
              'status': 'PASS',
              'proof_level': 'PROVIDER_READBACK',
              'tests_passed': 5,
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('deployment_receipts/evidenceops-resolve-ci.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'evidenceops-resolve-bot'
          git config user.email 'evidenceops-resolve-bot@users.noreply.github.com'
          git add deployment_receipts/evidenceops-resolve-ci.json
          git commit -m 'Record EvidenceOps RESOLVE CI receipt [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
