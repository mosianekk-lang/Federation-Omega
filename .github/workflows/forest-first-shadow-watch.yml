name: Forest-First Justice Shadow Watch

on:
  pull_request:
    paths:
      - "evidenceops/lex_omega/forest_first.py"
      - "evidenceops/lex_omega/forest_first_shadow.py"
      - "tests/test_phoenix_provider_cutover_v3_forest_first*.py"
      - ".github/workflows/forest-first-shadow-watch.yml"
  push:
    branches: [main]
    paths:
      - "evidenceops/lex_omega/forest_first.py"
      - "evidenceops/lex_omega/forest_first_shadow.py"
      - "tests/test_phoenix_provider_cutover_v3_forest_first*.py"
      - ".github/workflows/forest-first-shadow-watch.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-first-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run Forest-First deterministic regression
        run: python -m unittest tests.test_phoenix_provider_cutover_v3_forest_first tests.test_phoenix_provider_cutover_v3_forest_first_shadow -v

      - name: Run synthetic no-effect shadow benchmark
        run: |
          mkdir -p forest-first-shadow
          python -m evidenceops.lex_omega.forest_first_shadow \
            --output forest-first-shadow/forest-first-shadow-report.json

      - name: Build immutable shadow receipt
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path("forest-first-shadow/forest-first-shadow-report.json")
          report_bytes = report_path.read_bytes()
          report = json.loads(report_bytes)
          receipt = {
              "schema": "FOREST-FIRST-SHADOW-RECEIPT-V1",
              "doctrine_id": "FFJOS-CANONICAL-001",
              "commit_sha": os.environ["COMMIT_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "event_name": os.environ["EVENT_NAME"],
              "created_at": datetime.now(timezone.utc).isoformat(),
              "report_sha256": hashlib.sha256(report_bytes).hexdigest(),
              "case_count": report["case_count"],
              "forest_expected_match_rate": report["forest_expected_match_rate"],
              "no_external_effect": True,
              "authority_ceiling": "A1_INTERNAL",
              "maturity_claim": "SYNTHETIC_SHADOW_ONLY",
              "truth_boundary": [
                  "No live case evidence is processed.",
                  "No legal filing or provider mutation occurs.",
                  "Synthetic success does not establish real-world legal accuracy or operational deployment.",
              ],
          }
          Path("forest-first-shadow/forest-first-shadow-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload immutable no-effect shadow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forest-first-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: forest-first-shadow
          if-no-files-found: error
          retention-days: 90
