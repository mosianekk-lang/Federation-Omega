name: BCO PRIME Shadow Qualification

on:
  pull_request:
    paths:
      - 'benchmarking/cfbe_omega/bco_prime_meta_executive_v1.py'
      - 'benchmarking/cfbe_omega/bco_prime_shadow_value_bridge_v1.py'
      - 'benchmarking/cfbe_omega/value_foundry_v1.py'
      - 'tests/test_bco_prime_meta_executive_v1.py'
      - 'tests/test_bco_prime_shadow_value_bridge_v1.py'
      - 'tests/test_cfbe_value_foundry_v1.py'
      - 'governance/proofos_omega_policy_extension_bco_prime_shadow_value_bridge_v1.json'
      - '.github/workflows/bco-prime-shadow-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarking/cfbe_omega/bco_prime_meta_executive_v1.py'
      - 'benchmarking/cfbe_omega/bco_prime_shadow_value_bridge_v1.py'
      - 'benchmarking/cfbe_omega/value_foundry_v1.py'
      - 'tests/test_bco_prime_meta_executive_v1.py'
      - 'tests/test_bco_prime_shadow_value_bridge_v1.py'
      - 'tests/test_cfbe_value_foundry_v1.py'
      - 'governance/proofos_omega_policy_extension_bco_prime_shadow_value_bridge_v1.json'
      - '.github/workflows/bco-prime-shadow-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bco-prime-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run PRIME and Value Foundry regression courts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_bco_prime_meta_executive_v1.py' -v
          python -m unittest discover -s tests -p 'test_bco_prime_shadow_value_bridge_v1.py' -v
          python -m unittest discover -s tests -p 'test_cfbe_value_foundry_v1.py' -v

      - name: Run current-source PRIME 30-pair hosted shadow court
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof
          python -m benchmarking.cfbe_omega.bco_prime_shadow_value_bridge_v1 \
            --source-sha "$GITHUB_SHA" \
            --require-github-actions \
            --cross-process-cases 10 \
            > runtime-proof/bco-prime-hosted-shadow.json
          python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/bco-prime-hosted-shadow.json', encoding='utf-8'))
          assert receipt['schema'] == 'BCO-PRIME-HOSTED-SHADOW-V1', receipt
          assert receipt['evidence_mode'] == 'HOSTED_SHADOW', receipt
          assert receipt['github_actions_runtime'] is True, receipt
          assert receipt['pair_count'] == 30, receipt
          assert receipt['cross_process_replay_count'] == 10, receipt
          assert receipt['cross_process_replay_ratio'] == 1.0, receipt
          assert receipt['quality_delta'] >= 0.02, receipt
          assert receipt['pairwise_regression_count'] == 0, receipt
          assert receipt['hard_regressions'] == 0, receipt
          assert set(receipt['action_coverage']) == {
              'CONTINUE', 'REFLECT', 'SEEK_EVIDENCE', 'REPLAN', 'CHALLENGE', 'ROLLBACK'
          }, receipt
          assert set(receipt['topology_coverage']) == {
              'DETERMINISTIC', 'SINGLE_CONTROLLER', 'HYBRID', 'BUILDER_FALSIFIER_WITNESS'
          }, receipt
          assert receipt['fallback_failure_domain_diversity_coverage'] == 1.0, receipt
          assert receipt['interrupt_proxy_reduction'] > 0, receipt
          assert receipt['hosted_shadow_qualified'] is True, receipt
          assert receipt['owner_value_proven'] is False, receipt
          assert receipt['bounded_topology_control_authorized'] is False, receipt
          assert receipt['promotion_state'] == 'HOLD', receipt
          assert receipt['provider_effect_authorized'] is False, receipt
          assert receipt['stable_promotion_authorized'] is False, receipt
          print('BCO_PRIME_HOSTED_SHADOW_30_PAIR_VERIFIED')
          PY

      - name: Publish PRIME qualification summary
        if: always()
        shell: bash
        run: |
          if [[ -f runtime-proof/bco-prime-hosted-shadow.json ]]; then
            echo '## BCΩ-PRIME Hosted Shadow Qualification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runtime-proof/bco-prime-hosted-shadow.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable PRIME shadow proof
        if: always() && hashFiles('runtime-proof/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bco-prime-shadow-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-proof/
          if-no-files-found: error
          retention-days: 90
