name: EvidenceOps External Scheduler

on:
  schedule:
    - cron: '17 * * * *'       # hourly lane/dependency watch
    - cron: '43 */6 * * *'     # Kimmie Seed maturity watch
    - cron: '0 6 * * *'        # 08:00 Africa/Johannesburg innovation scan
    - cron: '0 20 * * *'       # 22:00 Africa/Johannesburg continuity checkpoint
    - cron: '0 5 * * 1'        # Monday 07:00 Africa/Johannesburg conformance review
  workflow_dispatch:
    inputs:
      mode:
        description: Scheduler mode
        required: false
        default: manual
        type: choice
        options:
          - manual
          - hourly
          - every_6_hours
          - daily_0800_sast
          - daily_2200_sast
          - weekly_monday_0700_sast

permissions:
  contents: read
  issues: write

concurrency:
  group: evidenceops-external-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run scheduler
        id: scheduler
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p scheduler/runtime
          MODE="${INPUT_MODE:-auto}"
          python scheduler/run_scheduler.py \
            --mode "$MODE" \
            --cron "$EVENT_SCHEDULE" \
            --output scheduler/runtime/latest-report.json | tee scheduler/runtime/summary.txt
          test -s scheduler/runtime/latest-report.json
          test -s scheduler/runtime/summary.txt
          test -s scheduler/runtime/capability-heartbeat.json
          test -s scheduler/runtime/heartbeat-system.json
          test -s scheduler/runtime/objective-completion.json
          test -s scheduler/runtime/cloud-capability-inheritance.json

      - name: Publish workflow summary
        run: cat scheduler/runtime/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof report
        uses: actions/upload-artifact@v4
        with:
          name: evidenceops-scheduler-report-${{ github.run_id }}
          path: |
            scheduler/runtime/latest-report.json
            scheduler/runtime/summary.txt
            scheduler/runtime/capability-heartbeat.json
            scheduler/runtime/heartbeat-system.json
            scheduler/runtime/objective-completion.json
            scheduler/runtime/cloud-capability-inheritance.json
          retention-days: 90

      - name: Comment on scheduler control issue
        if: ${{ vars.EVIDENCEOPS_SCHEDULER_ISSUE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.EVIDENCEOPS_SCHEDULER_ISSUE }}
        run: |
          {
            echo "### External scheduler run ${{ github.run_id }}"
            echo
            echo '```text'
            cat scheduler/runtime/summary.txt
            echo '```'
            echo
            echo "Artifact: evidenceops-scheduler-report-${{ github.run_id }}"
            echo "Execution proof remains subject to external readback receipts."
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file /tmp/comment.md
