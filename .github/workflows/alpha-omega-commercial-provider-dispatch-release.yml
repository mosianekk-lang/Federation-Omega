name: Alpha Omega Commercial Provider Dispatch Outbox Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/provider_dispatch_outbox*'
      - 'alpha_omega_commercial/canonical_commercial_api_effective_v11.json'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/provider_dispatch_outbox*'
      - 'alpha_omega_commercial/canonical_commercial_api_effective_v11.json'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-dispatch-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run provider dispatch and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute provider dispatch release reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_dispatch_outbox_release
          --output artifacts

      - name: Validate release receipt and commercial boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('artifacts/provider-dispatch-outbox-release-receipt.json').read_text()
          )
          assert receipt['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTBOX-V11-RELEASE'
          assert receipt['status'] == 'PROVIDER_DISPATCH_OUTBOX_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert receipt['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          assert receipt['implementation_release']['pull_request'] == 139
          assert receipt['implementation_release']['merge_commit'] == 'e8591e5212da5aba07b768aed399c79f36808b8a'
          assert receipt['provider_proof']['workflow_run'] == 30899701403
          assert receipt['provider_proof']['artifact_id'] == 8888531477
          assert receipt['google_drive_release']['readback_verified'] is True
          assert receipt['google_drive_release']['shared'] is False
          assert receipt['effective_state']['mock_provider_contract_conformance_verified'] is True
          assert receipt['effective_state']['live_provider_operation_proven'] is False
          assert receipt['effective_state']['distributed_provider_exactly_once_proven'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_dispatch_outbox_checkpoint.json'),
              Path('alpha_omega_commercial/provider_dispatch_outbox_release_checkpoint.json'),
              Path('alpha_omega_commercial/prove_provider_dispatch_outbox_release.py'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable provider dispatch release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-dispatch-outbox-release-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
