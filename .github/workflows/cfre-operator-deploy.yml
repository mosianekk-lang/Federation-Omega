name: CFRE Operator Keyless Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cfre-operator-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_id == '1292795464' && github.repository_owner_id == '261966700' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
          service_account: fo-github-deployer@sov-hybrid-suite.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build immutable operator image
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe fo-runtime --project=sov-hybrid-suite --location=africa-south1 --format=json > artifact-repository.json
          IMAGE="africa-south1-docker.pkg.dev/sov-hybrid-suite/fo-runtime/federation-omega-operator:$GITHUB_SHA"
          gcloud builds submit ops/federation_omega_operator --project=sov-hybrid-suite --region=africa-south1 --tag="$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy operator revision
        run: |
          set -euo pipefail
          gcloud run services describe federation-omega-operator --project=sov-hybrid-suite --region=africa-south1 --format='value(status.latestReadyRevisionName)' > previous-revision.txt
          gcloud run deploy federation-omega-operator --project=sov-hybrid-suite --region=africa-south1 --image="$IMAGE" --service-account=fo-operator-sa@sov-hybrid-suite.iam.gserviceaccount.com --update-env-vars="PROJECT_ID=sov-hybrid-suite,REGION=africa-south1,OIDC_ALLOWED_PRINCIPALS=fo-github-deployer@sov-hybrid-suite.iam.gserviceaccount.com,OPERATOR_AUDIENCE=https://federation-omega-operator-257649435135.africa-south1.run.app" --quiet
      - name: Verify contract and bind CFRE
        env:
          URL: https://federation-omega-operator-257649435135.africa-south1.run.app
        run: |
          set -euo pipefail
          curl -fsS "$URL/health" | tee health.json
          curl -fsS "$URL/" | tee contract.json
          grep -q '"BIND_CFRE_PRIVATE_RUNTIME"' contract.json
          TOKEN="$(gcloud auth print-identity-token --audiences="$URL")"
          curl -fsS -X POST "$URL/execute" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"action":"BIND_CFRE_PRIVATE_RUNTIME","payload":{"approvalKey":"APPROVED","project":"sov-hybrid-suite","region":"africa-south1","service":"cfre-omega-private-runtime","serviceAccount":"fo-operator-sa@sov-hybrid-suite.iam.gserviceaccount.com","sourceDriveId":"1RvaNgRofeepjfHanioQB9j96FXgamxwp","sourceSha256":"655a93976bda2f9d296468590a1ddcba3f0eefd140b7d06ef3cf67f142e358a7","embeddedRepairSha256":"58c1e456f02642bcccdf13c8029a07dc4f497f6418c274afc6d8185365f7407b","manifestSha256":"c581e04c3a5f15e59451e1fc6201ad1b07032418f632994001bf2d449f6b93e7","idempotencyKey":"cfre-private-runtime-655a93976bda2f9d"}}' | tee bind.json
          grep -q '"CFRE_PRIVATE_RUNTIME_BOUND"' bind.json
      - name: Roll back operator on failed verification or bind
        if: failure()
        run: |
          set -euo pipefail
          test -s previous-revision.txt
          PREVIOUS_REVISION="$(cat previous-revision.txt)"
          gcloud run services update-traffic federation-omega-operator --project=sov-hybrid-suite --region=africa-south1 --to-revisions="$PREVIOUS_REVISION=100" --quiet
          gcloud run services describe federation-omega-operator --project=sov-hybrid-suite --region=africa-south1 --format=json > rollback-readback.json
      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: cfre-operator-deploy
          path: |
            health.json
            contract.json
            bind.json
            previous-revision.txt
            rollback-readback.json
            artifact-repository.json
          if-no-files-found: warn
          retention-days: 30
