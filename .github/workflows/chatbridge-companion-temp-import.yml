name: Temporary ChatBridge Companion Payload Import

on:
  push:
    branches:
      - chatbridge-omega49-companion-ffcl-adapter-20260817

permissions:
  contents: write

jobs:
  import-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatbridge-omega49-companion-ffcl-adapter-20260817
          fetch-depth: 0

      - name: Reassemble, verify and extract governed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chatbridge_omega49_companion_payload.part.* > /tmp/chatbridge_payload.b64
          base64 --decode /tmp/chatbridge_payload.b64 > /tmp/chatbridge_omega49_companion_payload.tar.xz
          echo 'c5a27b8375a4622cc09d3765e1c4ad5ed2e6290d689e8831f81574cb22a84dea  /tmp/chatbridge_omega49_companion_payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/chatbridge_omega49_companion_payload.tar.xz -C .
          test -f chatbridge-companion/manifest.json
          test -f bubbles/chatbridge_omega4/browser_companion_adapter.py
          test -f tests/test_phoenix_provider_cutover_v3_chatbridge_omega4_browser_companion_adapter.py

      - name: Run Companion deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          cd chatbridge-companion
          npm run check

      - name: Run ChatBridge Omega 4.9 browser-ingress and core suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            bubbles.chatbridge_omega4.test_browser_companion_adapter \
            bubbles.chatbridge_omega4.test_browser_companion_source_contract \
            bubbles.chatbridge_omega4.test_alpha_omega_capture \
            bubbles.chatbridge_omega4.test_runtime_omega49 \
            -v

      - name: Create bounded source-import receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > audit/chatbridge_omega49_companion_import_receipt.json <<EOF
          {
            "schema_version": "1.0",
            "system": "CHATBRIDGE_OMEGA49_BROWSER_COMPANION",
            "state": "SOURCE_IMPORTED_AND_DETERMINISTIC_TESTED_NOT_BROWSER_DEPLOYED",
            "branch": "chatbridge-omega49-companion-ffcl-adapter-20260817",
            "source_run_id": "${GITHUB_RUN_ID}",
            "archive_sha256": "c5a27b8375a4622cc09d3765e1c4ad5ed2e6290d689e8831f81574cb22a84dea",
            "capture_path": "RENDERED_DOM",
            "truth_boundary": [
              "NO_BROWSER_INSTALLATION_CLAIM",
              "NO_SIGNED_IN_SESSION_BINDING_CLAIM",
              "NO_PROVIDER_RECEIPT_CLAIM",
              "NO_NATIVE_HIDDEN_CHAT_ACCESS",
              "RENDERED_DOM_MAY_BE_VIRTUALIZED_OR_INCOMPLETE"
            ]
          }
          EOF

      - name: Remove temporary transport and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .bootstrap/chatbridge_omega49_companion_payload.part.*
          rm -f .github/workflows/chatbridge-companion-temp-import.yml

      - name: Commit verified extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ChatBridge Omega 4.9: integrate browser Companion FFCL adapter'
          git push origin HEAD:chatbridge-omega49-companion-ffcl-adapter-20260817
