name: SOVARA Existing EvidenceOps WIF Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sovara-evidenceops-wif-probe.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sovara-existing-evidenceops-wif-probe
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  EXPECTED_PROJECT_NUMBER: '257649435135'
  EVIDENCEOPS_WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/evidenceops-github/providers/github
  EVIDENCEOPS_OPERATOR_SA: evidenceops-cloud-operator@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  probe-existing-lineage:
    if: github.event_name != 'issues' || github.event.issue.title == 'SOVARA_EVIDENCEOPS_WIF_PROBE'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Attempt existing EvidenceOps WIF lineage
        id: evidenceops_auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.EVIDENCEOPS_WIF_PROVIDER }}
          service_account: ${{ env.EVIDENCEOPS_OPERATOR_SA }}

      - name: Install gcloud
        id: setup_gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Produce redacted provider receipt
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.evidenceops_auth.outcome }}
          GCLOUD_OUTCOME: ${{ steps.setup_gcloud.outcome }}
        run: |
          set -euo pipefail
          mkdir -p provider-authority-output
          python - <<'PY'
          import json, os, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def run(args):
              if shutil.which(args[0]) is None:
                  return {'ok':False,'exit_code':127,'stdout':'','stderr':f'{args[0]} unavailable'}
              p=subprocess.run(args,text=True,capture_output=True)
              return {'ok':p.returncode==0,'exit_code':p.returncode,'stdout':p.stdout.strip()[:6000],'stderr':p.stderr.strip()[:1800]}

          project=os.environ['PROJECT_ID']
          auth=os.environ.get('AUTH_OUTCOME','unknown')
          account=run(['gcloud','auth','list','--filter=status:ACTIVE','--format=value(account)'])
          access=run(['gcloud','auth','print-access-token'])
          authenticated=bool(auth=='success' and account['ok'] and account['stdout'] and access['ok'] and access['stdout'])
          access={'ok':access['ok'],'exit_code':access['exit_code'],'stderr':access['stderr']}

          def gc(*args):
              return run(['gcloud',*args,'--project',project])

          project_read=gc('projects','describe',project,'--format=json(projectId,projectNumber,lifecycleState)') if authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}
          pool=gc('iam','workload-identity-pools','describe','evidenceops-github','--location','global','--format=json(name,state,disabled)') if authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}
          provider=gc('iam','workload-identity-pools','providers','describe','github','--workload-identity-pool','evidenceops-github','--location','global','--format=json(name,state,disabled,attributeCondition,attributeMapping)') if authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}
          operator=gc('iam','service-accounts','describe',os.environ['EVIDENCEOPS_OPERATOR_SA'],'--format=json(email,disabled,oauth2ClientId)') if authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}
          secrets={}
          for sid in ['fo-operator-admin-token','gemini-api-key','sovara-gateway-master-key']:
              secrets[sid]=gc('secrets','describe',sid,'--format=json(name,createTime,replication)') if authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          expected=os.environ['EXPECTED_PROJECT_NUMBER']
          project_match=authenticated and project_read.get('ok') and expected in project_read.get('stdout','')
          classification=(
              'EVIDENCEOPS_WIF_PROVIDER_AUTHENTICATED_PROJECT_VERIFIED'
              if project_match else
              'EVIDENCEOPS_WIF_AUTHENTICATED_PROJECT_MISMATCH'
              if authenticated else
              'EVIDENCEOPS_WIF_NOT_AUTHENTICATED'
          )
          receipt={
              'schema':'SOVARA-EXISTING-EVIDENCEOPS-WIF-PROBE-V1',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'mutation_attempted':False,
              'secret_values_recorded':False,
              'candidate_provider':os.environ['EVIDENCEOPS_WIF_PROVIDER'],
              'candidate_service_account':os.environ['EVIDENCEOPS_OPERATOR_SA'],
              'auth_action_outcome':auth,
              'setup_gcloud_outcome':os.environ.get('GCLOUD_OUTCOME','unknown'),
              'provider_authenticated':authenticated,
              'active_account':account,
              'access_token_test':access,
              'project':project_read,
              'project_number_match':bool(project_match),
              'wif_pool':pool,
              'wif_provider':provider,
              'operator_service_account':operator,
              'secret_metadata':secrets,
              'classification':classification,
              'truth_boundary':'Read-only probe of an already source-defined WIF lineage. No Google API/IAM/WIF/secret/deployment/traffic mutation is performed.'
          }
          out=Path('provider-authority-output/evidenceops-wif-receipt.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'classification':classification,'provider_authenticated':authenticated,'project_number_match':bool(project_match)}))
          PY

      - name: Persist redacted receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sovara-evidenceops-wif-probe[bot]'
          git config user.email 'sovara-evidenceops-wif-probe[bot]@users.noreply.github.com'
          git add provider-authority-output/evidenceops-wif-receipt.json
          git diff --cached --quiet || { git commit -m 'Record SOVARA EvidenceOps WIF probe'; git push origin HEAD:main; }
