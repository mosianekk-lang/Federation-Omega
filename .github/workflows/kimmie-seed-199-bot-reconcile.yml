name: Kimmie Seed 199-Bot Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kimmie_seed/workforce/reconcile.py'
      - '.github/workflows/kimmie-seed-199-bot-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: kimmie-seed-199-bot-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip reconcile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final workforce state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run workforce regression tests
        run: python -m unittest kimmie_seed/workforce/test_coordinator.py -v

      - name: Reconcile canonical Kimmie state
        run: python kimmie_seed/workforce/reconcile.py

      - name: Verify canonical outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('kimmie_seed/registry.json').read_text())
          checkpoint = json.loads(Path('kimmie_seed/checkpoints/KSA-20260803-023.json').read_text())
          receipt = json.loads(Path('evidenceops/innovation_engine/receipts/lane-watch-receipt-027.json').read_text())
          assert registry['registry_version'] == '1.13.0'
          assert registry['current_verified_stage'] == 'SAPLING'
          assert registry['workforce']['bot_count'] == 199
          assert registry['workforce']['independent_verifier_count'] == 48
          assert registry['workforce']['deployment_commit'] == '7beb4bdfc95f6b92c08ffc14929593958c0c3797'
          assert checkpoint['root_promotion'] == 'NONE'
          assert checkpoint['child_promotion'] == 'NONE'
          assert receipt['status'] == 'PASS'
          assert receipt['root_promotion'] == 'NONE'
          assert receipt['child_promotion'] == 'NONE'
          print(json.dumps({
              'registry_version': registry['registry_version'],
              'checkpoint_sha256': checkpoint['checkpoint_sha256'],
              'lane_receipt_sha256': receipt['receipt_sha256'],
          }))
          PY

      - name: Persist canonical reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kimmie_seed/registry.json
          git add kimmie_seed/checkpoints/KSA-20260803-023.json
          git add evidenceops/innovation_engine/receipts/lane-watch-receipt-027.json
          if git diff --cached --quiet; then
            echo 'No reconciliation-state change.'
          else
            git commit -m 'Reconcile Kimmie Seed 199-bot workforce proof [skip reconcile] [skip workforce]'
            git push
          fi
