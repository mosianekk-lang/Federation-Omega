name: Alpha Omega Foundry v2.2 Operations

on:
  push:
    paths:
      - 'alpha_omega_v21/**'
      - '.github/workflows/alpha-omega-v21-ci.yml'
  pull_request:
    paths:
      - 'alpha_omega_v21/**'
      - '.github/workflows/alpha-omega-v21-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: alpha-omega-v22-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operational-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: ao-foundry examples/concept.json --workspace ./ci_workspace > operational-output.json
      - run: test -f ./ci_workspace/operational/*/operational_receipt.json
      - run: ao-foundry examples/concept.json --workspace ./ci_workspace --maintenance-cycle > maintenance-output.json
      - run: |
          test -f ./ci_workspace/operations/maintenance_report.json
          test -f ./ci_workspace/operations/heartbeat.jsonl
          test -f ./ci_workspace/operations/learning_ledger.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-foundry-v22-operational-release
          path: |
            alpha_omega_v21/ci_workspace/releases/*.zip
            alpha_omega_v21/ci_workspace/releases/*.manifest.json
            alpha_omega_v21/ci_workspace/operational/*/operational_receipt.json
            alpha_omega_v21/ci_workspace/operations/*.json
            alpha_omega_v21/ci_workspace/operations/*.jsonl
            alpha_omega_v21/maintenance-output.json
          if-no-files-found: error

  maintenance-runtime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: ao-foundry examples/concept.json --workspace ./ci_workspace --maintenance-cycle > maintenance-output.json
      - name: Write provider event receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          target = Path('ci_workspace/operations/provider_event.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
          }, indent=2), encoding='utf-8')
          PY
      - run: |
          test -f ./ci_workspace/operations/maintenance_report.json
          test -f ./ci_workspace/operations/heartbeat.jsonl
          test -f ./ci_workspace/operations/learning_ledger.jsonl
          test -f ./ci_workspace/operations/provider_event.json
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-foundry-v22-maintenance-${{ github.run_id }}
          path: |
            alpha_omega_v21/ci_workspace/operations/*.json
            alpha_omega_v21/ci_workspace/operations/*.jsonl
            alpha_omega_v21/maintenance-output.json
          if-no-files-found: error
