name: Alpha Omega Commercial Authority Action Coordination Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-coordination-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-coordination-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-action-coordination-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run coordination release and implementation regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_authority_action_coordination_release
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity

      - name: Execute coordination release reconciliation
        run: >-
          python -m alpha_omega_commercial.prove_authority_action_coordination_release
          --output artifacts/authority-action-coordination-release-reconciliation-receipt.json

      - name: Validate release proof and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          release = json.loads((root / 'authority_action_coordination_release_receipt.json').read_text())
          checkpoint = json.loads((root / 'authority_action_coordination_release_checkpoint.json').read_text())
          proof = json.loads(Path('artifacts/authority-action-coordination-release-reconciliation-receipt.json').read_text())

          assert release['status'] == 'AUTHORITY_ACTION_COORDINATION_RELEASE_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert release['dependency']['implementation_pull_request'] == 134
          assert release['dependency']['implementation_merge_commit'] == 'a72713473b381e5a30c4c5b99d00213effb3ff05'
          assert release['final_head_provider_proof']['artifact_id'] == 8885094025
          assert release['final_head_provider_proof']['checks_failed'] == 0
          assert release['google_drive_release']['file_id'] == '18vFykuY7E6okU33SJuOxn4hg9z-Cnh-pDCg6xhiZyEw'
          assert release['google_drive_release']['readback_sha256'] == '9d0782f5bba0b8ceb56c69abdef3b21338697ce34e78dd8c3dedc87b0e19cae3'
          assert release['google_drive_release']['readback_verified'] is True
          assert release['google_drive_release']['shared'] is False
          assert release['effective_controls']['provider_process_coordination'] is True
          assert release['effective_controls']['concurrent_startup_can_rollback_live_transaction'] is False
          assert release['effective_controls']['distributed_provider_atomicity_proven'] is False
          assert all(value is False for value in release['external_gates'].values())
          assert release['commercial_truth']['verified_live_revenue_events'] == 0
          assert release['commercial_truth']['cloud_run_operation_proven'] is False
          assert release['commercial_truth']['payment_provider_operation_proven'] is False
          assert release['commercial_truth']['full_commercial_maturity'] is False
          assert all(value.startswith('OWNER_RESERVED') for value in release['owner_authority'].values())

          assert checkpoint['implementation_release']['release_receipt_sha256'] == release['receipt_sha256']
          assert checkpoint['provider_proof']['artifact_id'] == 8885094025
          assert checkpoint['google_drive_release']['readback_sha256'] == release['google_drive_release']['readback_sha256']
          assert all(value is False for value in checkpoint['external_gates'].values())

          assert proof['status'] == 'AUTHORITY_ACTION_COORDINATION_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert proof['checks_required'] == len(proof['checks'])
          assert proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          assert proof['release_receipt_sha256'] == release['receipt_sha256']
          assert proof['provider_artifact_id'] == 8885094025
          assert proof['google_drive_readback_verified'] is True
          assert proof['google_drive_shared'] is False
          assert proof['verified_live_revenue_events'] == 0
          assert proof['external_gate_effect'] == 'UNCHANGED'
          assert proof['full_commercial_maturity'] is False
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_action_coordination_release_receipt.json'),
              Path('alpha_omega_commercial/authority_action_coordination_release_checkpoint.json'),
              Path('alpha_omega_commercial/prove_authority_action_coordination_release.py'),
              Path('alpha_omega_commercial/test_authority_action_coordination_release.py'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable coordination release proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alpha-omega-commercial-authority-action-coordination-release-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
