name: Deploy Superior Logic to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'superior_logic/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-cloud-run.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: architron9
  REPOSITORY: federation-omega
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  IMAGE: africa-south1-docker.pkg.dev/sov-hybrid-suite/federation-omega/architron9:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud through keyless OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Confirm authenticated project authority
        run: |
          gcloud projects describe "$PROJECT_ID" --format='value(projectId,projectNumber)'
      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" --project "$PROJECT_ID" --location "$REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --repository-format=docker --description='Federation Omega runtime images'
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account superior-logic-runtime@${PROJECT_ID}.iam.gserviceaccount.com \
            --platform managed \
            --quiet
      - name: Verify revision and health
        run: |
          CREATED=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestCreatedRevisionName)')
          READY=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          test -n "$CREATED"
          test "$CREATED" = "$READY"
          TOKEN=$(gcloud auth print-identity-token)
          RESPONSE=$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$URL/health")
          echo "$RESPONSE"
          python - "$RESPONSE" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('status') == 'HEALTHY'
          assert payload.get('event_chain_valid') is True
          PY
