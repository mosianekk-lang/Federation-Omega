name: SEB Omega Qualification

on:
  pull_request:
    paths:
      - 'sovereign_execution_boundary/**'
      - '.github/workflows/seb-omega.yml'
      - '.github/workflows/seb-omega-qualification.yml'
      - 'governance/github_airlock_policy.json'
  push:
    branches: [main]
    paths:
      - 'sovereign_execution_boundary/**'
      - '.github/workflows/seb-omega.yml'
      - '.github/workflows/seb-omega-qualification.yml'
      - 'governance/github_airlock_policy.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seb-omega-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign_execution_boundary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q seb tests
      - run: python -m unittest discover -s tests -v
      - run: docker build --pull -t seb-omega:${{ github.sha }} .
      - run: docker run --rm --read-only --tmpfs /tmp --tmpfs /app/data:rw,uid=65532,gid=65532,mode=1770 seb-omega:${{ github.sha }} -m unittest discover -s tests -v
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: seb-omega:${{ github.sha }}
          format: spdx-json
          output-file: seb-omega.spdx.json
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: seb-omega:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
