name: Alpha Omega Commercial Governed Authority Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-governed-authority.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-governed-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-governed-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Verify canonical package import
        run: |
          python - <<'PY'
          from alpha_omega_commercial import (
              AuthoritySnapshotCommercialControlPlane,
              GovernedCommercialAssuranceControlPlane,
          )
          assert AuthoritySnapshotCommercialControlPlane.__name__ == 'AuthoritySnapshotCommercialControlPlane'
          assert GovernedCommercialAssuranceControlPlane.__name__ == 'GovernedCommercialAssuranceControlPlane'
          PY

      - name: Run commercial regression suite
        working-directory: alpha_omega_commercial
        run: >-
          python -m unittest -v
          test_commercial_platform.py
          test_commercial_expansion.py
          test_commercial_assurance.py
          test_receipt_integrity.py
          test_programme_integrity.py
          test_external_evidence.py
          test_authority_refresh.py
          test_live_provider_expansion.py
          test_live_provider_block.py
          test_canonical_authority_reconciliation.py
          test_owner_authority_reconciliation.py
          test_governed_commercial_assurance.py
          test_authority_snapshot_control_plane.py
          test_governed_authority_release.py

      - name: Execute governed authority proof
        run: >-
          python alpha_omega_commercial/prove_governed_commercial_assurance.py
          --output alpha_omega_commercial/artifacts/c10-c15/governed-authority-v2

      - name: Execute governed authority release reconciliation proof
        run: >-
          python alpha_omega_commercial/prove_governed_authority_release.py
          --output alpha_omega_commercial/artifacts/c10-c15/governed-authority-release/reconciliation-receipt.json

      - name: Validate proof, programme boundary and checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          receipt = json.loads((root / 'artifacts/c10-c15/governed-authority-v2/governed-commercial-authority-v2-receipt.json').read_text())
          readback = json.loads((root / 'artifacts/c10-c15/governed-authority-v2/canonical-api-readback.json').read_text())
          release_proof = json.loads((root / 'artifacts/c10-c15/governed-authority-release/reconciliation-receipt.json').read_text())
          release = json.loads((root / 'governed_authority_release_receipt.json').read_text())
          checkpoint = json.loads((root / 'governed_authority_checkpoint.json').read_text())
          contract = json.loads((root / 'owner_authority_receipt_contract_v2.json').read_text())
          api = json.loads((root / 'canonical_commercial_api.json').read_text())
          programme = json.loads((root / 'programme.json').read_text())

          assert receipt['status'] == 'GOVERNED_COMMERCIAL_AUTHORITY_V2_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert all(receipt['gates'].values())
          assert receipt['commercial_truth']['live_verified_revenue_events'] == 0
          assert receipt['commercial_truth']['mock_provider_conformance_events'] == 1
          assert not receipt['commercial_truth']['full_commercial_maturity']
          assert readback['caller_set_approval_parameters_absent']
          assert readback['authority_ledger_integrity']
          assert readback['external_evidence_ledger_integrity']
          assert readback['revenue']['live_verified_revenue_events'] == 0
          assert release_proof['status'] == 'GOVERNED_AUTHORITY_RELEASE_RECONCILIATION_VERIFIED'
          assert all(release_proof['checks'].values())
          assert release['receipt_sha256'] == release_proof['release_receipt_sha256']
          assert release['provider_native_proof']['artifact_id'] == 8877970163
          assert release['google_drive_release']['readback_verified']
          assert release['google_drive_release']['shared'] is False
          assert release['truth_boundary']['verified_live_revenue_events'] == 0
          assert not release['truth_boundary']['full_commercial_maturity']
          assert api['api_id'] == 'AO-COMMERCIAL-CANONICAL-API-V3'
          assert api['canonical_class'] == 'AuthoritySnapshotCommercialControlPlane'
          assert api['predecessor_class'] == 'GovernedCommercialAssuranceControlPlane'
          assert api['predecessor_state'] == 'REFERENCE_AND_MOCK_CONFORMANCE_ONLY'
          assert api['legacy_state'] == 'REFERENCE_ONLY_NOT_CANONICAL'
          assert api['authority_snapshot']['raw_authority_dictionary_grants_live_authority'] is False
          assert contract['mock_provider_rule'].startswith('Mock-provider conformance')
          assert contract['truth_boundary']['verified_revenue_events'] == 0
          assert checkpoint['status'] == 'GOVERNED_COMMERCIAL_AUTHORITY_V2_RELEASE_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert checkpoint['provider_proof']['state'] == 'FINAL_HEAD_PROVIDER_NATIVE_CI_VERIFIED'
          assert checkpoint['release_receipt']['receipt_sha256'] == release['receipt_sha256']
          assert checkpoint['dependency_checkpoint']['preceding_pull_request'] == 117
          assert programme['canonical_status'] == 'COMMERCIAL_READINESS_VERIFIED_EXTERNAL_MATURITY_GATES_OPEN'
          assert not programme['external_gate_evidence']
          assert programme['stages'][10]['id'] == 'C11'
          assert programme['stages'][12]['id'] == 'C13'
          assert programme['stages'][14]['id'] == 'C15'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/governed_commercial_assurance.py'),
              Path('alpha_omega_commercial/authority_snapshot.py'),
              Path('alpha_omega_commercial/authority_snapshot_control_plane.py'),
              Path('alpha_omega_commercial/artifacts/c10-c15/governed-authority-v2'),
              Path('alpha_omega_commercial/artifacts/c10-c15/governed-authority-release'),
              Path('alpha_omega_commercial/owner_authority_receipt_contract_v2.json'),
              Path('alpha_omega_commercial/governed_authority_checkpoint.json'),
              Path('alpha_omega_commercial/governed_authority_release_receipt.json'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable governed authority proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-governed-authority-v2-proof
          path: |
            alpha_omega_commercial/artifacts/c10-c15/governed-authority-v2
            alpha_omega_commercial/artifacts/c10-c15/governed-authority-release
          if-no-files-found: error
          retention-days: 90
