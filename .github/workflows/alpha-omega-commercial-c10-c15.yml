name: Alpha Omega Commercial C10-C15 Proof

on:
  pull_request:
    paths:
      - "alpha_omega_commercial/**"
      - ".github/workflows/alpha-omega-commercial-c10-c15.yml"
  push:
    branches: [main]
    paths:
      - "alpha_omega_commercial/**"
      - ".github/workflows/alpha-omega-commercial-c10-c15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run commercial regression tests
        working-directory: alpha_omega_commercial
        run: >-
          python -m unittest -v
          test_commercial_platform.py
          test_commercial_expansion.py
          test_commercial_assurance.py
          test_receipt_integrity.py
          test_programme_integrity.py
          test_external_evidence.py
          test_authority_refresh.py
          test_live_provider_expansion.py
          test_live_provider_block.py
          test_canonical_authority_reconciliation.py

      - name: Execute reversible C10-C15 proof
        run: python alpha_omega_commercial/prove_c10_c15.py --output alpha_omega_commercial/artifacts/c10-c15

      - name: Reconcile and prove canonical receipt integrity
        run: python alpha_omega_commercial/prove_receipt_integrity.py --output alpha_omega_commercial/artifacts/c10-c15

      - name: Verify canonical programme register
        run: >-
          python alpha_omega_commercial/prove_programme_integrity.py
          --programme alpha_omega_commercial/programme.json
          --artifact-root alpha_omega_commercial/artifacts/c10-c15
          --output alpha_omega_commercial/artifacts/c10-c15/programme-register-integrity.json

      - name: Execute external commercial evidence admission proof
        run: >-
          python alpha_omega_commercial/prove_external_evidence.py
          --output alpha_omega_commercial/artifacts/c10-c15/external-evidence

      - name: Reconcile provider authority freshness
        run: >-
          python alpha_omega_commercial/prove_authority_refresh.py
          --programme alpha_omega_commercial/programme.json
          --observations alpha_omega_commercial/provider_authority_observations.json
          --output alpha_omega_commercial/artifacts/c10-c15/provider-authority-freshness

      - name: Validate stage gates and truth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial/artifacts/c10-c15')
          receipt = json.loads((root / 'commercial-c10-c15-receipt.json').read_text())
          maturity = json.loads((root / 'commercial-maturity.json').read_text())
          dashboard = json.loads((root / 'revenue-operations-dashboard.json').read_text())
          integrity = json.loads((root / 'canonical-receipt-integrity.json').read_text())
          rollback = json.loads((root / 'canonical-receipt-rollback-proof.json').read_text())
          programme = json.loads(Path('alpha_omega_commercial/programme.json').read_text())
          programme_integrity = json.loads((root / 'programme-register-integrity.json').read_text())
          admission = json.loads((root / 'external-evidence' / 'external-evidence-admission-receipt.json').read_text())
          projection = json.loads((root / 'external-evidence' / 'external-maturity-projection.json').read_text())
          freshness = json.loads((root / 'provider-authority-freshness' / 'provider-authority-freshness-receipt.json').read_text())
          authority_projection = json.loads((root / 'provider-authority-freshness' / 'provider-authority-projection.json').read_text())
          live_receipt = json.loads(Path('alpha_omega_commercial/live_provider_expansion_receipt.json').read_text())
          canonical_receipt = json.loads(Path('alpha_omega_commercial/canonical_authority_reconciliation_receipt.json').read_text())

          assert receipt['stages']['C10']['status'] == 'REFERENCE_ASSURANCE_VERIFIED_ENTERPRISE_ATTESTATION_REQUIRED'
          assert receipt['stages']['C10']['proof']['control_coverage_pass']
          assert receipt['stages']['C10']['dr']['pass']
          assert receipt['stages']['C11']['status'] == 'REFERENCE_EXECUTION_VERIFIED_AND_ROLLED_BACK'
          assert receipt['stages']['C11']['owner_reserved'] == 'OWNER_APPROVAL_REQUIRED'
          assert receipt['stages']['C12']['status'] == 'MARKET_PROOF_REQUIRED'
          assert not receipt['stages']['C12']['proof']['publication_allowed']
          assert receipt['stages']['C13']['status'] == 'REFERENCE_REVOPS_VERIFIED_ZERO_REVENUE'
          assert receipt['stages']['C13']['quote_status'] == 'DRAFT_OWNER_APPROVAL_REQUIRED'
          assert dashboard['verified_revenue_events'] == 0
          assert dashboard['verified_revenue_by_currency'] == {}
          assert receipt['stages']['C14']['status'] == 'REFERENCE_SCALE_VERIFIED_PRODUCTION_LOAD_REQUIRED'
          assert all(receipt['stages']['C14']['proof']['gates'].values())
          assert receipt['ledger']['pass']

          assert maturity['technical_reference_ready']
          assert maturity['technical_gates']['C15_succession_ready']
          assert not maturity['full_commercial_maturity']
          assert maturity['canonical_status'] == 'COMMERCIAL_READINESS_VERIFIED_EXTERNAL_MATURITY_GATES_OPEN'
          assert not any(maturity['external_gates'].values())
          assert receipt['truth_boundaries']['cloud_run'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'

          assert integrity['status'] == 'CANONICAL_RECEIPT_INTEGRITY_VERIFIED'
          assert all(integrity['checks'].values())
          assert rollback['status'] == 'CANONICAL_RECEIPT_ROLLBACK_VERIFIED'
          assert all(rollback['restored'].values())

          assert programme['canonical_status'] == maturity['canonical_status']
          assert programme['canonical_receipt_integrity'] == integrity['status']
          assert programme['external_evidence_admission']['status'] == 'EXTERNAL_EVIDENCE_ADMISSION_VERIFIED_GATES_UNCHANGED'
          assert programme['provider_authority_freshness']['status'] == 'PROVIDER_AUTHORITY_FRESHNESS_RECONCILIATION_VERIFIED'
          assert programme['stages'][-1]['status'] == 'COMMERCIAL_READINESS_VERIFIED_CANONICAL_PROVIDER_ROUTE_ALIGNED_EXTERNAL_MATURITY_GATES_OPEN'
          assert programme['live_provider_expansion']['status'] == 'REVERSIBLE_PROVIDER_EXPANSION_VERIFIED_CLOUD_RUN_PROVIDER_BLOCKED'
          assert programme['live_provider_expansion']['provider_states']['google_cloud_run'] == 'PROVIDER_BLOCKED_WIF_TOKEN_EXCHANGE_FAILED'
          assert programme['live_provider_expansion']['verified_revenue_events'] == 0
          assert not programme['live_provider_expansion']['full_commercial_maturity']
          assert not programme['live_provider_expansion']['cloud_run_block']['mutation_performed']

          checkpoint = programme['canonical_authority_reconciliation']
          assert checkpoint['status'] == 'CANONICAL_PROVIDER_ROUTE_ALIGNED_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert checkpoint['cloud_run']['project_id'] == 'sov-hybrid-suite'
          assert checkpoint['cloud_run']['region'] == 'africa-south1'
          assert checkpoint['cloud_run']['service'] == 'federation-omega-operator'
          assert checkpoint['cloud_run']['path'] == '/execute'
          assert checkpoint['cloud_run']['provider_state'] == 'PROVIDER_BLOCKED_CANONICAL_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert not checkpoint['cloud_run']['live_invocation_proven']
          assert not checkpoint['cloud_run']['cloud_mutation_performed']
          assert checkpoint['external_gate_effect'] == 'UNCHANGED'
          assert checkpoint['owner_authority_effect'] == 'UNCHANGED'
          assert not checkpoint['full_commercial_maturity']
          assert canonical_receipt['status'] == checkpoint['status']
          assert canonical_receipt['receipt_sha256'] == checkpoint['receipt_sha256']
          assert canonical_receipt['verified_revenue_events'] == 0
          assert not canonical_receipt['full_commercial_maturity']

          assert live_receipt['status'] == 'REVERSIBLE_PROVIDER_EXPANSION_VERIFIED_CLOUD_RUN_PROVIDER_BLOCKED'
          assert live_receipt['truth_boundary']['six_reversible_provider_operations_verified']
          assert not live_receipt['truth_boundary']['bounded_live_cloud_operation_verified']
          assert not live_receipt['truth_boundary']['cloud_mutation_performed_when_blocked']
          assert live_receipt['provider_states']['google_cloud_run'] == 'PROVIDER_BLOCKED_WIF_TOKEN_EXCHANGE_FAILED'
          assert not live_receipt['cloud_run']['mutation_performed']

          assert programme_integrity['status'] == 'PROGRAMME_REGISTER_INTEGRITY_VERIFIED'
          assert all(programme_integrity['checks'].values())
          assert programme_integrity['canonical_authority_reconciliation'] == checkpoint['status']
          assert not any(programme_integrity['external_gates'].values())

          assert admission['status'] == 'EXTERNAL_EVIDENCE_ADMISSION_VERIFIED_GATES_UNCHANGED'
          assert all(admission['gates'].values())
          assert not any(projection['external_gates'].values())
          assert not projection['full_commercial_maturity']
          assert projection['ledger_integrity']

          assert freshness['status'] == 'PROVIDER_AUTHORITY_FRESHNESS_RECONCILIATION_VERIFIED'
          assert all(freshness['gates'].values())
          assert authority_projection['states']['github_actions'] == 'FRESH_VERIFIED'
          assert authority_projection['states']['google_drive_document_release'] == 'FRESH_VERIFIED_READBACK'
          assert authority_projection['states']['cloud_run'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert authority_projection['states']['payment_provider'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert authority_projection['external_gate_effect'] == 'UNCHANGED'
          assert authority_projection['owner_authority_effect'] == 'UNCHANGED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('alpha_omega_commercial/artifacts/c10-c15')
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for path in root.rglob('*'):
              if path.is_file():
                  assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-commercial-c10-c15-proof
          path: alpha_omega_commercial/artifacts/c10-c15
          retention-days: 90
          if-no-files-found: error
