name: SOL 6.1 Runtime Proof

on:
  push:
    branches: [main]
    paths:
      - "sol_61_runtime/**"
      - ".github/workflows/sol-61-runtime-proof.yml"
  pull_request:
    paths:
      - "sol_61_runtime/**"
      - ".github/workflows/sol-61-runtime-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q sol_61_runtime
      - name: Unit tests
        working-directory: sol_61_runtime
        run: python -m unittest -v test_runtime.py test_worker.py test_coordinator.py test_adaptive.py test_semantic_memory.py test_causal.py test_policy_kernel.py test_observability.py
      - name: Execute provider-neutral runtime proof
        run: python sol_61_runtime/prove_runtime.py --output sol_61_runtime/artifacts/proof
      - name: Execute durable worker proof
        run: python sol_61_runtime/prove_worker.py --output sol_61_runtime/artifacts/worker-proof
      - name: Execute distributed coordination proof
        run: python sol_61_runtime/prove_coordinator.py --output sol_61_runtime/artifacts/coordination-proof
      - name: Execute adaptive execution proof
        run: python sol_61_runtime/prove_adaptive.py --output sol_61_runtime/artifacts/adaptive-proof
      - name: Execute semantic memory proof
        run: python sol_61_runtime/prove_semantic_memory.py --output sol_61_runtime/artifacts/semantic-proof
      - name: Execute causal intelligence proof
        run: python sol_61_runtime/prove_causal.py --output sol_61_runtime/artifacts/causal-proof
      - name: Execute formal policy kernel proof
        run: python sol_61_runtime/prove_policy_kernel.py --output sol_61_runtime/artifacts/policy-proof
      - name: Execute observability and self-diagnosis proof
        run: python sol_61_runtime/prove_observability.py --output sol_61_runtime/artifacts/observability-proof
      - name: Validate proof gates and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pairs = {
            'runtime': ('proof', 'sol-61-runtime-receipt.json', 'REFERENCE_RUNTIME_VERIFIED'),
            'worker': ('worker-proof', 'sol-61-worker-receipt.json', 'DURABLE_WORKER_REFERENCE_VERIFIED'),
            'coordination': ('coordination-proof', 'sol-61-coordination-receipt.json', 'DISTRIBUTED_COORDINATION_VERIFIED'),
            'adaptive': ('adaptive-proof', 'sol-61-adaptive-receipt.json', 'ADAPTIVE_EXECUTION_VERIFIED'),
            'semantic': ('semantic-proof', 'sol-61-semantic-memory-receipt.json', 'SEMANTIC_MEMORY_VERIFIED'),
            'causal': ('causal-proof', 'sol-61-causal-receipt.json', 'CAUSAL_DECISION_INTELLIGENCE_VERIFIED'),
            'policy': ('policy-proof', 'sol-61-policy-kernel-receipt.json', 'FORMAL_POLICY_SAFETY_KERNEL_VERIFIED'),
            'observability': ('observability-proof', 'sol-61-observability-receipt.json', 'OBSERVABILITY_SELF_DIAGNOSIS_VERIFIED'),
          }
          receipts = {}
          for key, (folder, filename, status) in pairs.items():
            receipt = json.loads((Path('sol_61_runtime/artifacts') / folder / filename).read_text())
            assert receipt['status'] == status and all(receipt['gates'].values())
            receipts[key] = receipt
          obs = receipts['observability']
          assert obs['truth_boundary']['github_actions_execution']
          assert obs['truth_boundary']['provider_neutral_observability']
          assert not obs['truth_boundary']['live_external_telemetry_stream']
          assert not obs['truth_boundary']['live_incident_delivery']
          assert not obs['truth_boundary']['continuous_background_monitoring']
          root = Path('sol_61_runtime/artifacts/observability-proof/observability-runtime')
          assert (root / 'observability-events.jsonl').is_file()
          assert (root / 'observability-state.json').is_file()
          PY
      - name: Upload proof package
        uses: actions/upload-artifact@v4
        with:
          name: sol-61-runtime-proof
          path: |
            sol_61_runtime/artifacts/proof
            sol_61_runtime/artifacts/worker-proof
            sol_61_runtime/artifacts/coordination-proof
            sol_61_runtime/artifacts/adaptive-proof
            sol_61_runtime/artifacts/semantic-proof
            sol_61_runtime/artifacts/causal-proof
            sol_61_runtime/artifacts/policy-proof
            sol_61_runtime/artifacts/observability-proof
          retention-days: 90
          if-no-files-found: error
