name: SOL 6.1 Runtime Proof

on:
  push:
    branches: [main]
    paths:
      - "sol_61_runtime/**"
      - ".github/workflows/sol-61-runtime-proof.yml"
  pull_request:
    paths:
      - "sol_61_runtime/**"
      - ".github/workflows/sol-61-runtime-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q sol_61_runtime
      - name: Unit tests
        working-directory: sol_61_runtime
        run: python -m unittest -v test_runtime.py test_worker.py test_coordinator.py test_adaptive.py test_semantic_memory.py test_causal.py
      - name: Execute provider-neutral runtime proof
        run: python sol_61_runtime/prove_runtime.py --output sol_61_runtime/artifacts/proof
      - name: Execute durable worker proof
        run: python sol_61_runtime/prove_worker.py --output sol_61_runtime/artifacts/worker-proof
      - name: Execute distributed coordination proof
        run: python sol_61_runtime/prove_coordinator.py --output sol_61_runtime/artifacts/coordination-proof
      - name: Execute adaptive execution proof
        run: python sol_61_runtime/prove_adaptive.py --output sol_61_runtime/artifacts/adaptive-proof
      - name: Execute semantic memory proof
        run: python sol_61_runtime/prove_semantic_memory.py --output sol_61_runtime/artifacts/semantic-proof
      - name: Execute causal intelligence proof
        run: python sol_61_runtime/prove_causal.py --output sol_61_runtime/artifacts/causal-proof
      - name: Validate proof gates and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = {
            'runtime': Path('sol_61_runtime/artifacts/proof'),
            'worker': Path('sol_61_runtime/artifacts/worker-proof'),
            'coordination': Path('sol_61_runtime/artifacts/coordination-proof'),
            'adaptive': Path('sol_61_runtime/artifacts/adaptive-proof'),
            'semantic': Path('sol_61_runtime/artifacts/semantic-proof'),
            'causal': Path('sol_61_runtime/artifacts/causal-proof'),
          }
          receipt = json.loads((roots['runtime'] / 'sol-61-runtime-receipt.json').read_text())
          worker = json.loads((roots['worker'] / 'sol-61-worker-receipt.json').read_text())
          coordination = json.loads((roots['coordination'] / 'sol-61-coordination-receipt.json').read_text())
          adaptive = json.loads((roots['adaptive'] / 'sol-61-adaptive-receipt.json').read_text())
          semantic = json.loads((roots['semantic'] / 'sol-61-semantic-memory-receipt.json').read_text())
          causal = json.loads((roots['causal'] / 'sol-61-causal-receipt.json').read_text())
          assert receipt['status'] == 'REFERENCE_RUNTIME_VERIFIED' and all(receipt['gates'].values())
          assert worker['status'] == 'DURABLE_WORKER_REFERENCE_VERIFIED' and all(worker['gates'].values())
          assert coordination['status'] == 'DISTRIBUTED_COORDINATION_VERIFIED' and all(coordination['gates'].values())
          assert adaptive['status'] == 'ADAPTIVE_EXECUTION_VERIFIED' and all(adaptive['gates'].values())
          assert semantic['status'] == 'SEMANTIC_MEMORY_VERIFIED' and all(semantic['gates'].values())
          assert causal['status'] == 'CAUSAL_DECISION_INTELLIGENCE_VERIFIED' and all(causal['gates'].values())
          assert causal['truth_boundary']['github_actions_execution']
          assert causal['truth_boundary']['provider_neutral_causal_model']
          assert not causal['truth_boundary']['live_intervention_execution']
          assert not causal['truth_boundary']['automatic_real_world_causality_proven']
          PY
      - name: Upload proof package
        uses: actions/upload-artifact@v4
        with:
          name: sol-61-runtime-proof
          path: |
            sol_61_runtime/artifacts/proof
            sol_61_runtime/artifacts/worker-proof
            sol_61_runtime/artifacts/coordination-proof
            sol_61_runtime/artifacts/adaptive-proof
            sol_61_runtime/artifacts/semantic-proof
            sol_61_runtime/artifacts/causal-proof
          retention-days: 90
          if-no-files-found: error
