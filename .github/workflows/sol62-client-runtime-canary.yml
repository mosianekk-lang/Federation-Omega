name: SOL 6.2 Client Runtime Canary v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: sol62-client-runtime-canary-v1
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: fuse-sol62-client-canary
  ARTIFACT_REPOSITORY: federation-omega
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  PRODUCTION_TRAFFIC_CHANGED: 'false'

jobs:
  deploy-isolated-canary:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] SOL62_CLIENT_RUNTIME_CANARY_V1' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate canonical keyless deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud client
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Qualify provider prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" --format='value(email)' >/dev/null
          gcloud run services list --project "$PROJECT_ID" --region "$REGION" --limit=1 --format='value(metadata.name)' >/dev/null
          echo 'PROVIDER_PREREQS_QUALIFIED=true' >> "$GITHUB_ENV"

      - name: Build and push immutable SOL62 image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/sol62-client-runtime:$GITHUB_SHA"
          docker build --pull --file services/sol62_client_runtime/Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          IMAGE_DIGEST_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/sol62-client-runtime@$DIGEST"
          echo "IMAGE_DIGEST_URI=$IMAGE_DIGEST_URI" >> "$GITHUB_ENV"
          echo "VERIFIED_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo 'ARTIFACT_REGISTRY_PUSH_PERFORMED=true' >> "$GITHUB_ENV"

      - name: Exact-image local semantic canary
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_CONTAINER="sol62-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/sol62-canary-receipt
          capture_local() {
            set +e
            docker inspect "$LOCAL_CONTAINER" > /tmp/sol62-canary-receipt/local-container-inspect.json 2>/dev/null || true
            docker logs "$LOCAL_CONTAINER" > /tmp/sol62-canary-receipt/local-startup.log 2>&1 || true
            set -e
          }
          cleanup() { capture_local || true; docker rm --force "$LOCAL_CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull "$IMAGE_DIGEST_URI"
          docker run --detach --name "$LOCAL_CONTAINER"             --publish 127.0.0.1:18762:8762             --env SOL62_CLIENT_HOST=0.0.0.0             --env SOL62_CLIENT_PORT=8762             "$IMAGE_DIGEST_URI" >/dev/null
          CODE='000'
          for attempt in $(seq 1 30); do
            CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5               --output /tmp/sol62-local-health.json --write-out '%{http_code}'               http://127.0.0.1:18762/health || true)"
            [[ "$CODE" == '200' ]] && break
            docker inspect --format='{{.State.Running}}' "$LOCAL_CONTAINER" | grep -Fx true >/dev/null || break
            sleep 1
          done
          if [[ "$CODE" != '200' ]]; then
            capture_local
            echo "SOL62_LOCAL_STARTUP_FAILED:health_code=$CODE" >&2
            cat /tmp/sol62-canary-receipt/local-startup.log >&2 || true
            exit 72
          fi
          capture_local
          echo "LOCAL_STARTUP_LOG_SHA256=$(sha256sum /tmp/sol62-canary-receipt/local-startup.log | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "LOCAL_CONTAINER_INSPECT_SHA256=$(sha256sum /tmp/sol62-canary-receipt/local-container-inspect.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sol62-local-health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('schema') == 'SOL62_COMPLETE_FUSE_CLIENT_RUNTIME_V1', d
          integrity=d.get('sol_integrity') or {}
          assert integrity.get('version') == '6.2', integrity
          assert integrity.get('event_chain_valid') is True, integrity
          assert integrity.get('inflight_effects') == [], integrity
          assert d.get('chatgpt_ui_required') is False, d
          assert d.get('provider_specific_limits_are_mission_terminal') is False, d
          meta=d.get('sovereign_meta_intelligence') or {}
          assert meta.get('owner_label') == 'Kim Kagiso Mosiane', meta
          assert meta.get('auto_repair_control') is True, meta
          assert meta.get('auto_protect_control') is True, meta
          assert meta.get('provider_authority_created') is False, meta
          PY
          echo 'LOCAL_SEMANTIC_CANARY=PASS' >> "$GITHUB_ENV"

      - name: Deploy authenticated isolated Cloud Run canary
        shell: bash
        run: |
          set -euo pipefail
          echo 'CLOUD_RUN_DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
          gcloud run deploy "$SERVICE"             --project "$PROJECT_ID"             --region "$REGION"             --image "$IMAGE_DIGEST_URI"             --service-account "$RUNTIME_SA"             --platform managed             --port 8080             --cpu 1             --memory 512Mi             --min 0             --max 1             --concurrency 20             --ingress all             --set-env-vars='SOL62_CLIENT_HOST=0.0.0.0,SOL62_CLIENT_PORT=8080'             --quiet
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL" && test -n "$REVISION"
          echo "CANARY_URL=$URL" >> "$GITHUB_ENV"
          echo "CANARY_REVISION=$REVISION" >> "$GITHUB_ENV"

          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/sol62-iam.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/sol62-iam.json',encoding='utf-8'))
          public={'all'+'Users','all'+'AuthenticatedUsers'}
          found={m for b in p.get('bindings',[]) for m in b.get('members',[]) if m in public}
          assert not found, found
          PY
          echo 'PUBLIC_INVOCATION=false' >> "$GITHUB_ENV"

          TOKEN="$(gcloud auth print-identity-token --audiences="$URL")"
          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN" "$URL/health" > /tmp/sol62-provider-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sol62-provider-health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          integrity=d.get('sol_integrity') or {}
          assert integrity.get('version') == '6.2', integrity
          assert integrity.get('event_chain_valid') is True, integrity
          assert integrity.get('inflight_effects') == [], integrity
          assert d.get('chatgpt_ui_required') is False, d
          meta=d.get('sovereign_meta_intelligence') or {}
          assert meta.get('owner_label') == 'Kim Kagiso Mosiane', meta
          assert meta.get('auto_repair_control') is True, meta
          assert meta.get('auto_protect_control') is True, meta
          assert meta.get('untrusted_content_has_instruction_authority') is False, meta
          assert meta.get('provider_authority_created') is False, meta
          PY
          echo 'PROVIDER_SEMANTIC_CANARY=PASS' >> "$GITHUB_ENV"
          echo 'PRODUCTION_TRAFFIC_CHANGED=false' >> "$GITHUB_ENV"

      - name: Emit redacted deployment receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sol62-canary-receipt
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          truth=lambda n: os.environ.get(n,'').lower()=='true'
          body={
            'schema':'SOL62_CLIENT_RUNTIME_CANARY_RECEIPT_V1',
            'source_sha':os.environ.get('GITHUB_SHA'),
            'project_id':os.environ.get('PROJECT_ID'),
            'region':os.environ.get('REGION'),
            'service':os.environ.get('SERVICE'),
            'image_digest_uri':os.environ.get('IMAGE_DIGEST_URI'),
            'verified_image_digest':os.environ.get('VERIFIED_IMAGE_DIGEST'),
            'canary_url':os.environ.get('CANARY_URL'),
            'canary_revision':os.environ.get('CANARY_REVISION'),
            'provider_prereqs_qualified':truth('PROVIDER_PREREQS_QUALIFIED'),
            'artifact_registry_push_performed':truth('ARTIFACT_REGISTRY_PUSH_PERFORMED'),
            'cloud_run_deploy_attempted':truth('CLOUD_RUN_DEPLOY_ATTEMPTED'),
            'local_semantic_canary':os.environ.get('LOCAL_SEMANTIC_CANARY'),
            'local_startup_log_sha256':os.environ.get('LOCAL_STARTUP_LOG_SHA256'),
            'local_container_inspect_sha256':os.environ.get('LOCAL_CONTAINER_INSPECT_SHA256'),
            'provider_semantic_canary':os.environ.get('PROVIDER_SEMANTIC_CANARY'),
            'provider_mutation_performed':truth('ARTIFACT_REGISTRY_PUSH_PERFORMED') or truth('CLOUD_RUN_DEPLOY_ATTEMPTED'),
            'production_traffic_changed':truth('PRODUCTION_TRAFFIC_CHANGED'),
            'public_invocation':truth('PUBLIC_INVOCATION'),
            'secret_value_recorded':False,
            'oauth_value_recorded':False,
            'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
          }
          body['receipt_sha256']=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('/tmp/sol62-canary-receipt/receipt.json','w').write(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload canary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol62-client-runtime-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sol62-canary-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
