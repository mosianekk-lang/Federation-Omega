name: Alpha Omega v3 Self-Verifying Institution

on:
  push:
    paths:
      - 'alpha_omega_v30/**'
      - '.github/workflows/alpha-omega-v30-institution.yml'
  pull_request:
    paths:
      - 'alpha_omega_v30/**'
      - '.github/workflows/alpha-omega-v30-institution.yml'
  schedule:
    - cron: '37 * * * *'

jobs:
  institution-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: pytest -q
      - run: |
          python - <<'PY'
          import json
          from institution import RealityState
          state = {'deployed': True, 'rollback': True}
          receipt = {
              'state': 'INSTITUTION_KERNEL_VERIFIED',
              'reality': RealityState(state, state, state, state, state).reconcile(),
              'truth_boundary': {
                  'kernel_runtime': True,
                  'all_15_phases_operational': False,
                  'cloud_run_deployed': False
              }
          }
          open('institution_receipt.json','w').write(json.dumps(receipt, indent=2))
          PY
      - run: test -f institution_receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-omega-v30-institution-proof
          path: |
            alpha_omega_v30/institution_receipt.json
            alpha_omega_v30/programme.json
          if-no-files-found: error
