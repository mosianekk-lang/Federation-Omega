name: Nature Intelligence Acquisition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kimmie_seed/nature_intelligence/**'
      - '.github/workflows/nature-intelligence-acquisition.yml'
  schedule:
    - cron: '37 2 * * 2'

permissions:
  contents: write

concurrency:
  group: nature-intelligence-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip nature-watch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run acquisition regression tests
        run: python -m unittest kimmie_seed/nature_intelligence/test_acquire.py -v

      - name: Acquire and verify bounded corpus
        run: python kimmie_seed/nature_intelligence/acquire.py

      - name: Verify proof outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('kimmie_seed/nature_intelligence/monitoring/latest_health.json').read_text())
          receipt = json.loads(Path('kimmie_seed/nature_intelligence/receipts/latest_acquisition_receipt.json').read_text())
          assert health['status'] == 'PASS'
          assert health['germination_gate'] == 'PASSED'
          assert health['sources_passed'] >= 1
          assert health['full_text_persisted'] is False
          assert receipt['status'] == 'PASS'
          assert len(receipt['receipt_sha256']) == 64
          print(json.dumps({'health_sha256': health['health_sha256'], 'receipt_sha256': receipt['receipt_sha256']}))
          PY

      - name: Persist durable acquisition readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kimmie_seed/nature_intelligence/monitoring/latest_health.json
          git add kimmie_seed/nature_intelligence/receipts/latest_acquisition_receipt.json
          if git diff --cached --quiet; then
            echo 'No proof-state change to persist.'
          else
            git commit -m 'Record Nature Intelligence acquisition proof [skip nature-watch]'
            git push
          fi
