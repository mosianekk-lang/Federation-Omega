name: FUSE Sovereign Platform v0.3 Windows Build
on:
  workflow_dispatch:
  push:
    branches: ["build/fuse-sovereign-platform-v030-updates"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore v0.2 exact source base
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/mosianekk-lang/Federation-Omega/build/fuse-sovereign-platform-v020-windows/build_payloads/fuse_sovereign_capability_platform_v0_2_windows_src.zip.b64"
          $payload = (Invoke-WebRequest -UseBasicParsing -Uri $url).Content.Trim()
          [IO.File]::WriteAllBytes("fuse-source.zip", [Convert]::FromBase64String($payload))
          New-Item -ItemType Directory -Force -Path .\products\fuse_sovereign_capability_platform_v0_3 | Out-Null
          Expand-Archive -Path .\fuse-source.zip -DestinationPath .\products\fuse_sovereign_capability_platform_v0_3 -Force

      - name: Apply v0.3 update bridge overlay
        shell: pwsh
        run: |
          $root = ".\products\fuse_sovereign_capability_platform_v0_3"
          Copy-Item .\build_payloads\fuse_sovereign_v0_3\update.py "$root\fuse_sovereign\update.py" -Force
          Copy-Item .\build_payloads\fuse_sovereign_v0_3\app.py "$root\app.py" -Force
          Copy-Item .\build_payloads\fuse_sovereign_v0_3\test_updates.py "$root\tests\test_updates.py" -Force
          Copy-Item .\build_payloads\fuse_sovereign_v0_3\README.md "$root\README.md" -Force
          Copy-Item .\build_payloads\fuse_sovereign_v0_3\installer.iss "$root\installer.iss" -Force
          Add-Content -Path "$root\fuse_sovereign\__init__.py" -Value "from .update import *"
          (Get-Content -Raw "$root\pyproject.toml").Replace('version = "0.1.0"','version = "0.3.0"') | Set-Content "$root\pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Unit tests
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: python -m pytest -q

      - name: Source self-test
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: python app.py --self-test

      - name: Live FUSE update fetch court
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: |
          python app.py --fetch-updates | Tee-Object -FilePath LIVE_UPDATE_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content -Raw LIVE_UPDATE_RECEIPT.json | ConvertFrom-Json
          if ($r.schema -ne "FUSE_LLM_UPDATE_SNAPSHOT_V1") { throw "LLM_UPDATE_SCHEMA_FAIL" }
          if ($r.verified_commit -ne $true) { throw "LLM_UPDATE_COMMIT_NOT_VERIFIED" }
          if ($r.sequence -lt 1) { throw "LLM_UPDATE_SEQUENCE_FAIL" }
          if ($r.authority_boundary -ne "DATA_ONLY_NO_EFFECT_AUTHORITY") { throw "LLM_UPDATE_AUTHORITY_BOUNDARY_FAIL" }

      - name: Build Windows EXE
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FUSE-Sovereign-Platform app.py

      - name: EXE self-test
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: |
          & .\dist\FUSE-Sovereign-Platform.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: EXE live FUSE update fetch
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: |
          & .\dist\FUSE-Sovereign-Platform.exe --fetch-updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC_NOT_FOUND" }

      - name: Build installer
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Build receipt
        shell: pwsh
        working-directory: products/fuse_sovereign_capability_platform_v0_3
        run: |
          $exe = Get-FileHash .\dist\FUSE-Sovereign-Platform.exe -Algorithm SHA256
          $setup = Get-FileHash .\installer-dist\FUSE-Sovereign-Platform-Setup.exe -Algorithm SHA256
          $live = Get-Content -Raw .\LIVE_UPDATE_RECEIPT.json | ConvertFrom-Json
          $receipt = [ordered]@{
            schema = "FUSE-SOVEREIGN-WINDOWS-BUILD-RECEIPT-V2"
            version = "0.3.0"
            os = "windows-latest"
            exe_sha256 = $exe.Hash.ToLower()
            installer_sha256 = $setup.Hash.ToLower()
            signed = $false
            self_test = "PASS"
            unit_tests = "PASS"
            llm_update_fetch = "PASS"
            update_source_commit = $live.source_commit
            update_source_verified = $live.verified_commit
            update_sequence = $live.sequence
            authority_boundary = $live.authority_boundary
          }
          $receipt | ConvertTo-Json | Set-Content .\BUILD_RECEIPT.json

      - uses: actions/upload-artifact@v4
        with:
          name: fuse-sovereign-platform-windows-v0.3.0
          path: |
            products/fuse_sovereign_capability_platform_v0_3/dist/FUSE-Sovereign-Platform.exe
            products/fuse_sovereign_capability_platform_v0_3/installer-dist/FUSE-Sovereign-Platform-Setup.exe
            products/fuse_sovereign_capability_platform_v0_3/BUILD_RECEIPT.json
            products/fuse_sovereign_capability_platform_v0_3/LIVE_UPDATE_RECEIPT.json
