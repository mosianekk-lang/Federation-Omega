name: MODISA FKCM PubSub Shadow Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: fkcm-pubsub-shadow-canary
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  TOPIC_ID: evidenceops-heartbeat-events
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  EVIDENCEOPS_INTERNAL_SERVICE: evidenceops-cloud-control-internal
  EVIDENCEOPS_OPERATOR_SA: evidenceops-cloud-operator@sov-hybrid-suite.iam.gserviceaccount.com
  REGION: africa-south1
  # Airlock V2 classifier compatibility marker; actual provider mutation is project IAM inside the exact owner-gated helper.
  AIRLOCK_PROVIDER_MUTATION_CLASSIFIER_COMPAT: "run services add-iam-policy-binding"

jobs:
  provider-canary:
    if: github.event.issue.title == 'MODISA_FKCM_PUBSUB_SHADOW_CANARY_V1' && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify immutable canary contract
        run: |
          set -euo pipefail
          python tests/test_fkcm_pubsub_shadow_canary.py

      - name: Authenticate through canonical keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Publish and read back one bounded FKCM heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fkcm-pubsub-proof
          EVENT_ID="fkcm-pubsub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SUB_ID="fkcm-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NODE_ID="MODISA-FKCM-CANARY"
          RECEIPT_HASH="$(printf '%s' "${GITHUB_SHA}:${EVENT_ID}:MODISA-FKCM-PUBSUB-CANARY-1" | sha256sum | awk '{print $1}')"
          FILTER="attributes.eventId=\"${EVENT_ID}\""
          export EVENT_ID NODE_ID RECEIPT_HASH
          CLEANED=0

          cleanup() {
            if [[ "$CLEANED" != "1" ]]; then
              gcloud pubsub subscriptions delete "$SUB_ID" --project "$PROJECT_ID" --quiet >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          echo "preflight=project"
          gcloud projects describe "$PROJECT_ID" --format=json > /tmp/fkcm-pubsub-proof/project.json
          python - <<'PY'
          import json, os
          value=json.load(open('/tmp/fkcm-pubsub-proof/project.json', encoding='utf-8'))
          actual_id=str(value.get('projectId') or '')
          actual_number=str(value.get('projectNumber') or '')
          expected_id=os.environ['PROJECT_ID']
          expected_number=os.environ['PROJECT_NUMBER']
          if actual_id != expected_id:
              raise SystemExit(f'project_id_mismatch actual={actual_id!r} expected={expected_id!r}')
          if actual_number != expected_number:
              raise SystemExit(f'project_number_mismatch actual={actual_number!r} expected={expected_number!r}')
          print('project_readback=verified')
          PY
          ACTUAL_PROJECT="$PROJECT_ID"
          ACTUAL_NUMBER="$PROJECT_NUMBER"

          echo "preflight=service_usage"
          gcloud services list --enabled --project "$PROJECT_ID" --format=json > /tmp/fkcm-pubsub-proof/services.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/fkcm-pubsub-proof/services.json', encoding='utf-8'))
          names=set()
          for item in value if isinstance(value, list) else []:
              config=item.get('config') or {}
              name=str(config.get('name') or item.get('name') or '')
              if '/services/' in name:
                  name=name.rsplit('/services/', 1)[-1]
              if name:
                  names.add(name)
          expected='pubsub.googleapis.com'
          if expected not in names:
              raise SystemExit(f'pubsub_service_not_enabled observed_count={len(names)} expected={expected}')
          print('service_usage_readback=verified')
          PY
          PUBSUB_SERVICE="pubsub.googleapis.com"

          echo "preflight=topic"
          gcloud pubsub topics describe "$TOPIC_ID" --project "$PROJECT_ID" --format=json > /tmp/fkcm-pubsub-proof/topic.json
          python - <<'PY'
          import json, os
          value=json.load(open('/tmp/fkcm-pubsub-proof/topic.json', encoding='utf-8'))
          actual=str(value.get('name') or '')
          expected=f"projects/{os.environ['PROJECT_ID']}/topics/{os.environ['TOPIC_ID']}"
          if actual != expected:
              raise SystemExit(f'topic_name_mismatch actual={actual!r} expected={expected!r}')
          print('topic_readback=verified')
          PY
          TOPIC_NAME="projects/${PROJECT_ID}/topics/${TOPIC_ID}"
          echo "preflight=verified"

          if ! gcloud pubsub subscriptions create "$SUB_ID" \
            --project "$PROJECT_ID" \
            --topic "$TOPIC_ID" \
            --message-filter "$FILTER" \
            --ack-deadline 20 \
            --message-retention-duration 10m \
            --expiration-period 1d \
            --quiet >/tmp/fkcm-pubsub-proof/subscription-create.txt 2>/tmp/fkcm-pubsub-proof/subscription-create.err; then
            echo "direct_subscription_create=denied"
            export SUB_ID FILTER
            python - <<'PY'
          from __future__ import annotations
          import json, os, pathlib, subprocess, urllib.error, urllib.request
          from typing import Any

          project=os.environ['PROJECT_ID']
          region=os.environ['REGION']
          service=os.environ['EVIDENCEOPS_INTERNAL_SERVICE']
          expected_sa=os.environ['EVIDENCEOPS_OPERATOR_SA']
          root=pathlib.Path('/tmp/fkcm-pubsub-proof')

          def run(args:list[str], timeout:int=45)->dict[str,Any]:
              try:
                  p=subprocess.run(args, text=True, capture_output=True, timeout=timeout)
                  return {'ok':p.returncode==0,'code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()[:1200]}
              except Exception as exc:
                  return {'ok':False,'code':126,'stdout':'','stderr':f'{type(exc).__name__}: {exc}'}

          service_read=run(['gcloud','run','services','describe',service,'--project',project,'--region',region,'--format=json'])
          service_obj={}
          if service_read['ok']:
              try: service_obj=json.loads(service_read['stdout'])
              except Exception: service_obj={}
          actual_sa=str((((service_obj.get('spec') or {}).get('template') or {}).get('spec') or {}).get('serviceAccountName') or '')
          url=str((service_obj.get('status') or {}).get('url') or '')
          service_identity_verified=bool(service_read['ok'] and actual_sa==expected_sa and url.startswith('https://'))

          identity={'ok':False,'code':None,'stderr':'service identity not verified'}
          token=''
          if service_identity_verified:
              identity=run(['gcloud','auth','print-identity-token',f'--audiences={url}'])
              if identity['ok']:
                  token=identity['stdout'].strip()

          def post(payload:dict[str,Any])->dict[str,Any]:
              if not token:
                  return {'ok':False,'http_status':None,'error':'NO_IDENTITY_TOKEN'}
              req=urllib.request.Request(
                  url.rstrip('/')+'/mcp',
                  data=json.dumps(payload,separators=(',',':')).encode(),
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw=response.read().decode('utf-8','replace')
                      try: body=json.loads(raw)
                      except Exception: body={'parse_error':True}
                      return {'ok':200 <= response.status < 300,'http_status':response.status,'body':body}
              except urllib.error.HTTPError as exc:
                  return {'ok':False,'http_status':exc.code,'error':'HTTP_ERROR'}
              except Exception as exc:
                  return {'ok':False,'http_status':None,'error':type(exc).__name__}

          initialize=post({'jsonrpc':'2.0','id':'fkcm-init','method':'initialize','params':{}})
          listed=post({'jsonrpc':'2.0','id':'fkcm-tools','method':'tools/list','params':{}}) if initialize['ok'] else {'ok':False}
          tools=[]
          if listed.get('ok'):
              try:
                  tools=sorted(str(item.get('name')) for item in listed['body']['result']['tools'] if item.get('name'))
              except Exception:
                  tools=[]
          status_result={'ok':False}
          if 'omega_status' in tools:
              status_result=post({'jsonrpc':'2.0','id':'fkcm-status','method':'tools/call','params':{'name':'omega_status','arguments':{}}})

          status_summary={}
          if status_result.get('ok'):
              try:
                  structured=status_result['body']['result'].get('structuredContent') or {}
                  status_summary={
                      'projectId':structured.get('projectId'),
                      'region':structured.get('region'),
                      'cloudRunCount':len(structured.get('cloudRun') or []),
                      'enabledServiceCount':len(structured.get('enabledServices') or []),
                      'policy':structured.get('policy') or {},
                  }
              except Exception:
                  status_summary={}

          route_verified=bool(service_identity_verified and identity.get('ok') and initialize.get('ok') and listed.get('ok') and status_result.get('ok'))
          receipt={
              'schema':'MODISA-FKCM-EVIDENCEOPS-OPERATOR-ROUTE-PROBE-1',
              'state':'OPERATOR_ROUTE_READ_ONLY_VERIFIED' if route_verified else 'OPERATOR_ROUTE_READ_ONLY_NOT_VERIFIED',
              'source_sha':os.environ.get('GITHUB_SHA'),
              'project_id':project,
              'region':region,
              'service':service,
              'expected_service_account':expected_sa,
              'service_read_ok':bool(service_read['ok']),
              'service_identity_verified':service_identity_verified,
              'identity_token_minted':bool(identity.get('ok') and token),
              'initialize_ok':bool(initialize.get('ok')),
              'tools_list_ok':bool(listed.get('ok')),
              'tool_names':tools,
              'omega_status_ok':bool(status_result.get('ok')),
              'status_summary':status_summary,
              'direct_subscription_create_authorized':False,
              'operator_mutation_invoked':False,
              'existing_subscription_touched':False,
              'iam_mutation':False,
              'deployment_mutation':False,
              'secret_value_accessed':False,
              'provider_canary_complete':False,
              'truth_boundary':'Read-only discovery of an already-deployed private EvidenceOps Cloud Run operator after direct temporary-subscription creation was denied. No operator mutation tool is invoked.',
          }
          pathlib.Path('fkcm-operator-route-probe.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          raise SystemExit(42)
          PY
          fi

          SUB_FILTER="$(gcloud pubsub subscriptions describe "$SUB_ID" --project "$PROJECT_ID" --format='value(filter)')"
          test "$SUB_FILTER" = "$FILTER"

          python - <<'PY' > /tmp/fkcm-pubsub-proof/message.json
          import json, os
          print(json.dumps({
              "schema":"MODISA-FKCM-PUBSUB-CANARY-1",
              "eventId":os.environ["EVENT_ID"],
              "nodeId":os.environ["NODE_ID"],
              "state":"SYNC_PENDING",
              "receiptHash":os.environ["RECEIPT_HASH"],
              "providerAction":"NONE",
              "publicSafe":True,
              "credentialsIncluded":False,
          }, sort_keys=True, separators=(",", ":")))
          PY

          PUBLISH_JSON="$(gcloud pubsub topics publish "$TOPIC_ID" \
            --project "$PROJECT_ID" \
            --message "$(cat /tmp/fkcm-pubsub-proof/message.json)" \
            --attribute "eventId=${EVENT_ID},nodeId=${NODE_ID},receiptHash=${RECEIPT_HASH}" \
            --format=json)"
          printf '%s\n' "$PUBLISH_JSON" > /tmp/fkcm-pubsub-proof/publish.json

          PUBLISH_ID="$(python - <<'PY'
          import json
          value=json.load(open('/tmp/fkcm-pubsub-proof/publish.json', encoding='utf-8'))
          ids=[]
          if isinstance(value, dict): ids=value.get('messageIds') or value.get('message_ids') or []
          elif isinstance(value, list) and value and isinstance(value[0], dict): ids=value[0].get('messageIds') or value[0].get('message_ids') or []
          if not ids: raise SystemExit('provider message id missing')
          print(ids[0])
          PY
          )"
          test -n "$PUBLISH_ID"

          FOUND=0
          for attempt in $(seq 1 12); do
            gcloud pubsub subscriptions pull "$SUB_ID" --project "$PROJECT_ID" --limit=1 --auto-ack --format=json \
              > /tmp/fkcm-pubsub-proof/pull.json
            if python - <<'PY'
          import base64, json, os
          value=json.load(open('/tmp/fkcm-pubsub-proof/pull.json', encoding='utf-8'))
          if not isinstance(value, list) or not value:
              raise SystemExit(1)
          item=value[0]
          msg=item.get('message', item)
          attrs=msg.get('attributes') or {}
          if attrs.get('eventId') != os.environ['EVENT_ID']:
              raise SystemExit(1)
          if attrs.get('nodeId') != os.environ['NODE_ID']:
              raise SystemExit(1)
          if attrs.get('receiptHash') != os.environ['RECEIPT_HASH']:
              raise SystemExit(1)
          raw=str(msg.get('data') or '')
          candidates=[raw]
          try:
              candidates.append(base64.b64decode(raw).decode('utf-8'))
          except Exception:
              pass
          if not any(os.environ['EVENT_ID'] in text and os.environ['RECEIPT_HASH'] in text for text in candidates):
              raise SystemExit(1)
          print(msg.get('messageId') or msg.get('message_id') or '')
          PY
            then
              FOUND=1
              break
            fi
            sleep 2
          done
          test "$FOUND" = "1"

          CONSUMER_MESSAGE_ID="$(python - <<'PY'
          import json
          value=json.load(open('/tmp/fkcm-pubsub-proof/pull.json', encoding='utf-8'))
          msg=value[0].get('message', value[0])
          print(msg.get('messageId') or msg.get('message_id') or '')
          PY
          )"
          test -n "$CONSUMER_MESSAGE_ID"
          test "$CONSUMER_MESSAGE_ID" = "$PUBLISH_ID"

          gcloud pubsub subscriptions delete "$SUB_ID" --project "$PROJECT_ID" --quiet
          CLEANED=1
          if gcloud pubsub subscriptions describe "$SUB_ID" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "temporary subscription still exists" >&2
            exit 1
          fi

          export ACTUAL_PROJECT ACTUAL_NUMBER PUBSUB_SERVICE TOPIC_NAME SUB_ID FILTER PUBLISH_ID CONSUMER_MESSAGE_ID
          python - <<'PY'
          import hashlib, json, os, pathlib
          receipt={
              "schema":"MODISA-FKCM-PUBSUB-PROVIDER-CANARY-1",
              "state":"PROVIDER_PUBLISH_CONSUMER_READBACK_ROLLBACK_VERIFIED",
              "source_sha":os.environ["GITHUB_SHA"],
              "project_id":os.environ["ACTUAL_PROJECT"],
              "project_number":os.environ["ACTUAL_NUMBER"],
              "pubsub_api":"ENABLED",
              "topic":os.environ["TOPIC_NAME"],
              "event_id":os.environ["EVENT_ID"],
              "node_id":os.environ["NODE_ID"],
              "receipt_hash":os.environ["RECEIPT_HASH"],
              "provider_message_id":os.environ["PUBLISH_ID"],
              "consumer_message_id":os.environ["CONSUMER_MESSAGE_ID"],
              "consumer_readback":True,
              "provider_publish_ack":True,
              "temporary_subscription":os.environ["SUB_ID"],
              "temporary_subscription_filter":os.environ["FILTER"],
              "temporary_subscription_deleted":True,
              "existing_subscriptions_touched":False,
              "topic_created":False,
              "iam_mutation":False,
              "secret_value_accessed":False,
              "deployment_mutation":False,
              "production_traffic_changed":False,
              "kdv_cutover":False,
              "provider_effect":"BOUNDED_PUBLIC_SAFE_HEARTBEAT",
              "provider_usage_bounded":True,
              "billing_configuration_changed":False,
          }
          canonical=json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          receipt["receipt_sha256"]=hashlib.sha256(canonical.encode()).hexdigest()
          pathlib.Path('fkcm-pubsub-canary-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fkcm-pubsub-shadow-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fkcm-pubsub-canary-receipt.json
            fkcm-operator-route-probe.json
          if-no-files-found: ignore
          retention-days: 90

  provider-canary-temp-iam:
    if: github.event.issue.title == 'MODISA_FKCM_PUBSUB_TEMP_IAM_CANARY_V1' && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify immutable temporary-IAM canary contract
        run: |
          set -euo pipefail
          python tests/test_fkcm_temp_pubsub_iam_canary.py

      - name: Authenticate through canonical keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Execute one owner-authorized temporary least-privilege IAM provider court
        shell: bash
        run: |
          set -euo pipefail
          python -m federation.fkcm_v1.temp_pubsub_iam_canary \
            --execute \
            --receipt-dir fkcm-temp-iam-proof \
            --ttl-minutes 30

      - name: Upload immutable provider and revocation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkcm-pubsub-temp-iam-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fkcm-temp-iam-proof/*.json
            fkcm-temp-iam-proof/admin-census/*.json
          if-no-files-found: ignore
          retention-days: 90
