name: Superior Logic CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install runtime and API test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate operational shell scripts
        run: bash -n ops/*.sh
      - name: Validate all Apps Script source and manifests
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            tmp="/tmp/$(echo "$file" | tr '/ ' '__').js"
            cp "$file" "$tmp"
            node --check "$tmp"
          done < <(find apps_script -name '*.gs' -print0)
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));' "$file"
          done < <(find apps_script -name 'appsscript.json' -print0)
      - name: Run runtime and typed API tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
