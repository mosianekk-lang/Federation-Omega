name: Alpha Omega Commercial Provider Dispatch Outbox Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-outbox.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-outbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-dispatch-outbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run provider dispatch and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute provider dispatch outbox proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_dispatch_outbox
          --output artifacts

      - name: Validate contract checkpoint projection and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'provider_dispatch_outbox_contract.json').read_text())
          checkpoint = json.loads((root / 'provider_dispatch_outbox_checkpoint.json').read_text())
          projection = json.loads((root / 'canonical_commercial_api_effective_v11.json').read_text())
          receipt = json.loads(Path('artifacts/provider-dispatch-outbox-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTBOX-V11'
          assert contract['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert contract['depends_on']['pull_request'] == 138
          assert contract['depends_on']['merge_commit'] == 'b038db47eeca54a41ed149ee80a5ce84331e8d1e'
          assert contract['depends_on']['google_drive_release_readback_verified'] is True
          rules = contract['dispatch_rules']
          assert rules['committed_v10_action_required'] is True
          assert rules['stable_provider_idempotency_key_required'] is True
          assert rules['mock_provider_contract_conformance_verified'] is True
          assert rules['mock_receipt_may_claim_external_mutation'] is False
          assert rules['mock_receipt_may_claim_live_provider_operation'] is False
          assert rules['live_provider_receipt_requires_concrete_native_verifier'] is True
          assert rules['distributed_provider_exactly_once_proven'] is False
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          dependency = checkpoint['dependency_checkpoint']
          assert dependency['preceding_pull_request'] == 138
          assert dependency['preceding_drive_readback_verified'] is True
          assert dependency['programme_dependency_order_verified'] is True
          assert dependency['institution_state_preserved'] is True
          assert checkpoint['status'] in {
              'PROVIDER_DISPATCH_OUTBOX_IMPLEMENTED_MOCK_CONFORMANCE_VERIFIED_LIVE_PROVIDER_PROOF_REQUIRED',
              'PROVIDER_DISPATCH_OUTBOX_PROVIDER_PROOF_VERIFIED_MOCK_CONFORMANCE_ONLY_EXTERNAL_GATES_UNCHANGED',
          }
          assert checkpoint['candidate_projection']['capability_revision'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTBOX-V11'
          assert checkpoint['candidate_projection']['canonical_class'] == 'ProviderDispatchOutboxCommercialControlPlane'
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['distributed_provider_exactly_once_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert projection['effective_canonical_class'] == 'ProviderDispatchOutboxCommercialControlPlane'
          assert projection['provider_dispatch']['mock_provider_conformance'] == 'VERIFIED_BY_REFERENCE_TESTS'
          assert projection['provider_dispatch']['live_provider_receipt_admission'] == 'PROVIDER_PROOF_REQUIRED'
          assert projection['provider_dispatch']['distributed_provider_exactly_once'] == 'NOT_PROVEN'
          assert projection['verified_live_revenue_events'] == 0
          assert projection['full_commercial_maturity'] is False

          assert receipt['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTBOX-V11'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          safety = receipt['provider_dispatch_safety']
          assert safety['stable_provider_idempotency_key'] is True
          assert safety['dispatch_bound_to_committed_v10_action'] is True
          assert safety['mock_provider_contract_conformance_verified'] is True
          assert safety['live_provider_receipt_admitted'] is False
          assert safety['external_mutation_performed'] is False
          assert safety['live_provider_operation_proven'] is False
          assert safety['distributed_provider_exactly_once_proven'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_dispatch_outbox.py'),
              Path('alpha_omega_commercial/prove_provider_dispatch_outbox.py'),
              Path('alpha_omega_commercial/test_provider_dispatch_outbox.py'),
              Path('alpha_omega_commercial/provider_dispatch_outbox_contract.json'),
              Path('alpha_omega_commercial/provider_dispatch_outbox_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v11.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable provider dispatch outbox proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-dispatch-outbox-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
