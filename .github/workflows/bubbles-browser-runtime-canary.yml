name: Bubbles Browser Runtime Canary

on:
  push:
    branches: [ main ]
    paths:
      - 'bubbles/browser_runtime_canary.py'
      - 'tests/test_bubbles_browser_runtime_canary.py'
      - '.github/workflows/bubbles-browser-runtime-canary.yml'
  pull_request:
    paths:
      - 'bubbles/browser_runtime_canary.py'
      - 'tests/test_bubbles_browser_runtime_canary.py'
      - '.github/workflows/bubbles-browser-runtime-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubbles-browser-runtime-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify browser canary contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_bubbles_browser_runtime_canary

      - name: Run loopback-only browser runtime canary
        run: |
          set -euo pipefail
          mkdir -p bubbles-browser-runtime-output
          python -m bubbles.browser_runtime_canary \
            --output bubbles-browser-runtime-output/receipt.json

      - name: Enforce no-effect truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          receipt = json.load(open('bubbles-browser-runtime-output/receipt.json', encoding='utf-8'))
          if receipt.get('state') != 'HOSTED_BROWSER_RUNTIME_VERIFIED':
              raise SystemExit('BUBBLES_BROWSER_RUNTIME_NOT_VERIFIED')
          if receipt.get('browser_runtime_verified') is not True:
              raise SystemExit('BROWSER_RUNTIME_FALSE')
          if receipt.get('javascript_execution_verified') is not True:
              raise SystemExit('JAVASCRIPT_EXECUTION_FALSE')
          if receipt.get('dom_readback_verified') is not True:
              raise SystemExit('DOM_READBACK_FALSE')
          if receipt.get('loopback_only') is not True:
              raise SystemExit('LOOPBACK_BOUNDARY_DILUTED')
          if receipt.get('external_network_target_requested') is not False:
              raise SystemExit('UNEXPECTED_EXTERNAL_NETWORK_TARGET')
          if receipt.get('provider_mutation_attempted') is not False:
              raise SystemExit('UNEXPECTED_PROVIDER_MUTATION')
          if receipt.get('secret_values_recorded') is not False:
              raise SystemExit('SECRET_RECORDING_BOUNDARY_DILUTED')
          print('BUBBLES_HOSTED_BROWSER_RUNTIME_VERIFIED')
          PY

      - name: Upload immutable browser runtime receipt
        if: ${{ always() && hashFiles('bubbles-browser-runtime-output/receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-browser-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: bubbles-browser-runtime-output/receipt.json
          if-no-files-found: error
          retention-days: 90
