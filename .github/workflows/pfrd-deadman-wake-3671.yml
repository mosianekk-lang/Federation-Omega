name: PFRD Deadman Wake 3671

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pfrd-deadman-wake-3671.yml"

permissions:
  contents: write

concurrency:
  group: pfrd-deadman-generation-3671
  cancel-in-progress: false

jobs:
  wake-once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Submit generation 3671 exactly once
        shell: bash
        env:
          DEADMAN_URL: https://script.google.com/macros/s/AKfycbyexLOXcQw0kdXnw2XJIplln2HZpzouQcsiOw6v9-RWtSZI1sPHFSXW1OL0RpjI0taLjQ/exec
          SIGNED_BODY_B64: 
        run: |
          set -euo pipefail
          mkdir -p /tmp/pfrd-deadman deployments/pfrd-omega
          python - <<'PY' >/tmp/pfrd-deadman/request.json
          import base64, os
          raw = base64.b64decode(os.environ['SIGNED_BODY_B64'])
          print(raw.decode('utf-8'))
          PY
          REQUEST_SHA=$(sha256sum /tmp/pfrd-deadman/request.json | awk '{print $1}')
          set +e
          HTTP_CODE=$(curl --silent --show-error --location \
            --max-time 180 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/pfrd-deadman/request.json \
            --output /tmp/pfrd-deadman/response.raw \
            --write-out '%{http_code}' \
            "$DEADMAN_URL")
          CURL_RC=$?
          set -e
          export HTTP_CODE CURL_RC REQUEST_SHA
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          raw_path = Path('/tmp/pfrd-deadman/response.raw')
          raw = raw_path.read_text(encoding='utf-8', errors='replace') if raw_path.exists() else ''
          try:
              response = json.loads(raw) if raw else None
          except Exception:
              response = {'unparsed_text': raw[:4000]}

          curl_rc = int(os.environ['CURL_RC'])
          http_code = os.environ.get('HTTP_CODE', '')
          status = response.get('status') if isinstance(response, dict) else None
          if curl_rc != 0:
              classification = 'EXECUTION_UNCERTAIN_NO_AUTOMATIC_RETRY'
          elif http_code not in {'200', '302'}:
              classification = 'PROVIDER_HTTP_FAILURE'
          elif status == 'DEADMAN_SEMANTIC_EXECUTION_VERIFIED':
              classification = 'DEADMAN_GENERATION_EXECUTED_AND_ROTATED'
          elif status == 'DEADMAN_REPLAY_DEDUPLICATED':
              classification = 'DEADMAN_GENERATION_ALREADY_EXECUTED_NO_SIDE_EFFECT_REPEAT'
          elif status == 'DEADMAN_REPLAY_REJECTED':
              classification = 'DEADMAN_GENERATION_REJECTED_STALE_OR_OUT_OF_SEQUENCE'
          else:
              classification = 'DEADMAN_RESPONSE_NOT_SEMANTICALLY_VERIFIED'

          receipt = {
              'receipt': 'PFRD-DEADMAN-WAKE-3671',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'generation': 3671,
              'request_sha256': os.environ['REQUEST_SHA'],
              'signature_recorded': False,
              'automatic_retry_performed': False,
              'curl_exit_code': curl_rc,
              'http_code': http_code,
              'response': response,
              'classification': classification,
          }
          out = Path('deployments/pfrd-omega/DEADMAN_WAKE_3671_RECEIPT.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('/tmp/pfrd-deadman/DEADMAN_WAKE_3671_RECEIPT.json').write_text(out.read_text(), encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist wake receipt
        run: |
          set -euo pipefail
          git config user.name "pfrd-deadman-wake[bot]"
          git config user.email "pfrd-deadman-wake[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add deployments/pfrd-omega/DEADMAN_WAKE_3671_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record PFRD deadman generation 3671 receipt"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pfrd-deadman-wake-3671
          if-no-files-found: error
          retention-days: 30
          path: /tmp/pfrd-deadman/DEADMAN_WAKE_3671_RECEIPT.json
