name: Package FO Offline Whisper Small

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fo-offline-whisper-small-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-whisper-small:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download official Whisper small.en weights
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/fo-offline-whisper-small
          mkdir -p "$ROOT"
          python -m pip install --quiet openai-whisper
          python - <<'PY' > /tmp/whisper_small_url.txt
          import whisper
          print(whisper._MODELS['small.en'])
          PY
          MODEL_URL="$(cat /tmp/whisper_small_url.txt)"
          curl --fail --location --retry 4 --retry-delay 3 \
            --output "$ROOT/small.en.pt" "$MODEL_URL"
          printf '%s\n' "$MODEL_URL" > "$ROOT/model-source-url.txt"
          sha256sum "$ROOT/small.en.pt" > "$ROOT/model.sha256"
          stat -c '%s' "$ROOT/small.en.pt" > "$ROOT/model.size"

      - uses: actions/upload-artifact@v7
        with:
          name: fo-offline-whisper-small-en-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: /tmp/fo-offline-whisper-small/
