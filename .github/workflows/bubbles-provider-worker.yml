name: Bubbles Provider Worker

on:
  workflow_run:
    workflows: ["Bubbles Command Bus"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: bubbles-provider-worker-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  google-cloud-wif-plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate default-branch provider context and Bubbles handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          mkdir -p provider-input provider-output
          gh api "/repos/${REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/artifacts" > /tmp/bubbles-artifacts.json
          python - "$ORIGIN_RUN_ID" <<'PY' > /tmp/bubbles-artifact-id.txt
          import json, sys
          run_id = sys.argv[1]
          payload = json.load(open('/tmp/bubbles-artifacts.json', encoding='utf-8'))
          expected_prefix = f'bubbles-command-receipt-{run_id}-'
          rows = [item for item in payload.get('artifacts', []) if item.get('name', '').startswith(expected_prefix)]
          if len(rows) != 1:
              raise SystemExit(f'Expected exactly one Bubbles command receipt artifact, found {len(rows)}')
          print(rows[0]['id'])
          PY
          ARTIFACT_ID="$(cat /tmp/bubbles-artifact-id.txt)"
          gh api "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/bubbles-handoff.zip
          test "$(unzip -Z1 /tmp/bubbles-handoff.zip)" = "receipt.json"
          unzip -q /tmp/bubbles-handoff.zip -d provider-input
          python -m bubbles.provider_worker validate \
            --event "$GITHUB_EVENT_PATH" \
            --handoff provider-input/receipt.json \
            --output provider-output/validated-handoff.json

      - name: Authenticate to Google Cloud through repository-scoped WIF
        id: google_auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: sov-hybrid-suite
          workload_identity_provider: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
          service_account: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        id: setup_gcloud
        if: steps.google_auth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: sov-hybrid-suite

      - name: Execute read-only WIF and provider inventory plan
        id: wif_plan
        if: steps.google_auth.outcome == 'success' && steps.setup_gcloud.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./ops/bootstrap_github_wif.sh --plan | tee provider-output/wif-plan.log
          tail -n 1 provider-output/wif-plan.log > provider-output/wif-plan.json
          python -c "import json; json.load(open('provider-output/wif-plan.json', encoding='utf-8'))"

      - name: Synthesize provider-native readback receipt
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.google_auth.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_gcloud.outcome }}
          PLAN_OUTCOME: ${{ steps.wif_plan.outcome }}
        shell: bash
        run: |
          set -u
          auth="${AUTH_OUTCOME:-skipped}"
          setup="${SETUP_OUTCOME:-skipped}"
          plan="${PLAN_OUTCOME:-skipped}"
          args=(
            --validation provider-output/validated-handoff.json
            --auth-outcome "$auth"
            --setup-outcome "$setup"
            --plan-outcome "$plan"
            --provider-run-id "$GITHUB_RUN_ID"
            --provider-ref "$GITHUB_REF"
            --output provider-output/provider-receipt.json
          )
          if [[ -f provider-output/wif-plan.json ]]; then
            args+=(--plan provider-output/wif-plan.json)
          fi
          if ! python -m bubbles.provider_worker synthesize "${args[@]}"; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('provider-output/provider-receipt.json').write_text(json.dumps({
              'schema': 'BUBBLES-PROVIDER-READBACK-V1',
              'state': 'FAILURE',
              'mutation_performed': False,
              'reason': 'Provider receipt synthesis failed closed.',
              'truth_boundary': 'No Google mutation was requested or performed.'
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          fi

      - name: Upload immutable provider readback receipt
        if: always() && hashFiles('provider-output/provider-receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-provider-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-output/provider-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce provider readback result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          receipt = json.load(open('provider-output/provider-receipt.json', encoding='utf-8'))
          print(json.dumps(receipt, sort_keys=True))
          if receipt.get('state') != 'SUCCESS':
              raise SystemExit(1)
          if receipt.get('mutation_performed') is not False:
              raise SystemExit('Mutation flag was not false')
          PY
