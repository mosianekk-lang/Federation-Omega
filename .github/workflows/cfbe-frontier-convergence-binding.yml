name: CFBE Frontier Convergence Binding

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfbe-frontier-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify CFBE Frontier Convergence receiver-local proof binding
        run: python -m unittest discover -s tests -p 'test_cfbe_frontier_convergence_binding.py' -v
