name: Live Bible Capture Fabric v2

on:
  pull_request:
    paths:
      - "live_bible_capture/releases/v2.0.0/**"
      - ".github/workflows/live-bible-capture-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify and test exact source release
        run: python live_bible_capture/releases/v2.0.0/verify_release.py --run-tests
      - name: Enforce authority and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('live_bible_capture/releases/v2.0.0')
          d = json.loads((root / 'release_descriptor.json').read_text())
          a = json.loads((root / 'ACCEPTANCE.json').read_text())
          assert d['authority_ceiling'] == 'A1_REVERSIBLE_INTERNAL'
          assert d['external_effects'] == 0
          assert a['external_effects'] == 0
          assert 'No source adapter means no message capture' in d['truth_boundary']
          print('LIVE_BIBLE_NO_EFFECT_BOUNDARY_OK')
          PY
