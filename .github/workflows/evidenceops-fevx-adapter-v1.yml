name: EvidenceOps FEVX CSE Read-Only Adapter

on:
  pull_request:
    branches: ["main"]
    paths:
      - "evidenceops/fevx_adapter_v1/**"
      - "evidenceops/fevx_mcoe/**"
      - "evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json"
      - "evidenceops/runtime_service/active_manifest.json"
      - "runtime/evidenceops_fevx_adapter/**"
      - ".github/workflows/evidenceops-fevx-adapter-v1.yml"
  push:
    branches: ["main"]
    paths:
      - "evidenceops/fevx_adapter_v1/**"
      - "evidenceops/fevx_mcoe/**"
      - "evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json"
      - "evidenceops/runtime_service/active_manifest.json"
      - "runtime/evidenceops_fevx_adapter/queue/**"
      - "runtime/evidenceops_fevx_adapter/state/desired_state.json"
      - ".github/workflows/evidenceops-fevx-adapter-v1.yml"
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidenceops-fevx-adapter-v1
  cancel-in-progress: false

env:
  CSE_WHEEL_SHA256: 8c2832a9cd844af62a5fd403038bc2cebca4aa8967826295b34b6c9660c83022
  CSE_WHEEL_PATH: /tmp/fevx_cognitive_sovereignty_ecology-1.1.0-py3-none-any.whl
  PYTHONPATH: .:systems/fevx-frontier-v2

jobs:
  provider-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and verify exact CSE v1.1 wheel
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            systems/fevx-cse-runtime/vendor/wheel.part.00
            systems/fevx-cse-runtime/vendor/wheel.part.01
            systems/fevx-cse-runtime/vendor/wheel.part.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.00
            systems/fevx-cse-runtime/vendor/wheel.part.03.01
            systems/fevx-cse-runtime/vendor/wheel.part.03.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.03
            systems/fevx-cse-runtime/vendor/wheel.part.04.00
            systems/fevx-cse-runtime/vendor/wheel.part.04.01
            systems/fevx-cse-runtime/vendor/wheel.part.04.02
            systems/fevx-cse-runtime/vendor/wheel.part.04.03
            systems/fevx-cse-runtime/vendor/wheel.part.05
            systems/fevx-cse-runtime/vendor/wheel.part.06.00
            systems/fevx-cse-runtime/vendor/wheel.part.06.01
            systems/fevx-cse-runtime/vendor/wheel.part.06.02
            systems/fevx-cse-runtime/vendor/wheel.part.06.03
            systems/fevx-cse-runtime/vendor/wheel.part.07
          )
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" | base64 --decode > "$CSE_WHEEL_PATH"
          observed="$(sha256sum "$CSE_WHEEL_PATH" | awk '{print $1}')"
          test "$observed" = "$CSE_WHEEL_SHA256"
          python -m zipfile -t "$CSE_WHEEL_PATH"
          python -m pip install --disable-pip-version-check "$CSE_WHEEL_PATH"

      - name: Validate typed contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in (
              Path('evidenceops/fevx_adapter_v1/contracts/input-v1.schema.json'),
              Path('evidenceops/fevx_adapter_v1/contracts/output-v1.schema.json'),
          ):
              schema=json.loads(path.read_text())
              Draft202012Validator.check_schema(schema)
          PY

      - name: Run adapter boundary tests
        run: python -m unittest discover -s evidenceops/fevx_adapter_v1/tests -v

      - name: Execute actual twenty-module provider canary
        run: |
          python evidenceops/fevx_adapter_v1/run_provider_canary.py \
            --repo-root . \
            --runtime-root runtime/evidenceops_fevx_adapter

      - name: Enforce integration proof gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/evidenceops_fevx_adapter')
          result=json.loads((root/'results/latest.json').read_text())
          heartbeat=json.loads((root/'heartbeat/latest.json').read_text())
          drift=json.loads((root/'drift/latest.json').read_text())
          actual=json.loads((root/'state/actual_state.json').read_text())
          assert result['status']=='VERIFIED', result
          assert result['provider']=='github_actions', result
          assert result['combined_module_count']==20, result
          assert result['checks_passed']==result['check_count']==20, result
          assert result['idempotent_recurrence'] is True, result
          assert result['rollback_test'] is True and result['reapply_test'] is True, result
          assert result['integrity']['status']=='PASSED', result
          assert result['external_effect'] is False, result
          assert result['source_write'] is False, result
          assert result['verified_fact_write'] is False, result
          assert result['cross_case_access'] is False, result
          assert result['level_6_eligible'] is False, result
          assert result['real_case_accuracy_evidence'] is False, result
          assert actual['integration_state']=='PROVIDER_VERIFIED_SUPERVISED_READ_ONLY_ANALYTICAL_SERVICE', actual
          assert actual['evidenceops_adapter_level']==4, actual
          assert actual['cse_provider_level']==5, actual
          assert heartbeat['verified'] is True and heartbeat['runtime_state']=='OPERATIONAL', heartbeat
          assert drift['classification']=='IN_SYNC', drift
          PY

      - name: Persist canonical adapter state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "evidenceops-fevx-adapter[bot]"
          git config user.email "evidenceops-fevx-adapter[bot]@users.noreply.github.com"
          git add runtime/evidenceops_fevx_adapter
          if git diff --cached --quiet; then
            echo "Verified EvidenceOps FEVX state already canonical"
          else
            git commit -m "Persist EvidenceOps FEVX adapter proof [skip evidenceops-fevx]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidenceops-fevx-adapter-v1-provider-evidence
          path: runtime/evidenceops_fevx_adapter/
          if-no-files-found: error
          retention-days: 90
