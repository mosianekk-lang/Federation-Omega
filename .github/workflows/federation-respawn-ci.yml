name: Federation Respawn CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'respawn/**'
      - '.github/workflows/federation-respawn-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: respawn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
