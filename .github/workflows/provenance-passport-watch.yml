name: Provenance Passport Health Watch

on:
  push:
    branches: [main]
    paths:
      - 'evidenceops/provenance_passport/**'
      - 'tests/test_provenance_passport.py'
      - '.github/workflows/provenance-passport-watch.yml'
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provenance-passport-health-watch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout run revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Provenance Passport regression tests
        run: python -m unittest tests.test_provenance_passport -v

      - name: Execute controlled tamper and recovery drill
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          from evidenceops.provenance_passport.core import validate_passport

          fixture_path = Path('evidenceops/provenance_passport/fixtures/synthetic-odd-passport.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))

          baseline = validate_passport(fixture)
          if not baseline.valid:
              raise SystemExit('Baseline passport failed validation')

          tampered = deepcopy(fixture)
          tampered['files'][0]['sha256'] = '0' * 64
          tamper_result = validate_passport(tampered)
          if tamper_result.valid:
              raise SystemExit('Controlled tamper was not detected')

          recovered = validate_passport(fixture)
          if not recovered.valid:
              raise SystemExit('Recovery from canonical fixture failed')

          monitoring_dir = Path('evidenceops/provenance_passport/monitoring')
          monitoring_dir.mkdir(parents=True, exist_ok=True)
          health_path = monitoring_dir / 'latest_health.json'
          first_receipt_path = monitoring_dir / 'first_successful_workflow_receipt.json'

          health = {
              'lane_id': 'LANE-PROVENANCE-PASSPORT',
              'workflow': '.github/workflows/provenance-passport-watch.yml',
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'workflow_run_attempt': os.environ['WORKFLOW_RUN_ATTEMPT'],
              'workflow_event': os.environ['WORKFLOW_EVENT'],
              'source_sha': os.environ['SOURCE_SHA'],
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'regression_tests': 'PASSED',
              'baseline_validation': 'PASSED',
              'controlled_tamper_detection': 'PASSED',
              'controlled_recovery': 'PASSED',
              'proofs_checked': recovered.proofs_checked,
              'receipt_status': recovered.receipt_status,
              'public_provider_identifier_persisted': False,
              'status': 'PASS',
          }
          canonical = json.dumps(health, sort_keys=True, separators=(',', ':')).encode()
          health['health_sha256'] = hashlib.sha256(canonical).hexdigest()
          health_path.write_text(json.dumps(health, indent=2) + '\n', encoding='utf-8')

          if not first_receipt_path.exists():
              first_receipt = {
                  'lane_id': health['lane_id'],
                  'workflow': health['workflow'],
                  'first_successful_run_id': health['workflow_run_id'],
                  'source_sha': health['source_sha'],
                  'observed_at': health['observed_at'],
                  'health_sha256': health['health_sha256'],
                  'result': 'EXTERNAL_CI_TAMPER_RECOVERY_VERIFIED',
              }
              receipt_canonical = json.dumps(first_receipt, sort_keys=True, separators=(',', ':')).encode()
              first_receipt['receipt_sha256'] = hashlib.sha256(receipt_canonical).hexdigest()
              first_receipt_path.write_text(json.dumps(first_receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: provenance-passport-health
          path: evidenceops/provenance_passport/monitoring/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist durable monitoring readback
        run: |
          git config user.name "provenance-passport-health-watch"
          git config user.email "actions@users.noreply.github.com"
          git add evidenceops/provenance_passport/monitoring/latest_health.json
          git add evidenceops/provenance_passport/monitoring/first_successful_workflow_receipt.json
          git diff --cached --quiet || git commit -m "Record Provenance Passport health assessment"
          git pull --rebase
          git push
