name: Package FO Faster Whisper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fo-faster-whisper-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build offline runtime and model package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/fo-faster-whisper
          mkdir -p "$ROOT/wheels" "$ROOT/model"
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: --dest "$ROOT/wheels" \
            faster-whisper ctranslate2 tokenizers huggingface-hub av onnxruntime \
            tqdm pyyaml requests filelock fsspec packaging numpy protobuf \
            coloredlogs flatbuffers humanfriendly setuptools
          python -m pip install --quiet --only-binary=:all: \
            faster-whisper huggingface-hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-base.en',
              local_dir='/tmp/fo-faster-whisper/model',
              local_dir_use_symlinks=False,
              allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json']
          )
          PY
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          du -sh "$ROOT"

      - uses: actions/upload-artifact@v7
        with:
          name: fo-faster-whisper-base-en-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: /tmp/fo-faster-whisper/
