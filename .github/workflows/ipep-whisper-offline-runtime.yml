name: Package IPEP Offline Whisper Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipep-whisper-offline-runtime.yml'
      - 'ipep/audio_engine_v2/offline-runtime-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipep-whisper-offline-runtime
  cancel-in-progress: false

env:
  WHISPER_CPP_VERSION: v1.9.1
  WHISPER_BINARY_SHA256: f3bf3b4369a99b54665b0f19b88483b30de27f25963b0414235dea03198515c5
  MODEL_NAME: ggml-tiny.en-q5_1.bin
  MODEL_SHA256: c77c5766f1cef09b6b7d47f21b546cbddd4157886b3b5d6d4f709e91e66c7c2b
  VAD_NAME: ggml-silero-v6.2.0.bin

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify official whisper.cpp Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ipep-whisper/runtime/bin /tmp/ipep-whisper/runtime/models deployment_receipts
          BINARY_URL="https://github.com/ggml-org/whisper.cpp/releases/download/${WHISPER_CPP_VERSION}/whisper-bin-ubuntu-x64.tar.gz"
          curl --fail --location --retry 4 --retry-delay 3 "$BINARY_URL" -o /tmp/whisper-bin.tar.gz
          echo "${WHISPER_BINARY_SHA256}  /tmp/whisper-bin.tar.gz" | sha256sum -c -
          tar -xzf /tmp/whisper-bin.tar.gz -C /tmp/ipep-whisper/runtime/bin
          test -n "$(find /tmp/ipep-whisper/runtime/bin -type f -name whisper-cli -print -quit)"

      - name: Download verified tiny English model and Silero VAD
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/c521a4b02f422512d734391fdf08bb08c0862f68/${MODEL_NAME}?download=true"
          VAD_URL="https://huggingface.co/ggml-org/whisper-vad/resolve/main/${VAD_NAME}?download=true"
          curl --fail --location --retry 4 --retry-delay 3 "$MODEL_URL" -o "/tmp/ipep-whisper/runtime/models/${MODEL_NAME}"
          echo "${MODEL_SHA256}  /tmp/ipep-whisper/runtime/models/${MODEL_NAME}" | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 3 "$VAD_URL" -o "/tmp/ipep-whisper/runtime/models/${VAD_NAME}"
          test "$(stat -c '%s' "/tmp/ipep-whisper/runtime/models/${VAD_NAME}")" -gt 500000

      - name: Build immutable runtime package and receipt
        shell: bash
        run: |
          set -euo pipefail
          CLI=$(find /tmp/ipep-whisper/runtime/bin -type f -name whisper-cli -print -quit)
          chmod +x "$CLI"
          "$CLI" --help >/tmp/whisper-help.txt 2>&1 || true
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/ipep-whisper/runtime')
          model=root/'models'/os.environ['MODEL_NAME']
          vad=root/'models'/os.environ['VAD_NAME']
          cli=next(root.glob('bin/**/whisper-cli'))
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          manifest={
              'contract':'IPEP_OFFLINE_WHISPER_RUNTIME_V3',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'whisper_cpp_version':os.environ['WHISPER_CPP_VERSION'],
              'binary_archive_sha256':os.environ['WHISPER_BINARY_SHA256'],
              'cli_relative_path':str(cli.relative_to(root)),
              'cli_sha256':sha(cli),
              'model_name':model.name,
              'model_size_bytes':model.stat().st_size,
              'model_sha256':sha(model),
              'vad_name':vad.name,
              'vad_size_bytes':vad.stat().st_size,
              'vad_sha256':sha(vad),
              'intended_use':'bulk first-pass transcription; re-transcribe material passages with base or small model',
              'evidence_included':False,
              'credentials_included':False,
              'truth_boundary':'Runtime, tiny English model and VAD only; no transcript or provider execution claim.'
          }
          (root/'runtime-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          Path('deployment_receipts/ipep-whisper-offline-runtime-latest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          cd /tmp/ipep-whisper
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf ipep-whisper-offline-runtime.tar.gz runtime
          sha256sum ipep-whisper-offline-runtime.tar.gz | tee ipep-whisper-offline-runtime.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ipep-whisper-offline-runtime-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            /tmp/ipep-whisper/ipep-whisper-offline-runtime.tar.gz
            /tmp/ipep-whisper/ipep-whisper-offline-runtime.tar.gz.sha256
            deployment_receipts/ipep-whisper-offline-runtime-latest.json
