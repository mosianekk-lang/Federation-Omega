name: Bubbles Provider Authority Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bubbles-provider-authority-recovery-probe.yml'
      - 'ops/provider_authority_readonly_probe.py'
      - 'tests/test_phoenix_provider_cutover_v3_provider_authority_probe_containment.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bubbles-provider-authority-recovery-probe
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  EXPECTED_PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  DEFAULT_WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEFAULT_DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_REPOSITORY_WIF_PAIR: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '') && (secrets.GCP_SERVICE_ACCOUNT != '' || vars.GCP_SERVICE_ACCOUNT != '') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Try repository WIF binding
        id: auth_repository_wif
        if: ${{ env.HAS_REPOSITORY_WIF_PAIR == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Try canonical WIF binding
        id: auth_canonical_wif
        if: ${{ steps.auth_repository_wif.outcome != 'success' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ env.DEFAULT_DEPLOYER_SA }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run artifact-only read-only authority probe
        id: provider_probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf provider-authority-output
          python ops/provider_authority_readonly_probe.py \
            --project-id "${PROJECT_ID}" \
            --expected-project-number "${EXPECTED_PROJECT_NUMBER}" \
            --region "${REGION}" \
            --output provider-authority-output/receipt.json

      - name: Publish proof summary
        if: always() && hashFiles('provider-authority-output/receipt.json') != ''
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          data = json.load(open(
              "provider-authority-output/receipt.json",
              encoding="utf-8",
          ))
          print("## Bubbles Provider Authority Recovery Probe")
          print(f"- status: `{data['status']}`")
          print(f"- classification: `{data['classification']}`")
          print(
              "- provider_authenticated: "
              f"`{data['provider_authenticated']}`"
          )
          print(
              "- actual_project_number: "
              f"`{data.get('actual_project_number')}`"
          )
          print(
              "- provider_mutation_attempted: "
              f"`{data['provider_mutation_attempted']}`"
          )
          print(
              "- source_write_attempted: "
              f"`{data['source_write_attempted']}`"
          )
          print(
              "- secret_values_accessed: "
              f"`{data['secret_values_accessed']}`"
          )
          PY

      - name: Upload immutable redacted authority receipt
        if: always() && hashFiles('provider-authority-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-provider-authority-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-authority-output/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce canonical provider proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f provider-authority-output/receipt.json
          python - <<'PY'
          import json
          data = json.load(open(
              "provider-authority-output/receipt.json",
              encoding="utf-8",
          ))
          assert data["provider_mutation_attempted"] is False
          assert data["source_write_attempted"] is False
          assert data["secret_values_accessed"] is False
          assert data["credential_values_recorded"] is False
          if data["status"] != "VERIFIED":
              raise SystemExit(
                  "Provider authority remains blocked: "
                  + data["classification"]
              )
          if data["actual_project_number"] != "257649435135":
              raise SystemExit("Canonical project-number readback failed")
          PY
