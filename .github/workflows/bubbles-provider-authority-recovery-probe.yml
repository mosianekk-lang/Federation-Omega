name: Bubbles Provider Authority Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bubbles-provider-authority-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bubbles-provider-authority-recovery-probe
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  EXPECTED_PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app
  ARCHON_ADMIN_URL: https://archon-admin-plane-7ujkyfl36q-bq.a.run.app
  DEFAULT_WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEFAULT_DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
      HAS_GOOGLE_GHA_CREDS_JSON: ${{ secrets.GOOGLE_GHA_CREDS_JSON != '' }}
      HAS_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS != '' }}
      HAS_GCP_WIF_PAIR: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '') && (secrets.GCP_SERVICE_ACCOUNT != '' || vars.GCP_SERVICE_ACCOUNT != '') }}
      HAS_GENERIC_WIF_PAIR: ${{ (secrets.WIF_PROVIDER != '' || vars.WIF_PROVIDER != '') && (secrets.DEPLOYER_SA != '' || vars.DEPLOYER_SA != '') }}
      HAS_DIRECT_FO_TOKEN: ${{ secrets.FO_ADMIN_TOKEN != '' }}
      HAS_DIRECT_ARCHON_TOKEN: ${{ secrets.ARCHON_ADMIN_TOKEN != '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Try GCP_SA_KEY
        id: auth_gcp_sa
        if: ${{ env.HAS_GCP_SA_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Try GCP_SERVICE_ACCOUNT_KEY
        id: auth_gcp_service
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && env.HAS_GCP_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Try GOOGLE_CREDENTIALS
        id: auth_google_credentials
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && env.HAS_GOOGLE_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Try GOOGLE_SERVICE_ACCOUNT_KEY
        id: auth_google_sa
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Try GCP_CREDENTIALS
        id: auth_gcp_credentials
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && env.HAS_GCP_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Try GOOGLE_GHA_CREDS_JSON
        id: auth_gha_json
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && steps.auth_gcp_credentials.outcome != 'success' && env.HAS_GOOGLE_GHA_CREDS_JSON == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_GHA_CREDS_JSON }}

      - name: Try GOOGLE_CLOUD_CREDENTIALS
        id: auth_cloud_credentials
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && steps.auth_gcp_credentials.outcome != 'success' && steps.auth_gha_json.outcome != 'success' && env.HAS_GOOGLE_CLOUD_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Try repository GCP WIF pair
        id: auth_repo_wif
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && steps.auth_gcp_credentials.outcome != 'success' && steps.auth_gha_json.outcome != 'success' && steps.auth_cloud_credentials.outcome != 'success' && env.HAS_GCP_WIF_PAIR == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Try generic WIF pair
        id: auth_generic_wif
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && steps.auth_gcp_credentials.outcome != 'success' && steps.auth_gha_json.outcome != 'success' && steps.auth_cloud_credentials.outcome != 'success' && steps.auth_repo_wif.outcome != 'success' && env.HAS_GENERIC_WIF_PAIR == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA || vars.DEPLOYER_SA }}

      - name: Try canonical WIF fallback
        id: auth_canonical_wif
        if: ${{ steps.auth_gcp_sa.outcome != 'success' && steps.auth_gcp_service.outcome != 'success' && steps.auth_google_credentials.outcome != 'success' && steps.auth_google_sa.outcome != 'success' && steps.auth_gcp_credentials.outcome != 'success' && steps.auth_gha_json.outcome != 'success' && steps.auth_cloud_credentials.outcome != 'success' && steps.auth_repo_wif.outcome != 'success' && steps.auth_generic_wif.outcome != 'success' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ env.DEFAULT_DEPLOYER_SA }}

      - name: Install gcloud
        id: setup_gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run proof-only provider authority scan
        if: always()
        shell: bash
        env:
          DIRECT_FO_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
          DIRECT_ARCHON_TOKEN: ${{ secrets.ARCHON_ADMIN_TOKEN }}
          AUTH_GCP_SA: ${{ steps.auth_gcp_sa.outcome }}
          AUTH_GCP_SERVICE: ${{ steps.auth_gcp_service.outcome }}
          AUTH_GOOGLE_CREDENTIALS: ${{ steps.auth_google_credentials.outcome }}
          AUTH_GOOGLE_SA: ${{ steps.auth_google_sa.outcome }}
          AUTH_GCP_CREDENTIALS: ${{ steps.auth_gcp_credentials.outcome }}
          AUTH_GHA_JSON: ${{ steps.auth_gha_json.outcome }}
          AUTH_CLOUD_CREDENTIALS: ${{ steps.auth_cloud_credentials.outcome }}
          AUTH_REPO_WIF: ${{ steps.auth_repo_wif.outcome }}
          AUTH_GENERIC_WIF: ${{ steps.auth_generic_wif.outcome }}
          AUTH_CANONICAL_WIF: ${{ steps.auth_canonical_wif.outcome }}
          SETUP_GCLOUD: ${{ steps.setup_gcloud.outcome }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p provider-authority-output /tmp/provider-authority
          python - <<'PY'
          from __future__ import annotations
          import json, os, shutil, subprocess, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          project=os.environ['PROJECT_ID']; region=os.environ['REGION']
          operator=os.environ['OPERATOR_URL'].rstrip('/'); archon=os.environ['ARCHON_ADMIN_URL'].rstrip('/')

          def run(args: list[str], timeout: int=40) -> dict[str,Any]:
              if shutil.which(args[0]) is None:
                  return {'ok':False,'exit_code':127,'stdout':'','stderr':f'{args[0]} unavailable'}
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
                  return {'ok':p.returncode==0,'exit_code':p.returncode,'stdout':p.stdout.strip()[:12000],'stderr':p.stderr.strip()[:4000]}
              except Exception as exc:
                  return {'ok':False,'exit_code':126,'stdout':'','stderr':f'{type(exc).__name__}: {exc}'}

          def gcloud(*args: str) -> dict[str,Any]:
              return run(['gcloud',*args,'--project',project])

          def parse_json(result: dict[str,Any]) -> Any:
              try: return json.loads(result.get('stdout') or '{}')
              except Exception: return {}

          account=run(['gcloud','auth','list','--filter=status:ACTIVE','--format=value(account)'])
          access_test=run(['gcloud','auth','print-access-token'])
          provider_authenticated=bool(account.get('ok') and account.get('stdout') and access_test.get('ok') and access_test.get('stdout'))
          # Never retain an access token in the receipt.
          access_test={'ok':access_test.get('ok',False),'exit_code':access_test.get('exit_code'),'stderr':access_test.get('stderr','')[:1200]}

          project_read=gcloud('projects','describe',project,'--format=json(projectId,projectNumber,lifecycleState)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}
          canonical_wif=gcloud('iam','workload-identity-pools','providers','describe','github','--workload-identity-pool','github-federation-omega','--location','global','--format=json(name,state,attributeCondition,attributeMapping)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          service_accounts={}
          for email in [
              'superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com',
              'fo-operator-sa@sov-hybrid-suite.iam.gserviceaccount.com',
              'afeme-sovereign-runtime-v4@sov-hybrid-suite.iam.gserviceaccount.com',
              'fo-automation-agent@sov-hybrid-suite.iam.gserviceaccount.com',
          ]:
              service_accounts[email]=gcloud('iam','service-accounts','describe',email,'--format=json(email,disabled,oauth2ClientId)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          api_states={}
          for api in ['serviceusage.googleapis.com','script.googleapis.com','secretmanager.googleapis.com','run.googleapis.com','cloudbuild.googleapis.com','artifactregistry.googleapis.com']:
              api_states[api]=gcloud('services','describe',api,'--format=json(config.name,state)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          cloud_run={}
          for service in ['architron9','federation-omega-operator','afeme-sovereign-control-plane-v4']:
              cloud_run[service]=gcloud('run','services','describe',service,'--region',region,'--format=json(metadata.name,status.url,status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          secret_metadata={}
          for secret in ['fo-operator-admin-token','archon-admin-plane-token']:
              secret_metadata[secret]=gcloud('secrets','describe',secret,'--format=json(name,createTime,replication)') if provider_authenticated else {'ok':False,'skipped':'NO_VALID_PROVIDER_AUTH'}

          fo_token=os.environ.get('DIRECT_FO_TOKEN','').strip()
          archon_token=os.environ.get('DIRECT_ARCHON_TOKEN','').strip()
          fo_source='github_actions_secret' if fo_token else ''
          archon_source='github_actions_secret' if archon_token else ''

          if provider_authenticated and not fo_token:
              got=gcloud('secrets','versions','access','latest','--secret=fo-operator-admin-token')
              if got.get('ok') and got.get('stdout'):
                  fo_token=got['stdout'].strip(); fo_source='google_secret_manager'
          if provider_authenticated and not archon_token:
              got=gcloud('secrets','versions','access','latest','--secret=archon-admin-plane-token')
              if got.get('ok') and got.get('stdout'):
                  archon_token=got['stdout'].strip(); archon_source='google_secret_manager'

          for value in [fo_token,archon_token]:
              if value: print(f'::add-mask::{value}')

          secrets=tuple(v for v in [fo_token,archon_token] if v)
          sensitive_keys={'access_token','refresh_token','id_token','authorization','private_key','private_key_data','secret_value','credentials_json','token'}
          def redact(value: Any) -> Any:
              if isinstance(value,dict):
                  out={}
                  for k,v in value.items():
                      out[k]='[REDACTED]' if str(k).lower() in sensitive_keys else redact(v)
                  return out
              if isinstance(value,list): return [redact(v) for v in value]
              if isinstance(value,str):
                  out=value
                  for secret in secrets: out=out.replace(secret,'[REDACTED]')
                  return out
              return value

          def http(url: str, *, body: dict|None=None, headers: dict|None=None, timeout: int=45) -> dict[str,Any]:
              hs={'accept':'application/json,text/plain,*/*',**(headers or {})}; data=None; method='GET'
              if body is not None:
                  hs['content-type']='application/json'; data=json.dumps(body,separators=(',',':')).encode(); method='POST'
              req=urllib.request.Request(url,data=data,headers=hs,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed={'text':raw[:5000]}
                      return {'http_status':r.status,'body':redact(parsed)}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except Exception: parsed={'text':raw[:5000]}
                  return {'http_status':exc.code,'body':redact(parsed)}
              except Exception as exc:
                  return {'transport_error':type(exc).__name__,'message':str(exc)[:800]}

          operator_public_health=http(operator+'/health')
          operator_public_contract=http(operator+'/')
          operator_status=None; operator_architron=None
          if fo_token:
              h={'x-fo-admin-token':fo_token}
              operator_status=http(operator+'/execute',body={'action':'STATUS','payload':{'purpose':'Bubbles provider authority recovery probe','mutation':'NONE'}},headers=h)
              operator_architron=http(operator+'/execute',body={'action':'READ_CLOUD_RUN_SERVICE','payload':{'project':project,'region':region,'service':'architron9','purpose':'read-only authority recovery'}},headers=h)

          archon_openapi=http(archon+'/openapi.yaml')
          archon_reads={}
          if archon_token:
              h={'Authorization':'Bearer '+archon_token}
              for command,payload in [
                  ('capability_audit',{}),
                  ('project_info',{}),
                  ('iam_policy_read',{}),
                  ('enabled_services_list',{}),
                  ('run_services_list',{'region':region}),
                  ('secrets_list',{}),
              ]:
                  archon_reads[command]=http(archon+'/api/admin/command',body={'command':command,'payload':payload,'source':'bubbles-provider-authority-recovery'},headers=h,timeout=60)

          project_obj=parse_json(project_read) if project_read.get('ok') else {}
          actual_project_number=str(project_obj.get('projectNumber') or '')
          fo_auth_ok=bool(operator_status and operator_status.get('http_status')==200 and operator_status.get('body',{}).get('ok') is True)
          fo_cloud_ok=bool(operator_architron and operator_architron.get('http_status')==200 and operator_architron.get('body',{}).get('ok') is True)
          archon_ok=bool(archon_reads.get('capability_audit',{}).get('http_status')==200)

          auth_outcomes={
              'GCP_SA_KEY':os.environ.get('AUTH_GCP_SA',''),
              'GCP_SERVICE_ACCOUNT_KEY':os.environ.get('AUTH_GCP_SERVICE',''),
              'GOOGLE_CREDENTIALS':os.environ.get('AUTH_GOOGLE_CREDENTIALS',''),
              'GOOGLE_SERVICE_ACCOUNT_KEY':os.environ.get('AUTH_GOOGLE_SA',''),
              'GCP_CREDENTIALS':os.environ.get('AUTH_GCP_CREDENTIALS',''),
              'GOOGLE_GHA_CREDS_JSON':os.environ.get('AUTH_GHA_JSON',''),
              'GOOGLE_CLOUD_CREDENTIALS':os.environ.get('AUTH_CLOUD_CREDENTIALS',''),
              'REPOSITORY_GCP_WIF':os.environ.get('AUTH_REPO_WIF',''),
              'GENERIC_WIF':os.environ.get('AUTH_GENERIC_WIF',''),
              'CANONICAL_WIF':os.environ.get('AUTH_CANONICAL_WIF',''),
          }
          secret_presence={
              'GCP_SA_KEY':os.environ.get('HAS_GCP_SA_KEY')=='true',
              'GCP_SERVICE_ACCOUNT_KEY':os.environ.get('HAS_GCP_SERVICE_ACCOUNT_KEY')=='true',
              'GOOGLE_CREDENTIALS':os.environ.get('HAS_GOOGLE_CREDENTIALS')=='true',
              'GOOGLE_SERVICE_ACCOUNT_KEY':os.environ.get('HAS_GOOGLE_SERVICE_ACCOUNT_KEY')=='true',
              'GCP_CREDENTIALS':os.environ.get('HAS_GCP_CREDENTIALS')=='true',
              'GOOGLE_GHA_CREDS_JSON':os.environ.get('HAS_GOOGLE_GHA_CREDS_JSON')=='true',
              'GOOGLE_CLOUD_CREDENTIALS':os.environ.get('HAS_GOOGLE_CLOUD_CREDENTIALS')=='true',
              'GCP_WIF_PAIR':os.environ.get('HAS_GCP_WIF_PAIR')=='true',
              'GENERIC_WIF_PAIR':os.environ.get('HAS_GENERIC_WIF_PAIR')=='true',
              'FO_ADMIN_TOKEN':os.environ.get('HAS_DIRECT_FO_TOKEN')=='true',
              'ARCHON_ADMIN_TOKEN':os.environ.get('HAS_DIRECT_ARCHON_TOKEN')=='true',
          }

          if provider_authenticated and actual_project_number==os.environ['EXPECTED_PROJECT_NUMBER'] and fo_auth_ok and fo_cloud_ok:
              classification='GOOGLE_AUTH_AND_OPERATOR_READBACK_VERIFIED'
          elif provider_authenticated and actual_project_number==os.environ['EXPECTED_PROJECT_NUMBER']:
              classification='GOOGLE_PROVIDER_AUTH_VERIFIED_OPERATOR_AUTH_PENDING'
          elif fo_auth_ok and fo_cloud_ok:
              classification='OPERATOR_AUTH_VERIFIED_GOOGLE_PROVIDER_AUTH_PENDING'
          else:
              classification='TRUSTED_PROVIDER_AUTHORITY_STILL_BLOCKED'

          receipt={
              'schema':'BUBBLES-PROVIDER-AUTHORITY-RECOVERY-PROBE-V1',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'classification':classification,
              'mutation_attempted':False,
              'provider_authenticated':provider_authenticated,
              'active_account':account.get('stdout') if provider_authenticated else None,
              'access_token_test':access_test,
              'expected_project_id':project,
              'expected_project_number':os.environ['EXPECTED_PROJECT_NUMBER'],
              'actual_project_number':actual_project_number or None,
              'project_read':project_read,
              'canonical_wif_read':canonical_wif,
              'service_accounts':service_accounts,
              'api_states':api_states,
              'cloud_run_services':cloud_run,
              'secret_metadata':secret_metadata,
              'secret_alias_presence':secret_presence,
              'auth_outcomes':auth_outcomes,
              'fo_token_available':bool(fo_token),
              'fo_token_source':fo_source or None,
              'archon_token_available':bool(archon_token),
              'archon_token_source':archon_source or None,
              'operator_public_health':operator_public_health,
              'operator_public_contract':operator_public_contract,
              'operator_authenticated_status':operator_status,
              'operator_architron_read':operator_architron,
              'archon_openapi':archon_openapi,
              'archon_authenticated_reads':archon_reads,
              'secret_values_recorded':False,
              'truth_boundary':'Read-only authority recovery. No IAM, API, deployment, traffic, secret-version, Apps Script, scheduler, or Cloud Run mutation is performed.',
          }
          out=Path('provider-authority-output/receipt.json')
          out.write_text(json.dumps(redact(receipt),indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(redact(receipt),indent=2,sort_keys=True))
          PY

      - name: Publish proof summary
        if: always() && hashFiles('provider-authority-output/receipt.json') != ''
        shell: bash
        run: |
          echo '## Bubbles Provider Authority Recovery Probe' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('provider-authority-output/receipt.json'))
          print(f"- classification: `{d['classification']}`")
          print(f"- provider_authenticated: `{d['provider_authenticated']}`")
          print(f"- actual_project_number: `{d.get('actual_project_number')}`")
          print(f"- fo_token_available: `{d['fo_token_available']}` ({d.get('fo_token_source')})")
          print(f"- archon_token_available: `{d['archon_token_available']}` ({d.get('archon_token_source')})")
          PY

      - name: Upload immutable redacted authority receipt
        if: always() && hashFiles('provider-authority-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-provider-authority-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-authority-output/receipt.json
          if-no-files-found: error
          retention-days: 90
