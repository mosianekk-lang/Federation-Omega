name: EvidenceOps eCertify ZA CI

on:
  pull_request:
    paths:
      - "evidenceops/ecertify_za/**"
      - "tests/test_ecertify*.py"
      - ".github/workflows/ecertify-ci.yml"
  push:
    branches: [main]
    paths:
      - "evidenceops/ecertify_za/**"
      - "tests/test_ecertify*.py"
      - ".github/workflows/ecertify-ci.yml"

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile eCertify source
        run: python -m compileall -q evidenceops/ecertify_za
      - name: Validate deployment shell syntax
        run: bash -n evidenceops/ecertify_za/deployment/deploy_cloud_run_canary.sh
      - name: Run eCertify qualification tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_ecertify*.py' -v
