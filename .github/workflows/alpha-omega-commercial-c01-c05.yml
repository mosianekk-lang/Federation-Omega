name: Alpha Omega Commercial C01-C05 Proof

on:
  pull_request:
    paths:
      - "alpha_omega_commercial/**"
      - ".github/workflows/alpha-omega-commercial-c01-c05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q alpha_omega_commercial
      - name: Unit and boundary tests
        working-directory: alpha_omega_commercial
        run: python -m unittest -v test_commercial_platform.py
      - name: Execute C01-C05 provider proof
        run: python alpha_omega_commercial/prove_c01_c05.py --output alpha_omega_commercial/artifacts/c01-c05
      - name: Verify receipt boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('alpha_omega_commercial/artifacts/c01-c05/commercial-proof-receipt.json').read_text())
          assert receipt['stages']['C01']['status'].endswith('MARKET_PROOF_REQUIRED')
          assert receipt['stages']['C02']['status'] == 'REFERENCE_PROVIDER_VERIFIED'
          assert 'PROVIDER_AUTHORITY_REQUIRED' in receipt['stages']['C03']['status']
          assert receipt['stages']['C04']['proof']['rollback']['exists_after'] is False
          assert 'PAYMENT_PROVIDER_BLOCKED' in receipt['stages']['C05']['status']
          assert receipt['stages']['C05']['proof']['invoice']['status'] == 'INVOICE_READY_NOT_ISSUED'
          PY
      - name: Upload proof package
        uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-commercial-c01-c05-proof
          path: alpha_omega_commercial/artifacts/c01-c05
          retention-days: 90
          if-no-files-found: error
