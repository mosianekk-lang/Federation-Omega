name: Strategic FUSE Apps Script Read — Zero Traffic Candidate

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: strategic-fuse-appsscript-read-zero-traffic
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  REPOSITORY: federation-omega
  OPERATOR_SERVICE: federation-omega-operator
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  CANDIDATE_RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  TARGET_SCRIPT_ID: 1z4wkTnk3TF3NG6T-1f5PsSl08-3SFUQw4STcYwsiPptdGSVrfSE-4r_R
  REQUIRED_ACTION: READ_APPS_SCRIPT_PROJECT_BOUNDED

jobs:
  strategic-read-canary:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] STRATEGIC_FUSE_APPS_SCRIPT_READ_ZERO_TRAFFIC_V1' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fail closed unless owner issue trigger is bound to main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile every embedded Python block before provider work
        run: python -m unittest -v tests/test_strategic_fuse_embedded_python_compile.py

      - name: Authenticate keylessly to the existing Google deployment identity
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Derive provider-native candidate OIDC trust and freeze serving baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/strategic-read
          gcloud run services describe "$OPERATOR_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > /tmp/strategic-read/service-before.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.parse import urlparse

          p = json.loads(Path('/tmp/strategic-read/service-before.json').read_text())
          metadata_name = str(p.get('metadata', {}).get('name') or '').strip()
          assert metadata_name == os.environ['OPERATOR_SERVICE'], 'OPERATOR_SERVICE_IDENTITY_DRIFT'
          containers = p.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [])
          assert containers, 'OPERATOR_CONTAINER_MISSING'
          env_items = containers[0].get('env', [])
          direct = {x.get('name'): x.get('value') for x in env_items if x.get('name') and 'value' in x}
          serving_audience = (direct.get('OPERATOR_AUDIENCE') or '').strip()
          serving_principals = [x.strip().lower() for x in (direct.get('OIDC_ALLOWED_PRINCIPALS') or '').split(',') if x.strip()]
          serving_secret_backed_names = sorted(str(x.get('name') or '') for x in env_items if x.get('valueFrom'))
          canonical_url = str(p.get('status', {}).get('url') or '').strip()
          assert canonical_url, 'OPERATOR_CANONICAL_URL_MISSING'
          parsed = urlparse(canonical_url)
          host = (parsed.hostname or '').lower()
          expected_prefix = os.environ['OPERATOR_SERVICE'].lower() + '-'
          assert parsed.scheme == 'https', 'OPERATOR_CANONICAL_URL_SCHEME_INVALID'
          assert parsed.username is None and parsed.password is None and parsed.port is None, 'OPERATOR_CANONICAL_URL_AUTHORITY_INVALID'
          assert parsed.path in ('', '/') and not parsed.params and not parsed.query and not parsed.fragment, 'OPERATOR_CANONICAL_URL_SHAPE_INVALID'
          assert host.startswith(expected_prefix) and host.endswith('.run.app'), 'OPERATOR_CANONICAL_URL_SERVICE_BINDING_INVALID'
          deployer = os.environ['DEPLOYER_SA'].strip().lower()
          assert deployer.endswith('.iam.gserviceaccount.com'), 'DEPLOYER_SERVICE_ACCOUNT_INVALID'
          candidate_principals = deployer
          host_digest = hashlib.sha256(host.encode('utf-8')).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('OPERATOR_AUDIENCE<<STRATEGIC_AUD_EOF\n' + canonical_url + '\nSTRATEGIC_AUD_EOF\n')
              fh.write('OPERATOR_HOST_SHA256=' + host_digest + '\n')
              fh.write('CANDIDATE_OIDC_ALLOWED_PRINCIPALS=' + candidate_principals + '\n')
              fh.write('SERVING_AUDIENCE_PRESENT=' + ('true' if serving_audience else 'false') + '\n')
              fh.write('SERVING_PRINCIPAL_COUNT=' + str(len(serving_principals)) + '\n')
              fh.write('SERVING_SECRET_BACKED_ENV_COUNT=' + str(len(serving_secret_backed_names)) + '\n')
          serving = sorted(
              ({'revision': x.get('revisionName'), 'percent': int(x.get('percent') or 0)}
               for x in p.get('status', {}).get('traffic', []) if int(x.get('percent') or 0) > 0),
              key=lambda x: (x['revision'] or '', x['percent']))
          raw = json.dumps(serving, sort_keys=True, separators=(',', ':')).encode()
          Path('/tmp/strategic-read/serving-before.json').write_text(json.dumps(serving, sort_keys=True))
          Path('/tmp/strategic-read/serving-before.sha256').write_text(hashlib.sha256(raw).hexdigest())
          PY

      - name: Require exact bounded-read source before any provider build
        run: |
          set -euo pipefail
          test -f ops/federation_omega_operator/Dockerfile
          test -f ops/federation_omega_operator/lib/apps_script_bounded_read.mjs
          grep -q 'READ_APPS_SCRIPT_PROJECT_BOUNDED' ops/federation_omega_operator/lib/contracts.mjs
          grep -q 'executeAppsScriptBoundedReadAction' ops/federation_omega_operator/lib/operator.mjs
          node --check ops/federation_omega_operator/lib/apps_script_bounded_read.mjs
          npm --prefix ops/federation_omega_operator test
          npm --prefix ops/federation_omega_operator run check

      - name: Re-prove existing Artifact Registry writer and candidate runtime actAs authority without IAM mutation
        run: |
          set -euo pipefail
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/strategic-read/project-policy.json
          gcloud artifacts repositories get-iam-policy "$REPOSITORY" \
            --location "$REGION" --project "$PROJECT_ID" --format=json \
            > /tmp/strategic-read/repository-policy.json
          gcloud iam service-accounts describe "$CANDIDATE_RUNTIME_SA" \
            --project "$PROJECT_ID" --format=json > /tmp/strategic-read/runtime-sa.json
          gcloud iam service-accounts get-iam-policy "$CANDIDATE_RUNTIME_SA" \
            --project "$PROJECT_ID" --format=json > /tmp/strategic-read/runtime-sa-policy.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          deployer = 'serviceAccount:' + os.environ['DEPLOYER_SA']
          project = json.loads(Path('/tmp/strategic-read/project-policy.json').read_text())
          repository = json.loads(Path('/tmp/strategic-read/repository-policy.json').read_text())
          runtime = json.loads(Path('/tmp/strategic-read/runtime-sa.json').read_text())
          runtime_policy = json.loads(Path('/tmp/strategic-read/runtime-sa-policy.json').read_text())
          def has(policy, role, member):
              return any(
                  b.get('role') == role and not b.get('condition') and member in (b.get('members') or [])
                  for b in policy.get('bindings') or []
              )
          assert str(runtime.get('email') or '').lower() == os.environ['CANDIDATE_RUNTIME_SA'].lower(), 'CANDIDATE_RUNTIME_IDENTITY_DRIFT'
          writer = has(project, 'roles/artifactregistry.writer', deployer) or has(repository, 'roles/artifactregistry.writer', deployer)
          sa_user = has(project, 'roles/iam.serviceAccountUser', deployer) or has(runtime_policy, 'roles/iam.serviceAccountUser', deployer)
          assert writer, 'ARTIFACT_REGISTRY_WRITER_PREEXISTING_REQUIRED'
          assert sa_user, 'CANDIDATE_RUNTIME_ACTAS_PREEXISTING_REQUIRED'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('ARTIFACT_REGISTRY_WRITER_PREEXISTING=true\n')
              fh.write('CANDIDATE_RUNTIME_ACTAS_PREEXISTING=true\n')
          PY

      - name: Build exact operator locally and push directly to Artifact Registry
        run: |
          set -euo pipefail
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${OPERATOR_SERVICE}:strategic-read-${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --pull \
            --file ops/federation_omega_operator/Dockerfile \
            --tag "$IMAGE_TAG" \
            ops/federation_omega_operator
          docker push "$IMAGE_TAG"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${OPERATOR_SERVICE}@${DIGEST}"
          {
            echo "CANDIDATE_IMAGE=$IMAGE"
            echo "CANDIDATE_DIGEST=$DIGEST"
          } >> "$GITHUB_ENV"

      - name: Deploy tagged zero-traffic candidate with explicit pre-authorized runtime identity
        run: |
          set -euo pipefail
          TAG="strategic-read-${GITHUB_SHA:0:8}"
          gcloud run deploy "$OPERATOR_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$CANDIDATE_IMAGE" --no-traffic --tag "$TAG" \
            --service-account "$CANDIDATE_RUNTIME_SA" \
            --set-env-vars "OPERATOR_AUDIENCE=${OPERATOR_AUDIENCE},OIDC_ALLOWED_PRINCIPALS=${CANDIDATE_OIDC_ALLOWED_PRINCIPALS}" \
            --quiet
          echo "CANDIDATE_TAG=$TAG" >> "$GITHUB_ENV"
          gcloud run services describe "$OPERATOR_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > /tmp/strategic-read/service-candidate.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('/tmp/strategic-read/service-candidate.json').read_text())
          tag = os.environ['CANDIDATE_TAG']
          matches = [x for x in p.get('status', {}).get('traffic', []) if x.get('tag') == tag]
          assert len(matches) == 1, 'TAGGED_CANDIDATE_NOT_UNIQUE'
          item = matches[0]
          assert int(item.get('percent') or 0) == 0, 'CANDIDATE_TRAFFIC_NOT_ZERO'
          assert item.get('revisionName'), 'CANDIDATE_REVISION_MISSING'
          assert item.get('url'), 'CANDIDATE_URL_MISSING'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('CANDIDATE_URL<<STRATEGIC_URL_EOF\n' + item['url'] + '\nSTRATEGIC_URL_EOF\n')
              fh.write('CANDIDATE_REVISION=' + item['revisionName'] + '\n')
          PY

      - name: Prove candidate runtime trust is exact scoped and secretless
        run: |
          set -euo pipefail
          gcloud run revisions describe "$CANDIDATE_REVISION" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > /tmp/strategic-read/revision.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('/tmp/strategic-read/revision.json').read_text())
          spec = p.get('spec', {})
          actual_runtime = str(spec.get('serviceAccountName') or spec.get('serviceAccount') or '').strip().lower()
          assert actual_runtime == os.environ['CANDIDATE_RUNTIME_SA'].lower(), f'CANDIDATE_RUNTIME_IDENTITY_MISMATCH:{actual_runtime}'
          containers = spec.get('containers') or spec.get('template', {}).get('spec', {}).get('containers') or []
          assert containers, 'CANDIDATE_CONTAINER_MISSING'
          env_items = containers[0].get('env', [])
          direct = {x.get('name'): x.get('value') for x in env_items if x.get('name') and 'value' in x}
          secret_backed = [x for x in env_items if x.get('valueFrom')]
          assert not secret_backed, 'CANDIDATE_SECRET_BACKED_ENV_FORBIDDEN'
          assert set(direct) == {'OPERATOR_AUDIENCE', 'OIDC_ALLOWED_PRINCIPALS'}, f'CANDIDATE_ENV_NOT_CLOSED_WORLD:{sorted(direct)}'
          assert (direct.get('OPERATOR_AUDIENCE') or '').strip() == os.environ['OPERATOR_AUDIENCE'], 'CANDIDATE_AUDIENCE_DRIFT'
          allowed = [x.strip().lower() for x in (direct.get('OIDC_ALLOWED_PRINCIPALS') or '').split(',') if x.strip()]
          assert allowed == [os.environ['DEPLOYER_SA'].lower()], 'CANDIDATE_PRINCIPAL_DRIFT'
          PY

      - name: Mint one ephemeral OIDC token and verify STATUS before the Strategic read
        run: |
          set -euo pipefail
          set +x
          TOKEN="$(gcloud auth print-identity-token --audiences="$OPERATOR_AUDIENCE" --include-email)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' '{"action":"STATUS","payload":{}}' > /tmp/strategic-read/status-request.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/strategic-read/status-request.json \
            "$CANDIDATE_URL/execute" > /tmp/strategic-read/status.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/strategic-read/status.json').read_text())
          assert p.get('ok') is True, p
          assert p.get('status') == 'OPERATOR_EXECUTE_READY', p
          assert p.get('authMode') == 'GOOGLE_OIDC_ALLOWLIST', p
          assert str(p.get('principal','')).lower() == os.environ['DEPLOYER_SA'].lower(), p
          PY
          unset TOKEN

      - name: Execute exactly one bounded Strategic Apps Script project read
        run: |
          set -euo pipefail
          set +x
          TOKEN="$(gcloud auth print-identity-token --audiences="$OPERATOR_AUDIENCE" --include-email)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/strategic-read/read-request.json').write_text(json.dumps({
              'action': os.environ['REQUIRED_ACTION'],
              'payload': {'scriptId': os.environ['TARGET_SCRIPT_ID']},
          }, separators=(',', ':')), encoding='utf-8')
          PY
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/strategic-read/read-request.json \
            "$CANDIDATE_URL/execute" > /tmp/strategic-read/read.json
          unset TOKEN
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/strategic-read/read.json').read_text())
          assert p.get('ok') is True, p
          assert p.get('status') == 'APPS_SCRIPT_PROJECT_BOUNDED_READ_VERIFIED', p
          assert p.get('scriptId') == os.environ['TARGET_SCRIPT_ID'], p
          for key in ('rawSourcePersisted','sourceReturned','providerEffect','mutationAttempted','secretValuesRecorded'):
              assert p.get(key) is False, (key,p.get(key))
          assert isinstance(p.get('fileCount'), int) and p['fileCount'] > 0, p
          assert isinstance(p.get('functionCount'), int) and p['functionCount'] > 0, p
          assert isinstance(p.get('projectDigest'), str) and len(p['projectDigest']) == 64, p
          assert isinstance(p.get('requiredFunctionsPresent'), dict), p
          def contains_source(x):
              if isinstance(x, dict):
                  return 'source' in x or any(contains_source(v) for v in x.values())
              if isinstance(x, list): return any(contains_source(v) for v in x)
              return False
          assert not contains_source(p), 'RAW_SOURCE_FIELD_PRESENT'
          PY

      - name: Prove normal serving traffic was unchanged and candidate remains zero traffic
        run: |
          set -euo pipefail
          gcloud run services describe "$OPERATOR_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > /tmp/strategic-read/service-after.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          before = json.loads(Path('/tmp/strategic-read/serving-before.json').read_text())
          p = json.loads(Path('/tmp/strategic-read/service-after.json').read_text())
          after = sorted(
              ({'revision': x.get('revisionName'), 'percent': int(x.get('percent') or 0)}
               for x in p.get('status', {}).get('traffic', []) if int(x.get('percent') or 0) > 0),
              key=lambda x: (x['revision'] or '', x['percent']))
          assert before == after, f'SERVING_TRAFFIC_CHANGED:{before!r}!={after!r}'
          tag = os.environ['CANDIDATE_TAG']
          tagged = [x for x in p.get('status', {}).get('traffic', []) if x.get('tag') == tag]
          assert len(tagged) == 1 and int(tagged[0].get('percent') or 0) == 0, 'CANDIDATE_NOT_ZERO_TRAFFIC_AT_END'
          raw = json.dumps(after, sort_keys=True, separators=(',', ':')).encode()
          Path('/tmp/strategic-read/serving-after.sha256').write_text(hashlib.sha256(raw).hexdigest())
          assert Path('/tmp/strategic-read/serving-before.sha256').read_text() == Path('/tmp/strategic-read/serving-after.sha256').read_text(), 'SERVING_TRAFFIC_DIGEST_CHANGED'
          PY

      - name: Emit bounded no-secret proof receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads(Path('/tmp/strategic-read/status.json').read_text())
          read=json.loads(Path('/tmp/strategic-read/read.json').read_text())
          receipt={
            'schema':'STRATEGIC_FUSE_APPS_SCRIPT_READ_ZERO_TRAFFIC_RECEIPT_V1',
            'source_sha':os.environ['GITHUB_SHA'],
            'operator_service':os.environ['OPERATOR_SERVICE'],
            'operator_audience':os.environ['OPERATOR_AUDIENCE'],
            'operator_host_sha256':os.environ['OPERATOR_HOST_SHA256'],
            'provider_native_audience':True,
            'serving_operator_audience_present':os.environ['SERVING_AUDIENCE_PRESENT'].lower() == 'true',
            'serving_oidc_principal_count':int(os.environ['SERVING_PRINCIPAL_COUNT']),
            'serving_secret_backed_env_count':int(os.environ['SERVING_SECRET_BACKED_ENV_COUNT']),
            'artifact_registry_writer_preexisting':os.environ['ARTIFACT_REGISTRY_WRITER_PREEXISTING'].lower() == 'true',
            'candidate_runtime_service_account':os.environ['CANDIDATE_RUNTIME_SA'],
            'candidate_runtime_actas_preexisting':os.environ['CANDIDATE_RUNTIME_ACTAS_PREEXISTING'].lower() == 'true',
            'image_build_transport':'GITHUB_HOSTED_DOCKER_DIRECT_ARTIFACT_REGISTRY',
            'cloud_build_staging_used':False,
            'candidate_revision':os.environ['CANDIDATE_REVISION'],
            'candidate_tag':os.environ['CANDIDATE_TAG'],
            'candidate_image_digest':os.environ['CANDIDATE_DIGEST'],
            'candidate_traffic_percent':0,
            'candidate_oidc_principal_count':1,
            'candidate_oidc_principal_deployer_only':True,
            'candidate_environment_closed_world':True,
            'candidate_secret_backed_env_count':0,
            'candidate_only_trust_binding':True,
            'service_template_mutation_performed':True,
            'serving_revision_runtime_identity_mutation_performed':False,
            'serving_revision_trust_mutation_performed':False,
            'serving_traffic_unchanged':True,
            'auth_mode':status.get('authMode'),
            'principal':status.get('principal'),
            'action':os.environ['REQUIRED_ACTION'],
            'script_id':read.get('scriptId'),
            'file_count':read.get('fileCount'),
            'function_count':read.get('functionCount'),
            'project_digest':read.get('projectDigest'),
            'required_functions_present':read.get('requiredFunctionsPresent'),
            'raw_source_persisted':False,
            'source_returned':False,
            'provider_effect_from_apps_script_read':False,
            'apps_script_mutation_attempted':False,
            'secret_values_recorded':False,
            'iam_mutation_performed':False,
            'wif_mutation_performed':False,
            'traffic_promotion_performed':False,
            'provider_effect_scope':'ZERO_TRAFFIC_CANDIDATE_REVISION_ONLY',
          }
          Path('/tmp/strategic-read/receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-fuse-appsscript-read-zero-traffic-${{ github.run_id }}
          path: /tmp/strategic-read/receipt.json
          if-no-files-found: error
          retention-days: 30
