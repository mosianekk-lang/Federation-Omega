name: Alpha Omega Commercial Authority Action Coordination Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-coordination.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-coordination.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-action-coordination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run coordination and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute authority action coordination proof
        run: >-
          python -m alpha_omega_commercial.prove_authority_action_coordination
          --output artifacts

      - name: Validate contract checkpoint API and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'authority_action_coordination_contract.json').read_text())
          checkpoint = json.loads((root / 'authority_action_coordination_checkpoint.json').read_text())
          api = json.loads((root / 'canonical_commercial_api.json').read_text())
          receipt = json.loads(Path('artifacts/authority-action-coordination-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-COORDINATION-V9'
          assert contract['stage_scope'] == ['C03', 'C11', 'C12', 'C13', 'C15']
          assert contract['depends_on']['pull_request'] == 133
          assert contract['depends_on']['merge_commit'] == '0b0ee4a14f6a514707690f085b8af5d25031486f'
          assert contract['depends_on']['google_drive_release_readback_verified'] is True
          rules = contract['coordination_rules']
          assert rules['single_provider_process_lock'] is True
          assert rules['startup_cleanup_serialized'] is True
          assert rules['startup_recovery_serialized'] is True
          assert rules['live_authority_actions_serialized'] is True
          assert rules['integrity_readback_serialized'] is True
          assert rules['process_local_reentrant_fallback'] is True
          assert rules['process_crash_releases_operating_system_lock'] is True
          assert rules['concurrent_startup_can_rollback_live_transaction'] is False
          assert rules['new_action_blocked_until_recovery_complete'] is True
          assert rules['v8_atomic_event_publication_preserved'] is True
          assert rules['v7_durable_recovery_preserved'] is True
          assert rules['v6_atomic_state_restoration_preserved'] is True
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          assert api['api_id'] == 'AO-COMMERCIAL-CANONICAL-API-V3'
          assert api['current_capability_revision'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-COORDINATION-V9'
          assert api['current_canonical_class'] == 'CoordinatedJournalSafeAuthoritySnapshotCommercialControlPlane'
          assert api['current_predecessor_class'] == 'JournalSafeAtomicAuthoritySnapshotCommercialControlPlane'
          assert api['current_capability_revision'] in api['capability_lineage']
          assert api['current_canonical_class'] in api['canonical_lineage']
          assert api['authority_use']['provider_process_coordination_required'] is True
          assert api['authority_use']['startup_cleanup_serialized_with_actions'] is True
          assert api['authority_use']['startup_recovery_serialized_with_actions'] is True
          assert api['authority_use']['integrity_readback_serialized_with_actions'] is True
          assert api['authority_use']['concurrent_startup_can_rollback_live_transaction'] is False
          assert api['authority_use']['process_crash_releases_coordination_lock'] is True
          assert api['authority_use']['new_action_blocked_until_recovery_complete'] is True
          assert api['persistence']['authority_action_process_coordination'] == 'PROVIDER_PROCESS_LOCK_SERIALIZES_STARTUP_RECOVERY_ACTIONS_AND_READBACK'
          assert api['service_first_strategy'] == 'SERVICE_ENABLED_PLATFORM_BEFORE_SELF_SERVICE_SAAS'
          assert api['verified_live_revenue_events'] == 0
          assert api['full_commercial_maturity'] is False

          dependency = checkpoint['dependency_checkpoint']
          assert dependency['preceding_pull_request'] == 133
          assert dependency['preceding_merge_commit'] == '0b0ee4a14f6a514707690f085b8af5d25031486f'
          assert dependency['preceding_drive_readback_verified'] is True
          assert dependency['programme_dependency_order_verified'] is True
          assert dependency['institution_state_preserved'] is True
          assert checkpoint['status'] in {
              'AUTHORITY_ACTION_COORDINATION_IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'AUTHORITY_ACTION_COORDINATION_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED',
          }
          assert checkpoint['canonical_api_candidate']['current_capability_revision'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-COORDINATION-V9'
          assert checkpoint['canonical_api_candidate']['current_canonical_class'] == 'CoordinatedJournalSafeAuthoritySnapshotCommercialControlPlane'
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['cloud_run_operation_proven'] is False
          assert checkpoint['commercial_truth']['payment_provider_operation_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert receipt['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-COORDINATION-V9'
          assert receipt['status'] == 'AUTHORITY_ACTION_COORDINATION_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          coordination = receipt['coordination_safety']
          assert coordination['startup_cleanup_serialized'] is True
          assert coordination['startup_recovery_serialized'] is True
          assert coordination['live_authority_actions_serialized'] is True
          assert coordination['integrity_readback_serialized'] is True
          assert coordination['concurrent_startup_can_rollback_live_transaction'] is False
          assert coordination['process_crash_releases_coordination_lock'] is True
          assert coordination['new_action_blocked_until_recovery_complete'] is True
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_action_coordination.py'),
              Path('alpha_omega_commercial/prove_authority_action_coordination.py'),
              Path('alpha_omega_commercial/test_authority_action_coordination.py'),
              Path('alpha_omega_commercial/authority_action_coordination_contract.json'),
              Path('alpha_omega_commercial/authority_action_coordination_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable authority action coordination proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alpha-omega-commercial-authority-action-coordination-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
