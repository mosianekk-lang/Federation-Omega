name: SOVARA Sovereign Intelligence Court v2

on:
  pull_request:
    paths:
      - "ops/sovara_openrouter_code_eval_v1.py"
      - "ops/sovara_sovereign_intelligence_court_v2.py"
      - "ops/sovara_sovereign_mcp_v2.py"
      - "ops/sovara_gcs_mission_store_v1.py"
      - "ops/sovara_local_model_lane_v1.py"
      - "tests/test_sovara_openrouter_code_eval_v1.py"
      - "tests/test_sovara_sovereign_intelligence_court_v2.py"
      - "tests/test_sovara_sovereign_mcp_v2.py"
      - "tests/test_sovara_gcs_mission_store_v1.py"
      - "tests/test_sovara_local_model_lane_v1.py"
      - "tests/test_sovara_sic_v2_provider_truth.py"
      - "tests/test_sovara_sic_v2_public_safety.py"
      - "governance/sovara_*.json"
      - "governance/github_airlock_policy.json"
      - "requirements-sovara-mcp.txt"
      - "deployment/sovara-sovereign-intelligence-court/**"
      - ".github/workflows/sovara-sovereign-intelligence-court-v2.yml"
  push:
    branches: ["main"]
    paths:
      - "ops/sovara_openrouter_code_eval_v1.py"
      - "ops/sovara_sovereign_intelligence_court_v2.py"
      - "ops/sovara_sovereign_mcp_v2.py"
      - "ops/sovara_gcs_mission_store_v1.py"
      - "ops/sovara_local_model_lane_v1.py"
      - "tests/test_sovara_openrouter_code_eval_v1.py"
      - "tests/test_sovara_sovereign_intelligence_court_v2.py"
      - "tests/test_sovara_sovereign_mcp_v2.py"
      - "tests/test_sovara_gcs_mission_store_v1.py"
      - "tests/test_sovara_local_model_lane_v1.py"
      - "tests/test_sovara_sic_v2_provider_truth.py"
      - "tests/test_sovara_sic_v2_public_safety.py"
      - "governance/sovara_*.json"
      - "requirements-sovara-mcp.txt"
      - "deployment/sovara-sovereign-intelligence-court/**"
      - ".github/workflows/sovara-sovereign-intelligence-court-v2.yml"

permissions:
  contents: read

concurrency:
  group: sovara-sic-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-court:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pytest
          python -m pip install --disable-pip-version-check --no-input -r requirements-sovara-mcp.txt

      - name: Run v1 and v2 focused courts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_sovara_openrouter_code_eval_v1.py \
            tests/test_sovara_sovereign_intelligence_court_v2.py \
            tests/test_sovara_sovereign_mcp_v2.py \
            tests/test_sovara_gcs_mission_store_v1.py \
            tests/test_sovara_local_model_lane_v1.py \
            tests/test_sovara_sic_v2_provider_truth.py
          python -m py_compile \
            ops/sovara_openrouter_code_eval_v1.py \
            ops/sovara_sovereign_intelligence_court_v2.py \
            ops/sovara_sovereign_mcp_v2.py \
            ops/sovara_gcs_mission_store_v1.py \
            ops/sovara_local_model_lane_v1.py

      - name: Run repository safety regression slice
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_github_airlock.py' -v
          python -m unittest discover -s tests -p 'test_airlock_stale_base_guard.py' -v
          python -m unittest discover -s tests -p 'test_phoenix_source_provenance.py' -v
          python -m unittest tests.test_sovara_sic_v2_public_safety -v

      - name: Record source validation receipt
        run: |
          set -euo pipefail
          mkdir -p receipts
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [
              'ops/sovara_openrouter_code_eval_v1.py',
              'ops/sovara_sovereign_intelligence_court_v2.py',
              'ops/sovara_sovereign_mcp_v2.py',
              'ops/sovara_gcs_mission_store_v1.py',
              'ops/sovara_local_model_lane_v1.py',
          ]
          receipt = {
              'schema': 'SOVARA-SIC-V2-SOURCE-VALIDATION-RECEIPT-1',
              'tests': 'PASS',
              'py_compile': 'PASS',
              'provider_connectivity_claimed': False,
              'mcp_deployment_claimed': False,
              'chat_connection_claimed': False,
              'canonical_source_mutated_by_model': False,
              'files': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
          }
          Path('receipts/SOURCE_VALIDATION_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Resolve live provider canary eligibility
        if: github.event_name == 'push'
        id: eligibility
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "reason=AUTHORISED_REPOSITORY_SECRET_BOUND" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "reason=OPENROUTER_SECRET_NOT_BOUND" >> "$GITHUB_OUTPUT"
          fi

      - name: Run v2 synthetic external multi-model canary
        if: github.event_name == 'push' && steps.eligibility.outputs.live == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p receipts /tmp/sovara-sic-v2-state
          printf '%s\n' 'def dedupe(values):' '    return list(dict.fromkeys(values))' | \
            python ops/sovara_sovereign_intelligence_court_v2.py \
              --language python \
              --objective 'Find correctness defects and materially different redesigns.' \
              --mode AUTO \
              --max-models 4 \
              --state-dir /tmp/sovara-sic-v2-state \
              --output receipts/SOVARA_SIC_V2_LIVE_CANARY.json \
              > /tmp/sovara-sic-v2.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('receipts/SOVARA_SIC_V2_LIVE_CANARY.json').read_text())
          assert data['panel_summary']['round1_external_success'] >= 2, data['panel_summary']
          assert data['panel_summary']['provider_connectivity_claimed'] is True
          assert data['zero_dilution']['canonical_source_modified'] is False
          assert data['zero_dilution']['promotion_allowed'] is False
          assert data['result_sha256']
          summary = {
              'schema': 'SOVARA-SIC-V2-LIVE-CANARY-RECEIPT-1',
              'mission_id': data['mission_id'],
              'source_sha256': data['source_sha256'],
              'result_sha256': data['result_sha256'],
              'round1_external_success': data['panel_summary']['round1_external_success'],
              'round2_external_success': data['panel_summary']['round2_external_success'],
              'degradation_mode': data['degradation_mode'],
              'provider_connectivity_proven_for_this_canary': True,
              'canonical_source_mutated_by_model': False,
              'production_mcp_deployment_claimed': False,
              'chat_connection_claimed': False,
          }
          Path('receipts/LIVE_PROVIDER_RECEIPT.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Record held live boundary
        if: github.event_name == 'push' && steps.eligibility.outputs.live != 'true'
        env:
          HOLD_REASON: ${{ steps.eligibility.outputs.reason }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('receipts').mkdir(exist_ok=True)
          Path('receipts/LIVE_PROVIDER_RECEIPT.json').write_text(json.dumps({
              'schema': 'SOVARA-SIC-V2-LIVE-CANARY-RECEIPT-1',
              'provider_connectivity_proven_for_this_canary': False,
              'hold_reason': os.environ.get('HOLD_REASON'),
              'canonical_source_mutated_by_model': False,
              'production_mcp_deployment_claimed': False,
              'chat_connection_claimed': False,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload redacted receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-sic-v2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: receipts/
