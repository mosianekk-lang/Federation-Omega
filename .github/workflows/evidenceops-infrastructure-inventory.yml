name: EvidenceOps Infrastructure Inventory

on:
  push:
    branches:
      - evidenceops/ai-ict-production-runtime-v1-4
    paths:
      - '.github/workflows/evidenceops-infrastructure-inventory.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/evidenceops-infrastructure-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: sov-hybrid-suite
  GCP_REGION: africa-south1
  GCP_WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  GCP_SERVICE_ACCOUNT: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Inventory existing infrastructure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory
          PROJECT="$GCP_PROJECT_ID"
          REGION="$GCP_REGION"
          gcloud auth list --filter=status:ACTIVE --format=json > inventory/active-account.json
          gcloud projects describe "$PROJECT" --format=json > inventory/project.json
          gcloud services list --enabled --project="$PROJECT" --format=json > inventory/enabled-services.json
          gcloud artifacts repositories list --project="$PROJECT" --location="$REGION" --format=json > inventory/artifact-repositories.json
          gcloud storage buckets list --project="$PROJECT" --format=json > inventory/buckets.json
          gcloud pubsub topics list --project="$PROJECT" --format=json > inventory/pubsub-topics.json
          gcloud pubsub subscriptions list --project="$PROJECT" --format=json > inventory/pubsub-subscriptions.json
          gcloud sql instances list --project="$PROJECT" --format=json > inventory/sql-instances.json
          gcloud run services list --project="$PROJECT" --region="$REGION" --format=json > inventory/cloud-run-services.json
          gcloud iam service-accounts list --project="$PROJECT" --format=json > inventory/service-accounts.json
          gcloud secrets list --project="$PROJECT" --format=json > inventory/secrets.json
          python - <<'PY'
          import hashlib, json, pathlib, time
          root=pathlib.Path('inventory')
          summary={'generated_at_epoch':int(time.time()),'files':{},'counts':{}}
          for p in sorted(root.glob('*.json')):
              data=json.loads(p.read_text())
              summary['files'][p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
              summary['counts'][p.stem]=len(data) if isinstance(data,list) else 1
          (root/'inventory-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidenceops-infrastructure-inventory
          path: inventory
          retention-days: 30
