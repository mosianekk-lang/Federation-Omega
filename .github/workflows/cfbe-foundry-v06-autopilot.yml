name: CFBE Foundry v0.6 Autopilot Proof

on:
  push:
    branches:
      - 'cfbe-foundry-commercial-v0.6-*'
    paths:
      - 'artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip'
      - 'artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip.sha256'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfbe-foundry-v06-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCHIVE: artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip
  SOURCE_DIR: CFBE_Alpha_Omega_Foundry_v0_6
  PROJECT_ID: sov-hybrid-suite
  REGION: africa-south1
  GEMINI_MODEL: gemini-2.5-flash
  HAS_GCP_READ_CREDENTIAL: ${{ secrets.GCP_SA_KEY != '' || secrets.GCP_SERVICE_ACCOUNT_KEY != '' || secrets.GOOGLE_CREDENTIALS != '' || secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' || secrets.GCP_CREDENTIALS != '' || secrets.GOOGLE_GHA_CREDS_JSON != '' || secrets.GOOGLE_CLOUD_CREDENTIALS != '' }}

jobs:
  verify:
    name: Verify ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - name: Verify archive digest and extract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,pathlib,zipfile
          archive=pathlib.Path('artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip')
          side=pathlib.Path('artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip.sha256').read_text().split()[0]
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == side, (actual, side)
          zipfile.ZipFile(archive).extractall('.')
          print('ARCHIVE_VERIFIED', actual)
          PY
      - name: Run product proof court
        shell: bash
        working-directory: CFBE_Alpha_Omega_Foundry_v0_6
        run: |
          set -euo pipefail
          python -m compileall -q cfbe_ao tests
          python -m unittest discover -s tests -v
          python -m cfbe_ao doctor
          python -m cfbe_ao commercial-audit --root . --tests-passed

  windows-package:
    name: Windows setup package
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Extract verified source artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive='artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip'
          $expected=((Get-Content "$archive.sha256") -split '\s+')[0].ToLower()
          $actual=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "archive hash mismatch" }
          Expand-Archive -Path $archive -DestinationPath . -Force
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build executable and commercial setup package
        shell: pwsh
        working-directory: CFBE_Alpha_Omega_Foundry_v0_6
        run: ./installer/windows/build.ps1 -BuildInstaller
      - name: Silent per-user installer canary
        shell: pwsh
        working-directory: CFBE_Alpha_Omega_Foundry_v0_6
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist\CFBE-Alpha-Omega-Foundry-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'installer missing' }
          $target=Join-Path $env:RUNNER_TEMP 'cfbe-foundry-installed'
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$target"
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $doctor=& (Join-Path $target 'cfbe-ao.exe') doctor | Out-String
          $doctor | Out-File -Encoding utf8 dist\windows-installer-doctor.json
          if ($doctor -notmatch '"status"\s*:\s*"READY_LOCAL"') { throw 'installed executable doctor failed' }
          $setupHash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          @{state='WINDOWS_INSTALLER_VERIFIED';setup_sha256=$setupHash;installed_doctor=$true} | ConvertTo-Json | Out-File -Encoding utf8 dist\windows-install-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfbe-foundry-windows-v06-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            CFBE_Alpha_Omega_Foundry_v0_6/dist/cfbe-ao.exe
            CFBE_Alpha_Omega_Foundry_v0_6/dist/cfbe-ao.exe.sha256
            CFBE_Alpha_Omega_Foundry_v0_6/dist/CFBE-Alpha-Omega-Foundry-Setup-*.exe
            CFBE_Alpha_Omega_Foundry_v0_6/dist/CFBE-Alpha-Omega-Foundry-Setup-*.exe.sha256
            CFBE_Alpha_Omega_Foundry_v0_6/dist/windows-exe-doctor.json
            CFBE_Alpha_Omega_Foundry_v0_6/dist/windows-installer-doctor.json
            CFBE_Alpha_Omega_Foundry_v0_6/dist/windows-install-proof.json
            CFBE_Alpha_Omega_Foundry_v0_6/dist/*.whl
          if-no-files-found: error
          retention-days: 90

  google-surface:
    name: Google / AI Studio proof probes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Extract verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,pathlib,zipfile
          archive=pathlib.Path('artifacts/cfbe-foundry/CFBE_Alpha_Omega_Foundry_v0_6.zip')
          expected=pathlib.Path(str(archive)+'.sha256').read_text().split()[0]
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected
          zipfile.ZipFile(archive).extractall('.')
          PY
      - name: Apps Script current deployment probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cfbe-google
          printf '{"schema":"CFBE_FOUNDRY_GOOGLE_SURFACE_RECEIPT_V1","source_sha":"%s","provider_mutation_performed":false,"credential_values_recorded":false}\n' "$GITHUB_SHA" > /tmp/cfbe-google/surface.json
          python3 bubbles/apps_script_deployment_probe.py --receipt /tmp/cfbe-google/surface.json
      - name: Gemini bounded semantic canary
        shell: bash
        working-directory: CFBE_Alpha_Omega_Foundry_v0_6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            printf '{"state":"CREDENTIAL_MISSING","semantic_verified":false,"credential_value_recorded":false}\n' > /tmp/cfbe-google/gemini.json
          else
            python -m cfbe_ao gemini-canary --model "$GEMINI_MODEL" > /tmp/cfbe-google/gemini.json || true
          fi
      - name: Authenticate configured Google read credential
        id: gcp_read_auth
        if: ${{ env.HAS_GCP_READ_CREDENTIAL == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GOOGLE_SERVICE_ACCOUNT_KEY || secrets.GCP_CREDENTIALS || secrets.GOOGLE_GHA_CREDS_JSON || secrets.GOOGLE_CLOUD_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Cloud Run provider-native readback
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.gcp_read_auth.outcome }}
        run: |
          set -euo pipefail
          set +x
          if [[ "$HAS_GCP_READ_CREDENTIAL" != "true" || "${AUTH_OUTCOME:-}" != "success" ]]; then
            printf '{"state":"GOOGLE_CREDENTIAL_OR_AUTH_UNPROVEN","provider_readback":false,"provider_mutation_performed":false}\n' > /tmp/cfbe-google/cloud.json
            exit 0
          fi
          set +e
          gcloud run services list --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/cfbe-google/services.json 2>/tmp/cfbe-google/services.err
          rc=$?
          set -e
          RC="$rc" python - <<'PY' > /tmp/cfbe-google/cloud.json
          import hashlib,json,os,pathlib
          raw=pathlib.Path('/tmp/cfbe-google/services.json').read_bytes()
          err=pathlib.Path('/tmp/cfbe-google/services.err').read_bytes()
          rc=int(os.environ['RC'])
          data=json.loads(raw or b'[]') if rc == 0 else []
          print(json.dumps({
            'state':'PROVIDER_READBACK_VERIFIED' if rc == 0 else 'PROVIDER_READBACK_DENIED_OR_FAILED',
            'provider_readback':rc == 0,
            'service_count':len(data),
            'payload_sha256':hashlib.sha256(raw).hexdigest() if raw else None,
            'error_sha256':hashlib.sha256(err).hexdigest() if err else None,
            'provider_mutation_performed':False,
            'credential_value_recorded':False,
          },sort_keys=True))
          PY
      - name: Seal combined redacted Google receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/cfbe-google')
          out=json.loads((root/'surface.json').read_text())
          out['gemini']=json.loads((root/'gemini.json').read_text())
          out['cloud_run']=json.loads((root/'cloud.json').read_text())
          body=dict(out); body.pop('receipt_sha256',None)
          out['receipt_sha256']=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'CFBE_GOOGLE_SURFACE_RECEIPT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfbe-foundry-google-v06-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cfbe-google/CFBE_GOOGLE_SURFACE_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
