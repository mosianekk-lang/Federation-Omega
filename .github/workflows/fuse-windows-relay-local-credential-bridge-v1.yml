name: FUSE Windows Relay Exact Image Local Credential Bridge v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: fuse-windows-relay-local-credential-bridge-v1
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  REGION: africa-south1
  ARTIFACT_REPOSITORY: federation-omega
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  IMAGE_DIGEST: sha256:e24acd4e93a4efd7956bcce0f0452bba9b2f987de98b0316a86fc4335014b29d
  IMAGE_DIGEST_URI: africa-south1-docker.pkg.dev/sov-hybrid-suite/federation-omega/fuse-windows-relay@sha256:e24acd4e93a4efd7956bcce0f0452bba9b2f987de98b0316a86fc4335014b29d

jobs:
  exact-local-proof:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_LOCAL_CREDENTIAL_BRIDGE_V1' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate canonical keyless deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud client
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prove credential readability and exact-image local semantics
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=/tmp/fuse-relay-local-bridge-evidence
          BRIDGE_DIR=/tmp/fuse-relay-credential-bridge
          BRIDGE_FILE="$BRIDGE_DIR/gcp-credentials.json"
          LOCAL_CONTAINER="fuse-relay-bridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          LOCAL_PORT=18082
          mkdir -p "$EVIDENCE"

          cleanup() {
            set +e
            if docker inspect "$LOCAL_CONTAINER" >/dev/null 2>&1; then
              docker inspect "$LOCAL_CONTAINER" > "$EVIDENCE/status.json" 2>/dev/null || true
              docker logs "$LOCAL_CONTAINER" > "$EVIDENCE/startup.raw.log" 2>&1 || true
              docker rm --force "$LOCAL_CONTAINER" >/dev/null 2>&1 || true
            fi
            if [[ -f "$EVIDENCE/startup.raw.log" ]]; then
              python3 - "$EVIDENCE/startup.raw.log" "$EVIDENCE/startup.redacted.log" <<'PY'
          import re,sys
          p=sys.argv[1]; out=sys.argv[2]
          text=open(p,encoding='utf-8',errors='replace').read()
          patterns=[
              (r'(?i)(authorization\s*[:=]\s*bearer\s+)[^\s,;]+', r'\1[REDACTED]'),
              (r'(?i)(access_token|id_token|request_token|subject_token)(["\'=:\s]+)[^\s,"\'}]+', r'\1\2[REDACTED]'),
              (r'(?i)([?&](?:token|access_token|id_token|request_token)=)[^&\s]+', r'\1[REDACTED]'),
          ]
          for pat,repl in patterns: text=re.sub(pat,repl,text)
          open(out,'w',encoding='utf-8').write(text)
          PY
              rm -f "$EVIDENCE/startup.raw.log"
            fi
            sudo rm -rf "$BRIDGE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker pull "$IMAGE_DIGEST_URI"
          docker image inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_DIGEST_URI" | grep -Fx "$IMAGE_DIGEST_URI" >/dev/null

          {
            echo "source_sha=$GITHUB_SHA"
            echo "image_digest=$IMAGE_DIGEST"
            echo "image_digest_uri=$IMAGE_DIGEST_URI"
            echo "original_mode=$(stat -c '%a' "$GOOGLE_APPLICATION_CREDENTIALS")"
            echo "original_uid=$(stat -c '%u' "$GOOGLE_APPLICATION_CREDENTIALS")"
            echo "original_gid=$(stat -c '%g' "$GOOGLE_APPLICATION_CREDENTIALS")"
          } > "$EVIDENCE/credential-stat.txt"

          if docker run --rm --entrypoint sh --user 65532:65532 \
              --volume "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/original-gcp-credentials.json:ro" \
              "$IMAGE_DIGEST_URI" -lc 'test -r /tmp/original-gcp-credentials.json'; then
            echo 'original_readable_by_65532=true' >> "$EVIDENCE/credential-stat.txt"
          else
            echo 'original_readable_by_65532=false' >> "$EVIDENCE/credential-stat.txt"
          fi

          sudo install -d -m 0750 -o "$(id -u)" -g 65532 "$BRIDGE_DIR"
          sudo install -m 0640 -o "$(id -u)" -g 65532 "$GOOGLE_APPLICATION_CREDENTIALS" "$BRIDGE_FILE"
          {
            echo "bridge_mode=$(stat -c '%a' "$BRIDGE_FILE")"
            echo "bridge_uid=$(stat -c '%u' "$BRIDGE_FILE")"
            echo "bridge_gid=$(stat -c '%g' "$BRIDGE_FILE")"
          } >> "$EVIDENCE/credential-stat.txt"

          docker run --rm --entrypoint sh --user 65532:65532 \
            --volume "$BRIDGE_FILE:/tmp/bridge-gcp-credentials.json:ro" \
            "$IMAGE_DIGEST_URI" -lc 'test -r /tmp/bridge-gcp-credentials.json'
          echo 'bridge_readable_by_65532=true' >> "$EVIDENCE/credential-stat.txt"

          docker run --detach --name "$LOCAL_CONTAINER" \
            --publish "127.0.0.1:${LOCAL_PORT}:8080" \
            --env "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
            --env 'FUSE_AGENT_ONLY_BOOTSTRAP=true' \
            --env 'FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY' \
            --env 'GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json' \
            --volume "$BRIDGE_FILE:/tmp/gcp-credentials.json:ro" \
            "$IMAGE_DIGEST_URI" >/dev/null

          HEALTH_CODE=000
          for attempt in $(seq 1 30); do
            HEALTH_CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
              --output "$EVIDENCE/health.json" --write-out '%{http_code}' \
              "http://127.0.0.1:${LOCAL_PORT}/healthz" || true)"
            [[ "$HEALTH_CODE" == 200 ]] && break
            docker inspect --format='{{.State.Running}}' "$LOCAL_CONTAINER" | grep -Fx true >/dev/null || break
            sleep 1
          done

          NODE_CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
            --output "$EVIDENCE/node.html" --write-out '%{http_code}' \
            "http://127.0.0.1:${LOCAL_PORT}/node" || true)"
          MCP_CODE="$(curl --location --silent --show-error --connect-timeout 2 --max-time 5 \
            --output "$EVIDENCE/mcp.txt" --write-out '%{http_code}' \
            "http://127.0.0.1:${LOCAL_PORT}/mcp" || true)"

          docker inspect "$LOCAL_CONTAINER" > "$EVIDENCE/status.json"
          docker logs "$LOCAL_CONTAINER" > "$EVIDENCE/startup.raw.log" 2>&1 || true
          python3 - "$EVIDENCE/startup.raw.log" "$EVIDENCE/startup.redacted.log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          patterns=[
              (r'(?i)(authorization\s*[:=]\s*bearer\s+)[^\s,;]+', r'\1[REDACTED]'),
              (r'(?i)(access_token|id_token|request_token|subject_token)(["\'=:\s]+)[^\s,"\'}]+', r'\1\2[REDACTED]'),
              (r'(?i)([?&](?:token|access_token|id_token|request_token)=)[^&\s]+', r'\1[REDACTED]'),
          ]
          for pat,repl in patterns: text=re.sub(pat,repl,text)
          open(sys.argv[2],'w',encoding='utf-8').write(text)
          PY
          rm -f "$EVIDENCE/startup.raw.log"

          {
            echo "health_code=$HEALTH_CODE"
            echo "node_code=$NODE_CODE"
            echo "mcp_code=$MCP_CODE"
            echo "container_running=$(docker inspect --format='{{.State.Running}}' "$LOCAL_CONTAINER")"
            echo "container_status=$(docker inspect --format='{{.State.Status}}' "$LOCAL_CONTAINER")"
            echo "container_exit_code=$(docker inspect --format='{{.State.ExitCode}}' "$LOCAL_CONTAINER")"
            echo "health_sha256=$(sha256sum "$EVIDENCE/health.json" 2>/dev/null | cut -d' ' -f1 || true)"
            echo "node_sha256=$(sha256sum "$EVIDENCE/node.html" 2>/dev/null | cut -d' ' -f1 || true)"
            echo "mcp_sha256=$(sha256sum "$EVIDENCE/mcp.txt" 2>/dev/null | cut -d' ' -f1 || true)"
            echo "startup_redacted_sha256=$(sha256sum "$EVIDENCE/startup.redacted.log" | cut -d' ' -f1)"
          } > "$EVIDENCE/result.txt"

          test "$HEALTH_CODE" = 200
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); raise SystemExit(0 if d.get("status")=="ok" and d.get("device_auth")=="ECDSA_P256" else 1)' "$EVIDENCE/health.json"
          test "$NODE_CODE" = 200
          grep -F 'CONNECT THIS PC' "$EVIDENCE/node.html" >/dev/null
          case "$MCP_CODE" in 401|403|404) ;; *) echo "LOCAL_MCP_FAIL_CLOSED_REQUIRED:$MCP_CODE" >&2; exit 71 ;; esac

      - name: Upload redacted local proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-relay-local-credential-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fuse-relay-local-bridge-evidence
          if-no-files-found: error
          retention-days: 30
