name: FKPF Omega v3 CI

on:
  pull_request:
    paths:
      - 'federation/fkpf_omega_v3/**'
      - '.github/workflows/fkpf-omega-v3-ci.yml'
  push:
    branches:
      - 'fkpf/omega-v3-sovereign-fabric'
    paths:
      - 'federation/fkpf_omega_v3/**'
      - '.github/workflows/fkpf-omega-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q federation/fkpf_omega_v3
      - name: Deterministic regression court
        env:
          PYTHONWARNINGS: error
        run: python -m unittest discover -s federation/fkpf_omega_v3/tests -v
      - name: Build-contract checks
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('federation/fkpf_omega_v3')
          contract=json.loads((root/'BUILD_CONTRACT.json').read_text())
          assert contract['version']=='3.0.0'
          assert contract['no_new_sovereign_plane'] is True
          assert contract['provider_runtime_effect'] is False
          cards=json.loads((root/'interop/agent_cards.json').read_text())
          assert cards['target_protocol']=='A2A_1.0'
          assert all(a['protocolVersion']=='1.0' for a in cards['agents'])
          mcp=json.loads((root/'interop/mcp_boundaries.json').read_text())
          assert all(s['no_raw_secret_values'] for s in mcp['servers'])
          assert all(s['require_provider_readback'] for s in mcp['servers'])
          rego=(root/'policy/federation.rego').read_text()
          assert 'default allow := false' in rego
          print('FKPF_BUILD_CONTRACT_PASS')
          PY
      - name: Truth-boundary sentinel
        run: |
          python - <<'PY'
          import pathlib
          text='\n'.join(p.read_text(errors='ignore') for p in pathlib.Path('federation/fkpf_omega_v3').rglob('*') if p.is_file())
          required=['PROVIDER_READBACK','VALUE_OBSERVED','no_new_sovereign_plane']
          for token in required:
              assert token in text, token
          forbidden=['OPENAI_API_KEY=', 'GITHUB_TOKEN=', 'PRIVATE KEY-----']
          for token in forbidden:
              assert token not in text, token
          print('FKPF_TRUTH_BOUNDARY_PASS')
          PY
