name: FEVX CSE GitHub Shadow Runtime

on:
  push:
    branches: ["main"]
    paths:
      - "systems/fevx-cse-runtime/**"
      - "runtime/fevx-cse/state/desired_state.json"
      - "runtime/fevx-cse/queue/**"
      - ".github/workflows/fevx-cse-github-shadow.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fevx-cse-github-shadow-runtime
  cancel-in-progress: false

env:
  CSE_WHEEL_SHA256: 8c2832a9cd844af62a5fd403038bc2cebca4aa8967826295b34b6c9660c83022
  CSE_WHEEL_PATH: /tmp/fevx_cognitive_sovereignty_ecology-1.1.0-py3-none-any.whl

jobs:
  shadow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore and verify digest-pinned CSE wheel
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            systems/fevx-cse-runtime/vendor/wheel.part.00
            systems/fevx-cse-runtime/vendor/wheel.part.01
            systems/fevx-cse-runtime/vendor/wheel.part.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.00
            systems/fevx-cse-runtime/vendor/wheel.part.03.01
            systems/fevx-cse-runtime/vendor/wheel.part.03.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.03
            systems/fevx-cse-runtime/vendor/wheel.part.04.00
            systems/fevx-cse-runtime/vendor/wheel.part.04.01
            systems/fevx-cse-runtime/vendor/wheel.part.04.02
            systems/fevx-cse-runtime/vendor/wheel.part.04.03
            systems/fevx-cse-runtime/vendor/wheel.part.05
            systems/fevx-cse-runtime/vendor/wheel.part.06.00
            systems/fevx-cse-runtime/vendor/wheel.part.06.01
            systems/fevx-cse-runtime/vendor/wheel.part.06.02
            systems/fevx-cse-runtime/vendor/wheel.part.06.03
            systems/fevx-cse-runtime/vendor/wheel.part.07
          )
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" | base64 --decode > "$CSE_WHEEL_PATH"
          observed="$(sha256sum "$CSE_WHEEL_PATH" | awk '{print $1}')"
          test "$observed" = "$CSE_WHEEL_SHA256"
          python -m zipfile -t "$CSE_WHEEL_PATH"
          python -m pip install --disable-pip-version-check "$CSE_WHEEL_PATH"

      - name: Repair and verify packaged evolution migration lookup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/fevx-cse/results
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import fevx_cse

          package = Path(fevx_cse.__file__).resolve().parent
          source = package / 'sql/sqlite_001_bootstrap.sql'
          target = Path(fevx_cse.__file__).resolve().parents[2] / 'migrations/sqlite/001_bootstrap.sql'
          assert source.is_file(), source
          target.parent.mkdir(parents=True, exist_ok=True)
          payload = source.read_bytes()
          target.write_bytes(payload)
          assert target.read_bytes() == payload
          receipt = {
              'receipt': 'FEVX-CSE-EVOLUTION-MIGRATION-COMPATIBILITY-REPAIR',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'source': str(source),
              'target': str(target),
              'sha256': hashlib.sha256(payload).hexdigest(),
              'semantic_readback': True,
              'ephemeral_runner_only': True,
              'source_code_modified': False,
              'external_effect': False,
          }
          Path('runtime/fevx-cse/results/compatibility_repair.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Execute provider-native shadow, rollback and proof cycle
        shell: bash
        run: |
          set -euo pipefail
          python systems/fevx-cse-runtime/run_shadow.py \
            --repo-root . \
            --mission systems/fevx-cse-runtime/mission.json \
            --genome systems/fevx-cse-runtime/intent_genome.json

      - name: Verify operational proof contract
        shell: bash
        run: |
          set -euo pipefail
          test -s runtime/fevx-cse/state/cse_state.sql
          test -s runtime/fevx-cse/results/latest.json
          test -s runtime/fevx-cse/proofs/proof_chain_head.json
          test -s runtime/fevx-cse/heartbeat/latest.json
          test -s runtime/fevx-cse/drift/latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runtime/fevx-cse")
          result = json.loads((root / "results/latest.json").read_text())
          repair = json.loads((root / "results/compatibility_repair.json").read_text())
          heartbeat = json.loads((root / "heartbeat/latest.json").read_text())
          drift = json.loads((root / "drift/latest.json").read_text())
          actual = json.loads((root / "state/actual_state.json").read_text())

          assert repair["semantic_readback"] is True, repair
          assert repair["external_effect"] is False, repair
          assert result["status"] == "VERIFIED", result
          assert result["provider"] == "github_actions", result
          assert result["semantic_readback"] is True, result
          assert result["rollback_test"] is True, result
          assert result["reapply_test"] is True, result
          assert result["analysis"]["module_count"] == 10, result
          assert result["external_effect"] is False, result
          assert heartbeat["runtime_state"] == "OPERATIONAL", heartbeat
          assert heartbeat["verified"] is True, heartbeat
          assert drift["classification"] == "IN_SYNC", drift
          assert actual["maturity_state"] == "AUTONOMOUS_RUNTIME_VERIFIED_SHADOW", actual
          assert actual["current_verified_level"] == 4, actual
          assert actual["level_5_eligible"] is False, actual
          print(json.dumps({
              "result": result,
              "compatibility_repair": repair,
              "heartbeat": heartbeat,
              "drift": drift,
              "actual_state": actual,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload shadow-runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: fevx-cse-github-shadow-runtime
          path: |
            runtime/fevx-cse/results/
            runtime/fevx-cse/proofs/
            runtime/fevx-cse/heartbeat/
            runtime/fevx-cse/drift/
            runtime/fevx-cse/checkpoints/
            runtime/fevx-cse/snapshots/
            runtime/fevx-cse/state/
          if-no-files-found: error
          retention-days: 30

      - name: Persist durable shadow state and receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fevx-cse-shadow-runtime[bot]"
          git config user.email "fevx-cse-shadow-runtime[bot]@users.noreply.github.com"
          git add runtime/fevx-cse
          if git diff --cached --quiet; then
            echo "No durable shadow-state change"
          else
            git commit -m "Persist FEVX CSE provider shadow receipt [skip cse-shadow]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
