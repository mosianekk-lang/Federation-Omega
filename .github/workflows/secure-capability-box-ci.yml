name: Secure Capability Box CI

on:
  pull_request:
    paths:
      - "evidenceops/secure_capability_box/**"
      - "evidenceops/build_system/**"
      - "evidenceops/cloud_capability/**"
      - "evidenceops/security/public_repository_leak_guard.py"
      - ".github/workflows/secure-capability-box-ci.yml"
  push:
    branches:
      - main
    paths:
      - "evidenceops/secure_capability_box/**"
      - "evidenceops/build_system/**"
      - "evidenceops/cloud_capability/**"
      - "evidenceops/security/public_repository_leak_guard.py"
      - ".github/workflows/secure-capability-box-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-capability-box-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Secure Capability Box tests
        working-directory: evidenceops/secure_capability_box
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run objective-completion regression tests
        run: python -W error::ResourceWarning -m unittest discover -s evidenceops/build_system/tests -v
      - name: Run permanent cloud-capability regression tests
        run: python -W error::ResourceWarning -m unittest discover -s evidenceops/cloud_capability/tests -v
      - name: Require cloud capability inheritance
        run: python -m evidenceops.cloud_capability.inheritance --require-all-bound
      - name: Evaluate active Secure Capability Box mission
        run: |
          python -m evidenceops.build_system.objective_completion_guard \
            evidenceops/secure_capability_box/objective_completion_state.json \
            --output /tmp/objective-completion.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/objective-completion.json', encoding='utf-8'))
          assert value['mustContinue'] is True
          assert value['completionClaimPermitted'] is False
          assert value['finalResponsePermitted'] is False
          assert value['ownerActionRequired'] is False
          PY
      - name: Compile package
        working-directory: evidenceops/secure_capability_box
        run: python -m compileall -q secure_capability_box
      - name: Compile EvidenceOps build controls
        run: python -m compileall -q evidenceops/build_system evidenceops/cloud_capability
      - name: Scan public repository content
        run: python evidenceops/security/public_repository_leak_guard.py
