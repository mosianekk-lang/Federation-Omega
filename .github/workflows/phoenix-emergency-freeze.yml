name: Phoenix Emergency Execution Freeze

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[PST-CLOSE]') && 'phoenix-emergency-execution-freeze' || github.event_name == 'push' && startsWith(github.event.head_commit.message, '[BIBLE-REBUILD]') && 'phoenix-local-bible-rebuild' || 'phoenix-emergency-passive' }}
  cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, '[PST-CLOSE]') || startsWith(github.event.head_commit.message, '[BIBLE-REBUILD]')) }}

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve PST closure execution
        id: pst_closure
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          requested=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${HEAD_COMMIT_MESSAGE}" == "[PST-CLOSE]"* ]]; then
            requested=true
          fi
          echo "requested=${requested}" >> "${GITHUB_OUTPUT}"
          echo "PST closure requested: ${requested}"

      - name: Resolve Local Bible rebuild execution
        id: bible_rebuild
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          requested=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${HEAD_COMMIT_MESSAGE}" == "[BIBLE-REBUILD]"* ]]; then
            requested=true
          fi
          echo "requested=${requested}" >> "${GITHUB_OUTPUT}"
          echo "Local Bible rebuild requested: ${requested}"

      - name: Verify Phoenix export and provider controls
        run: |
          python -m unittest discover -s tests -p 'test_phoenix_exports.py' -v
          python -m unittest discover -s tests -p 'test_phoenix_provider_cutover_v2.py' -v
          python -m unittest discover -s tests -p 'test_phoenix_provider_cutover_v3.py' -v
          python -m unittest discover -s tests -p 'test_pst_composite_runtime_contract.py' -v
          python -m unittest discover -s tests -p 'test_phoenix_provider_cutover_v3_local_bible_rebuild.py' -v

      - name: Build source-clean Core and private Ops exports
        run: |
          set -euo pipefail
          rm -rf phoenix-export-output
          python phoenix/build_exports_v3.py \
            --repo-root . \
            --output phoenix-export-output

      - name: Quarantine legacy workflow execution
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p phoenix-freeze-output
          : > /tmp/phoenix-freeze-errors.txt
          : > /tmp/phoenix-freeze-disabled.txt
          : > /tmp/phoenix-freeze-enabled.txt
          : > /tmp/phoenix-freeze-provider-managed.txt

          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path, .state, .name] | @tsv' \
            > /tmp/phoenix-workflows-before.tsv; then
            echo 'Unable to list workflows before quarantine' >> /tmp/phoenix-freeze-errors.txt
          fi

          if [[ -s /tmp/phoenix-workflows-before.tsv ]]; then
            while IFS=$'\t' read -r workflow_id workflow_path workflow_state workflow_name; do
              case "$workflow_path" in
                .github/workflows/github-airlock.yml|\
                .github/workflows/public-repository-leak-guard.yml|\
                .github/workflows/phoenix-emergency-freeze.yml)
                  if [[ "$workflow_state" != "active" ]]; then
                    if gh api -X PUT \
                      "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable" \
                      >/dev/null; then
                      printf '%s\t%s\n' "$workflow_id" "$workflow_path" \
                        >> /tmp/phoenix-freeze-enabled.txt
                    else
                      printf 'Failed to enable required workflow: %s\n' "$workflow_path" \
                        >> /tmp/phoenix-freeze-errors.txt
                    fi
                  fi
                  ;;
                dynamic/dependabot/dependabot-updates)
                  printf '%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                    >> /tmp/phoenix-freeze-provider-managed.txt
                  ;;
                *)
                  if [[ "$workflow_state" != "disabled_manually" ]]; then
                    if gh api -X PUT \
                      "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" \
                      >/dev/null; then
                      printf '%s\t%s\n' "$workflow_id" "$workflow_path" \
                        >> /tmp/phoenix-freeze-disabled.txt
                    else
                      printf 'Failed to disable legacy workflow: %s\n' "$workflow_path" \
                        >> /tmp/phoenix-freeze-errors.txt
                    fi
                  fi
                  ;;
              esac
            done < /tmp/phoenix-workflows-before.tsv
          fi

          sleep 2
          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path, .state, .name] | @tsv' \
            > /tmp/phoenix-workflows-after.tsv; then
            echo 'Unable to list workflows after quarantine' >> /tmp/phoenix-freeze-errors.txt
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          keep = {
              '.github/workflows/github-airlock.yml',
              '.github/workflows/public-repository-leak-guard.yml',
              '.github/workflows/phoenix-emergency-freeze.yml',
          }
          provider_managed = {'dynamic/dependabot/dependabot-updates'}

          def workflow_rows(path: str):
              result = []
              file = Path(path)
              if not file.exists():
                  return result
              for line in file.read_text(encoding='utf-8').splitlines():
                  fields = line.split('\t', 3)
                  if len(fields) == 4:
                      workflow_id, workflow_path, state, name = fields
                      result.append({
                          'id': int(workflow_id),
                          'path': workflow_path,
                          'state': state,
                          'name': name,
                      })
              return result

          def mutation_rows(path: str):
              result = []
              file = Path(path)
              if not file.exists():
                  return result
              for line in file.read_text(encoding='utf-8').splitlines():
                  fields = line.split('\t', 1)
                  if len(fields) == 2:
                      workflow_id, workflow_path = fields
                      result.append({'id': int(workflow_id), 'path': workflow_path})
              return result

          before = workflow_rows('/tmp/phoenix-workflows-before.tsv')
          after = workflow_rows('/tmp/phoenix-workflows-after.tsv')
          disabled = mutation_rows('/tmp/phoenix-freeze-disabled.txt')
          enabled = mutation_rows('/tmp/phoenix-freeze-enabled.txt')
          errors_path = Path('/tmp/phoenix-freeze-errors.txt')
          errors = errors_path.read_text(encoding='utf-8').splitlines() if errors_path.exists() else []

          active_after = sorted(row['path'] for row in after if row['state'] == 'active')
          provider_managed_active = sorted(path for path in active_after if path in provider_managed)
          unexpected_active = sorted(
              path for path in active_after
              if path not in keep and path not in provider_managed
          )
          missing_required = sorted(path for path in keep if path not in active_after)
          verified = bool(after) and not errors and not unexpected_active and not missing_required

          payload = {
              'schema': 'FEDOMEGA-PHOENIX-EXECUTION-FREEZE-3',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'required_active_workflows': sorted(keep),
              'provider_managed_allowlist': sorted(provider_managed),
              'provider_managed_active': provider_managed_active,
              'provider_managed_control_plane': 'DEPENDABOT_REPOSITORY_SETTINGS',
              'workflow_count_before': len(before),
              'workflow_count_after': len(after),
              'disabled_count_this_run': len(disabled),
              'disabled_paths_this_run': sorted(row['path'] for row in disabled),
              'disabled_total_after': sum(1 for row in after if row['state'] == 'disabled_manually'),
              'enabled_count_this_run': len(enabled),
              'enabled_paths_this_run': sorted(row['path'] for row in enabled),
              'active_after': active_after,
              'unexpected_active': unexpected_active,
              'missing_required': missing_required,
              'errors': errors,
              'source_mutation_attempted': False,
              'status': 'VERIFIED' if verified else 'READBACK_FAILED',
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          output = Path('phoenix-freeze-output/phoenix-execution-freeze.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not verified:
              raise SystemExit(1)
          PY

      - name: Run authorised PST composite verification
        if: steps.pst_closure.outputs.requested == 'true'
        timeout-minutes: 300
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PST_VERIFY_ROOT: /tmp/pst-composite-verify
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean
          rm -rf /tmp/pst-composite-run /tmp/pst-composite-verify
          mkdir -p \
            /tmp/pst-composite-run/deployment_manifests \
            /tmp/pst-composite-run/deployment_receipts \
            phoenix-export-output/pst-completion
          cp deployment_manifests/evidenceops-pst-v2-composite-proof.json \
            /tmp/pst-composite-run/deployment_manifests/
          (
            cd /tmp/pst-composite-run
            python "${GITHUB_WORKSPACE}/ops/evidenceops_pst_v2_composite_verify.py"
          )
          cp /tmp/pst-composite-run/deployment_receipts/*.json \
            phoenix-export-output/pst-completion/
          test "$(python -c "import json; print(json.load(open('phoenix-export-output/pst-completion/evidenceops-pst-corpus-v2-drive-completion.json'))['status'])")" = "COMPLETE_VERIFIED"
          df -h

      - name: Authenticate private Local Bible recovery
        id: bible_auth
        if: steps.bible_rebuild.outputs.requested == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: sov-hybrid-suite
          workload_identity_provider: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
          service_account: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false
          request_reason: FEDOMEGA-LBRF-20260804-001

      - name: Rebuild private Local Bible Event 13
        if: steps.bible_rebuild.outputs.requested == 'true'
        timeout-minutes: 20
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.bible_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/local-bible-event13-rebuild phoenix-export-output/local-bible-rebuild
          python ops/evidenceops_local_bible_event13_rebuild.py \
            --work /tmp/local-bible-event13-rebuild \
            --output phoenix-export-output/local-bible-rebuild
          test "$(python -c "import json; print(json.load(open('phoenix-export-output/local-bible-rebuild/PACKAGE_VERIFICATION.json'))['status'])")" = "PROVIDER_PACKAGE_REBUILD_VERIFIED_PENDING_LIBRARY_WRITEBACK"

      - name: Upload immutable quarantine receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-execution-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: phoenix-freeze-output/phoenix-execution-freeze.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Core, Ops, provider cutover, PST completion and Local Bible package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-cutover-package-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phoenix-export-output/Federation-Omega-Core.tar.gz
            phoenix-export-output/Federation-Omega-Ops.tar.gz
            phoenix-export-output/phoenix-export-receipt.json
            phoenix-export-output/pst-completion/*.json
            phoenix-export-output/local-bible-rebuild/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified Phoenix commit status
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pst_requested="${{ steps.pst_closure.outputs.requested }}"
          bible_requested="${{ steps.bible_rebuild.outputs.requested }}"
          state=failure
          description='Phoenix quarantine or export failed'
          pst_ok=true
          bible_ok=true
          if [[ "${pst_requested}" == "true" ]]; then
            pst_ok=false
            description='Phoenix PST closure verification failed'
            if jq -e '.status == "COMPLETE_VERIFIED"' \
                 phoenix-export-output/pst-completion/evidenceops-pst-corpus-v2-drive-completion.json >/dev/null 2>&1; then
              pst_ok=true
              description='Phoenix quarantine, exports and PST completion verified'
            fi
          fi
          if [[ "${bible_requested}" == "true" ]]; then
            bible_ok=false
            description='Phoenix Local Bible rebuild failed'
            if jq -e '.status == "PROVIDER_PACKAGE_REBUILD_VERIFIED_PENDING_LIBRARY_WRITEBACK"' \
                 phoenix-export-output/local-bible-rebuild/PACKAGE_VERIFICATION.json >/dev/null 2>&1; then
              bible_ok=true
              description='Phoenix quarantine, exports and Local Bible rebuild verified'
            fi
          fi
          if jq -e '.status == "VERIFIED"' \
               phoenix-freeze-output/phoenix-execution-freeze.json >/dev/null 2>&1 \
             && jq -e '.status == "VERIFIED"' \
               phoenix-export-output/phoenix-export-receipt.json >/dev/null 2>&1 \
             && [[ "${pst_ok}" == "true" ]] \
             && [[ "${bible_ok}" == "true" ]]; then
            state=success
            if [[ "${pst_requested}" != "true" && "${bible_requested}" != "true" ]]; then
              description='Phoenix quarantine and exports verified; no marked rebuild requested'
            fi
          fi
          gh api -X POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='phoenix-freeze/verified' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          test "$state" = success
