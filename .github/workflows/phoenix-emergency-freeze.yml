name: Phoenix Emergency Execution Freeze

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: phoenix-emergency-execution-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify Phoenix export controls
        run: python -m unittest discover -s tests -p 'test_phoenix_exports.py' -v

      - name: Build source-clean Core and private Ops exports
        run: |
          set -euo pipefail
          rm -rf phoenix-export-output
          python phoenix/build_exports.py \
            --repo-root . \
            --output phoenix-export-output

      - name: Quarantine legacy workflow execution
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p phoenix-freeze-output
          : > /tmp/phoenix-freeze-errors.txt
          : > /tmp/phoenix-freeze-disabled.txt
          : > /tmp/phoenix-freeze-enabled.txt
          : > /tmp/phoenix-freeze-provider-managed.txt

          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path, .state, .name] | @tsv' \
            > /tmp/phoenix-workflows-before.tsv; then
            echo 'Unable to list workflows before quarantine' >> /tmp/phoenix-freeze-errors.txt
          fi

          if [[ -s /tmp/phoenix-workflows-before.tsv ]]; then
            while IFS=$'\t' read -r workflow_id workflow_path workflow_state workflow_name; do
              case "$workflow_path" in
                .github/workflows/github-airlock.yml|\
                .github/workflows/public-repository-leak-guard.yml|\
                .github/workflows/phoenix-emergency-freeze.yml)
                  if [[ "$workflow_state" != "active" ]]; then
                    if gh api -X PUT \
                      "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable" \
                      >/dev/null; then
                      printf '%s\t%s\n' "$workflow_id" "$workflow_path" \
                        >> /tmp/phoenix-freeze-enabled.txt
                    else
                      printf 'Failed to enable required workflow: %s\n' "$workflow_path" \
                        >> /tmp/phoenix-freeze-errors.txt
                    fi
                  fi
                  ;;
                dynamic/dependabot/dependabot-updates)
                  printf '%s\t%s\t%s\n' "$workflow_id" "$workflow_path" "$workflow_state" \
                    >> /tmp/phoenix-freeze-provider-managed.txt
                  ;;
                *)
                  if [[ "$workflow_state" != "disabled_manually" ]]; then
                    if gh api -X PUT \
                      "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" \
                      >/dev/null; then
                      printf '%s\t%s\n' "$workflow_id" "$workflow_path" \
                        >> /tmp/phoenix-freeze-disabled.txt
                    else
                      printf 'Failed to disable legacy workflow: %s\n' "$workflow_path" \
                        >> /tmp/phoenix-freeze-errors.txt
                    fi
                  fi
                  ;;
              esac
            done < /tmp/phoenix-workflows-before.tsv
          fi

          sleep 2
          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path, .state, .name] | @tsv' \
            > /tmp/phoenix-workflows-after.tsv; then
            echo 'Unable to list workflows after quarantine' >> /tmp/phoenix-freeze-errors.txt
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          keep = {
              '.github/workflows/github-airlock.yml',
              '.github/workflows/public-repository-leak-guard.yml',
              '.github/workflows/phoenix-emergency-freeze.yml',
          }
          provider_managed = {'dynamic/dependabot/dependabot-updates'}

          def workflow_rows(path: str):
              result = []
              file = Path(path)
              if not file.exists():
                  return result
              for line in file.read_text(encoding='utf-8').splitlines():
                  fields = line.split('\t', 3)
                  if len(fields) == 4:
                      workflow_id, workflow_path, state, name = fields
                      result.append({
                          'id': int(workflow_id),
                          'path': workflow_path,
                          'state': state,
                          'name': name,
                      })
              return result

          def mutation_rows(path: str):
              result = []
              file = Path(path)
              if not file.exists():
                  return result
              for line in file.read_text(encoding='utf-8').splitlines():
                  fields = line.split('\t', 1)
                  if len(fields) == 2:
                      workflow_id, workflow_path = fields
                      result.append({'id': int(workflow_id), 'path': workflow_path})
              return result

          before = workflow_rows('/tmp/phoenix-workflows-before.tsv')
          after = workflow_rows('/tmp/phoenix-workflows-after.tsv')
          disabled = mutation_rows('/tmp/phoenix-freeze-disabled.txt')
          enabled = mutation_rows('/tmp/phoenix-freeze-enabled.txt')
          errors_path = Path('/tmp/phoenix-freeze-errors.txt')
          errors = errors_path.read_text(encoding='utf-8').splitlines() if errors_path.exists() else []

          active_after = sorted(row['path'] for row in after if row['state'] == 'active')
          provider_managed_active = sorted(path for path in active_after if path in provider_managed)
          unexpected_active = sorted(
              path for path in active_after
              if path not in keep and path not in provider_managed
          )
          missing_required = sorted(path for path in keep if path not in active_after)
          verified = bool(after) and not errors and not unexpected_active and not missing_required

          payload = {
              'schema': 'FEDOMEGA-PHOENIX-EXECUTION-FREEZE-3',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'required_active_workflows': sorted(keep),
              'provider_managed_allowlist': sorted(provider_managed),
              'provider_managed_active': provider_managed_active,
              'provider_managed_control_plane': 'DEPENDABOT_REPOSITORY_SETTINGS',
              'workflow_count_before': len(before),
              'workflow_count_after': len(after),
              'disabled_count_this_run': len(disabled),
              'disabled_paths_this_run': sorted(row['path'] for row in disabled),
              'disabled_total_after': sum(1 for row in after if row['state'] == 'disabled_manually'),
              'enabled_count_this_run': len(enabled),
              'enabled_paths_this_run': sorted(row['path'] for row in enabled),
              'active_after': active_after,
              'unexpected_active': unexpected_active,
              'missing_required': missing_required,
              'errors': errors,
              'source_mutation_attempted': False,
              'status': 'VERIFIED' if verified else 'READBACK_FAILED',
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          output = Path('phoenix-freeze-output/phoenix-execution-freeze.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not verified:
              raise SystemExit(1)
          PY

      - name: Upload immutable quarantine receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phoenix-execution-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: phoenix-freeze-output/phoenix-execution-freeze.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Core, Ops and provider cutover package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phoenix-cutover-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phoenix-export-output/Federation-Omega-Core.tar.gz
            phoenix-export-output/Federation-Omega-Ops.tar.gz
            phoenix-export-output/phoenix-export-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified Phoenix commit status
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          state=failure
          description='Phoenix quarantine or export verification failed'
          if jq -e '.status == "VERIFIED"' \
               phoenix-freeze-output/phoenix-execution-freeze.json >/dev/null 2>&1 \
             && jq -e '.status == "VERIFIED"' \
               phoenix-export-output/phoenix-export-receipt.json >/dev/null 2>&1; then
            state=success
            description='Phoenix quarantine and Core/Ops exports verified'
          fi
          gh api -X POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='phoenix-freeze/verified' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          test "$state" = success
