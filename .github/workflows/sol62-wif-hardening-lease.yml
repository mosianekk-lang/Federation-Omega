name: SOL 6.2 One-Use WIF Hardening Lease
run-name: SOL62-WIF-HARDENING-LEASE-${{ github.event.issue.number }}

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: sol62-wif-hardening-one-use
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  EXACT_TRIGGER_TITLE: SOL62-WIF-HARDEN-20260901

jobs:
  harden:
    if: ${{ github.event.issue.author_association == 'OWNER' && github.event.issue.title == 'SOL62-WIF-HARDEN-20260901' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact main source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Consume lease only after first successful transaction
        id: lease
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          token = os.environ['GITHUB_TOKEN']
          workflow = 'sol62-wif-hardening-lease.yml'
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?status=success&per_page=100'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get('workflow_runs', [])
          prior_success = [item for item in runs if int(item.get('id', 0)) != run_id]
          consumed = bool(prior_success)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'consumed={str(consumed).lower()}\n')
              handle.write(f'prior_success_count={len(prior_success)}\n')
          print(json.dumps({
              'lease_state': 'ALREADY_CONSUMED' if consumed else 'AVAILABLE',
              'prior_success_count': len(prior_success),
              'current_run_id': run_id,
          }, sort_keys=True))
          PY

      - name: Authenticate through current provider WIF before tightening it
        if: steps.lease.outputs.consumed != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned Google Cloud CLI action
        if: steps.lease.outputs.consumed != 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Apply least-change canonical WIF hardening and verify provider readback
        if: steps.lease.outputs.consumed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sol62-wif
          # Airlock provider-mutation marker: workload-identity-pools providers update-oidc
          test "${{ github.event.issue.title }}" = "$EXACT_TRIGGER_TITLE"
          test "${{ github.event.issue.author_association }}" = "OWNER"
          SOVARA_WIF_HARDENING_APPROVAL=HARDEN_SOVARA_CANONICAL_WIF_V1 \
            bash ./ops/harden_sovara_provider_wif_v1.sh --apply \
            | tee /tmp/sol62-wif/WIF_HARDEN_APPLY.json
          bash ./ops/harden_sovara_provider_wif_v1.sh --verify \
            | tee /tmp/sol62-wif/WIF_HARDEN_VERIFY.json
          python3 - <<'PY'
          import hashlib, json
          apply=json.load(open('/tmp/sol62-wif/WIF_HARDEN_APPLY.json', encoding='utf-8'))
          verify=json.load(open('/tmp/sol62-wif/WIF_HARDEN_VERIFY.json', encoding='utf-8'))
          assert apply.get('schema') == 'SOVARA_WIF_HARDENING_V1', apply
          assert apply.get('state') in {'APPLIED_AND_VERIFIED','ALREADY_HARDENED'}, apply
          assert verify.get('schema') == 'SOVARA_WIF_HARDENING_V1', verify
          assert verify.get('mode') == 'verify', verify
          assert verify.get('state') == 'VERIFIED', verify
          assert verify.get('project_number_observed') == '257649435135', verify
          assert verify.get('provider_state') == 'ACTIVE', verify
          assert verify.get('condition_match') is True, verify
          assert verify.get('mapping_match') is True, verify
          assert verify.get('exact_repository_id_binding_present') is True, verify
          assert verify.get('broad_repository_name_binding_present') is False, verify
          assert verify.get('required_mutations') == [], verify
          for receipt in (apply, verify):
              assert receipt.get('service_account_created') is False, receipt
              assert receipt.get('secret_payload_accessed') is False, receipt
              assert receipt.get('model_inference_performed') is False, receipt
              assert receipt.get('traffic_change_performed') is False, receipt
              assert len(str(receipt.get('receipt_sha256') or '')) == 64, receipt
          final={
            'receipt':'SOL62-WIF-HARDENING-VERIFIED',
            'state':'VERIFIED',
            'provider_verify_receipt_sha256':verify['receipt_sha256'],
            'provider_apply_receipt_sha256':apply['receipt_sha256'],
            'provider_mutation_performed':bool(apply.get('mutation_performed', False)),
            'condition_match':True,
            'mapping_match':True,
            'exact_repository_id_binding_present':True,
            'broad_repository_name_binding_present':False,
            'secret_payload_accessed':False,
            'service_account_created':False,
            'model_inference_performed':False,
            'traffic_change_performed':False,
            'lease_consumed_on_success':True,
          }
          final['receipt_sha256']=hashlib.sha256(json.dumps(final,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('/tmp/sol62-wif/SOL62_WIF_HARDENING_RECEIPT.json','w',encoding='utf-8').write(json.dumps(final,indent=2,sort_keys=True)+'\n')
          print(json.dumps(final, sort_keys=True))
          PY

      - name: Emit already-consumed no-effect receipt
        if: steps.lease.outputs.consumed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sol62-wif
          python3 - <<'PY'
          import hashlib, json, os
          receipt={
            'receipt':'SOL62-WIF-HARDENING-LEASE',
            'state':'ALREADY_CONSUMED',
            'provider_mutation_performed':False,
            'provider_authentication_performed':False,
            'prior_success_count':int(os.environ.get('PRIOR_SUCCESS_COUNT','0')),
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          open('/tmp/sol62-wif/SOL62_WIF_HARDENING_RECEIPT.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
        env:
          PRIOR_SUCCESS_COUNT: ${{ steps.lease.outputs.prior_success_count }}

      - name: Upload immutable redacted WIF receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol62-wif-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sol62-wif
          if-no-files-found: error
          retention-days: 90
