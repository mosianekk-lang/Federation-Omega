name: SOL 6.2 One-Use WIF Hardening Lease

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sol62-wif-hardening-one-use
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  POOL_ID: github-federation-omega
  PROVIDER_ID: github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  EXACT_PRINCIPAL: principalSet://iam.googleapis.com/projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/attribute.repository_id/1292795464
  BROAD_PRINCIPAL: principalSet://iam.googleapis.com/projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/attribute.repository/mosianekk-lang/Federation-Omega
  EXACT_TRIGGER_TITLE: SOL62-WIF-HARDEN-20260901
  SOURCE_SHA: ${{ github.sha }}

jobs:
  harden:
    if: ${{ github.event.issue.author_association == 'OWNER' && github.event.issue.title == 'SOL62-WIF-HARDEN-20260901' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact issue-event source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate through current provider WIF before tightening it
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot exact provider and affected IAM prestate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sol62-wif /tmp/sol62-wif-private
          test "${{ github.event.issue.title }}" = "$EXACT_TRIGGER_TITLE"
          test "${{ github.event.issue.author_association }}" = "OWNER"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project "$PROJECT_ID" \
            --location global \
            --workload-identity-pool "$POOL_ID" \
            --format=json > /tmp/sol62-wif-private/provider-before.json
          gcloud iam service-accounts get-iam-policy "$DEPLOYER_SA" \
            --project "$PROJECT_ID" \
            --format=json > /tmp/sol62-wif-private/iam-before.json

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          private = Path('/tmp/sol62-wif-private')
          public = Path('/tmp/sol62-wif')
          provider = json.loads((private / 'provider-before.json').read_text(encoding='utf-8'))
          iam = json.loads((private / 'iam-before.json').read_text(encoding='utf-8'))
          exact = os.environ['EXACT_PRINCIPAL']
          broad = os.environ['BROAD_PRINCIPAL']
          if provider.get('state') != 'ACTIVE':
              raise SystemExit('PROVIDER_PRESTATE_NOT_ACTIVE')
          oidc = provider.get('oidc') or {}
          issuer = oidc.get('issuerUri')
          condition = provider.get('attributeCondition')
          mapping = provider.get('attributeMapping')
          if not isinstance(issuer, str) or not issuer:
              raise SystemExit('PROVIDER_PRESTATE_ISSUER_UNREADABLE')
          if not isinstance(condition, str):
              raise SystemExit('PROVIDER_PRESTATE_CONDITION_UNREADABLE')
          if not isinstance(mapping, dict) or not mapping:
              raise SystemExit('PROVIDER_PRESTATE_MAPPING_UNREADABLE')
          members = set()
          for binding in iam.get('bindings') or []:
              if binding.get('role') == 'roles/iam.workloadIdentityUser':
                  members.update(binding.get('members') or [])
          pre = {
              'schema': 'SOL62_WIF_PRIVATE_PRESTATE_V3',
              'issuer_uri': issuer,
              'attribute_condition': condition,
              'attribute_mapping': mapping,
              'exact_binding_present': exact in members,
              'broad_binding_present': broad in members,
          }
          (private / 'prestate.json').write_text(json.dumps(pre, sort_keys=True), encoding='utf-8')
          mapping_blob = json.dumps(mapping, sort_keys=True, separators=(',', ':'))
          receipt = {
              'schema': 'SOL62_WIF_PRESTATE_RECEIPT_V3',
              'source_sha': os.environ['SOURCE_SHA'],
              'provider_state': 'ACTIVE',
              'issuer_sha256': hashlib.sha256(issuer.encode()).hexdigest(),
              'condition_sha256': hashlib.sha256(condition.encode()).hexdigest(),
              'mapping_sha256': hashlib.sha256(mapping_blob.encode()).hexdigest(),
              'exact_binding_present': pre['exact_binding_present'],
              'broad_binding_present': pre['broad_binding_present'],
              'raw_provider_persisted_in_artifact': False,
              'raw_iam_policy_persisted_in_artifact': False,
          }
          receipt['receipt_sha256'] = hashlib.sha256(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          (public / 'PRESTATE_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Apply canonical hardening with effect-aware rollback and exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIVATE=/tmp/sol62-wif-private
          PUBLIC=/tmp/sol62-wif
          MUTATION_ACKNOWLEDGED=false

          readback_effect_state() {
            # READBACK_EFFECT is deliberately read-only. Exit 0 means exact prestate
            # equivalence (therefore no mutating rollback is permitted); exit 10
            # means provider/IAM divergence; any other exit leaves effect uncertain.
            python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import time

          private = Path('/tmp/sol62-wif-private')
          public = Path('/tmp/sol62-wif')
          pre = json.loads((private / 'prestate.json').read_text(encoding='utf-8'))
          exact = os.environ['EXACT_PRINCIPAL']
          broad = os.environ['BROAD_PRINCIPAL']
          project = os.environ['PROJECT_ID']
          sa = os.environ['DEPLOYER_SA']
          pool = os.environ['POOL_ID']
          provider_id = os.environ['PROVIDER_ID']

          def run(args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout

          # A single immediate describe can be stale after an ambiguous provider call.
          # Require a bounded sequence of equivalent provider-native reads before
          # classifying a failed operation as PRESTATE_EQUIVALENT_NO_ROLLBACK.
          delays = (0, 2, 4, 8, 10, 10)
          last = None
          for attempt, delay in enumerate(delays, start=1):
              if delay:
                  time.sleep(delay)
              try:
                  provider = json.loads(run([
                      'gcloud','iam','workload-identity-pools','providers','describe',provider_id,
                      '--project',project,'--location','global','--workload-identity-pool',pool,
                      '--format=json'
                  ]))
                  iam = json.loads(run([
                      'gcloud','iam','service-accounts','get-iam-policy',sa,
                      '--project',project,'--format=json'
                  ]))
              except Exception as exc:
                  receipt = {
                      'schema': 'SOL62_WIF_EFFECT_READBACK_V1',
                      'source_sha': os.environ['SOURCE_SHA'],
                      'state': 'EFFECT_STATE_UNCERTAIN',
                      'readback_only': True,
                      'rollback_invoked': False,
                      'attempts_completed': attempt - 1,
                      'error_type': type(exc).__name__,
                  }
                  receipt['receipt_sha256'] = hashlib.sha256(
                      json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
                  ).hexdigest()
                  (public / 'EFFECT_READBACK.json').write_text(
                      json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
                  )
                  print(json.dumps(receipt, sort_keys=True))
                  raise SystemExit(11)

              members = set()
              for binding in iam.get('bindings') or []:
                  if binding.get('role') == 'roles/iam.workloadIdentityUser':
                      members.update(binding.get('members') or [])
              oidc = provider.get('oidc') or {}
              checks = {
                  'provider_state_active': provider.get('state') == 'ACTIVE',
                  'issuer_matches_prestate': oidc.get('issuerUri') == pre['issuer_uri'],
                  'condition_matches_prestate': provider.get('attributeCondition') == pre['attribute_condition'],
                  'mapping_matches_prestate': (provider.get('attributeMapping') or {}) == pre['attribute_mapping'],
                  'exact_binding_matches_prestate': (exact in members) == bool(pre['exact_binding_present']),
                  'broad_binding_matches_prestate': (broad in members) == bool(pre['broad_binding_present']),
              }
              equivalent = all(checks.values())
              last = (attempt, checks, equivalent)
              if not equivalent:
                  break

          assert last is not None
          attempt, checks, equivalent = last
          receipt = {
              'schema': 'SOL62_WIF_EFFECT_READBACK_V1',
              'source_sha': os.environ['SOURCE_SHA'],
              'state': 'PRESTATE_EQUIVALENT_NO_ROLLBACK' if equivalent else 'PROVIDER_EFFECT_DETECTED',
              'readback_only': True,
              'rollback_invoked': False,
              'attempts_completed': attempt,
              'equivalence_window_complete': equivalent and attempt == len(delays),
              **checks,
              'raw_provider_persisted_in_artifact': False,
              'raw_iam_policy_persisted_in_artifact': False,
          }
          receipt['receipt_sha256'] = hashlib.sha256(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          (public / 'EFFECT_READBACK.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          raise SystemExit(0 if equivalent else 10)
          PY
          }

          rollback_to_prestate() {
            python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          private = Path('/tmp/sol62-wif-private')
          public = Path('/tmp/sol62-wif')
          pre = json.loads((private / 'prestate.json').read_text(encoding='utf-8'))
          exact = os.environ['EXACT_PRINCIPAL']
          broad = os.environ['BROAD_PRINCIPAL']
          project = os.environ['PROJECT_ID']
          sa = os.environ['DEPLOYER_SA']
          pool = os.environ['POOL_ID']
          provider_id = os.environ['PROVIDER_ID']

          def run(args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout

          def iam_state():
              payload = json.loads(run([
                  'gcloud','iam','service-accounts','get-iam-policy',sa,
                  '--project',project,'--format=json'
              ]))
              members = set()
              for binding in payload.get('bindings') or []:
                  if binding.get('role') == 'roles/iam.workloadIdentityUser':
                      members.update(binding.get('members') or [])
              return exact in members, broad in members

          cur_exact, cur_broad = iam_state()
          for member, current, wanted in (
              (exact, cur_exact, bool(pre['exact_binding_present'])),
              (broad, cur_broad, bool(pre['broad_binding_present'])),
          ):
              if current == wanted:
                  continue
              verb = 'add-iam-policy-binding' if wanted else 'remove-iam-policy-binding'
              run([
                  'gcloud','iam','service-accounts',verb,sa,'--project',project,
                  '--role','roles/iam.workloadIdentityUser','--member',member,'--quiet'
              ])

          mapping_arg = ','.join(
              f'{key}={pre["attribute_mapping"][key]}' for key in sorted(pre['attribute_mapping'])
          )
          run('gcloud iam workload-identity-pools providers update-oidc'.split() + [
              provider_id,
              '--project',project,'--location','global','--workload-identity-pool',pool,
              '--issuer-uri=' + pre['issuer_uri'],
              '--attribute-mapping=' + mapping_arg,
              '--attribute-condition=' + pre['attribute_condition'],
          ])

          provider_after = json.loads(run([
              'gcloud','iam','workload-identity-pools','providers','describe',provider_id,
              '--project',project,'--location','global','--workload-identity-pool',pool,
              '--format=json'
          ]))
          exact_after, broad_after = iam_state()
          oidc_after = provider_after.get('oidc') or {}
          equivalent = (
              provider_after.get('state') == 'ACTIVE'
              and oidc_after.get('issuerUri') == pre['issuer_uri']
              and provider_after.get('attributeCondition') == pre['attribute_condition']
              and (provider_after.get('attributeMapping') or {}) == pre['attribute_mapping']
              and exact_after == bool(pre['exact_binding_present'])
              and broad_after == bool(pre['broad_binding_present'])
          )
          receipt = {
              'schema': 'SOL62_WIF_ROLLBACK_RECEIPT_V3',
              'source_sha': os.environ['SOURCE_SHA'],
              'state': 'ROLLBACK_EQUIVALENT' if equivalent else 'ROLLBACK_EQUIVALENCE_FAILED',
              'effect_classification': 'PROVIDER_EFFECT_DETECTED',
              'rollback_invoked': True,
              'provider_state_active': provider_after.get('state') == 'ACTIVE',
              'issuer_restored': oidc_after.get('issuerUri') == pre['issuer_uri'],
              'condition_restored': provider_after.get('attributeCondition') == pre['attribute_condition'],
              'mapping_restored': (provider_after.get('attributeMapping') or {}) == pre['attribute_mapping'],
              'exact_binding_restored': exact_after == bool(pre['exact_binding_present']),
              'broad_binding_restored': broad_after == bool(pre['broad_binding_present']),
              'raw_provider_persisted_in_artifact': False,
              'raw_iam_policy_persisted_in_artifact': False,
          }
          receipt['receipt_sha256'] = hashlib.sha256(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          (public / 'ROLLBACK_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          if not equivalent:
              raise SystemExit(97)
          PY
          }

          handle_failure() {
            original_status="$1"
            effect_window="${2:-NO_EFFECT}"
            trap - ERR
            set +e
            readback_effect_state
            effect_status=$?
            set -e
            if [[ $effect_status -eq 0 ]]; then
              # Exact provider/IAM prestate survived. A mutating rollback here would
              # be a fresh effect, so fail with readback evidence only.
              exit "$original_status"
            fi
            if [[ $effect_status -eq 10 ]]; then
              if [[ "$effect_window" == "NO_EFFECT" ]]; then
                # This transaction never entered a provider-mutation window;
                # divergence therefore cannot lawfully be attributed to this job.
                echo "Provider drift detected outside this transaction; refusing rollback" >&2
                exit 99
              fi
              # Divergence plus AMBIGUOUS_APPLY/ACKED_APPLY means this transaction
              # may have changed provider state. Only now is rollback allowed.
              set +e
              rollback_to_prestate
              rollback_status=$?
              set -e
              if [[ $rollback_status -ne 0 ]]; then
                echo "WIF rollback equivalence failed" >&2
                exit 97
              fi
              exit "$original_status"
            fi
            echo "WIF effect state uncertain; refusing mutating rollback or retry" >&2
            exit 98
          }

          test "${{ github.event.issue.title }}" = "$EXACT_TRIGGER_TITLE"
          test "${{ github.event.issue.author_association }}" = "OWNER"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s "$PRIVATE/prestate.json"
          test -s "$PUBLIC/PRESTATE_RECEIPT.json"

          bash ./ops/harden_sovara_provider_wif_v1.sh --plan \
            | tee "$PUBLIC/WIF_HARDEN_PLAN.json"
          PLAN_STATE="$(python3 -c "import json; print(json.load(open('$PUBLIC/WIF_HARDEN_PLAN.json'))['state'])")"
          if [[ "$PLAN_STATE" == "ALREADY_HARDENED" ]]; then
            cp "$PUBLIC/WIF_HARDEN_PLAN.json" "$PUBLIC/WIF_HARDEN_APPLY.json"
          elif [[ "$PLAN_STATE" == "HARDENING_REQUIRED" ]]; then
            set +e
            SOVARA_WIF_HARDENING_APPROVAL=HARDEN_SOVARA_CANONICAL_WIF_V1 \
              bash ./ops/harden_sovara_provider_wif_v1.sh --apply \
              | tee "$PUBLIC/WIF_HARDEN_APPLY.json"
            apply_status=${PIPESTATUS[0]}
            set -e
            if [[ $apply_status -ne 0 ]]; then
              handle_failure "$apply_status" "AMBIGUOUS_APPLY"
            fi
            # Successful apply is the first point where provider mutation is
            # acknowledged by the worker. Rollback remains contingent on readback.
            MUTATION_ACKNOWLEDGED=true
          else
            echo "Unexpected hardener plan state: $PLAN_STATE" >&2
            exit 12
          fi

          # From this point onward, downstream failures always enter READBACK_EFFECT.
          # Rollback is permitted only when this transaction entered a mutation window.
          if [[ "$MUTATION_ACKNOWLEDGED" == true ]]; then
            trap 'handle_failure "$?" "ACKED_APPLY"' ERR
          else
            trap 'handle_failure "$?" "NO_EFFECT"' ERR
          fi

          bash ./ops/harden_sovara_provider_wif_v1.sh --verify \
            | tee "$PUBLIC/WIF_HARDEN_VERIFY.json"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          public = Path('/tmp/sol62-wif')
          pre = json.loads((public / 'PRESTATE_RECEIPT.json').read_text(encoding='utf-8'))
          plan = json.loads((public / 'WIF_HARDEN_PLAN.json').read_text(encoding='utf-8'))
          apply = json.loads((public / 'WIF_HARDEN_APPLY.json').read_text(encoding='utf-8'))
          verify = json.loads((public / 'WIF_HARDEN_VERIFY.json').read_text(encoding='utf-8'))

          for receipt in (plan, apply, verify):
              assert receipt.get('schema') == 'SOVARA_WIF_HARDENING_V3', receipt
              assert receipt.get('provider_state') == 'ACTIVE', receipt
              assert receipt.get('event_surface_bound_per_workflow') is True, receipt
              assert receipt.get('workflow_claim') == 'workflow_ref', receipt
              assert receipt.get('event_claim') == 'event_name', receipt
              assert len(str(receipt.get('trust_contract_sha256') or '')) == 64, receipt
              assert receipt.get('service_account_created') is False, receipt
              assert receipt.get('secret_payload_accessed') is False, receipt
              assert receipt.get('model_inference_performed') is False, receipt
              assert receipt.get('traffic_change_performed') is False, receipt
              assert len(str(receipt.get('receipt_sha256') or '')) == 64, receipt

          assert plan.get('state') in {'HARDENING_REQUIRED','ALREADY_HARDENED'}, plan
          if plan.get('state') == 'ALREADY_HARDENED':
              assert apply.get('state') == 'ALREADY_HARDENED', apply
              assert apply.get('mode') == 'plan', apply
              assert apply.get('mutation_performed') is False, apply
          else:
              assert apply.get('mode') == 'apply', apply
              assert apply.get('state') == 'APPLIED_AND_VERIFIED', apply
              assert apply.get('mutation_performed') is True, apply
              assert apply.get('broad_repository_name_binding_effective') is False, apply
              assert apply.get('broad_repository_attribute_mapped') is False, apply

          assert verify.get('mode') == 'verify', verify
          assert verify.get('state') == 'VERIFIED', verify
          assert verify.get('project_number_observed') == '257649435135', verify
          assert verify.get('condition_match') is True, verify
          assert verify.get('mapping_match') is True, verify
          assert verify.get('exact_repository_id_binding_present') is True, verify
          assert verify.get('broad_repository_attribute_mapped') is False, verify
          assert verify.get('broad_repository_name_binding_effective') is False, verify
          if verify.get('broad_repository_name_binding_present'):
              assert verify.get('legacy_broad_repository_name_binding_inert') is True, verify
          assert verify.get('physical_legacy_binding_removal_required') is False, verify
          assert verify.get('required_mutations') == [], verify

          final = {
              'receipt': 'SOL62-WIF-HARDENING-TRANSACTION-VERIFIED',
              'state': 'VERIFIED',
              'source_sha': os.environ['SOURCE_SHA'],
              'prestate_receipt_sha256': pre['receipt_sha256'],
              'provider_verify_receipt_sha256': verify['receipt_sha256'],
              'provider_apply_or_noop_receipt_sha256': apply['receipt_sha256'],
              'provider_mutation_performed': bool(apply.get('mutation_performed', False)),
              'condition_match': True,
              'mapping_match': True,
              'event_surface_bound_per_workflow': True,
              'trust_contract_sha256': verify['trust_contract_sha256'],
              'exact_repository_id_binding_present': True,
              'broad_repository_name_binding_present': bool(verify.get('broad_repository_name_binding_present')),
              'broad_repository_attribute_mapped': False,
              'broad_repository_name_binding_effective': False,
              'legacy_broad_repository_name_binding_inert': bool(verify.get('legacy_broad_repository_name_binding_inert')),
              'physical_legacy_binding_removal_required': False,
              'effect_aware_rollback': True,
              'pre_effect_failure_mutating_rollback': False,
              'rollback_performed': False,
              'raw_provider_persisted_in_artifact': False,
              'raw_iam_policy_persisted_in_artifact': False,
              'secret_payload_accessed': False,
              'service_account_created': False,
              'model_inference_performed': False,
              'traffic_change_performed': False,
          }
          final['receipt_sha256'] = hashlib.sha256(
              json.dumps(final, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          (public / 'SOL62_WIF_HARDENING_RECEIPT.json').write_text(
              json.dumps(final, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(final, sort_keys=True))
          PY

          MUTATION_ACKNOWLEDGED=false
          trap - ERR

      - name: Upload immutable sanitized WIF transaction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol62-wif-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sol62-wif
          if-no-files-found: warn
          retention-days: 90
