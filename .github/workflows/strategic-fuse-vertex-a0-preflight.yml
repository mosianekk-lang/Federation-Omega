name: Strategic FUSE Vertex A0 Preflight

on:
  pull_request:
    paths:
      - 'bubbles/strategic_fuse_vertex_preflight_v1.py'
      - 'tests/test_bubbles_strategic_fuse_vertex_preflight_v1.py'
      - '.github/workflows/strategic-fuse-vertex-a0-preflight.yml'
      - 'governance/proofos_omega_policy_extension_strategic_fuse_vertex_a0_v1.json'
  push:
    branches: [main]
    paths:
      - 'bubbles/strategic_fuse_vertex_preflight_v1.py'
      - '.github/workflows/strategic-fuse-vertex-a0-preflight.yml'
      - 'governance/proofos_omega_policy_extension_strategic_fuse_vertex_a0_v1.json'

permissions:
  contents: read

concurrency:
  group: strategic-fuse-vertex-a0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Strategic FUSE Vertex A0 truth contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_bubbles_strategic_fuse_vertex_preflight_v1 -v

  provider-a0:
    needs: source-contract
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[STRATFUSE-VERTEX-PREFLIGHT]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute zero-inference Vertex capability read
        env:
          FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strategic-fuse-vertex-a0-output
          python -m bubbles.strategic_fuse_vertex_preflight_v1 \
            --operator 'https://federation-omega-operator-257649435135.africa-south1.run.app' \
            --source-ref "github-main:${GITHUB_SHA}" \
            --output strategic-fuse-vertex-a0-output/receipt.json
      - name: Publish truth-bounded preflight summary
        if: always() && hashFiles('strategic-fuse-vertex-a0-output/receipt.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          echo '## Strategic FUSE Vertex A0 Preflight' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat strategic-fuse-vertex-a0-output/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable preflight receipt
        if: always() && hashFiles('strategic-fuse-vertex-a0-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-fuse-vertex-a0-${{ github.run_id }}-${{ github.run_attempt }}
          path: strategic-fuse-vertex-a0-output/receipt.json
          if-no-files-found: error
          retention-days: 90
