name: JARVIS Ultimate Dependency Proof

on:
  pull_request:
    paths:
      - "services/jarvis-ultimate/**"
      - ".github/workflows/jarvis-ultimate-dependency-proof.yml"
  push:
    branches: [main]
    paths:
      - "services/jarvis-ultimate/**"
      - ".github/workflows/jarvis-ultimate-dependency-proof.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-ultimate-dependency-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-installed-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/jarvis-ultimate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Verify lock is current and install exact resolution
        run: |
          uv lock --check
          uv sync --frozen

      - name: Run installed-package and system tests
        run: |
          PYTHONPATH=. uv run --frozen python -m unittest discover -s tests -p 'test_*.py' -v
          uv run --frozen python -m compileall -q jarvis tests scripts
