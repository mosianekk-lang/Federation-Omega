name: Package FO Faster Whisper Small

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fo-faster-whisper-small-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Faster-Whisper small.en model
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/fo-faster-whisper-small
          mkdir -p "$ROOT/model"
          python -m pip install --quiet huggingface-hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-small.en',
              local_dir='/tmp/fo-faster-whisper-small/model',
              local_dir_use_symlinks=False,
              allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json']
          )
          PY
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          du -sh "$ROOT"
      - uses: actions/upload-artifact@v7
        with:
          name: fo-faster-whisper-small-en-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: /tmp/fo-faster-whisper-small/
