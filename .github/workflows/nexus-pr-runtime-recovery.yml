name: NEXUS PR Runtime Recovery

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/nexus-pr-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_URL: https://super-ai-ui-agent-worker-7ujkyf136q-uc.a.run.app

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe recovered direct worker contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-recovery
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base=os.environ['WORKER_URL'].rstrip('/')
          def call(path, method='GET', body=None):
              headers={'accept':'application/json'}; data=None
              if body is not None:
                  headers['content-type']='application/json'; data=json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed={'text':raw[:12000]}
                      return {'http_status':r.status,'final_url':r.geturl(),'headers':dict(r.headers.items()),'body':parsed}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except Exception: parsed={'text':raw[:12000]}
                  return {'http_status':e.code,'final_url':e.geturl(),'headers':dict(e.headers.items()),'body':parsed}
              except Exception as e:
                  return {'error':type(e).__name__,'message':str(e)[:1000]}

          probes={}
          for path in ['/','/health','/status','/openapi.json','/docs','/run-queue']:
              probes['GET '+path]=call(path)
          probes['POST /run-queue']=call('/run-queue','POST',{'source':'NEXUS_RUNTIME_RECOVERY','mode':'dry_run','mutation':'NONE'})
          receipt={'receipt':'NEXUS-DIRECT-WORKER-DISCOVERY','recorded_at':datetime.now(timezone.utc).isoformat(),
                   'worker_url':base,'mutation_attempted':False,'secret_values_recorded':False,'probes':probes}
          Path('/tmp/nexus-recovery/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-direct-worker-discovery
          path: /tmp/nexus-recovery/receipt.json
          if-no-files-found: error
          retention-days: 7
