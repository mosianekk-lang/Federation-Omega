name: NEXUS PR Runtime Recovery

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/nexus-pr-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHON_URL: https://archon-admin-plane-7ujkyfl36q-bq.a.run.app

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ARCHON Admin Plane public contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-recovery
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path

          def call(url, method='GET', body=None, headers=None):
              h={'accept':'application/json'}
              if headers: h.update(headers)
              data=None
              if body is not None:
                  h['content-type']='application/json'; data=json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed={'text':raw[:12000]}
                      return {'http_status':r.status,'headers':dict(r.headers.items()),'body':parsed}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except Exception: parsed={'text':raw[:12000]}
                  return {'http_status':e.code,'headers':dict(e.headers.items()),'body':parsed}
              except Exception as e:
                  return {'error':type(e).__name__,'message':str(e)[:700]}

          base=os.environ['ARCHON_URL'].rstrip('/')
          paths=['/','/health','/status','/openapi.yaml','/openapi.json','/.well-known/openapi.json','/api/admin/command']
          probes={p:call(base+p) for p in paths}
          probes['post_health_no_token']=call(base+'/api/admin/command','POST',{'command':'health_check','payload':{},'source':'nexus-public-contract-probe'})
          probes['post_project_no_token']=call(base+'/api/admin/command','POST',{'command':'project_info','payload':{},'source':'nexus-public-contract-probe'})
          receipt={'receipt':'NEXUS-ARCHON-ADMIN-PLANE-PUBLIC-CONTRACT','secret_values_recorded':False,'mutation_attempted':False,'probes':probes}
          Path('/tmp/nexus-recovery/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-archon-admin-plane-contract
          path: /tmp/nexus-recovery/receipt.json
          if-no-files-found: error
          retention-days: 7
