name: NEXUS PR Runtime Recovery

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/nexus-pr-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEADMAN_URL: https://script.google.com/macros/s/AKfycbyexLOXcQw0kdXnw2XJIplln2HZpzouQcsiOw6v9-RWtSZI1sPHFSXW1OL0RpjI0taLjQ/exec

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute pre-signed one-time queue recovery request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-recovery
          printf '%s' '' | base64 -d > /tmp/nexus-recovery/request.json
          code=$(curl --location --silent --show-error --output /tmp/nexus-recovery/response.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data-binary @/tmp/nexus-recovery/request.json "$DEADMAN_URL")
          python - "$code" <<'PY'
          import json, sys
          from pathlib import Path
          code=int(sys.argv[1])
          raw=Path('/tmp/nexus-recovery/response.json').read_text(encoding='utf-8',errors='replace')
          try: body=json.loads(raw)
          except Exception: body={'text':raw[:4000]}
          receipt={'receipt':'NEXUS-SIGNED-DEADMAN-RECOVERY','http_status':code,'body':body,'secret_values_recorded':False}
          Path('/tmp/nexus-recovery/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if code < 200 or code >= 300:
              raise SystemExit(1)
          status=str(body.get('status','')) if isinstance(body,dict) else ''
          if status not in {'DEADMAN_SEMANTIC_EXECUTION_VERIFIED','DEADMAN_LOCK_BUSY_RETRY_SAFE'}:
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-signed-deadman-recovery
          path: /tmp/nexus-recovery/receipt.json
          if-no-files-found: error
          retention-days: 7
