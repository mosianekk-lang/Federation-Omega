name: NEXUS PR Runtime Recovery

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/nexus-pr-runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEADMAN_URL: https://script.google.com/macros/s/AKfycbyexLOXcQw0kdXnw2XJIplln2HZpzouQcsiOw6v9-RWtSZI1sPHFSXW1OL0RpjI0taLjQ/exec

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve deployment route and execute one-time signed request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-recovery
          printf '%s' '' | base64 -d > /tmp/nexus-recovery/request.json
          set +e
          curl --silent --show-error --dump-header /tmp/nexus-recovery/headers.txt \
            --output /tmp/nexus-recovery/initial-body.txt --max-redirs 0 \
            --request POST --header 'Content-Type: application/json' \
            --data-binary @/tmp/nexus-recovery/request.json "$DEADMAN_URL"
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json, re, sys, urllib.error, urllib.request
          from pathlib import Path
          rc=int(sys.argv[1])
          headers=Path('/tmp/nexus-recovery/headers.txt').read_text(encoding='utf-8',errors='replace')
          initial=Path('/tmp/nexus-recovery/initial-body.txt').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'(?im)^location:\s*(\S+)',headers)
          location=m.group(1).strip() if m else None
          request_body=Path('/tmp/nexus-recovery/request.json').read_bytes()
          result={'receipt':'NEXUS-APPS-SCRIPT-ROUTE-RESOLUTION','curl_rc':rc,'initial_headers':headers[:4000],
                  'initial_body':initial[:2000],'redirect_location_present':bool(location),
                  'redirect_host':None,'redirect_response':None,'secret_values_recorded':False}
          if location:
              from urllib.parse import urlparse
              result['redirect_host']=urlparse(location).netloc
              req=urllib.request.Request(location,data=request_body,headers={'content-type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: body=json.loads(raw)
                      except Exception: body={'text':raw[:3000]}
                      result['redirect_response']={'http_status':r.status,'body':body}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  result['redirect_response']={'http_status':e.code,'body_text':raw[:3000]}
              except Exception as e:
                  result['redirect_response']={'error':type(e).__name__,'message':str(e)[:500]}
          Path('/tmp/nexus-recovery/receipt.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apps-script-route-resolution
          path: /tmp/nexus-recovery/receipt.json
          if-no-files-found: error
          retention-days: 7
