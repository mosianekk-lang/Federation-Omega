name: ACME v3 CI

on:
  pull_request:
    paths:
      - 'doctrine/ACME-001-v3.0.md'
      - 'tests/test_acme_v3.py'
      - '.github/workflows/acme-v3-ci.yml'
  push:
    branches: [main]
    paths:
      - 'doctrine/ACME-001-v3.0.md'
      - 'tests/test_acme_v3.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_acme_v3.py
