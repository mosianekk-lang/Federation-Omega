name: FEVX CSE PR Shadow Bootstrap

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    branches: ["main"]
    paths:
      - "runtime/fevx-cse/queue/bootstrap-trigger.json"

permissions:
  contents: read

concurrency:
  group: fevx-cse-pr-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CSE_WHEEL_SHA256: 8c2832a9cd844af62a5fd403038bc2cebca4aa8967826295b34b6c9660c83022

jobs:
  provider-shadow:
    if: >-
      github.event.pull_request.user.login == 'mosianekk-lang' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cse-github-shadow-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and verify exact wheel
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            systems/fevx-cse-runtime/vendor/wheel.part.00
            systems/fevx-cse-runtime/vendor/wheel.part.01
            systems/fevx-cse-runtime/vendor/wheel.part.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.00
            systems/fevx-cse-runtime/vendor/wheel.part.03.01
            systems/fevx-cse-runtime/vendor/wheel.part.03.02
            systems/fevx-cse-runtime/vendor/wheel.part.03.03
            systems/fevx-cse-runtime/vendor/wheel.part.04.00
            systems/fevx-cse-runtime/vendor/wheel.part.04.01
            systems/fevx-cse-runtime/vendor/wheel.part.04.02
            systems/fevx-cse-runtime/vendor/wheel.part.04.03
            systems/fevx-cse-runtime/vendor/wheel.part.05
            systems/fevx-cse-runtime/vendor/wheel.part.06.00
            systems/fevx-cse-runtime/vendor/wheel.part.06.01
            systems/fevx-cse-runtime/vendor/wheel.part.06.02
            systems/fevx-cse-runtime/vendor/wheel.part.06.03
            systems/fevx-cse-runtime/vendor/wheel.part.07
          )
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" | base64 --decode > /tmp/fevx_cse-1.1.0-py3-none-any.whl
          observed="$(sha256sum /tmp/fevx_cse-1.1.0-py3-none-any.whl | awk '{print $1}')"
          test "$observed" = "$CSE_WHEEL_SHA256"
          python -m zipfile -t /tmp/fevx_cse-1.1.0-py3-none-any.whl
          python -m pip install --disable-pip-version-check /tmp/fevx_cse-1.1.0-py3-none-any.whl

      - name: Execute provider-native shadow and proof cycle
        shell: bash
        run: |
          set -euo pipefail
          python systems/fevx-cse-runtime/run_shadow.py \
            --repo-root . \
            --mission systems/fevx-cse-runtime/mission.json \
            --genome systems/fevx-cse-runtime/intent_genome.json

      - name: Verify proof contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/fevx-cse')
          result=json.loads((root/'results/latest.json').read_text())
          heartbeat=json.loads((root/'heartbeat/latest.json').read_text())
          drift=json.loads((root/'drift/latest.json').read_text())
          actual=json.loads((root/'state/actual_state.json').read_text())
          assert result['status']=='VERIFIED', result
          assert result['provider']=='github_actions', result
          assert result['semantic_readback'] is True, result
          assert result['rollback_test'] is True, result
          assert result['reapply_test'] is True, result
          assert result['analysis']['module_count']==10, result
          assert result['external_effect'] is False, result
          assert heartbeat['runtime_state']=='OPERATIONAL', heartbeat
          assert heartbeat['verified'] is True, heartbeat
          assert drift['classification']=='IN_SYNC', drift
          assert actual['maturity_state']=='AUTONOMOUS_RUNTIME_VERIFIED_SHADOW', actual
          assert actual['current_verified_level']==4, actual
          assert actual['level_5_eligible'] is False, actual
          PY

      - name: Upload complete shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: fevx-cse-pr-shadow-bootstrap
          path: runtime/fevx-cse/
          if-no-files-found: error
          retention-days: 30
