name: Observe IPEP Parakeet Runtime Builds

on:
  workflow_run:
    workflows:
      - 'Package IPEP Parakeet CTC CPU Runtime'
      - 'Package IPEP Parakeet CTC CLI Runtime'
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ipep-parakeet-runtime-observer
  cancel-in-progress: false

jobs:
  publish-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture run jobs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/run.json
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          export OUT="deployment_receipts/ipep-parakeet-runtime-observation-${RUN_ID}.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          run=json.load(open('/tmp/run.json',encoding='utf-8'))
          jobs_raw=json.load(open('/tmp/jobs.json',encoding='utf-8'))
          artifacts_raw=json.load(open('/tmp/artifacts.json',encoding='utf-8'))
          jobs=[]
          for job in jobs_raw.get('jobs',[]):
              jobs.append({
                  'id':job.get('id'),
                  'name':job.get('name'),
                  'status':job.get('status'),
                  'conclusion':job.get('conclusion'),
                  'started_at':job.get('started_at'),
                  'completed_at':job.get('completed_at'),
                  'steps':[{
                      'number':s.get('number'),
                      'name':s.get('name'),
                      'status':s.get('status'),
                      'conclusion':s.get('conclusion')
                  } for s in job.get('steps',[])]
              })
          artifacts=[{
              'id':a.get('id'),
              'name':a.get('name'),
              'size_in_bytes':a.get('size_in_bytes'),
              'digest':a.get('digest'),
              'expired':a.get('expired')
          } for a in artifacts_raw.get('artifacts',[])]
          payload={
              'receipt':'IPEP-PARAKEET-RUNTIME-WORKFLOW-OBSERVATION',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'workflow_name':os.environ['WORKFLOW_NAME'],
              'run_id':int(os.environ['RUN_ID']),
              'run_url':os.environ['RUN_URL'],
              'conclusion':os.environ['CONCLUSION'],
              'source_sha':os.environ['SOURCE_SHA'],
              'run_attempt':run.get('run_attempt'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
              'jobs':jobs,
              'artifacts':artifacts,
          }
          Path(os.environ['OUT']).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          latest='deployment_receipts/ipep-parakeet-runtime-observation-latest.json'
          Path(latest).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Publish observation
        run: |
          set -euo pipefail
          git config user.name 'ipep-parakeet-observer[bot]'
          git config user.email 'ipep-parakeet-observer[bot]@users.noreply.github.com'
          git add deployment_receipts/ipep-parakeet-runtime-observation-*.json deployment_receipts/ipep-parakeet-runtime-observation-latest.json
          git commit -m "Record Parakeet runtime workflow observation [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
