name: EvidenceOps Consensus Transcription v3.1 CI

on:
  push:
    branches: [main]
    paths:
      - 'ipep/audio_engine_v3/**'
      - '.github/workflows/ipep-consensus-transcription-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipep-consensus-transcription-v31
  cancel-in-progress: false

jobs:
  test-package-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run v3.1 proof suite
        working-directory: ipep/audio_engine_v3
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log
          python -m compileall -q evidenceops_consensus
          TEST_COUNT=$(grep -E '^Ran [0-9]+ tests?' /tmp/tests.log | tail -1 | awk '{print $2}')
          test "$TEST_COUNT" -ge 10
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Build immutable source package
        working-directory: ipep/audio_engine_v3
        run: |
          set -euo pipefail
          rm -rf /tmp/ipep-consensus-v31
          mkdir -p /tmp/ipep-consensus-v31/source
          cp -R evidenceops_consensus tests README.md OPPORTUNITY_REGISTER.md pyproject.toml \
            MPMB298_CRITICAL_WINDOW_MANIFEST.json MPMB298_GOLD_SAMPLE_CALIBRATION_REGISTER.csv \
            /tmp/ipep-consensus-v31/source/
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/ipep-consensus-v31/source')
          files=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts):
              data=path.read_bytes()
              files.append({'path':str(path.relative_to(root)),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          payload={
              'contract':'EVIDENCEOPS_CONSENSUS_TRANSCRIPTION_V3_1_CI',
              'source_commit':'${{ github.sha }}',
              'run_id':${{ github.run_id }},
              'test_count':int('${{ env.TEST_COUNT }}'),
              'compile_pass':True,
              'created_at':datetime.now(timezone.utc).isoformat(),
              'files':files,
          }
          (root/'ci-receipt.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          cd /tmp/ipep-consensus-v31/source
          zip -X -r ../EvidenceOps_Consensus_Transcription_Mode_v3.1_Source.zip . -x '*__pycache__*' '*.pyc'
          cd ..
          sha256sum EvidenceOps_Consensus_Transcription_Mode_v3.1_Source.zip | tee package.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: evidenceops-consensus-transcription-v31-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/ipep-consensus-v31/EvidenceOps_Consensus_Transcription_Mode_v3.1_Source.zip
            /tmp/ipep-consensus-v31/package.sha256
            /tmp/ipep-consensus-v31/source/ci-receipt.json

      - name: Publish redacted proof receipt
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          TEST_COUNT: ${{ env.TEST_COUNT }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p deployment_receipts
          PACKAGE_SHA=$(cut -d' ' -f1 /tmp/ipep-consensus-v31/package.sha256)
          python - <<'PY' > deployment_receipts/ipep-consensus-transcription-v31-latest.json
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              'receipt':'EVIDENCEOPS-CONSENSUS-TRANSCRIPTION-V3.1-CI',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'run_id':int(os.environ['RUN_ID']),
              'source_sha':os.environ['SOURCE_SHA'],
              'tests_passed':int(os.environ['TEST_COUNT']),
              'compile_pass':True,
              'package_sha256':os.popen("cut -d' ' -f1 /tmp/ipep-consensus-v31/package.sha256").read().strip(),
              'architecture_gate':True,
              'quotation_gate':True,
              'evidence_included':False,
              'credentials_included':False,
              'conclusion':'success'
          },indent=2,sort_keys=True))
          PY
          git config user.name 'evidenceops-consensus-v31[bot]'
          git config user.email 'evidenceops-consensus-v31[bot]@users.noreply.github.com'
          git add deployment_receipts/ipep-consensus-transcription-v31-latest.json
          git commit -m 'Record EvidenceOps consensus v3.1 CI receipt [skip ci]' || exit 0
          git push origin HEAD:main
