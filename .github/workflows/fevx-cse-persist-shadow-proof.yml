name: FEVX CSE Persist Shadow Proof

on:
  workflow_run:
    workflows: ["FEVX CSE PR Shadow Bootstrap"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: fevx-cse-persist-shadow-proof
  cancel-in-progress: false

jobs:
  verify-and-persist:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'cse-github-shadow-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact successful provider artifact
        uses: actions/download-artifact@v4
        with:
          name: fevx-cse-pr-shadow-bootstrap
          path: /tmp/fevx-cse-proof
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify proof, state and hash chain
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          root = Path('/tmp/fevx-cse-proof')
          result = json.loads((root / 'results/latest.json').read_text())
          repair = json.loads((root / 'results/compatibility_repair.json').read_text())
          heartbeat = json.loads((root / 'heartbeat/latest.json').read_text())
          drift = json.loads((root / 'drift/latest.json').read_text())
          actual = json.loads((root / 'state/actual_state.json').read_text())
          proof = json.loads((root / f"proofs/{result['proof_id']}.json").read_text())
          head = json.loads((root / 'proofs/proof_chain_head.json').read_text())
          checkpoint = json.loads((root / 'checkpoints/latest.json').read_text())
          sql_bytes = (root / 'state/cse_state.sql').read_bytes()

          def canonical(value: Any) -> bytes:
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')

          computed_sql = hashlib.sha256(sql_bytes).hexdigest()
          proof_without_hash = dict(proof)
          claimed_proof_hash = proof_without_hash.pop('record_hash')
          computed_proof_hash = hashlib.sha256(canonical(proof_without_hash)).hexdigest()

          checks = {
              'source_run_matches': str(result['execution_id']) == os.environ['SOURCE_RUN_ID'],
              'source_head_matches': result['commit_sha'] == os.environ['SOURCE_HEAD_SHA'],
              'result_verified': result['status'] == 'VERIFIED',
              'provider_native': result['provider'] == 'github_actions',
              'semantic_readback': result['semantic_readback'] is True,
              'rollback_test': result['rollback_test'] is True,
              'reapply_test': result['reapply_test'] is True,
              'module_count_10': result['analysis']['module_count'] == 10,
              'bounded_evolution': result['evolution']['score'] == 1.0,
              'ledger_integrity': result['integrity']['status'] == 'PASSED',
              'compatibility_repair': repair['semantic_readback'] is True and repair['external_effect'] is False,
              'no_external_effect': result['external_effect'] is False and actual['external_effect'] is False,
              'heartbeat_verified': heartbeat['verified'] is True and heartbeat['runtime_state'] == 'OPERATIONAL',
              'drift_in_sync': drift['classification'] == 'IN_SYNC' and not drift['differences'],
              'level_4_shadow': actual['current_verified_level'] == 4 and actual['maturity_state'] == 'AUTONOMOUS_RUNTIME_VERIFIED_SHADOW',
              'level_5_held': actual['level_5_eligible'] is False and actual['real_workflow_evidence'] is False,
              'sql_hash_matches_result': computed_sql == result['after_state_sha256'],
              'sql_hash_matches_heartbeat': computed_sql == heartbeat['database_dump_sha256'],
              'proof_hash_valid': computed_proof_hash == claimed_proof_hash,
              'proof_hash_matches_result': claimed_proof_hash == result['proof_hash'],
              'proof_hash_matches_heartbeat': claimed_proof_hash == heartbeat['proof_hash'],
              'proof_chain_head_matches': head['head_hash'] == claimed_proof_hash and head['proof_id'] == result['proof_id'],
              'ledger_head_matches': proof['ledger_head_hash'] == result['integrity']['ledger_head_hash'] == heartbeat['ledger_head_hash'],
              'checkpoint_matches_ledger': checkpoint['event_hash'] == result['integrity']['ledger_head_hash'],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(json.dumps({'failed_checks': failed, 'checks': checks}, indent=2))

          receipt = {
              'receipt': 'FEVX-CSE-PROVIDER-SHADOW-PERSISTENCE',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'proof_id': result['proof_id'],
              'proof_hash': claimed_proof_hash,
              'ledger_head_hash': result['integrity']['ledger_head_hash'],
              'database_dump_sha256': computed_sql,
              'analysis_output_hash': result['analysis']['output_hash'],
              'analysis_semantic_hash': result['analysis']['semantic_hash'],
              'checks': checks,
              'status': 'VERIFIED_FOR_CANONICAL_PERSISTENCE',
              'maturity_state': 'AUTONOMOUS_RUNTIME_VERIFIED_SHADOW',
              'current_verified_level': 4,
              'level_5_eligible': False,
              'next_gate': 'SUPERVISED_REAL_WORKFLOW_CANARIES',
              'external_effect': False,
          }
          (root / 'results/provider_persistence_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist exact artifact bytes to canonical runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/fevx-cse
          cp -a /tmp/fevx-cse-proof/. runtime/fevx-cse/
          git config user.name "fevx-cse-proof-persistence[bot]"
          git config user.email "fevx-cse-proof-persistence[bot]@users.noreply.github.com"
          git add runtime/fevx-cse
          if git diff --cached --quiet; then
            echo "Provider proof already canonical"
          else
            git commit -m "Persist verified FEVX CSE provider shadow proof [skip cse-persist]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload canonical persistence receipt
        uses: actions/upload-artifact@v4
        with:
          name: fevx-cse-provider-shadow-persistence
          path: /tmp/fevx-cse-proof/results/provider_persistence_receipt.json
          if-no-files-found: error
          retention-days: 30
