name: SLOS G0 Read-Only WIF and ADC Canary v2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: slos-g0-read-only-auth-canary-v2
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: federation-omega
  SLOS_RELEASE_SHA256: 979f4f6423920ed32d0a46f9eac069d92f045e350210f6ad3932ed8c90e7dd84

jobs:
  g0-read-only:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] SLOS_G0_READ_ONLY_AUTH_CANARY_V2' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate through canonical keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify current WIF identity and isolate legacy deploy-readiness gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g0-output
          bash ./ops/bootstrap_github_wif.sh --plan | tee g0-output/wif-plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          p=json.load(open('g0-output/wif-plan.json',encoding='utf-8'))
          assert p['project']=='sov-hybrid-suite',p
          assert p['project_number_observed']=='257649435135',p
          assert p['active_account']==os.environ['DEPLOYER_SA'],p
          assert p['deployer_exists'] is True,p
          assert p['pool_state']=='ACTIVE',p
          assert p['provider_state']=='ACTIVE',p
          assert p['wif_binding'] is True,p
          assert p['service_usage_consumer'] is True,p
          assert p['mutation_performed'] is False,p
          condition=str(p.get('provider_condition') or '')
          assert 'assertion.repository' in condition and 'mosianekk-lang/Federation-Omega' in condition,p

          hardening=[]
          if condition != str(p.get('provider_condition_expected') or ''):
              hardening.append('provider_attribute_condition_ref_scope')
          for item in p.get('missing_controls') or []:
              if item == 'provider_attribute_mapping':
                  hardening.append(item)
          deploy_controls={
              'cloud_run_developer_role',
              'cloud_run_invoker_role',
              'artifact_registry_writer_role',
              'runtime_service_account_user_role',
              'existing_cloud_run_service',
              'existing_artifact_registry_repository',
              'required_apis',
          }
          deployment=sorted(set(p.get('missing_controls') or []) & deploy_controls)
          receipt={
              'schema':'FEDOMEGA_WIF_IDENTITY_PROOF_V1',
              'state':'WIF_IDENTITY_VERIFIED',
              'project_id':p['project'],
              'project_number':p['project_number_observed'],
              'active_account':p['active_account'],
              'workload_identity_provider':p['workload_identity_provider'],
              'pool_state':p['pool_state'],
              'provider_state':p['provider_state'],
              'wif_binding':p['wif_binding'],
              'service_usage_consumer':p['service_usage_consumer'],
              'security_hardening_gaps':sorted(set(hardening)),
              'legacy_resource_local_deployment_gaps':deployment,
              'identity_verified_independent_of_deploy_roles':True,
              'mutation_performed':False,
              'provider_effect_executed':False,
          }
          Path('g0-output/wif-identity.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Resolve effective FUSE Mobile deployment authority without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          project=os.environ['PROJECT_ID']
          region=os.environ['REGION']
          deployer=f"serviceAccount:{os.environ['DEPLOYER_SA']}"
          runtime=f"serviceAccount:{os.environ['RUNTIME_SA']}"
          repo=os.environ['ARTIFACT_REPOSITORY']

          def gcloud(*args):
              p=subprocess.run(['gcloud',*args,'--project',project],text=True,capture_output=True)
              return p.returncode,p.stdout.strip(),p.stderr.strip()

          def policy(*args):
              rc,out,err=gcloud(*args,'--format=json')
              if rc != 0:
                  return {'ok':False,'bindings':[],'error_class':'GCLOUD_READ_FAILED','stderr_sha256':__import__('hashlib').sha256(err.encode()).hexdigest()}
              obj=json.loads(out or '{}')
              return {'ok':True,'bindings':obj.get('bindings') or []}

          def unconditional_member_has_role(p, role, member):
              return any(
                  b.get('role') == role and not b.get('condition') and member in (b.get('members') or [])
                  for b in p.get('bindings') or []
              )

          project_policy=policy('projects','get-iam-policy',project)
          repo_policy=policy('artifacts','repositories','get-iam-policy',repo,'--location',region)
          runtime_policy=policy('iam','service-accounts','get-iam-policy',os.environ['RUNTIME_SA'])

          project_run_developer=unconditional_member_has_role(project_policy,'roles/run.developer',deployer)
          project_run_invoker=unconditional_member_has_role(project_policy,'roles/run.invoker',deployer) or unconditional_member_has_role(project_policy,'roles/run.servicesInvoker',deployer)
          project_ar_writer=unconditional_member_has_role(project_policy,'roles/artifactregistry.writer',deployer)
          project_sa_user=unconditional_member_has_role(project_policy,'roles/iam.serviceAccountUser',deployer)
          repo_ar_writer=unconditional_member_has_role(repo_policy,'roles/artifactregistry.writer',deployer)
          runtime_sa_user=unconditional_member_has_role(runtime_policy,'roles/iam.serviceAccountUser',deployer)

          api_states={}
          for api in ('run.googleapis.com','artifactregistry.googleapis.com','iamcredentials.googleapis.com','sts.googleapis.com'):
              rc,out,_=gcloud('services','list','--enabled',f'--filter=config.name={api}','--format=value(config.name)')
              api_states[api]=rc == 0 and api in out.splitlines()

          rc,repo_desc,_=gcloud('artifacts','repositories','describe',repo,'--location',region,'--format=json(name,format,mode)')
          repository_exists=rc == 0
          rc,sa_desc,_=gcloud('iam','service-accounts','describe',os.environ['RUNTIME_SA'],'--format=json(email,disabled)')
          runtime_sa_exists=rc == 0

          effective_run_developer=project_run_developer
          effective_invoke=project_run_developer or project_run_invoker
          effective_ar_writer=project_ar_writer or repo_ar_writer
          effective_sa_user=project_sa_user or runtime_sa_user
          required_apis=all(api_states.values())
          direct_deploy_ready=all((
              effective_run_developer,
              effective_ar_writer,
              effective_sa_user,
              repository_exists,
              runtime_sa_exists,
              required_apis,
          ))
          private_canary_invoke_ready=direct_deploy_ready and effective_invoke
          missing=[]
          if not effective_run_developer: missing.append('effective_cloud_run_developer')
          if not effective_ar_writer: missing.append('effective_artifact_registry_writer')
          if not effective_sa_user: missing.append('effective_runtime_service_account_user')
          if not repository_exists: missing.append('artifact_repository_exists')
          if not runtime_sa_exists: missing.append('runtime_service_account_exists')
          if not required_apis: missing.append('required_apis')
          if direct_deploy_ready and not private_canary_invoke_ready: missing.append('private_canary_invocation_authority')

          receipt={
              'schema':'FUSE_MOBILE_GOOGLE_DEPLOYMENT_AUTHORITY_V1',
              'state':'FUSE_MOBILE_DIRECT_DEPLOY_READY' if direct_deploy_ready else 'FUSE_MOBILE_DIRECT_DEPLOY_HELD',
              'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
              'project_id':project,
              'project_number':os.environ['PROJECT_NUMBER'],
              'region':region,
              'active_account':os.environ['DEPLOYER_SA'],
              'runtime_service_account':os.environ['RUNTIME_SA'],
              'artifact_repository':repo,
              'project_policy_readable':project_policy['ok'],
              'artifact_repository_policy_readable':repo_policy['ok'],
              'runtime_service_account_policy_readable':runtime_policy['ok'],
              'project_run_developer':project_run_developer,
              'project_run_invoker':project_run_invoker,
              'project_artifact_registry_writer':project_ar_writer,
              'project_service_account_user':project_sa_user,
              'repository_artifact_registry_writer':repo_ar_writer,
              'runtime_service_account_user':runtime_sa_user,
              'effective_cloud_run_developer':effective_run_developer,
              'effective_cloud_run_invoker':effective_invoke,
              'effective_artifact_registry_writer':effective_ar_writer,
              'effective_runtime_service_account_user':effective_sa_user,
              'artifact_repository_exists':repository_exists,
              'runtime_service_account_exists':runtime_sa_exists,
              'api_states':api_states,
              'direct_runner_build_push_deploy_ready':direct_deploy_ready,
              'private_canary_invoke_ready':private_canary_invoke_ready,
              'missing_controls':missing,
              'conditional_bindings_not_promoted':True,
              'provider_mutation_performed':False,
              'secret_payload_accessed':False,
          }
          Path('g0-output/fuse-mobile-deploy-readiness.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({
              'state':receipt['state'],
              'direct_runner_build_push_deploy_ready':direct_deploy_ready,
              'private_canary_invoke_ready':private_canary_invoke_ready,
              'missing_controls':missing,
          },sort_keys=True))
          PY

      - name: Verify ADC credential transport and isolate Gemini deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects describe "$PROJECT_ID" --format=json > g0-output/project-readback.json
          bash ./ops/bootstrap_gemini_gateway.sh --plan | tee g0-output/gemini-plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import unquote

          cred_path=Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])
          assert cred_path.is_file(),cred_path
          cred=json.loads(cred_path.read_text(encoding='utf-8'))
          assert cred.get('type')=='external_account',cred.get('type')
          audience=str(cred.get('audience') or '')
          assert os.environ['WIF_PROVIDER'] in audience,audience
          impersonation=unquote(str(cred.get('service_account_impersonation_url') or ''))
          assert os.environ['DEPLOYER_SA'] in impersonation,impersonation

          project=json.load(open('g0-output/project-readback.json',encoding='utf-8'))
          observed=str(project.get('projectNumber') or '')
          assert observed==os.environ['PROJECT_NUMBER'],observed

          plan=json.load(open('g0-output/gemini-plan.json',encoding='utf-8'))
          assert plan['project_id']==os.environ['PROJECT_ID'],plan
          assert plan['project_number_observed']==os.environ['PROJECT_NUMBER'],plan
          assert plan['active_account']==os.environ['DEPLOYER_SA'],plan
          assert plan['mutation_performed'] is False,plan
          assert plan['service_account_key_created'] is False,plan
          assert plan['secret_payload_accessed'] is False,plan

          receipt={
              'schema':'FEDOMEGA_GITHUB_WIF_ADC_TRANSPORT_PROOF_V1',
              'state':'GITHUB_WIF_ADC_TRANSPORT_VERIFIED',
              'credential_type':'external_account',
              'project_id':plan['project_id'],
              'project_number':plan['project_number_observed'],
              'active_account':plan['active_account'],
              'wif_provider_bound':True,
              'service_account_impersonation_bound':True,
              'gemini_deployment_ready':not bool(plan.get('missing_controls')),
              'gemini_deployment_readiness_gaps':sorted(plan.get('missing_controls') or []),
              'gemini_missing_apis':sorted(plan.get('missing_apis') or []),
              'service_account_key_created':False,
              'secret_payload_accessed':False,
              'mutation_performed':False,
              'provider_effect_executed':False,
          }
          Path('g0-output/adc-identity.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Run Strategic FUSE direct WIF Vertex A0 read
        shell: bash
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m bubbles.strategic_fuse_vertex_direct_wif_v1 \
            --source-ref "$SOURCE_REF" \
            --output g0-output/strategic-fuse-vertex-a0-direct-wif.json

      - name: Compile receiver-local workload identity receipt
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          wif=json.load(open('g0-output/wif-identity.json',encoding='utf-8'))
          deploy=json.load(open('g0-output/fuse-mobile-deploy-readiness.json',encoding='utf-8'))
          adc=json.load(open('g0-output/adc-identity.json',encoding='utf-8'))
          a0=json.load(open('g0-output/strategic-fuse-vertex-a0-direct-wif.json',encoding='utf-8'))
          assert wif['state']=='WIF_IDENTITY_VERIFIED',wif
          assert adc['state']=='GITHUB_WIF_ADC_TRANSPORT_VERIFIED',adc
          r={
            'schema':'BUBBLES_CFBE_OMEGA_WORKLOAD_IDENTITY_RECEIPT_V1',
            'state':'WORKLOAD_IDENTITY_VERIFIED',
            'fhu_047_workload_identity_proven':True,
            'release_sha256':os.environ['SLOS_RELEASE_SHA256'],
            'source_sha':os.environ['SOURCE_SHA'],
            'issue_number':int(os.environ['ISSUE_NUMBER']),
            'issue_actor':os.environ['ISSUE_ACTOR'],
            'issue_author_association':os.environ['ISSUE_ASSOCIATION'],
            'project_id':os.environ['PROJECT_ID'],
            'project_number':os.environ['PROJECT_NUMBER'],
            'region':os.environ['REGION'],
            'wif_identity':wif,
            'fuse_mobile_deployment_authority':deploy,
            'adc_transport':adc,
            'strategic_fuse_vertex_a0':a0,
            'direct_vertex_a0_verified':a0.get('state')=='VERTEX_A0_DIRECT_WIF_READBACK_VERIFIED',
            'fuse_mobile_direct_deploy_ready':deploy['direct_runner_build_push_deploy_ready'],
            'fuse_mobile_private_canary_invoke_ready':deploy['private_canary_invoke_ready'],
            'security_hardening_complete':not bool(wif['security_hardening_gaps']),
            'long_lived_service_account_key_used':False,
            'mutation_performed':False,
            'provider_effect_executed':False,
            'secret_payload_accessed':False,
          }
          raw=json.dumps(r,sort_keys=True,separators=(',',':')).encode()
          r['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          Path('g0-output/bubbles-cfbe-workload-identity-receipt-v1.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable G0 proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bubbles-cfbe-workload-identity-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            g0-output/wif-plan.json
            g0-output/wif-identity.json
            g0-output/fuse-mobile-deploy-readiness.json
            g0-output/project-readback.json
            g0-output/gemini-plan.json
            g0-output/adc-identity.json
            g0-output/strategic-fuse-vertex-a0-direct-wif.json
            g0-output/bubbles-cfbe-workload-identity-receipt-v1.json
          if-no-files-found: error
          retention-days: 90
