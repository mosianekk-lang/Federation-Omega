name: SLOS G0 Read-Only WIF and ADC Canary v2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: slos-g0-read-only-auth-canary-v2
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  SLOS_RELEASE_SHA256: 979f4f6423920ed32d0a46f9eac069d92f045e350210f6ad3932ed8c90e7dd84

jobs:
  g0-read-only:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] SLOS_G0_READ_ONLY_AUTH_CANARY_V2' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate through canonical keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify current WIF identity contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g0-output
          bash ./ops/bootstrap_github_wif.sh --verify | tee g0-output/wif.json
          python - <<'PY'
          import json
          p=json.load(open('g0-output/wif.json',encoding='utf-8'))
          assert p['receipt']=='FEDOMEGA-WIF-CLOUD-VERIFIED',p
          assert p['state']=='VERIFIED',p
          assert p['project']=='sov-hybrid-suite',p
          assert p['project_number_observed']=='257649435135',p
          assert p['mutation_performed'] is False,p
          PY

      - name: Verify Gemini ADC runtime identity contract
        shell: bash
        run: |
          set -euo pipefail
          bash ./ops/bootstrap_gemini_gateway.sh --verify | tee g0-output/adc.json
          python - <<'PY'
          import json
          p=json.load(open('g0-output/adc.json',encoding='utf-8'))
          assert p['receipt']=='FEDOMEGA-GEMINI-ADC-VERIFIED',p
          assert p['state']=='VERIFIED',p
          assert p['project_id']=='sov-hybrid-suite',p
          assert p['project_number_observed']=='257649435135',p
          assert p['mutation_performed'] is False,p
          assert p['service_account_key_created'] is False,p
          assert p['secret_payload_accessed'] is False,p
          PY

      - name: Compile receiver-local G0 receipt
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          wif=json.load(open('g0-output/wif.json',encoding='utf-8'))
          adc=json.load(open('g0-output/adc.json',encoding='utf-8'))
          r={
            'schema':'SLOS_G0_RECEIVER_LOCAL_IDENTITY_RECEIPT_V2',
            'state':'VERIFIED',
            'release_sha256':os.environ['SLOS_RELEASE_SHA256'],
            'source_sha':os.environ['SOURCE_SHA'],
            'issue_number':int(os.environ['ISSUE_NUMBER']),
            'issue_actor':os.environ['ISSUE_ACTOR'],
            'issue_author_association':os.environ['ISSUE_ASSOCIATION'],
            'project_id':os.environ['PROJECT_ID'],
            'project_number':os.environ['PROJECT_NUMBER'],
            'region':os.environ['REGION'],
            'wif_receipt':wif,
            'adc_receipt':adc,
            'mutation_performed':False,
            'provider_effect_executed':False,
            'secret_payload_accessed':False,
          }
          raw=json.dumps(r,sort_keys=True,separators=(',',':')).encode()
          r['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          open('g0-output/slos-g0-receiver-local-receipt-v2.json','w',encoding='utf-8').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable G0 proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slos-g0-receiver-local-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            g0-output/wif.json
            g0-output/adc.json
            g0-output/slos-g0-receiver-local-receipt-v2.json
          if-no-files-found: error
          retention-days: 90
