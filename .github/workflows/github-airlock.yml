name: Federation Omega Airlock

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: federation-omega-airlock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve admission comparison and provider provenance
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_count=0
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"; head="$PR_HEAD"; pr_count=1 ;;
            merge_group)
              base="$MERGE_BASE"; head="$MERGE_HEAD"; pr_count=1 ;;
            push)
              base="$PUSH_BASE"; head="$PUSH_HEAD"
              pr_count="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/commits/${head}/pulls" \
                --jq 'length')" ;;
            workflow_dispatch)
              base="$(git rev-parse HEAD^)"; head="$(git rev-parse HEAD)" ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "associated_pr_count=$pr_count" >> "$GITHUB_OUTPUT"

      - name: Enforce pull-request head ancestry
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "STALE_BASE_HEAD_REJECTED: head $HEAD_SHA does not descend from base $BASE_SHA" >&2
            exit 1
          fi
          echo "HEAD_ANCESTRY_VERIFIED: $BASE_SHA is an ancestor of $HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # Fail fast on Frontier source-byte drift before running the larger regression court.
      - name: Run Frontier Convergence source-manifest integrity test
        run: python -m unittest discover -s tests -p 'test_frontier_convergence_manifest.py' -v

      - name: Run Airlock regression tests
        run: python -m unittest discover -s tests -p 'test_github_airlock.py' -v

      - name: Run stale-base ancestry regression tests
        run: python -m unittest discover -s tests -p 'test_airlock_stale_base_guard.py' -v

      - name: Run source provenance regression tests
        run: python -m unittest discover -s tests -p 'test_phoenix_source_provenance.py' -v

      - name: Run provider Airlock activator regression tests
        run: python -m unittest discover -s tests -p 'test_provider_airlock_activate.py' -v

      - name: Run provider cutover v2 regression tests
        run: python -m unittest discover -s tests -p 'test_phoenix_provider_cutover_v2.py' -v

      - name: Run provider cutover v3 regression tests
        run: python -m unittest discover -s tests -p 'test_phoenix_provider_cutover_v3*.py' -v

      - name: Run Phoenix export purity regression tests
        run: python -m unittest discover -s tests -p 'test_phoenix_exports.py' -v

      - name: Run OpenAI rotation semantic proof regression tests
        run: python -m unittest discover -s tests -p 'test_openai_rotation_contract.py' -v

      - name: Run Apps Script authorization regression tests
        run: python -m unittest discover -s tests -p 'test_apps_script_authorization_gate.py' -v

      - name: Run JFRIE v2 shadow and adversarial regression tests
        run: python -m unittest discover -s tests -p 'test_jfrie_v2_shadow_adversarial.py' -v

      - name: Run TruthGrid guard-bound writer regression tests
        run: python -m unittest evidenceops.truthgrid.test_writer_adapter -v

      - name: Run KAIO registered-source shadow boundary regression tests
        run: python -m unittest discover -s tests -p 'test_kaio_fluid_shadow_unittest.py' -v

      - name: Run EvidenceOps proof-state transition adversarial regression tests
        run: python -m unittest discover -s tests -p 'test_evidenceops_proof_state_transition_guard.py' -v

      - name: Run Federation autonomous controller regression tests
        run: python -m unittest discover -s tests -p 'test_federation_autonomous_controller.py' -v

      - name: Run Federation capability twin regression tests
        run: python -m unittest discover -s tests -p 'test_federation_capability_twin.py' -v

      - name: Run Federation evolution program regression tests
        run: python -m unittest discover -s tests -p 'test_federation_evolution_program.py' -v

      - name: Run Superior Logic autonomous maturation regression tests
        run: python -m unittest discover -s tests -p 'test_autonomous_maturation.py' -v

      - name: Run Superior Logic maturation shadow runtime regression tests
        run: python -m unittest discover -s tests -p 'test_maturation_shadow_runtime.py' -v

      - name: Run Frontier Convergence core regression tests
        run: python -m unittest discover -s tests -p 'test_frontier_convergence.py' -v

      - name: Run Frontier Convergence execution-continuity regression tests
        run: python -m unittest discover -s tests -p 'test_frontier_convergence_continuity.py' -v

      - name: Run CFBE Frontier Convergence receiver-local proof binding tests
        run: python -m unittest discover -s tests -p 'test_cfbe_frontier_convergence_binding.py' -v

      - name: Build source provenance receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airlock-output
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            printf '[{"sha":"%s","associated_pr_count":1}]\n' "$HEAD_SHA" \
              > airlock-output/source-provenance-input.json
          else
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
              mapfile -t commits < <(gh api \
                "/repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                --jq '.commits[].sha')
            else
              commits=("$HEAD_SHA")
            fi
            printf '[' > airlock-output/source-provenance-input.json
            separator=''
            for sha in "${commits[@]}"; do
              count="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                --jq 'length')"
              printf '%s{"sha":"%s","associated_pr_count":%s}' \
                "$separator" "$sha" "$count" \
                >> airlock-output/source-provenance-input.json
              separator=','
            done
            printf ']\n' >> airlock-output/source-provenance-input.json
          fi
          python phoenix/source_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --head "$HEAD_SHA" \
            --input airlock-output/source-provenance-input.json \
            --output airlock-output/source-provenance-report.json
          test "$(python -c "import json; print(json.load(open('airlock-output/source-provenance-report.json'))['status'])")" = "VERIFIED"

      - name: Enforce default-deny admission policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airlock-output
          python tools/github_airlock.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --event '${{ github.event_name }}' \
            --associated-pr-count '${{ steps.refs.outputs.associated_pr_count }}' \
            --report airlock-output/github-airlock-report.json

      - name: Publish Airlock result
        if: always()
        shell: bash
        run: |
          if [[ -f airlock-output/github-airlock-report.json ]]; then
            echo '## Federation Omega Airlock' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat airlock-output/github-airlock-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f airlock-output/source-provenance-report.json ]]; then
            echo '## Source Provenance' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat airlock-output/source-provenance-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable Airlock and provenance reports
        if: always() && hashFiles('airlock-output/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-omega-airlock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            airlock-output/github-airlock-report.json
            airlock-output/source-provenance-report.json
          if-no-files-found: error
          retention-days: 90

  gemini_handshake_canary:
    name: Gemini handshake canary (probe only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 693
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRIDGE_ID: CG-BRIDGE-20260828-023812-SAST
      BRIDGE_DOC_ID: 1nEtTJVutY1lUch8krbUthJEPEg7ebVk5GtXFVoG3TkM
      SOURCE_PROMPT_ID: 1Kpn5SQ05bgmPTorb6-wmBhTuu8mwvPen
      GH_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Execute bounded live-inference handshake
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          bridge_id = os.environ['BRIDGE_ID']
          bridge_doc_id = os.environ['BRIDGE_DOC_ID']
          source_prompt_id = os.environ['SOURCE_PROMPT_ID']
          gemini_key = os.environ.get('GH_GEMINI_API_KEY', '').strip()
          openrouter_key = os.environ.get('GH_OPENROUTER_API_KEY', '').strip()
          prompt = (
              'Return JSON only, no markdown. This is a bounded interoperability handshake. '
              f'bridge_id={bridge_id}; bridge_doc_id={bridge_doc_id}; source_prompt_id={source_prompt_id}. '
              'Return keys cockpit (GEMINI), model_actually_used, bridge_id, bridge_doc_id, source_prompt_id, '
              'read_state (HANDSHAKE_RECEIVED), gaps (array), provider_timestamp_utc. '
              'Do not claim external reads that this inference did not perform.'
          )
          receipt = {
              'schema':'CHATGPT-GEMINI-HANDSHAKE-CANARY-1',
              'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
              'bridge_id':bridge_id,'bridge_doc_id':bridge_doc_id,'source_prompt_id':source_prompt_id,
              'direct_google_secret_present':bool(gemini_key),'openrouter_secret_present':bool(openrouter_key),
              'inference_verified':False,'native_google_provider_verified':False,'route':None,
              'model':None,'provider':None,'handshake_text':None,'handshake_sha256':None,'attempts':[]
          }
          def call(url, method='GET', headers=None, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read().decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: obj=json.loads(body)
                  except Exception: obj={'error_text':body[:1000]}
                  return e.code,obj
          def err(obj):
              if isinstance(obj,dict) and isinstance(obj.get('error'),dict):
                  x=obj['error']; return {'code':x.get('code'),'status':x.get('status'),'message':str(x.get('message',''))[:400]}
              return {'message':str(obj)[:400]}

          if gemini_key:
              hs={'x-goog-api-key':gemini_key,'Content-Type':'application/json'}
              s, mo = call('https://generativelanguage.googleapis.com/v1beta/models', headers={'x-goog-api-key':gemini_key})
              if s==200:
                  usable=[m for m in mo.get('models',[]) if 'generateContent' in (m.get('supportedGenerationMethods') or []) and 'gemini' in (m.get('name') or '').lower()]
                  names=[m['name'] for m in usable if m.get('name')]
                  prefs=['models/gemini-3.1-pro-preview','models/gemini-3.1-pro','models/gemini-3-pro-preview','models/gemini-2.5-pro','models/gemini-2.5-flash']
                  selected=next((x for x in prefs if x in names), names[0] if names else None)
                  if selected:
                      cs, co=call(f'https://generativelanguage.googleapis.com/v1beta/{selected}:generateContent',method='POST',headers=hs,payload={'contents':[{'role':'user','parts':[{'text':prompt}]}],'generationConfig':{'temperature':0.0}})
                      if cs==200:
                          parts=(((co.get('candidates') or [{}])[0].get('content') or {}).get('parts') or [])
                          text=''.join(p.get('text','') for p in parts if isinstance(p,dict)).strip()
                          if text:
                              receipt.update(inference_verified=True,native_google_provider_verified=True,route='GOOGLE_GEMINI_API',model=selected,provider='Google Gemini API',handshake_text=text[:6000],handshake_sha256=hashlib.sha256(text.encode()).hexdigest())
                              receipt['attempts'].append({'route':'GOOGLE_GEMINI_API','status':cs,'result':'PASS'})
                      if not receipt['inference_verified']: receipt['attempts'].append({'route':'GOOGLE_GEMINI_API','status':cs,'result':'HTTP_OR_EMPTY','error':err(co)})
                  else: receipt['attempts'].append({'route':'GOOGLE_GEMINI_API','status':200,'result':'NO_MODEL'})
              else: receipt['attempts'].append({'route':'GOOGLE_GEMINI_API','status':s,'result':'MODEL_LIST_ERROR','error':err(mo)})
          else: receipt['attempts'].append({'route':'GOOGLE_GEMINI_API','result':'SECRET_ABSENT'})

          if not receipt['inference_verified'] and openrouter_key:
              oh={'Authorization':f'Bearer {openrouter_key}','Content-Type':'application/json','HTTP-Referer':'https://github.com/mosianekk-lang/Federation-Omega','X-Title':'Federation Omega Gemini Handshake Canary'}
              s, mo=call('https://openrouter.ai/api/v1/models',headers=oh)
              if s==200:
                  ids=[m.get('id') for m in mo.get('data',[]) if isinstance(m,dict) and m.get('id')]
                  gids=[x for x in ids if x.startswith('google/gemini')]
                  prefs=['google/gemini-3.1-pro-preview','google/gemini-3-pro-preview','google/gemini-2.5-pro','google/gemini-2.5-flash']
                  selected=next((x for x in prefs if x in gids), gids[0] if gids else None)
                  if selected:
                      cs, co=call('https://openrouter.ai/api/v1/chat/completions',method='POST',headers=oh,payload={'model':selected,'messages':[{'role':'user','content':prompt}],'temperature':0})
                      if cs==200:
                          text=(((co.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip()
                          if text:
                              receipt.update(inference_verified=True,native_google_provider_verified=False,route='OPENROUTER_GEMINI',model=co.get('model') or selected,provider=co.get('provider') or 'OpenRouter (Gemini model)',handshake_text=text[:6000],handshake_sha256=hashlib.sha256(text.encode()).hexdigest())
                              receipt['attempts'].append({'route':'OPENROUTER_GEMINI','status':cs,'result':'PASS'})
                      if not receipt['inference_verified']: receipt['attempts'].append({'route':'OPENROUTER_GEMINI','status':cs,'result':'HTTP_OR_EMPTY','error':err(co)})
                  else: receipt['attempts'].append({'route':'OPENROUTER_GEMINI','status':200,'result':'NO_GEMINI_MODEL'})
              else: receipt['attempts'].append({'route':'OPENROUTER_GEMINI','status':s,'result':'MODEL_LIST_ERROR','error':err(mo)})
          elif not receipt['inference_verified']: receipt['attempts'].append({'route':'OPENROUTER_GEMINI','result':'SECRET_ABSENT'})

          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          with open('HANDSHAKE_RECEIPT.json','w',encoding='utf-8') as f: json.dump(receipt,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({'inference_verified':receipt['inference_verified'],'native_google_provider_verified':receipt['native_google_provider_verified'],'route':receipt['route'],'model':receipt['model'],'attempts':receipt['attempts'],'receipt_sha256':receipt['receipt_sha256']},sort_keys=True))
          PY

      - name: Upload redacted handshake receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-handshake-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: HANDSHAKE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live inference proof
        if: always()
        shell: bash
        run: |
          test -f HANDSHAKE_RECEIPT.json
          python3 - <<'PY'
          import json
          r=json.load(open('HANDSHAKE_RECEIPT.json',encoding='utf-8'))
          if not r.get('inference_verified'):
              raise SystemExit('No live Gemini inference verified; inspect redacted receipt')
          PY
