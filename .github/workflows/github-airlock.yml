name: Federation Omega Airlock

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: federation-omega-airlock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full repository history is required by the admitted BCO real first-parent
          # calibration court. Exact comparison objects are still verified below.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve admission comparison and provider provenance
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_count=0
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"; head="$PR_HEAD"; pr_count=1 ;;
            merge_group)
              base="$MERGE_BASE"; head="$MERGE_HEAD"; pr_count=1 ;;
            push)
              base="$PUSH_BASE"; head="$PUSH_HEAD"
              pr_count="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/commits/${head}/pulls" \
                --jq 'length')" ;;
            workflow_dispatch)
              base="$(git rev-parse HEAD^)"; head="$(git rev-parse HEAD)" ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "associated_pr_count=$pr_count" >> "$GITHUB_OUTPUT"

      - name: Fetch exact comparison objects
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HEAD_SHA" ]]; then
            echo "MISSING_HEAD_SHA" >&2
            exit 1
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
          else
            if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$HEAD_SHA"
            fi
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "AIRLOCK_FULL_HISTORY_REQUIRED: repository became shallow before proof courts" >&2
            exit 1
          fi
          echo "EXACT_COMPARISON_OBJECTS_READY_FULL_HISTORY"

      - name: Enforce pull-request head ancestry
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.merge_base_commit.sha')"
          if [[ "$merge_base" != "$BASE_SHA" ]]; then
            echo "STALE_BASE_HEAD_REJECTED: head $HEAD_SHA does not descend from base $BASE_SHA" >&2
            exit 1
          fi
          echo "HEAD_ANCESTRY_VERIFIED: provider merge base $merge_base matches $BASE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      # P0 bootstrap: validate the admission kernel and selector before trusting dynamic selection.
      - name: Run Airlock regression tests
        run: python -m unittest discover -s tests -p 'test_github_airlock.py' -v

      - name: Run ProofOS bootstrap regression tests
        run: python -m unittest discover -s tests -p 'test_proofos*.py' -v

      - name: Run changed SOVARA creative capability courts
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(sovara/creative/|governance/sovara_.*|tests/test_sovara_creative_.*\.py$)' <<<"$changed"; then
            echo "SOVARA_CREATIVE_CAPABILITY_COURT_REQUIRED"
            python -m unittest discover -s tests -p 'test_sovara_creative_*.py' -v
          else
            echo "SOVARA_CREATIVE_CAPABILITY_COURT_NOT_APPLICABLE"
          fi

      - name: Build source provenance receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airlock-output
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            printf '[{"sha":"%s","associated_pr_count":1}]\n' "$HEAD_SHA" \
              > airlock-output/source-provenance-input.json
          else
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
              mapfile -t commits < <(gh api \
                "/repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                --jq '.commits[].sha')
            else
              commits=("$HEAD_SHA")
            fi
            printf '[' > airlock-output/source-provenance-input.json
            separator=''
            for sha in "${commits[@]}"; do
              count="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                --jq 'length')"
              printf '%s{"sha":"%s","associated_pr_count":%s}' \
                "$separator" "$sha" "$count" \
                >> airlock-output/source-provenance-input.json
              separator=','
            done
            printf ']\n' >> airlock-output/source-provenance-input.json
          fi
          python phoenix/source_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --head "$HEAD_SHA" \
            --input airlock-output/source-provenance-input.json \
            --output airlock-output/source-provenance-report.json
          test "$(python -c "import json; print(json.load(open('airlock-output/source-provenance-report.json'))['status'])")" = "VERIFIED"

      - name: Enforce default-deny admission policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p airlock-output
          python tools/github_airlock.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --event '${{ github.event_name }}' \
            --associated-pr-count '${{ steps.refs.outputs.associated_pr_count }}' \
            --report airlock-output/github-airlock-report.json

      - name: Compile Evidence-Directed ProofOS manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m proofos_omega.cli compile \
            --policy governance/proofos_omega_policy_v1.json \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --repo-root . \
            --output airlock-output/proofos-manifest.json

      - name: Verify ProofOS omission and integrity contract
        run: >-
          python -m proofos_omega.cli verify
          --policy governance/proofos_omega_policy_v1.json
          --manifest airlock-output/proofos-manifest.json

      - name: Execute manifest-selected proof court
        shell: bash
        run: |
          set -euo pipefail
          python -m proofos_omega.cli run \
            --policy governance/proofos_omega_policy_v1.json \
            --manifest airlock-output/proofos-manifest.json \
            --repo-root . \
            --output airlock-output/proofos-admission-report.json

      - name: Run non-blocking ProofOS shadow selector calibration
        shell: bash
        run: |
          set -euo pipefail
          python -m proofos_omega.calibration \
            --policy governance/proofos_omega_policy_v1.json \
            --config proofos_omega/shadow_calibration_v1.json \
            --manifest airlock-output/proofos-manifest.json \
            --repo-root . \
            --output airlock-output/proofos-shadow-calibration.json

      - name: Publish Airlock result
        if: always()
        shell: bash
        run: |
          if [[ -f airlock-output/github-airlock-report.json ]]; then
            echo '## Federation Omega Airlock' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat airlock-output/github-airlock-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f airlock-output/source-provenance-report.json ]]; then
            echo '## Source Provenance' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat airlock-output/source-provenance-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f airlock-output/proofos-manifest.json ]]; then
            echo '## ProofOS change-impact manifest' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open('airlock-output/proofos-manifest.json'))
          print(f"- manifest: `{p['manifest_sha256']}`")
          print(f"- risk: `{p['impact']['risk']}`")
          print(f"- selected proofs: `{len(p['selected_tests'])}`")
          print(f"- omitted proofs with reasons: `{len(p['omitted_tests'])}`")
          print(f"- unmapped production paths: `{len(p['impact']['unmapped_production_paths'])}`")
          PY
          fi
          if [[ -f airlock-output/proofos-admission-report.json ]]; then
            echo '## ProofOS admission report' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open('airlock-output/proofos-admission-report.json'))
          print(f"- status: `{p['status']}`")
          print(f"- report: `{p['report_sha256']}`")
          print(f"- executed/reused proofs: `{len(p['results'])}`")
          print(f"- blocking failures: `{len(p['blocking_failures'])}`")
          PY
          fi
          if [[ -f airlock-output/proofos-shadow-calibration.json ]]; then
            echo '## ProofOS shadow selector calibration' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open('airlock-output/proofos-shadow-calibration.json'))
          print(f"- status: `{p['status']}`")
          print(f"- receipt: `{p['receipt_sha256']}`")
          print(f"- sentinels: `{len(p['selected_sentinels'])}`")
          print(f"- selector escape candidates: `{len(p['escape_candidates'])}`")
          PY
          fi

      - name: Upload immutable Airlock, provenance and ProofOS reports
        if: always() && hashFiles('airlock-output/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-omega-airlock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            airlock-output/github-airlock-report.json
            airlock-output/source-provenance-report.json
            airlock-output/proofos-manifest.json
            airlock-output/proofos-admission-report.json
            airlock-output/proofos-shadow-calibration.json
