name: Observe FO Offline Whisper

on:
  workflow_run:
    workflows: ['Package FO Offline Whisper']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Capture workflow and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          python - <<'PY' > deployment_receipts/fo-offline-whisper-latest.json
          import json, os
          from datetime import datetime, timezone
          raw=json.load(open('/tmp/artifacts.json',encoding='utf-8'))
          artifacts=[{
              'id':a.get('id'),
              'name':a.get('name'),
              'size_in_bytes':a.get('size_in_bytes'),
              'expired':a.get('expired'),
              'created_at':a.get('created_at'),
              'expires_at':a.get('expires_at')
          } for a in raw.get('artifacts',[])]
          print(json.dumps({
              'receipt':'FO-OFFLINE-WHISPER-OBSERVATION',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'run_id':int(os.environ['RUN_ID']),
              'run_url':os.environ['RUN_URL'],
              'conclusion':os.environ['CONCLUSION'],
              'source_sha':os.environ['SOURCE_SHA'],
              'artifacts':artifacts
          },indent=2,sort_keys=True))
          PY

      - name: Publish receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fo-offline-whisper-observer[bot]'
          git config user.email 'fo-offline-whisper-observer[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add deployment_receipts/fo-offline-whisper-latest.json
          git commit -m 'Record offline Whisper observation [skip ci]' || exit 0
          git push origin HEAD:main
