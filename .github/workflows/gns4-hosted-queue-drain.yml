name: GNS4 Hosted Queue Drain

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gns4-hosted-queue-drain
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  GNS4_SPREADSHEET_ID: 1LSVjK9YK6u2CMrvetOcXpun4VQnOh5cE6b3w6z_KTHg

jobs:
  drain:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == '[FO-DISPATCH] GNS4_HOSTED_QUEUE_CANARY_V1' &&
       github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate through canonical keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install bounded Google auth runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            google-auth==2.40.3 requests==2.32.5

      - name: Execute one bounded GNS4 queue-drain cycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gns4-output
          python ops/gns4_hosted_queue_drain.py | tee gns4-output/receipt.json

      - name: Upload immutable hosted-worker receipt
        if: always() && hashFiles('gns4-output/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gns4-hosted-queue-drain-${{ github.run_id }}-${{ github.run_attempt }}
          path: gns4-output/receipt.json
          if-no-files-found: error
          retention-days: 30
