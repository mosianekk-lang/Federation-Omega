name: SOVARA AI Studio Direct Semantic Canary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sovara-ai-studio-semantic-canary.yml"
      - "governance/sovara_ai_studio_semantic_canary_request_v1.json"
      - "ops/sovara_ai_studio_semantic_canary.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sovara-ai-studio-direct-semantic-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: sov-hybrid-suite
      PROJECT_NUMBER: "257649435135"
      WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
      DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
      REQUEST_FILE: governance/sovara_ai_studio_semantic_canary_request_v1.json
    steps:
      - name: Checkout exact source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate through existing keyless Google WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Validate zero-data request contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('governance/sovara_ai_studio_semantic_canary_request_v1.json',encoding='utf-8'))
          assert p['schema']=='SOVARA_AI_STUDIO_SEMANTIC_CANARY_REQUEST_V1',p
          assert p['execute'] is True,p
          assert p['project_id']=='sov-hybrid-suite',p
          assert p['project_number']=='257649435135',p
          assert p['credential_mode']=='GOOGLE_WIF_SECRET_MANAGER_TRANSIENT_ACCESS',p
          assert p['credential_reference']=='gcp_secret_name:gemini-api-key',p
          assert p['credential_secret_name']=='gemini-api-key',p
          assert p['resolution_surface']=='google_cloud',p
          assert p['workload_identity_provider']=='projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github',p
          assert p['service_account']=='superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com',p
          assert p['provider']=='GOOGLE_GEMINI_DEVELOPER_API',p
          assert p['model_policy']['discovery_required'] is True,p
          assert p['model_policy']['allow_dynamic_fallback'] is True,p
          for k in ('case_data_allowed','provider_mutation_allowed','iam_mutation_allowed','secret_mutation_allowed','secret_value_logging_allowed','deployment_allowed','traffic_change_allowed','external_communication_allowed'):
              assert p[k] is False,(k,p[k])
          assert int(p['semantic_canary']['max_output_tokens']) <= 32,p
          PY

      - name: Run Gemini Developer API discovery and exact-nonce canary
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/sovara-ai-studio
          python3 ops/sovara_ai_studio_semantic_canary.py \
            --request "$REQUEST_FILE" \
            --receipt /tmp/sovara-ai-studio/AI_STUDIO_SEMANTIC_RECEIPT.json

      - name: Upload immutable redacted semantic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-ai-studio-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sovara-ai-studio/AI_STUDIO_SEMANTIC_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
