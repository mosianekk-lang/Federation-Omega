name: SOVARA AI Studio Direct Semantic Canary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sovara-ai-studio-semantic-canary.yml"
      - "governance/sovara_ai_studio_semantic_canary_request_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovara-ai-studio-direct-semantic-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate zero-data auth-key request contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('governance/sovara_ai_studio_semantic_canary_request_v1.json',encoding='utf-8'))
          assert p['schema']=='SOVARA_AI_STUDIO_SEMANTIC_CANARY_REQUEST_V1',p
          assert p['execute'] is True,p
          assert p['project_id']=='sov-hybrid-suite',p
          assert p['project_number']=='257649435135',p
          assert p['credential_mode']=='GEMINI_AUTHORIZATION_KEY_ENV_SECRET',p
          assert p['credential_reference']=='GITHUB_ACTIONS_SECRET:GEMINI_API_KEY',p
          assert p['provider']=='GOOGLE_GEMINI_DEVELOPER_API',p
          assert p['model_policy']['discovery_required'] is True,p
          assert p['model_policy']['allow_dynamic_fallback'] is True,p
          for k in ('case_data_allowed','provider_mutation_allowed','iam_mutation_allowed','secret_mutation_allowed','secret_value_logging_allowed','deployment_allowed','traffic_change_allowed','external_communication_allowed'):
              assert p[k] is False,(k,p[k])
          assert int(p['semantic_canary']['max_output_tokens']) <= 128,p
          PY

      - name: Run Gemini Developer API auth-key discovery and exact-nonce canary
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/sovara-ai-studio
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          request_contract=json.load(open('governance/sovara_ai_studio_semantic_canary_request_v1.json',encoding='utf-8'))
          key=os.environ.get('GEMINI_API_KEY','')
          receipt_path=Path('/tmp/sovara-ai-studio/AI_STUDIO_SEMANTIC_RECEIPT.json')
          base={
              'schema':'SOVARA_AI_STUDIO_DIRECT_SEMANTIC_RECEIPT_V4',
              'provider':'GOOGLE_GEMINI_DEVELOPER_API',
              'transport':'DIRECT_GENERATIVELANGUAGE_API_AUTH_KEY',
              'project_id':request_contract['project_id'],
              'project_number':request_contract['project_number'],
              'credential_mode':request_contract['credential_mode'],
              'credential_reference':request_contract['credential_reference'],
              'credential_present':bool(key),
              'credential_value_recorded':False,
              'credential_value_hashed':False,
              'secret_value_recorded':False,
              'case_data_processed':False,
              'provider_mutation_performed':False,
              'iam_mutation_performed':False,
              'secret_mutation_performed':False,
              'deployment_performed':False,
              'traffic_change_performed':False,
              'source_sha':os.environ.get('GITHUB_SHA'),
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
          }

          def seal_and_write(receipt:dict) -> None:
              body=dict(receipt)
              body.pop('receipt_sha256',None)
              receipt['receipt_sha256']=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              receipt_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          if not key:
              receipt={**base,'state':'CREDENTIAL_MISSING','semantic_verified':False,'models_list_http_status':None,'models_visible_count':0,'selected_model':None,'selected_model_source':None,'generate_http_status':None,'provider_model_version':None,'provider_request_id_or_equivalent':None,'nonce_sha256':None,'response_text_sha256':None,'usage_metadata':{}}
              seal_and_write(receipt)
              print(json.dumps({k:receipt[k] for k in ('state','semantic_verified','credential_present','selected_model','receipt_sha256')},sort_keys=True))
              raise SystemExit('Gemini auth-key runtime secret unavailable; redacted receipt retained')

          def provider_json(url:str, *, payload:dict|None=None) -> tuple[int,dict,dict[str,str]]:
              data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              headers={'Content-Type':'application/json','x-goog-api-key':key}
              req=urllib.request.Request(url,data=data,headers=headers,method='GET' if payload is None else 'POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as response:
                      raw=response.read().decode('utf-8','replace')
                      try: body=json.loads(raw) if raw else {}
                      except Exception: body={'raw_sha256':hashlib.sha256(raw.encode()).hexdigest()}
                      return int(response.status),body,{k.lower():v for k,v in response.headers.items()}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw else {}
                  except Exception: body={'raw_sha256':hashlib.sha256(raw.encode()).hexdigest()}
                  return int(exc.code),body,{k.lower():v for k,v in exc.headers.items()}

          # Provider-native discovery is mandatory; never infer current model availability from source labels.
          models=[]
          page_token=None
          list_status=None
          list_error={}
          for _ in range(5):
              query={'pageSize':'1000'}
              if page_token:
                  query['pageToken']=page_token
              url='https://generativelanguage.googleapis.com/v1beta/models?'+urllib.parse.urlencode(query)
              status,body,_=provider_json(url)
              list_status=status
              if status!=200:
                  list_error=(body.get('error') or {}) if isinstance(body,dict) else {}
                  break
              models.extend(body.get('models') or [])
              page_token=body.get('nextPageToken')
              if not page_token:
                  break

          available=[]
          rejected_terms=tuple(str(x).lower() for x in request_contract['model_policy'].get('reject_model_classes') or [])
          for item in models:
              if not isinstance(item,dict):
                  continue
              name=str(item.get('name') or '')
              short=name.split('/',1)[-1]
              methods=set(item.get('supportedGenerationMethods') or [])
              if not name.startswith('models/gemini-') or 'generateContent' not in methods:
                  continue
              if any(term in short.lower() for term in rejected_terms):
                  continue
              available.append({'name':name,'short':short,'display_name':item.get('displayName'),'methods':sorted(methods)})

          preferred=[str(x) for x in request_contract['model_policy'].get('preferred_models') or []]
          selected=None
          selected_source=None
          available_by_short={x['short']:x for x in available}
          for candidate in preferred:
              if candidate in available_by_short:
                  selected=available_by_short[candidate]
                  selected_source='PREFERRED_PROVIDER_DISCOVERED'
                  break

          def version_score(short:str) -> tuple:
              nums=tuple(int(x) for x in re.findall(r'\d+',short)[:3])
              stable_penalty=1 if any(tag in short.lower() for tag in ('preview','exp','experimental')) else 0
              latest_bonus=1 if short.endswith('-latest') else 0
              flash_bonus=1 if '-flash' in short else 0
              return (stable_penalty*-1,flash_bonus,nums,latest_bonus,short)

          if selected is None and available and request_contract['model_policy'].get('allow_dynamic_fallback'):
              selected=max(available,key=lambda x:version_score(x['short']))
              selected_source='DYNAMIC_PROVIDER_DISCOVERY'

          if list_status!=200 or selected is None:
              err_message=str(list_error.get('message',''))
              receipt={
                  **base,
                  'state':'MODEL_DISCOVERY_HELD',
                  'semantic_verified':False,
                  'models_list_http_status':list_status,
                  'models_visible_count':len(available),
                  'selected_model':selected['short'] if selected else None,
                  'selected_model_source':selected_source,
                  'generate_http_status':None,
                  'provider_error_status':list_error.get('status'),
                  'provider_error_code':list_error.get('code'),
                  'provider_error_message_sha256':hashlib.sha256(err_message.encode()).hexdigest() if err_message else None,
                  'provider_model_version':None,
                  'provider_request_id_or_equivalent':None,
                  'nonce_sha256':None,
                  'response_text_sha256':None,
                  'usage_metadata':{},
              }
              seal_and_write(receipt)
              print(json.dumps({k:receipt[k] for k in ('state','semantic_verified','models_list_http_status','models_visible_count','selected_model','receipt_sha256')},sort_keys=True))
              raise SystemExit('Gemini provider model discovery not verified; redacted receipt retained')

          nonce=f"SOVARA-AISTUDIO-{os.environ.get('GITHUB_RUN_ID','local')}-{os.environ.get('GITHUB_RUN_ATTEMPT','0')}-{str(os.environ.get('GITHUB_SHA',''))[:12]}"
          expected=nonce
          payload={
              'contents':[{'role':'user','parts':[{'text':f'Return exactly this token and nothing else: {expected}'}]}],
              'generationConfig':{
                  'temperature':request_contract['semantic_canary']['temperature'],
                  'maxOutputTokens':request_contract['semantic_canary']['max_output_tokens'],
              },
          }
          generate_url=f"https://generativelanguage.googleapis.com/v1beta/models/{selected['short']}:generateContent"
          generate_status,body,headers=provider_json(generate_url,payload=payload)
          parts=((((body.get('candidates') or [{}])[0].get('content') or {}).get('parts')) or []) if isinstance(body,dict) else []
          text=''.join(str(part.get('text','')) for part in parts).strip()
          exact=generate_status==200 and text==expected
          error=(body.get('error') or {}) if isinstance(body,dict) else {}
          error_message=str(error.get('message',''))
          request_id=(body.get('responseId') if isinstance(body,dict) else None) or (body.get('response_id') if isinstance(body,dict) else None) or headers.get('x-request-id')
          usage=(body.get('usageMetadata') or {}) if isinstance(body,dict) else {}
          receipt={
              **base,
              'state':'VERIFIED_SCOPED' if exact else 'PROVIDER_SEMANTIC_HELD',
              'semantic_verified':exact,
              'models_list_http_status':list_status,
              'models_visible_count':len(available),
              'selected_model':selected['short'],
              'selected_model_source':selected_source,
              'generate_http_status':generate_status,
              'provider_error_status':error.get('status'),
              'provider_error_code':error.get('code'),
              'provider_error_message_sha256':hashlib.sha256(error_message.encode()).hexdigest() if error_message else None,
              'provider_model_version':body.get('modelVersion') if isinstance(body,dict) else None,
              'provider_request_id_or_equivalent':request_id,
              'nonce_sha256':hashlib.sha256(nonce.encode()).hexdigest(),
              'response_text_sha256':hashlib.sha256(text.encode()).hexdigest() if text else None,
              'usage_metadata':{k:usage.get(k) for k in ('promptTokenCount','candidatesTokenCount','totalTokenCount','cachedContentTokenCount') if k in usage},
          }
          seal_and_write(receipt)
          print(json.dumps({k:receipt[k] for k in ('state','semantic_verified','models_list_http_status','models_visible_count','selected_model','selected_model_source','generate_http_status','provider_model_version','provider_request_id_or_equivalent','receipt_sha256')},sort_keys=True))
          if not exact:
              raise SystemExit('Gemini provider semantic proof not verified; redacted receipt retained')
          PY

      - name: Upload immutable redacted semantic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-ai-studio-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sovara-ai-studio/AI_STUDIO_SEMANTIC_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
