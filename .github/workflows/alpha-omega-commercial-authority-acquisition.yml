name: Alpha Omega Commercial Provider Authority Acquisition Proof

on:
  pull_request:
    paths:
      - "alpha_omega_commercial/**"
      - ".github/workflows/alpha-omega-commercial-authority-acquisition.yml"
  push:
    branches: [main]
    paths:
      - "alpha_omega_commercial/**"
      - ".github/workflows/alpha-omega-commercial-authority-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile authority acquisition package
        run: python -m compileall -q alpha_omega_commercial
      - name: Run authority acquisition tests
        working-directory: alpha_omega_commercial
        run: python -m unittest -v test_authority_acquisition.py
      - name: Execute provider authority acquisition proof
        run: >-
          python alpha_omega_commercial/prove_authority_acquisition.py
          --programme alpha_omega_commercial/programme.json
          --requirements alpha_omega_commercial/provider_authority_requirements.json
          --observations alpha_omega_commercial/provider_authority_observations.json
          --output alpha_omega_commercial/artifacts/provider-authority-acquisition
      - name: Validate authority, readback, persistence and rollback gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial/artifacts/provider-authority-acquisition')
          receipt = json.loads((root / 'provider-authority-acquisition-receipt.json').read_text())
          projection = json.loads((root / 'provider-authority-acquisition-projection.json').read_text())
          handoff = json.loads((root / 'provider-authority-acquisition-handoff.json').read_text())
          rollback = json.loads((root / 'rollback-proof.json').read_text())
          programme = json.loads(Path('alpha_omega_commercial/programme.json').read_text())
          acquisition = programme['provider_authority_acquisition']
          canonical = programme['canonical_authority_reconciliation']
          stages = {row['id']: row for row in programme['stages']}

          assert receipt['status'] == 'PROVIDER_AUTHORITY_ACQUISITION_PACKAGE_VERIFIED_BLOCKED_DOMAINS_UNCHANGED'
          assert all(receipt['gates'].values())
          assert receipt['operational_domains'] == ['github_actions', 'google_drive_document_release']
          assert projection['states']['github_actions'] == 'FRESH_VERIFIED'
          assert projection['states']['google_drive_document_release'] == 'FRESH_VERIFIED_READBACK'
          assert projection['states']['cloud_run'] == 'PROVIDER_BLOCKED_CANONICAL_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert projection['states']['live_cloud_operations'] == 'PROVIDER_BLOCKED_CANONICAL_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert projection['states']['payment_provider'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert projection['states']['customer_market'] == 'MARKET_PROOF_REQUIRED'
          assert projection['states']['partner_market'] == 'MARKET_PROOF_REQUIRED'
          assert projection['states']['external_attestation'] == 'UNVERIFIED'
          assert projection['external_gate_effect'] == 'UNCHANGED'
          assert projection['owner_authority_effect'] == 'UNCHANGED'
          assert projection['ledger_integrity']
          assert projection['owner_decision_queue']
          assert len(handoff['requirements']) == 10
          assert handoff['owner_reserved_authority'] == programme['owner_reserved_authority']
          assert rollback['status'] == 'AUTHORITY_ACQUISITION_ROLLBACK_VERIFIED'
          assert rollback['original_hash'] == rollback['restored_hash']
          assert acquisition['status'] == receipt['status']
          assert acquisition['external_gate_effect'] == 'UNCHANGED'
          assert acquisition['owner_authority_effect'] == 'UNCHANGED'
          assert stages['C03']['status'] == 'CANONICAL_PROVIDER_ROUTE_ALIGNED_SIX_REVERSIBLE_PROVIDERS_VERIFIED_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert canonical['status'] == 'CANONICAL_PROVIDER_ROUTE_ALIGNED_IDENTITY_AUTHORITY_UNAVAILABLE'
          assert canonical['cloud_run']['service'] == 'federation-omega-operator'
          assert canonical['cloud_run']['path'] == '/execute'
          assert not canonical['cloud_run']['live_invocation_proven']
          assert not canonical['cloud_run']['cloud_mutation_performed']
          assert not programme['external_gate_evidence']
          assert (root / 'authority-acquisition-runtime' / 'provider-authority-acquisition-ledger.jsonl').is_file()
          assert (root / 'authority-acquisition-runtime' / 'provider-authority-acquisition-state.json').is_file()
          assert (root / 'authority-acquisition-runtime' / 'handoffs' / 'cloud_run.json').is_file()
          assert (root / 'rollback-snapshot' / 'provider-authority-acquisition-ledger.jsonl').is_file()
          PY
      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_acquisition.py'),
              Path('alpha_omega_commercial/provider_authority_requirements.json'),
              Path('alpha_omega_commercial/artifacts/provider-authority-acquisition'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = [root] if root.is_file() else root.rglob('*')
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-commercial-provider-authority-acquisition-proof
          path: alpha_omega_commercial/artifacts/provider-authority-acquisition
          retention-days: 90
          if-no-files-found: error
