name: Kimmie Seed 199-Role Source Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimmie-seed-199-role-source-canary
  cancel-in-progress: false

jobs:
  verify-source-packets:
    if: ${{ vars.KIMMIE_WORKFORCE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate source and runtime controls
        run: |
          python kimmie_seed/workforce/coordinator.py --validate-only
          python -m unittest kimmie_seed.workforce.test_coordinator -v
          python -m unittest tests.test_kimmie_workforce_runtime_v1 -v

      - name: Emit artifact-only packet proof
        env:
          KIMMIE_ARTIFACT_DIR: ${{ runner.temp }}/kimmie-workforce-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python kimmie_seed/workforce/coordinator.py --output-dir "$KIMMIE_ARTIFACT_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['KIMMIE_ARTIFACT_DIR'])
          receipt = json.loads((root / 'receipt.json').read_text())
          heartbeat = json.loads((root / 'heartbeat.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['bot_count'] == 199
          assert receipt['assignment_count'] == 199
          assert heartbeat['provider_model_execution_proven'] is False
          assert json.loads((root / 'dead_letter.json').read_text()) == []
          PY

      - name: Upload immutable source-canary proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kimmie-source-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kimmie-workforce-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
