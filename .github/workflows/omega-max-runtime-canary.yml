name: Omega-Max Provider Runtime Canary

on:
  push:
    paths:
      - '.github/workflows/omega-max-runtime-canary.yml'
      - 'deployments/omega-max/runtime-canary-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: omega-max-provider-runtime-canary
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  SOURCE_SERVICE: architron9

jobs:
  provider-read-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate through existing Workload Identity Federation
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install gcloud after successful authentication
        if: steps.auth.outcome == 'success'
        id: setup_gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Execute non-destructive provider canary and emit receipt
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          SETUP_GCLOUD_OUTCOME: ${{ steps.setup_gcloud.outcome }}
        shell: bash
        run: |
          set -u
          mkdir -p deployments/omega-max
          python - <<'PY'
          import json, os, shutil, subprocess, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          project = os.environ['PROJECT_ID']
          region = os.environ['REGION']
          service = os.environ['SOURCE_SERVICE']
          auth_outcome = os.environ.get('AUTH_OUTCOME', 'unknown')
          setup_outcome = os.environ.get('SETUP_GCLOUD_OUTCOME', 'skipped')

          def run(args):
              if shutil.which(args[0]) is None:
                  return {'ok': False, 'exit_code': 127, 'stdout': '', 'stderr': f'{args[0]} not available'}
              p = subprocess.run(args, text=True, capture_output=True)
              return {
                  'ok': p.returncode == 0,
                  'exit_code': p.returncode,
                  'stdout': p.stdout.strip()[:8000],
                  'stderr': p.stderr.strip()[:3000],
              }

          def gcloud(*args):
              return run(['gcloud', *args, '--project', project])

          account = run(['gcloud', 'auth', 'list', '--filter=status:ACTIVE', '--format=value(account)'])
          project_info = gcloud('projects', 'describe', project, '--format=json(projectId,projectNumber,lifecycleState)')
          service_info = gcloud(
              'run', 'services', 'describe', service,
              '--region', region,
              '--format=json(metadata.name,status.url,status.latestReadyRevisionName,status.traffic,spec.template.spec.serviceAccountName)'
          )
          revisions = gcloud(
              'run', 'revisions', 'list', '--service', service, '--region', region,
              '--limit=5', '--format=json(metadata.name,status.conditions,status.logUrl)'
          )
          api_states = {}
          for api in ['run.googleapis.com','cloudbuild.googleapis.com','artifactregistry.googleapis.com','drive.googleapis.com','docs.googleapis.com','sheets.googleapis.com']:
              api_states[api] = gcloud('services', 'describe', api, '--format=value(state)')

          service_json = {}
          if service_info['ok'] and service_info['stdout']:
              try:
                  service_json = json.loads(service_info['stdout'])
              except json.JSONDecodeError:
                  service_json = {}
          service_url = ((service_json.get('status') or {}).get('url') or '').strip()

          http_checks = []
          for suffix in ['/health', '/']:
              if not service_url:
                  break
              url = service_url.rstrip('/') + suffix
              item = {'url': url, 'ok': False, 'status': None, 'body_prefix': ''}
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      body = response.read(1000).decode('utf-8', errors='replace')
                      item.update(ok=200 <= response.status < 400, status=response.status, body_prefix=body)
              except urllib.error.HTTPError as exc:
                  item.update(status=exc.code, body_prefix=exc.read(1000).decode('utf-8', errors='replace'))
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'
              http_checks.append(item)

          identity_ok = account['ok'] and os.environ['DEPLOYER_SA'] in account['stdout']
          project_ok = project_info['ok'] and os.environ['PROJECT_NUMBER'] in project_info['stdout']
          service_read_ok = service_info['ok'] and bool(service_url)
          revision_read_ok = revisions['ok']
          http_ok = any(item.get('ok') for item in http_checks)

          if identity_ok and project_ok and service_read_ok and revision_read_ok and http_ok:
              classification = 'PROVIDER_RUNTIME_CANARY_VERIFIED'
          elif identity_ok and project_ok and service_read_ok and revision_read_ok:
              classification = 'PROVIDER_IDENTITY_AND_SERVICE_READ_VERIFIED_HTTP_UNPROVEN'
          elif auth_outcome != 'success':
              classification = 'AUTHORITY_REQUIRED_WIF_AUTHENTICATION_FAILED'
          elif setup_outcome != 'success':
              classification = 'PROVIDER_BLOCKED_GCLOUD_SETUP_FAILED'
          else:
              classification = 'PROVIDER_RUNTIME_CANARY_PARTIAL'

          receipt = {
              'receipt_id': 'RCP-OMX-PROVIDER-RUNTIME-CANARY',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'classification': classification,
              'mutation_attempted': False,
              'secret_values_recorded': False,
              'auth_outcome': auth_outcome,
              'setup_gcloud_outcome': setup_outcome,
              'identity_ok': identity_ok,
              'project_ok': project_ok,
              'service_read_ok': service_read_ok,
              'revision_read_ok': revision_read_ok,
              'http_ok': http_ok,
              'active_account': account,
              'project': project_info,
              'service': service_info,
              'revisions': revisions,
              'api_states': api_states,
              'http_checks': http_checks,
              'rollback': 'No provider mutation was performed; disable this workflow or revert its commit.',
          }
          path = Path('deployments/omega-max/OMEGA_MAX_RUNTIME_CANARY_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Persist provider canary receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "omega-max-runtime-canary[bot]"
          git config user.email "omega-max-runtime-canary[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add deployments/omega-max/OMEGA_MAX_RUNTIME_CANARY_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record Omega-Max provider runtime canary [skip omega-runtime-canary]"
            git push origin HEAD:main
          fi

      - name: Upload canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-max-provider-runtime-canary
          path: deployments/omega-max/OMEGA_MAX_RUNTIME_CANARY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
