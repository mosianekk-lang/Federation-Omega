name: SOVARA LiteLLM v2.3 Provider Admission

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sovara-litellm-v2-3-provider-admission.yml"
      - "governance/github_airlock_policy.json"
      - "governance/sovara_gemini_collaboration_request_v1.json"
      - "governance/sovara_creative_gemini_architecture_challenge_v1.json"
      - "sovara/gemini/bootstrap_gateway.sh"
      - "sovara/gemini/private_gateway_canary.sh"
      - "services/gemini_gateway/**"
      - "sovara/creative/gemini_architecture_challenge.py"
      - "releases/sovara-litellm/v2.3.0/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: sovara-litellm-v2-3-provider-admission-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  AR_REPOSITORY: federation-omega
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  GEMINI_REQUEST_FILE: governance/sovara_gemini_collaboration_request_v1.json

jobs:
  provider-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact admitted main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve provider execution mode
        id: provider_mode
        shell: bash
        run: |
          set -euo pipefail
          requested=false
          scope=SOURCE_VALIDATION_ONLY

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested=true
            scope=FULL_PROVIDER_ADMISSION
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if git rev-parse "${GITHUB_SHA}^1" >/dev/null 2>&1; then
              changed="$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" || true)"
            else
              changed="$(git diff-tree --root --no-commit-id --name-only -r "${GITHUB_SHA}" || true)"
            fi
            if grep -Fxq "${GEMINI_REQUEST_FILE}" <<<"${changed}"; then
              scope="$(python3 - "${GEMINI_REQUEST_FILE}" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p.get('schema') == 'SOVARA_GEMINI_COLLABORATION_REQUEST_V1', p
          assert p.get('execute') is True, p
          assert p.get('promote') is False, p
          assert p.get('case_data_allowed') is False, p
          assert p.get('external_communication_allowed') is False, p
          assert p.get('expected_project_id') == 'sov-hybrid-suite', p
          assert p.get('expected_project_number') == '257649435135', p
          assert p.get('expected_workflow') == '.github/workflows/sovara-litellm-v2-3-provider-admission.yml', p
          mode=p.get('mode')
          if mode == 'G0_READ_ONLY_VERIFY':
              assert p.get('provider_mutation_allowed') is False, p
              objective=p.get('g0_objective', 'ADC_IDENTITY_VERIFY')
              assert objective in {'ADC_IDENTITY_VERIFY','ADMIN_AUTHORITY_GRAPH_CENSUS'}, p
              if objective == 'ADMIN_AUTHORITY_GRAPH_CENSUS':
                  expected=set(p.get('expected_missing_adc_controls') or [])
                  assert expected, p
          elif mode == 'G1_ADC_APPLY_VERIFY':
              assert p.get('provider_mutation_allowed') is True, p
              expected={
                'CREATE_SV_GEMINI_RUNTIME_SERVICE_ACCOUNT_IF_ABSENT',
                'BIND_RUNTIME_ROLES_AIPLATFORM_USER_AND_SERVICEUSAGE_CONSUMER',
                'BIND_DEPLOYER_SERVICE_ACCOUNT_USER_ON_RUNTIME',
                'BIND_DEPLOYER_RUN_DEVELOPER',
                'ENSURE_EXISTING_REQUIRED_APIS_ENABLED',
              }
              assert set(p.get('mutation_scope') or []) == expected, p
          elif mode == 'G2_CREATIVE_ARCHITECTURE_CHALLENGE':
              assert p.get('provider_mutation_allowed') is False, p
              assert p.get('model_inference_allowed') is True, p
              assert p.get('transport') == 'OPENROUTER', p
              assert p.get('model') == 'google/gemini-3.1-pro-preview', p
              assert p.get('challenge_spec') == 'governance/sovara_creative_gemini_architecture_challenge_v1.json', p
              assert 1 <= int(p.get('max_output_tokens', 0)) <= 6000, p
          elif mode == 'G3_PRIVATE_GATEWAY_CANARY':
              assert p.get('provider_mutation_allowed') is True, p
              assert p.get('model_inference_allowed') is True, p
              assert p.get('deployment_scope') == 'PRIVATE_ZERO_TRAFFIC_CANARY', p
              assert p.get('production_traffic_allowed') is False, p
              assert p.get('runtime_service_account') == 'superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com', p
              assert p.get('service') == 'sovara-gemini-gateway', p
          else:
              raise AssertionError(f'unsupported request mode: {mode!r}')
          print(mode)
          PY
              )"
              requested=true
            fi
          fi

          echo "requested=${requested}" >> "$GITHUB_OUTPUT"
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "Provider execution requested: ${requested}; scope=${scope}"

      - name: Materialize and verify exact release bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE_BUNDLE="releases/sovara-litellm/v2.3.0/SOVARA_LITELLM_GATEWAY_V2.3.0_CONVERGED_PROOF_READY.zip"
          OVERLAY="releases/sovara-litellm/v2.3.0/SOVARA_LITELLM_V2.3.0_PROVIDER_ADMISSION_OVERLAY.zip"
          BASE_EXPECTED="2dc95a249938604e3117d26e81da4afada96e3c836ab9dde3d80776187cf15bd"
          OVERLAY_EXPECTED="7d15c31e266a1424d982be82655b07c96afe29480ac2f921639215433204794f"

          test "$(sha256sum "$BASE_BUNDLE" | awk '{print $1}')" = "$BASE_EXPECTED"
          test "$(sha256sum "$OVERLAY" | awk '{print $1}')" = "$OVERLAY_EXPECTED"

          TARGET="$RUNNER_TEMP/sovara-litellm/v2.3.0"
          rm -rf "$TARGET"
          mkdir -p "$TARGET/receipts"
          unzip -q "$BASE_BUNDLE" -d "$TARGET"
          unzip -qo "$OVERLAY" -d "$TARGET"

          python3 "$TARGET/sovara_gateway_control_v2_3.py" validate \
            "$TARGET/litellm_config.v2.3.0-converged-proof-ready.yaml" \
            --predecessor "$TARGET/litellm_config.v2.2.0-proof-ready.rollback.yaml" \
            --expected-alias-count 33 \
            > "$TARGET/receipts/STRUCTURAL_VALIDATION_PRE_AUTH.json"

          python3 "$TARGET/SOVARA_PROVIDER_ADMISSION_PROBE_V2.3.0.py" \
            --self-test \
            > "$TARGET/receipts/PROVIDER_PROBE_SELF_TEST.json"

          bash -n "$TARGET/run_provider_admission_v2_3.sh"
          bash -n sovara/gemini/private_gateway_canary.sh

          if [[ -f governance/sovara_creative_gemini_architecture_challenge_v1.json ]]; then
            python3 - <<'PY'
          from sovara.creative.gemini_architecture_challenge import build_request, load_spec
          spec=load_spec('governance/sovara_creative_gemini_architecture_challenge_v1.json')
          request=build_request(spec)
          assert request['model'] == 'google/gemini-3.1-pro-preview'
          assert request['provider']['data_collection'] == 'deny'
          assert request['provider']['zdr'] is True
          assert request['response_format']['type'] == 'json_schema'
          PY
          fi

          echo "SOVARA_RELEASE_DIR=$TARGET" >> "$GITHUB_ENV"
          echo "SOVARA_RECEIPT_DIR=$TARGET/receipts" >> "$GITHUB_ENV"

      - name: Authenticate through exact repository-scoped Google WIF
        if: steps.provider_mode.outputs.requested == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Install pinned Google Cloud CLI action
        if: steps.provider_mode.outputs.requested == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify exact canonical WIF provider contract
        if: steps.provider_mode.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOVARA_RECEIPT_DIR"
          gcloud iam workload-identity-pools providers describe github \
            --project "$PROJECT_ID" \
            --location global \
            --workload-identity-pool github-federation-omega \
            --format=json > "$SOVARA_RECEIPT_DIR/WIF_PROVIDER_READBACK.json"
          gcloud projects describe "$PROJECT_ID" --format=json > "$SOVARA_RECEIPT_DIR/GCP_PROJECT_READBACK.json"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          python3 - "$SOVARA_RECEIPT_DIR/WIF_PROVIDER_READBACK.json" "$SOVARA_RECEIPT_DIR/GCP_PROJECT_READBACK.json" "$ACTIVE_ACCOUNT" <<'PY' > "$SOVARA_RECEIPT_DIR/WIF_G0_VERIFIED.json"
          import hashlib, json, sys
          provider=json.load(open(sys.argv[1], encoding='utf-8'))
          project=json.load(open(sys.argv[2], encoding='utf-8'))
          active=sys.argv[3]
          expected_condition=(
              "assertion.repository_id=='1292795464'"
              " && assertion.repository_owner_id=='261966700'"
              " && assertion.ref=='refs/heads/main'"
              " && assertion.job_workflow_ref=='mosianekk-lang/Federation-Omega/.github/workflows/sovara-litellm-v2-3-provider-admission.yml@refs/heads/main'"
              " && (assertion.event_name=='workflow_dispatch' || assertion.event_name=='push')"
          )
          expected_mapping={
              'google.subject':'assertion.sub',
              'attribute.repository_id':'assertion.repository_id',
              'attribute.repository_owner_id':'assertion.repository_owner_id',
              'attribute.ref':'assertion.ref',
              'attribute.event_name':'assertion.event_name',
              'attribute.workflow_ref':'assertion.job_workflow_ref',
          }
          observed_mapping=provider.get('attributeMapping') or {}
          observed_condition=provider.get('attributeCondition') or ''
          assert str(project.get('projectNumber','')) == '257649435135', project
          assert project.get('projectId') == 'sov-hybrid-suite', project
          assert provider.get('state','ACTIVE') == 'ACTIVE' and provider.get('disabled') is not True, provider
          assert observed_condition == expected_condition, {'observed':observed_condition,'expected':expected_condition}
          assert observed_mapping == expected_mapping, {'observed':observed_mapping,'expected':expected_mapping}
          assert active == 'superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com', active
          r={
              'receipt':'FEDOMEGA-WIF-CLOUD-VERIFIED',
              'state':'VERIFIED',
              'project':'sov-hybrid-suite',
              'project_number_observed':'257649435135',
              'active_account':active,
              'provider_name':provider.get('name',''),
              'provider_state':provider.get('state','ACTIVE'),
              'provider_condition_sha256':hashlib.sha256(observed_condition.encode()).hexdigest(),
              'provider_mapping_sha256':hashlib.sha256(json.dumps(observed_mapping,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
              'mutation_performed':False,
              'secret_payload_accessed':False,
          }
          r['receipt_sha256']=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          print(json.dumps(r,sort_keys=True))
          PY

      - name: Reconcile Gemini ADC runtime identity contract
        if: steps.provider_mode.outputs.requested == 'true'
        id: adc
        continue-on-error: true
        shell: bash
        env:
          EXECUTION_SCOPE: ${{ steps.provider_mode.outputs.scope }}
        run: |
          set -u
          mkdir -p "$SOVARA_RECEIPT_DIR"
          case "$EXECUTION_SCOPE" in
            G0_READ_ONLY_VERIFY|G3_PRIVATE_GATEWAY_CANARY|FULL_PROVIDER_ADMISSION)
              set +e
              ./sovara/gemini/bootstrap_gateway.sh --verify | tee "$SOVARA_RECEIPT_DIR/GEMINI_ADC_VERIFIED.json"
              code=${PIPESTATUS[0]}
              set -e
              exit "$code"
              ;;
            G1_ADC_APPLY_VERIFY)
              set -euo pipefail
              ./sovara/gemini/bootstrap_gateway.sh --plan | tee "$SOVARA_RECEIPT_DIR/GEMINI_ADC_PRE_APPLY.json"
              set +e
              FEDOMEGA_GEMINI_GATEWAY_APPLY=ATTACH_GEMINI_GATEWAY_ADC_V1 \
                ./sovara/gemini/bootstrap_gateway.sh --apply | tee "$SOVARA_RECEIPT_DIR/GEMINI_ADC_APPLY.json"
              apply_code=${PIPESTATUS[0]}
              set -e
              ./sovara/gemini/bootstrap_gateway.sh --verify | tee "$SOVARA_RECEIPT_DIR/GEMINI_ADC_VERIFIED.json"
              verify_code=${PIPESTATUS[0]}
              if [[ "$apply_code" -ne 0 || "$verify_code" -ne 0 ]]; then
                exit 1
              fi
              ;;
            *)
              echo "ADC reconciliation not applicable for scope=$EXECUTION_SCOPE"
              ;;
          esac

      - name: Execute bounded Gemini Creative Architecture Challenge
        if: steps.provider_mode.outputs.scope == 'G2_CREATIVE_ARCHITECTURE_CHALLENGE'
        id: g2_challenge
        continue-on-error: true
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          python3 sovara/creative/gemini_architecture_challenge.py \
            --spec governance/sovara_creative_gemini_architecture_challenge_v1.json \
            --output-dir "$SOVARA_RECEIPT_DIR"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Execute private zero-traffic Gemini gateway canary
        if: steps.provider_mode.outputs.scope == 'G3_PRIVATE_GATEWAY_CANARY'
        id: g3_canary
        continue-on-error: true
        shell: bash
        env:
          SOVARA_G3_PRIVATE_CANARY_EXECUTE: DEPLOY_PRIVATE_ZERO_TRAFFIC_GEMINI_CANARY_V1
        run: |
          set +e
          chmod +x ./sovara/gemini/private_gateway_canary.sh
          ./sovara/gemini/private_gateway_canary.sh --execute
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Execute provider admission, canaries, deployment, and rollback gates
        if: steps.provider_mode.outputs.scope == 'FULL_PROVIDER_ADMISSION'
        id: admission
        continue-on-error: true
        shell: bash
        env:
          RELEASE_DIR: ${{ env.SOVARA_RELEASE_DIR }}
          RECEIPT_DIR: ${{ env.SOVARA_RECEIPT_DIR }}
          GH_SOVARA_GATEWAY_MASTER_KEY: ${{ secrets.SOVARA_GATEWAY_MASTER_KEY }}
          GH_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_OLLAMA_API_BASE: ${{ secrets.OLLAMA_API_BASE }}
        run: |
          set +e
          chmod +x "$RELEASE_DIR/run_provider_admission_v2_3.sh"
          "$RELEASE_DIR/run_provider_admission_v2_3.sh"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record workflow-level truth boundary
        if: always()
        shell: bash
        env:
          PROVIDER_ADMISSION_REQUESTED: ${{ steps.provider_mode.outputs.requested }}
          EXECUTION_SCOPE: ${{ steps.provider_mode.outputs.scope }}
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
          G2_EXIT_CODE: ${{ steps.g2_challenge.outputs.exit_code }}
          G3_EXIT_CODE: ${{ steps.g3_canary.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p "${SOVARA_RECEIPT_DIR:-$RUNNER_TEMP/sovara-litellm-v2.3.0/receipts}"
          python3 - "${SOVARA_RECEIPT_DIR:-$RUNNER_TEMP/sovara-litellm-v2.3.0/receipts}/WORKFLOW_RECEIPT.json" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path(sys.argv[1])
          scope=os.environ.get('EXECUTION_SCOPE','SOURCE_VALIDATION_ONLY')
          raw_code=os.environ.get('ADMISSION_EXIT_CODE','').strip()
          code=int(raw_code) if raw_code else None
          raw_g2=os.environ.get('G2_EXIT_CODE','').strip()
          g2_code=int(raw_g2) if raw_g2 else None
          raw_g3=os.environ.get('G3_EXIT_CODE','').strip()
          g3_code=int(raw_g3) if raw_g3 else None
          d=path.parent

          def load(name):
              p=d/name
              if not p.is_file(): return {}
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return {}

          request={}
          request_path=Path(os.environ.get('GEMINI_REQUEST_FILE',''))
          if request_path.is_file():
              try: request=json.loads(request_path.read_text(encoding='utf-8'))
              except Exception: request={}
          g0_objective=request.get('g0_objective','ADC_IDENTITY_VERIFY') if scope=='G0_READ_ONLY_VERIFY' else None
          expected_missing=set(request.get('expected_missing_adc_controls') or [])

          wif=load('WIF_G0_VERIFIED.json')
          adc=load('GEMINI_ADC_VERIFIED.json')
          adc_apply=load('GEMINI_ADC_APPLY.json')
          census=load('PROJECT_IAM_AUTHORITY_CENSUS.json')
          challenge=load('GEMINI_CREATIVE_ARCHITECTURE_CHALLENGE_RECEIPT.json')
          g3=load('G3_PRIVATE_CANARY_RECEIPT.json')
          structural_ok=(d/'STRUCTURAL_VALIDATION_PRE_AUTH.json').is_file() and (d/'PROVIDER_PROBE_SELF_TEST.json').is_file()
          wif_ok=(wif.get('receipt')=='FEDOMEGA-WIF-CLOUD-VERIFIED' and wif.get('state')=='VERIFIED' and wif.get('project_number_observed')=='257649435135')
          adc_ok=(adc.get('receipt')=='FEDOMEGA-GEMINI-ADC-VERIFIED' and adc.get('state')=='VERIFIED' and adc.get('project_number_observed')=='257649435135' and adc.get('service_account_key_created') is False and adc.get('secret_payload_accessed') is False)
          adc_mutation=bool(adc_apply.get('mutation_performed',False))
          census_ok=(
              census.get('schema')=='SOVARA_PROJECT_IAM_AUTHORITY_GRAPH_V1'
              and census.get('project_id')=='sov-hybrid-suite'
              and str(census.get('project_number'))=='257649435135'
              and census.get('provider_mutation_performed') is False
              and census.get('credential_values_recorded') is False
              and census.get('secret_payload_accessed') is False
              and bool(census.get('receipt_sha256'))
          )
          adc_gap_preserved=(
              g0_objective=='ADMIN_AUTHORITY_GRAPH_CENSUS'
              and bool(expected_missing)
              and adc.get('receipt')=='FEDOMEGA-GEMINI-ADC-VERIFICATION-FAILED'
              and adc.get('state')=='NOT_VERIFIED'
              and adc.get('mutation_performed') is False
              and set(adc.get('missing_controls') or [])==expected_missing
          )
          challenge_ok=(
              challenge.get('schema')=='SOVARA_CREATIVE_GEMINI_ARCHITECTURE_CHALLENGE_RECEIPT_V1'
              and challenge.get('status')=='VERIFIED'
              and challenge.get('challenge_id')=='SC-GEMINI-ARCH-20260828-001'
              and challenge.get('semantic_verified') is True
              and challenge.get('model_returned')
              and 'gemini' in str(challenge.get('model_returned','')).lower()
              and challenge.get('provider_request_id')
              and challenge.get('case_data_processed') is False
              and challenge.get('external_effect_performed') is False
              and challenge.get('proposal_authority_only') is True
              and challenge.get('proposal_count') == 12
              and g2_code == 0
          )
          g3_ok=(
              g3.get('receipt')=='FEDOMEGA-GEMINI-GATEWAY-CANARY-VERIFIED'
              and g3.get('state')=='VERIFIED'
              and g3.get('project_id')=='sov-hybrid-suite'
              and str(g3.get('project_number'))=='257649435135'
              and g3.get('runtime_service_account')=='superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com'
              and g3.get('normal_traffic_percent')==0
              and bool(g3.get('provider_request_id'))
              and bool(g3.get('model_identity'))
              and g3.get('production_promotion_performed') is False
              and g3.get('case_data_processed') is False
              and bool(g3.get('receipt_sha256'))
              and g3_code == 0
          )

          receipt={
              'schema':'SOVARA-LITELLM-V2.3-GITHUB-WORKFLOW-RECEIPT-8',
              'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
              'repository':os.environ['GITHUB_REPOSITORY'],
              'workflow':os.environ['GITHUB_WORKFLOW'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'source_sha':os.environ['GITHUB_SHA'],
              'ref':os.environ['GITHUB_REF'],
              'execution_scope':scope,
              'g0_objective':g0_objective,
              'structural_validation_completed':structural_ok,
              'wif_verified':wif_ok,
              'adc_verified':adc_ok,
              'g0_identity_adc_verified':wif_ok and adc_ok,
              'admin_authority_census_verified':census_ok,
              'admin_authority_verified_path_count':len(census.get('verified_admin_delegation_paths') or []) if census else None,
              'admin_authority_reusable_service_account_count':len(census.get('verified_reusable_admin_service_accounts') or []) if census else None,
              'adc_gap_preserved':adc_gap_preserved,
              'adc_missing_controls':adc.get('missing_controls') if adc else None,
              'adc_apply_mutation_performed':adc_mutation,
              'provider_admission_attempted':scope=='FULL_PROVIDER_ADMISSION',
              'provider_admission_exit_code':code,
              'provider_admission_completed':scope=='FULL_PROVIDER_ADMISSION' and code==0,
              'provider_state_claimed':scope=='FULL_PROVIDER_ADMISSION' and code==0,
              'gemini_architecture_challenge_verified':challenge_ok,
              'gemini_challenge_id':challenge.get('challenge_id') if challenge else None,
              'gemini_transport':challenge.get('transport') if challenge else None,
              'gemini_model_requested':challenge.get('model_requested') if challenge else None,
              'gemini_model_returned':challenge.get('model_returned') if challenge else None,
              'gemini_upstream_provider':challenge.get('provider') if challenge else None,
              'gemini_provider_request_id':challenge.get('provider_request_id') if challenge else None,
              'gemini_proposal_count':challenge.get('proposal_count') if challenge else None,
              'gemini_challenge_receipt_sha256':challenge.get('receipt_sha256') if challenge else None,
              'gemini_private_canary_verified':g3_ok,
              'gemini_private_canary_revision':g3.get('revision') if g3 else None,
              'gemini_private_canary_image_digest_ref':g3.get('image_digest_ref') if g3 else None,
              'gemini_private_canary_normal_traffic_percent':g3.get('normal_traffic_percent') if g3 else None,
              'gemini_private_canary_provider_request_id':g3.get('provider_request_id') if g3 else None,
              'gemini_private_canary_model_identity':g3.get('model_identity') if g3 else None,
              'gemini_private_canary_receipt_sha256':g3.get('receipt_sha256') if g3 else None,
              'production_promotion_performed':bool(g3.get('production_promotion_performed',False)) if g3 else False,
              'case_data_processed':False,
              'model_inference_performed':g3_ok if scope=='G3_PRIVATE_GATEWAY_CANARY' else (challenge_ok if scope=='G2_CREATIVE_ARCHITECTURE_CHALLENGE' else (False if scope in {'G0_READ_ONLY_VERIFY','G1_ADC_APPLY_VERIFY'} else None)),
              'repository_source_write_authority':False,
              'credential_values_recorded':False,
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable redacted provider receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovara-litellm-v2-3-provider-admission-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ env.SOVARA_RECEIPT_DIR }}

      - name: Enforce execution-mode result
        if: always()
        env:
          EXECUTION_SCOPE: ${{ steps.provider_mode.outputs.scope }}
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
          G2_EXIT_CODE: ${{ steps.g2_challenge.outputs.exit_code }}
          G3_EXIT_CODE: ${{ steps.g3_canary.outputs.exit_code }}
        run: |
          set -euo pipefail
          receipt="${SOVARA_RECEIPT_DIR}/WORKFLOW_RECEIPT.json"
          case "${EXECUTION_SCOPE:-SOURCE_VALIDATION_ONLY}" in
            FULL_PROVIDER_ADMISSION)
              code="${ADMISSION_EXIT_CODE:-99}"
              if [[ "$code" -ne 0 ]]; then
                echo "Provider admission stopped at a proof gate. Redacted receipts were retained as a workflow artifact." >&2
                exit "$code"
              fi
              jq -e '.provider_admission_attempted == true and .provider_admission_completed == true and .provider_admission_exit_code == 0' "$receipt" >/dev/null
              ;;
            G0_READ_ONLY_VERIFY)
              if jq -e '.g0_objective == "ADMIN_AUTHORITY_GRAPH_CENSUS"' "$receipt" >/dev/null; then
                jq -e '.execution_scope == "G0_READ_ONLY_VERIFY" and .wif_verified == true and .admin_authority_census_verified == true and .adc_verified == false and .adc_gap_preserved == true and .adc_apply_mutation_performed == false and .provider_admission_attempted == false and .case_data_processed == false and .model_inference_performed == false' "$receipt" >/dev/null
                echo "G0 admin authority graph census verified. WIF is verified; the expected Gemini ADC gaps remain explicitly unverified and no provider mutation or model inference occurred."
              else
                jq -e '.execution_scope == "G0_READ_ONLY_VERIFY" and .wif_verified == true and .adc_verified == true and .adc_apply_mutation_performed == false and .provider_admission_attempted == false and .case_data_processed == false' "$receipt" >/dev/null
                echo "G0 WIF and Gemini ADC verification passed. No model inference, provider mutation, traffic promotion or case-data processing was performed."
              fi
              ;;
            G1_ADC_APPLY_VERIFY)
              jq -e '.execution_scope == "G1_ADC_APPLY_VERIFY" and .wif_verified == true and .adc_verified == true and .adc_apply_mutation_performed == true and .provider_admission_attempted == false and .case_data_processed == false and .model_inference_performed == false' "$receipt" >/dev/null
              echo "G1 Gemini ADC attachment verified. Only the bounded runtime identity/IAM/API controls in the request were admitted; no model inference, traffic promotion or case-data processing was performed."
              ;;
            G2_CREATIVE_ARCHITECTURE_CHALLENGE)
              code="${G2_EXIT_CODE:-99}"
              if [[ "$code" -ne 0 ]]; then
                echo "G2 Gemini Creative Architecture Challenge stopped at a provider proof gate. Redacted receipts were retained when available." >&2
                exit "$code"
              fi
              jq -e '.execution_scope == "G2_CREATIVE_ARCHITECTURE_CHALLENGE" and .gemini_architecture_challenge_verified == true and .model_inference_performed == true and .case_data_processed == false and .gemini_proposal_count == 12 and (.gemini_provider_request_id | length > 0)' "$receipt" >/dev/null
              echo "G2 Gemini Creative Architecture Challenge verified. Output is proposal-only; no provider mutation, case-data processing, publishing or design auto-promotion occurred."
              ;;
            G3_PRIVATE_GATEWAY_CANARY)
              code="${G3_EXIT_CODE:-99}"
              if [[ "$code" -ne 0 ]]; then
                echo "G3 private Gemini gateway canary stopped at a provider proof gate. Redacted receipts were retained when available." >&2
                exit "$code"
              fi
              jq -e '.execution_scope == "G3_PRIVATE_GATEWAY_CANARY" and .wif_verified == true and .adc_verified == true and .gemini_private_canary_verified == true and .gemini_private_canary_normal_traffic_percent == 0 and .production_promotion_performed == false and .provider_admission_attempted == false and .case_data_processed == false and .model_inference_performed == true and (.gemini_private_canary_provider_request_id | length > 0)' "$receipt" >/dev/null
              echo "G3 private Gemini gateway canary verified. The tagged revision has zero normal traffic; no production promotion or case-data processing occurred."
              ;;
            SOURCE_VALIDATION_ONLY)
              jq -e '.execution_scope == "SOURCE_VALIDATION_ONLY" and .structural_validation_completed == true and .provider_admission_attempted == false and .provider_admission_exit_code == null and .provider_state_claimed == false' "$receipt" >/dev/null
              echo "Source validation verified. Provider admission was not requested and no WIF exchange was attempted."
              ;;
            *)
              echo "Unknown execution scope: ${EXECUTION_SCOPE}" >&2
              exit 2
              ;;
          esac
