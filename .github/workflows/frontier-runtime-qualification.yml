name: Frontier Runtime Qualification

on:
  pull_request:
    paths:
      - 'frontier_convergence/**'
      - 'federation/superior_logic_convergence_measurement.py'
      - 'federation/cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/mission_execution_adapter_v1.py'
      - 'tests/test_mission_ir_golden_path_shadow.py'
      - 'tests/test_cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/bubbles_30_pair_observed_certification_20260830.json'
      - 'tests/test_superior_logic_convergence_measurement.py'
      - 'tests/test_frontier_slos_convergence_runner.py'
      - 'benchmarking/cfbe_omega/bubbles_chatbridge_payload_ingress_observation_20260830_v1.json'
      - 'governance/superior_logic_gemini_frontier_convergence_v1.json'
      - '.github/workflows/frontier-runtime-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'frontier_convergence/**'
      - 'federation/superior_logic_convergence_measurement.py'
      - 'federation/cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/mission_execution_adapter_v1.py'
      - 'tests/test_mission_ir_golden_path_shadow.py'
      - 'tests/test_cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/bubbles_30_pair_observed_certification_20260830.json'
      - 'tests/test_superior_logic_convergence_measurement.py'
      - 'tests/test_frontier_slos_convergence_runner.py'
      - 'benchmarking/cfbe_omega/bubbles_chatbridge_payload_ingress_observation_20260830_v1.json'
      - 'governance/superior_logic_gemini_frontier_convergence_v1.json'
      - '.github/workflows/frontier-runtime-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-runtime-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run provider-disabled deterministic canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof
          python -m frontier_convergence.canary > runtime-proof/canary.json
          python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/canary.json', encoding='utf-8'))
          assert receipt['state'] == 'PASS', receipt
          assert receipt['provider_effects'] is False, receipt
          assert receipt['event_chain_valid'] is True, receipt
          print('PROVIDER_DISABLED_CANARY_VERIFIED')
          PY

      - name: Run 30-pair CFBE hosted shadow court
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_superior_logic_convergence_measurement.py' -v
          python -m unittest discover -s tests -p 'test_frontier_slos_convergence_runner.py' -v
          python -m unittest discover -s tests -p 'test_cfbe_observed_campaign_admission.py' -v
          python -m frontier_convergence.slos_convergence_runner > runtime-proof/slos-convergence-campaign.json
          python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/slos-convergence-campaign.json', encoding='utf-8'))
          assert receipt['state'] == 'HOSTED_SHADOW_30_OF_30_PASS', receipt
          assert receipt['pair_count'] == 30, receipt
          assert receipt['hosted_shadow_pair_count'] == 30, receipt
          assert receipt['observed_pair_count'] == 0, receipt
          assert receipt['zero_critical_omissions'] is True, receipt
          assert receipt['external_effect'] is False, receipt
          assert receipt['provider_effects'] is False, receipt
          assert receipt['stable_promotion_allowed'] is False, receipt
          print('CFBE_HOSTED_SHADOW_30_OF_30_VERIFIED')
          PY

      - name: Run MissionIR SOVARA Golden Path shadow court
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mission_ir_golden_path_shadow.py' -v
          python -m frontier_convergence.mission_ir_golden_path_shadow > runtime-proof/mission-ir-golden-path-shadow.json
          python - <<'PY'
          import json, os
          receipt = json.load(open('runtime-proof/mission-ir-golden-path-shadow.json', encoding='utf-8'))
          assert receipt['certification_source_sha'] == os.environ['GITHUB_SHA'], receipt
          assert receipt['state'] == 'HOSTED_SHADOW_REFERENCE_PASS', receipt
          assert receipt['binding_hash_matches'] is True, receipt
          assert receipt['semantic_pass'] is True, receipt
          assert receipt['selected_work_ids'] == ['SC-PLAN'], receipt
          assert receipt['provider_policy_excluded_cell_ids'] == ['cell-adobe', 'cell-gemini'], receipt
          selected = {
              cell_id
              for placement in receipt['cell_placements']
              for cell_id in placement['selected_cell_ids']
          }
          assert selected == {'cell-canva'}, receipt
          assert receipt['provider_effect_authorized'] is False, receipt
          assert receipt['financial_effect_authorized'] is False, receipt
          assert receipt['publication_authorized'] is False, receipt
          assert receipt['external_effects'] == 0, receipt
          assert receipt['runtime_metrics']['observed_runtime_comparison_proven'] is False, receipt
          assert receipt['stable_promotion_allowed'] is False, receipt
          print('MISSION_IR_GOLDEN_PATH_HOSTED_SHADOW_VERIFIED')
          PY

      - name: Build non-root control-runtime container
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -f frontier_convergence/Dockerfile -t "frontier-convergence:${SOURCE_SHA}" .
          docker image inspect "frontier-convergence:${SOURCE_SHA}" --format '{{.Id}}' > runtime-proof/image-id.txt

      - name: Prove health restart idempotency persistence and rollback
        shell: bash
        run: |
          set -euo pipefail
          export RUNTIME_DIR="${RUNNER_TEMP}/frontier-runtime-${GITHUB_RUN_ID}"
          export IMAGE="frontier-convergence:${SOURCE_SHA}"
          export PORT=18080
          mkdir -p "$RUNTIME_DIR"
          chmod 0777 "$RUNTIME_DIR"

          cleanup() {
            docker rm -f frontier-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          share_test_volume() {
            sudo chmod -R a+rwX "$RUNTIME_DIR"
          }

          start_runtime() {
            cleanup
            docker run -d --name frontier-runtime \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --memory=256m \
              --cpus=1 \
              -p "127.0.0.1:${PORT}:8080" \
              -e FC_DB_PATH=/state/frontier.db \
              -v "$RUNTIME_DIR:/state" \
              "$IMAGE" >/dev/null
            for _ in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            docker logs frontier-runtime >&2 || true
            return 1
          }

          stop_runtime() {
            docker stop -t 5 frontier-runtime >/dev/null 2>&1 || true
            docker rm frontier-runtime >/dev/null 2>&1 || true
          }

          SIGNAL_ONE='{"source_organization":"SYNTHETIC_RUNTIME","capability_class":"internal_runtime_qualification","mechanism":"provider-disabled deterministic restart proof","evidence_refs":["synthetic://runtime-qualification"],"observed_at":"2026-08-27T21:00:00+00:00"}'
          SIGNAL_TWO='{"source_organization":"SYNTHETIC_RUNTIME","capability_class":"internal_runtime_qualification","mechanism":"provider-disabled rollback perturbation","evidence_refs":["synthetic://runtime-qualification-rollback"],"observed_at":"2026-08-27T21:01:00+00:00"}'

          start_runtime
          curl --fail --silent --show-error "http://127.0.0.1:${PORT}/health" > runtime-proof/health-1.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$SIGNAL_ONE" \
            "http://127.0.0.1:${PORT}/v1/frontier/signals" > runtime-proof/signal-1.json
          stop_runtime
          share_test_volume

          python - <<'PY'
          import json, os, sqlite3
          root = os.environ['RUNTIME_DIR']
          db_path = os.path.join(root, 'frontier.db')
          backup_path = os.path.join(root, 'frontier.db.backup')
          con = sqlite3.connect(db_path)
          con.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          baseline = con.execute('SELECT COUNT(*) FROM events').fetchone()[0]
          assert baseline >= 1, baseline
          backup = sqlite3.connect(backup_path)
          con.backup(backup)
          backup.close()
          con.close()
          json.dump({'baseline_event_count': baseline}, open('runtime-proof/baseline.json', 'w', encoding='utf-8'), sort_keys=True)
          PY
          share_test_volume

          start_runtime
          curl --fail --silent --show-error "http://127.0.0.1:${PORT}/health" > runtime-proof/health-2.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$SIGNAL_ONE" \
            "http://127.0.0.1:${PORT}/v1/frontier/signals" > runtime-proof/signal-1-replay.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$SIGNAL_TWO" \
            "http://127.0.0.1:${PORT}/v1/frontier/signals" > runtime-proof/signal-2.json
          stop_runtime
          share_test_volume

          python - <<'PY'
          import json, os, sqlite3
          root = os.environ['RUNTIME_DIR']
          db_path = os.path.join(root, 'frontier.db')
          backup_path = os.path.join(root, 'frontier.db.backup')
          baseline = json.load(open('runtime-proof/baseline.json', encoding='utf-8'))['baseline_event_count']
          first = json.load(open('runtime-proof/signal-1.json', encoding='utf-8'))
          replay = json.load(open('runtime-proof/signal-1-replay.json', encoding='utf-8'))
          assert first['receipt']['event_id'] == replay['receipt']['event_id'], (first, replay)
          con = sqlite3.connect(db_path)
          con.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          mutated = con.execute('SELECT COUNT(*) FROM events').fetchone()[0]
          con.close()
          assert mutated == baseline + 1, (baseline, mutated)
          backup = sqlite3.connect(backup_path)
          restored = sqlite3.connect(db_path)
          backup.backup(restored)
          restored.close()
          backup.close()
          verify = sqlite3.connect(db_path)
          restored_count = verify.execute('SELECT COUNT(*) FROM events').fetchone()[0]
          verify.close()
          assert restored_count == baseline, (baseline, restored_count)
          json.dump({
              'baseline_event_count': baseline,
              'mutated_event_count': mutated,
              'restored_event_count': restored_count,
              'replay_event_id_equal': True,
              'rollback_restored': True,
          }, open('runtime-proof/persistence-rollback.json', 'w', encoding='utf-8'), sort_keys=True)
          PY
          share_test_volume

          start_runtime
          curl --fail --silent --show-error "http://127.0.0.1:${PORT}/health" > runtime-proof/health-3-after-restore.json
          stop_runtime
          share_test_volume

          python - <<'PY'
          import json, os
          from frontier_convergence.core import SQLiteConvergenceStore
          healths = [json.load(open(path, encoding='utf-8')) for path in (
              'runtime-proof/health-1.json',
              'runtime-proof/health-2.json',
              'runtime-proof/health-3-after-restore.json',
          )]
          for health in healths:
              assert health['state'] == 'READY_INTERNAL_CONTROL_RUNTIME', health
              assert health['provider_effects'] is False, health
              assert health['event_chain_valid'] is True, health
          root = os.environ['RUNTIME_DIR']
          store = SQLiteConvergenceStore(os.path.join(root, 'frontier.db'))
          assert store.verify_event_chain() is True
          persistence = json.load(open('runtime-proof/persistence-rollback.json', encoding='utf-8'))
          canary = json.load(open('runtime-proof/canary.json', encoding='utf-8'))
          receipt = {
              'schema': 'FRONTIER-RUNTIME-QUALIFICATION-1',
              'source_sha': os.environ['SOURCE_SHA'],
              'provider_effects': False,
              'canary_state': canary['state'],
              'container_health_states': [item['state'] for item in healths],
              'event_chain_valid_after_restore': True,
              **persistence,
              'status': 'INTERNAL_RUNTIME_VERIFIED',
          }
          json.dump(receipt, open('runtime-proof/runtime-qualification.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Bind exact-head internal runtime proof to v2 court
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          runtime_path = Path('runtime-proof/runtime-qualification.json')
          runtime_raw = runtime_path.read_bytes()
          runtime = json.loads(runtime_raw)
          image_digest = Path('runtime-proof/image-id.txt').read_text(encoding='utf-8').strip()
          assert runtime['source_sha'] == os.environ['SOURCE_SHA'], runtime
          assert runtime['status'] == 'INTERNAL_RUNTIME_VERIFIED', runtime
          assert runtime['provider_effects'] is False, runtime
          assert runtime['container_health_states'] == ['READY_INTERNAL_CONTROL_RUNTIME'] * 3, runtime
          assert runtime['event_chain_valid_after_restore'] is True, runtime
          assert runtime['replay_event_id_equal'] is True, runtime
          assert runtime['rollback_restored'] is True, runtime
          assert runtime['mutated_event_count'] == runtime['baseline_event_count'] + 1, runtime
          assert runtime['restored_event_count'] == runtime['baseline_event_count'], runtime
          assert image_digest.startswith('sha256:') and len(image_digest) == 71, image_digest

          evidence = [{
              'evidence_id': f"github-actions-frontier-runtime-{os.environ["GITHUB_RUN_ID"]}",
              'source_head_sha': os.environ['SOURCE_SHA'],
              'evidence_mode': 'INTERNAL_RUNTIME_QUALIFICATION',
              'environment': 'github-actions-ubuntu-24.04-docker',
              'image_digest': image_digest,
              'revision_id': '',
              'provider_registration_verified': False,
              'workload_identity_verified': False,
              'health_readback_verified': True,
              'rollback_verified': True,
              'deployment_observed': False,
              'independent_readback': True,
              'provider_effect_authorized': False,
              'proof_refs': [
                  'runtime-qualification:sha256:' + hashlib.sha256(runtime_raw).hexdigest(),
                  'image:' + image_digest,
              ],
          }]
          Path('runtime-proof/internal-runtime-court-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python -m evidenceops.caseforge.owner_value_deployment_court_v2 \
            --candidate-id bubbles-pr876-exact-head-runtime \
            --source-head-sha "$SOURCE_SHA" \
            --deployment-receipt runtime-proof/internal-runtime-court-evidence.json \
            --output runtime-proof/owner-value-deployment-court-v2.json
          python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/owner-value-deployment-court-v2.json', encoding='utf-8'))
          assert receipt['source_head_sha'] == __import__('os').environ['SOURCE_SHA'], receipt
          assert receipt['decision'] == 'HOLD_NO_PROMOTION', receipt
          assert receipt['internal_runtime_qualified'] is True, receipt
          assert receipt['provider_deployment_proven'] is False, receipt
          assert 'EXACT_HEAD_INTERNAL_RUNTIME_QUALIFICATION_REQUIRED' not in receipt['blockers'], receipt
          assert 'OWNER_VALUE_MINIMUM_OBSERVED_PAIRS_REQUIRED' in receipt['blockers'], receipt
          assert 'LIVE_PROVIDER_DEPLOYMENT_EVIDENCE_REQUIRED' in receipt['blockers'], receipt
          assert receipt['stable_promotion_authorized'] is False, receipt
          assert receipt['effect_authorized'] is False, receipt
          assert receipt['external_effect'] is False, receipt
          print('EXACT_HEAD_INTERNAL_RUNTIME_BOUND_TO_V2_COURT_NO_PROMOTION')
          PY
      - name: Publish qualification summary
        if: always()
        shell: bash
        run: |
          if [[ -f runtime-proof/runtime-qualification.json ]]; then
            echo '## Frontier Runtime Qualification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runtime-proof/runtime-qualification.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f runtime-proof/mission-ir-golden-path-shadow.json ]]; then
            echo '## MissionIR Golden Path Shadow Certification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runtime-proof/mission-ir-golden-path-shadow.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f runtime-proof/owner-value-deployment-court-v2.json ]]; then
            echo '## Owner-Value and Deployment Court v2' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runtime-proof/owner-value-deployment-court-v2.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload immutable runtime proof
        if: always() && hashFiles('runtime-proof/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-proof/
          if-no-files-found: error
          retention-days: 90
