name: EvidenceOps AI ICT durable runtime

on:
  push:
    paths:
      - "evidenceops/ai_ict_durable/**"
      - ".github/workflows/evidenceops-ai-ict-durable-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-non-secret-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: evidenceops/ai_ict_durable/requirements-sdk.txt
      - name: Install exact OpenAI Agents SDK contract
        working-directory: evidenceops/ai_ict_durable
        run: python -m pip install --disable-pip-version-check -r requirements-sdk.txt
      - name: Verify live SDK API contract without a credential
        working-directory: evidenceops/ai_ict_durable
        run: python sdk_contract_probe.py
      - name: Run durable runtime tests
        working-directory: evidenceops/ai_ict_durable
        run: python -m unittest discover -s tests -v
      - name: Verify security and persistence contract
        working-directory: evidenceops/ai_ict_durable
        run: python verify_overlay.py
