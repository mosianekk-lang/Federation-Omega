name: EvidenceOps AI ICT durable runtime

on:
  push:
    paths:
      - "evidenceops/ai_ict_durable/**"
      - ".github/workflows/evidenceops-ai-ict-durable-runtime.yml"
  pull_request:
    paths:
      - "evidenceops/ai_ict_durable/**"
      - ".github/workflows/evidenceops-ai-ict-durable-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-non-secret-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            evidenceops/ai_ict_durable/requirements-sdk.txt
            evidenceops/ai_ict_durable/requirements-sdk-wheel.txt
      - name: Download hash-locked OpenAI Agents SDK wheel
        working-directory: evidenceops/ai_ict_durable
        run: >-
          python -m pip download --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          -r requirements-sdk-wheel.txt -d wheelhouse
      - name: Install attested SDK wheel and dependencies
        working-directory: evidenceops/ai_ict_durable
        run: |
          python -m pip install --disable-pip-version-check --no-deps wheelhouse/openai_agents-0.19.2-py3-none-any.whl
          python -m pip install --disable-pip-version-check -r requirements-sdk.txt
          python -m pip check
      - name: Verify live SDK API contract without a credential
        working-directory: evidenceops/ai_ict_durable
        run: python sdk_contract_probe.py
      - name: Run durable runtime tests
        working-directory: evidenceops/ai_ict_durable
        run: python -m unittest discover -s tests -v
      - name: Verify security and persistence contract
        working-directory: evidenceops/ai_ict_durable
        run: python verify_overlay.py
