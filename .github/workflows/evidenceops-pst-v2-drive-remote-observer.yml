name: EvidenceOps PST v2 Drive Remote Observer

on:
  workflow_run:
    workflows: ["EvidenceOps PST v2 Drive Remote Verify"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record terminal provider state
        env:
          OBSERVED_RUN_ID: ${{ github.event.workflow_run.id }}
          OBSERVED_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          OBSERVED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          OBSERVED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          OBSERVED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OBSERVED_HTML_URL: ${{ github.event.workflow_run.html_url }}
          OBSERVED_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          OBSERVED_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          conclusion = os.environ['OBSERVED_CONCLUSION']
          receipt = {
              'schema': 'EVIDENCEOPS-PST-V2-DRIVE-REMOTE-OBSERVER-1',
              'workflow': 'EvidenceOps PST v2 Drive Remote Verify',
              'workflow_run_id': int(os.environ['OBSERVED_RUN_ID']),
              'run_number': int(os.environ['OBSERVED_RUN_NUMBER']),
              'run_attempt': int(os.environ['OBSERVED_ATTEMPT']),
              'head_sha': os.environ['OBSERVED_HEAD_SHA'],
              'html_url': os.environ['OBSERVED_HTML_URL'],
              'provider_created_at': os.environ['OBSERVED_CREATED_AT'],
              'provider_updated_at': os.environ['OBSERVED_UPDATED_AT'],
              'conclusion': conclusion,
              'status': 'COMPLETE_VERIFIED_RECEIPT_EXPECTED' if conclusion == 'success' else 'TERMINAL_PROVIDER_FAILURE_REQUIRES_REPAIR',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'completion_receipt_path': 'deployment_receipts/evidenceops-pst-corpus-v2-drive-completion.json',
              'remote_verification_path': 'deployment_receipts/evidenceops-pst-corpus-v2-remote-verification.json',
          }
          Path('deployment_receipts/evidenceops-pst-corpus-v2-drive-remote-observer.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit observer receipt
        run: |
          set -euo pipefail
          git config user.name 'evidenceops-pst-observer'
          git config user.email 'evidenceops-pst-observer@users.noreply.github.com'
          git add deployment_receipts/evidenceops-pst-corpus-v2-drive-remote-observer.json
          git commit -m 'Record PST Drive remote verifier terminal state [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
