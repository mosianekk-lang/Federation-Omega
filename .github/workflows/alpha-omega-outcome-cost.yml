name: Alpha Omega Outcome and Cost Governor

on:
  pull_request:
    paths:
      - 'alpha_omega_v21/**'
      - '.github/workflows/alpha-omega-outcome-cost.yml'
  push:
    paths:
      - 'alpha_omega_v21/**'
      - '.github/workflows/alpha-omega-outcome-cost.yml'
  schedule:
    - cron: '37 * * * *'

jobs:
  outcome-cost-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python scripts/run_outcome_cost.py --workspace ./outcome_cost_workspace
      - run: test -f ./outcome_cost_workspace/outcome_cost_receipt.json
      - run: test -f ./outcome_cost_workspace/outcome_cost_ledger.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-outcome-cost-proof
          path: |
            alpha_omega_v21/outcome_cost_workspace/outcome_cost_receipt.json
            alpha_omega_v21/outcome_cost_workspace/outcome_cost_ledger.jsonl
          if-no-files-found: error
