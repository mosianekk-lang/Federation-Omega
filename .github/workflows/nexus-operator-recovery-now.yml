name: NEXUS Operator Recovery Now

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nexus-operator-recovery-now
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: "257649435135"
  REGION: africa-south1
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app
  DEFAULT_WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEFAULT_DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  TARGET_SERVICE: nexus-codex-runtime
  SOURCE_SERVICE: architron9
  ARTIFACT_DRIVE_ID: 1_r1qlRHeEcF7Xl-BSJpfWUWIRYs4C_Pm
  ARTIFACT_NAME: nexus-codex-runtime-v3.1.1.zip
  ARTIFACT_SHA256: fabbdf9ec89c1ea4468515ba1659cc0019719c5bc5747084795148a354dc1518
  WHEEL_DRIVE_ID: 1Ur3FEOPCjQ54gumvBDTSbWJpDse6o86p
  SERVICE_ACCOUNT: fo-automation-agent@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  recover-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_DIRECT_TOKEN: ${{ secrets.FO_ADMIN_TOKEN != '' }}
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
      HAS_GOOGLE_GHA_CREDS_JSON: ${{ secrets.GOOGLE_GHA_CREDS_JSON != '' }}
      HAS_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS != '' }}
      HAS_GCP_WIF_PAIR: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '') && (secrets.GCP_SERVICE_ACCOUNT != '' || vars.GCP_SERVICE_ACCOUNT != '') }}
      HAS_GENERIC_WIF_PAIR: ${{ (secrets.WIF_PROVIDER != '' || vars.WIF_PROVIDER != '') && (secrets.DEPLOYER_SA != '' || vars.DEPLOYER_SA != '') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate with GCP_SA_KEY
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate with GCP_SERVICE_ACCOUNT_KEY
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Authenticate with GOOGLE_CREDENTIALS
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Authenticate with GOOGLE_SERVICE_ACCOUNT_KEY
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Authenticate with GCP_CREDENTIALS
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Authenticate with GOOGLE_GHA_CREDS_JSON
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS != 'true' && env.HAS_GOOGLE_GHA_CREDS_JSON == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_GHA_CREDS_JSON }}

      - name: Authenticate with GOOGLE_CLOUD_CREDENTIALS
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS != 'true' && env.HAS_GOOGLE_GHA_CREDS_JSON != 'true' && env.HAS_GOOGLE_CLOUD_CREDENTIALS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Authenticate with repository-defined GCP WIF pair
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS != 'true' && env.HAS_GOOGLE_GHA_CREDS_JSON != 'true' && env.HAS_GOOGLE_CLOUD_CREDENTIALS != 'true' && env.HAS_GCP_WIF_PAIR == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with generic WIF pair
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS != 'true' && env.HAS_GOOGLE_GHA_CREDS_JSON != 'true' && env.HAS_GOOGLE_CLOUD_CREDENTIALS != 'true' && env.HAS_GCP_WIF_PAIR != 'true' && env.HAS_GENERIC_WIF_PAIR == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA || vars.DEPLOYER_SA }}

      - name: Authenticate with canonical WIF
        if: ${{ env.HAS_DIRECT_TOKEN != 'true' && env.HAS_GCP_SA_KEY != 'true' && env.HAS_GCP_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GOOGLE_CREDENTIALS != 'true' && env.HAS_GOOGLE_SERVICE_ACCOUNT_KEY != 'true' && env.HAS_GCP_CREDENTIALS != 'true' && env.HAS_GOOGLE_GHA_CREDS_JSON != 'true' && env.HAS_GOOGLE_CLOUD_CREDENTIALS != 'true' && env.HAS_GCP_WIF_PAIR != 'true' && env.HAS_GENERIC_WIF_PAIR != 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ env.DEFAULT_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Acquire token and execute reversible acceptance chain
        if: ${{ always() }}
        shell: bash
        env:
          DIRECT_FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p deployments/nexus /tmp/nexus

          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1 || true)"
          TOKEN="$DIRECT_FO_ADMIN_TOKEN"
          TOKEN_SOURCE=""
          TOKEN_ERROR=""

          if [[ -n "$TOKEN" ]]; then
            TOKEN_SOURCE="github_actions_secret"
          elif [[ -n "$ACCOUNT" ]]; then
            set +e
            TOKEN="$(gcloud secrets versions access latest --secret=fo-operator-admin-token --project="$PROJECT_ID" 2>/tmp/nexus/token-error.txt)"
            RC=$?
            set -e
            if [[ $RC -eq 0 && -n "$TOKEN" ]]; then
              TOKEN_SOURCE="google_secret_manager"
            else
              TOKEN=""
              TOKEN_ERROR="$(tail -c 2400 /tmp/nexus/token-error.txt 2>/dev/null || true)"
            fi
          fi

          if [[ -n "$TOKEN" ]]; then
            echo "::add-mask::$TOKEN"
          fi

          export NEXUS_OPERATOR_TOKEN="$TOKEN"
          export NEXUS_TOKEN_SOURCE="$TOKEN_SOURCE"
          export NEXUS_ACTIVE_ACCOUNT="$ACCOUNT"
          export NEXUS_TOKEN_ERROR="$TOKEN_ERROR"

          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          base = os.environ["OPERATOR_URL"].rstrip("/")
          token = os.environ.get("NEXUS_OPERATOR_TOKEN", "")
          project = os.environ["PROJECT_ID"]
          region = os.environ["REGION"]
          target = os.environ["TARGET_SERVICE"]
          source = os.environ["SOURCE_SERVICE"]

          SENSITIVE_EXACT = {
              "access_token", "refresh_token", "id_token", "authorization",
              "credentials_json", "credential_json", "api_key", "client_secret",
              "secret_value", "private_key", "private_key_data",
          }

          def redact(value: Any) -> Any:
              if isinstance(value, dict):
                  out = {}
                  for key, item in value.items():
                      normalized = str(key).lower()
                      out[key] = "[REDACTED]" if normalized in SENSITIVE_EXACT else redact(item)
                  return out
              if isinstance(value, list):
                  return [redact(item) for item in value]
              if isinstance(value, str) and token:
                  return value.replace(token, "[REDACTED]")
              return value

          def call(path: str, body: dict | None = None, auth: bool = False, timeout: int = 90) -> dict:
              headers = {"accept": "application/json"}
              data = None
              if body is not None:
                  headers["content-type"] = "application/json"
                  data = json.dumps(body, separators=(",", ":")).encode()
              if auth and token:
                  headers["x-fo-admin-token"] = token
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  headers=headers,
                  method="POST" if body is not None else "GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", "replace")
                      try:
                          parsed = json.loads(raw)
                      except Exception:
                          parsed = {"text": raw[:5000]}
                      return {"http_status": response.status, "body": redact(parsed)}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"text": raw[:5000]}
                  return {"http_status": exc.code, "body": redact(parsed)}
              except Exception as exc:
                  return {
                      "transport_error": type(exc).__name__,
                      "message": str(exc)[:700],
                      "execution_uncertain": body is not None,
                  }

          def ok(response: dict) -> bool:
              return (
                  response.get("http_status") == 200
                  and response.get("body", {}).get("ok") is True
              )

          def find(value: Any, names: set[str]) -> str | None:
              if isinstance(value, dict):
                  for key, item in value.items():
                      if str(key).lower() in names and item not in (None, "", [], {}):
                          return str(item)
                  for item in value.values():
                      result = find(item, names)
                      if result:
                          return result
              elif isinstance(value, list):
                  for item in value:
                      result = find(item, names)
                      if result:
                          return result
              return None

          def contains_terminal_status(value: Any, expected: str) -> bool:
              if isinstance(value, dict):
                  for key, item in value.items():
                      if str(key).lower() in {"status", "build_status", "buildstatus", "state"}:
                          if str(item).upper() == expected:
                              return True
                      if contains_terminal_status(item, expected):
                          return True
              elif isinstance(value, list):
                  return any(contains_terminal_status(item, expected) for item in value)
              return False

          def evidence_value_ok(value: Any) -> bool:
              if isinstance(value, bool):
                  return value
              if isinstance(value, dict):
                  if value.get("ok") is True:
                      return True
                  if str(value.get("status", "")).upper() in {"DONE", "OK", "SUCCESS", "VERIFIED"}:
                      return True
                  return any(evidence_value_ok(item) for item in value.values())
              if isinstance(value, list):
                  return any(evidence_value_ok(item) for item in value)
              if isinstance(value, str):
                  return value.strip().upper() in {"TRUE", "DONE", "OK", "SUCCESS", "VERIFIED"}
              return False

          def named_evidence_ok(value: Any, names: set[str]) -> bool:
              if isinstance(value, dict):
                  for key, item in value.items():
                      if str(key).lower() in names and evidence_value_ok(item):
                          return True
                      if named_evidence_ok(item, names):
                          return True
              elif isinstance(value, list):
                  return any(named_evidence_ok(item, names) for item in value)
              return False

          presence = {
              "FO_ADMIN_TOKEN": os.environ.get("HAS_DIRECT_TOKEN") == "true",
              "GCP_SA_KEY": os.environ.get("HAS_GCP_SA_KEY") == "true",
              "GCP_SERVICE_ACCOUNT_KEY": os.environ.get("HAS_GCP_SERVICE_ACCOUNT_KEY") == "true",
              "GOOGLE_CREDENTIALS": os.environ.get("HAS_GOOGLE_CREDENTIALS") == "true",
              "GOOGLE_SERVICE_ACCOUNT_KEY": os.environ.get("HAS_GOOGLE_SERVICE_ACCOUNT_KEY") == "true",
              "GCP_CREDENTIALS": os.environ.get("HAS_GCP_CREDENTIALS") == "true",
              "GOOGLE_GHA_CREDS_JSON": os.environ.get("HAS_GOOGLE_GHA_CREDS_JSON") == "true",
              "GOOGLE_CLOUD_CREDENTIALS": os.environ.get("HAS_GOOGLE_CLOUD_CREDENTIALS") == "true",
              "GCP_WIF_PAIR": os.environ.get("HAS_GCP_WIF_PAIR") == "true",
              "GENERIC_WIF_PAIR": os.environ.get("HAS_GENERIC_WIF_PAIR") == "true",
          }

          priority = [
              "FO_ADMIN_TOKEN", "GCP_SA_KEY", "GCP_SERVICE_ACCOUNT_KEY",
              "GOOGLE_CREDENTIALS", "GOOGLE_SERVICE_ACCOUNT_KEY",
              "GCP_CREDENTIALS", "GOOGLE_GHA_CREDS_JSON",
              "GOOGLE_CLOUD_CREDENTIALS", "GCP_WIF_PAIR", "GENERIC_WIF_PAIR",
          ]
          selected_route = next((name for name in priority if presence[name]), "CANONICAL_WIF")

          health = call("/health")
          contract = call("/")
          allowed = set(contract.get("body", {}).get("allowedActions", []))
          required = {"STATUS", "READ_CLOUD_RUN_SERVICE", "DEPLOY_SOLUTION5_LOCKED", "READ_BUILD"}

          receipt: dict[str, Any] = {
              "receipt": "NEXUS-OPERATOR-RECOVERY-NOW",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "project": project,
              "region": region,
              "target_service": target,
              "source_service": source,
              "artifact": {
                  "drive_id": os.environ["ARTIFACT_DRIVE_ID"],
                  "name": os.environ["ARTIFACT_NAME"],
                  "sha256": os.environ["ARTIFACT_SHA256"],
                  "wheel_drive_id": os.environ["WHEEL_DRIVE_ID"],
              },
              "credential_alias_presence": presence,
              "auth_route_selected": selected_route,
              "active_gcloud_account": os.environ.get("NEXUS_ACTIVE_ACCOUNT") or None,
              "token_source": os.environ.get("NEXUS_TOKEN_SOURCE") or "none",
              "token_present": bool(token),
              "token_value_recorded": False,
              "secret_values_recorded": False,
              "token_error": os.environ.get("NEXUS_TOKEN_ERROR", "")[:2400] or None,
              "public_health": health,
              "public_contract": contract,
              "required_actions_missing": sorted(required - allowed),
              "authenticated_status": None,
              "baseline_read": None,
              "deployment": None,
              "build_readbacks": [],
              "target_read": None,
              "endpoint_health": None,
              "mutation_attempted": False,
              "rollback_ref": None,
              "proof_matrix": {},
              "classification": "BLOCKED_NO_TRUSTED_SECRET_ROUTE",
          }

          if token and required.issubset(allowed):
              status = call(
                  "/execute",
                  {"action": "STATUS", "payload": {
                      "purpose": "NEXUS v3.1.1 authenticated acceptance",
                      "mutation": "NONE",
                  }},
                  True,
              )
              baseline = call(
                  "/execute",
                  {"action": "READ_CLOUD_RUN_SERVICE", "payload": {
                      "project": project,
                      "region": region,
                      "service": source,
                      "purpose": "NEXUS reversible deployment baseline",
                  }},
                  True,
              )
              receipt["authenticated_status"] = status
              receipt["baseline_read"] = baseline

              if ok(status) and ok(baseline):
                  payload = {
                      "approvalKey": "APPROVED",
                      "project": project,
                      "region": region,
                      "service": target,
                      "artifactDriveId": os.environ["ARTIFACT_DRIVE_ID"],
                      "artifactName": os.environ["ARTIFACT_NAME"],
                      "artifactSha256": os.environ["ARTIFACT_SHA256"],
                      "wheelDriveId": os.environ["WHEEL_DRIVE_ID"],
                      "sourceService": source,
                      "serviceAccount": os.environ["SERVICE_ACCOUNT"],
                      "deploymentMode": "reversible_new_service",
                      "requiredSecrets": ["OPENAI_API_KEY"],
                      "proofRequired": [
                          "build_id", "build_status_SUCCESS", "service_url",
                          "latest_ready_revision", "service_account", "health",
                          "rollback_ref", "doc_write_readback", "sheet_write_readback",
                      ],
                  }
                  receipt["mutation_attempted"] = True
                  deployment = call(
                      "/execute",
                      {"action": "DEPLOY_SOLUTION5_LOCKED", "payload": payload},
                      True,
                      180,
                  )
                  receipt["deployment"] = deployment
                  dep_body = deployment.get("body", {})
                  build_id = find(dep_body, {"build_id", "buildid"})
                  receipt["rollback_ref"] = find(
                      dep_body,
                      {"rollback_ref", "rollback", "previous_revision", "previousrevision"},
                  )

                  if ok(deployment) and build_id:
                      for _ in range(12):
                          build_read = call(
                              "/execute",
                              {"action": "READ_BUILD", "payload": {
                                  "project": project,
                                  "buildId": build_id,
                              }},
                              True,
                          )
                          receipt["build_readbacks"].append(build_read)
                          if any(
                              contains_terminal_status(build_read, status_name)
                              for status_name in ("SUCCESS", "FAILURE", "CANCELLED", "TIMEOUT")
                          ):
                              break
                          time.sleep(15)

                      target_read = call(
                          "/execute",
                          {"action": "READ_CLOUD_RUN_SERVICE", "payload": {
                              "project": project,
                              "region": region,
                              "service": target,
                          }},
                          True,
                      )
                      receipt["target_read"] = target_read
                      service_url = find(target_read, {"service_url", "serviceurl", "url", "uri"})
                      latest_revision = find(
                          target_read,
                          {"latest_ready_revision", "latestreadyrevision", "latestreadyrevisionname", "revision"},
                      )
                      deployed_sa = find(
                          target_read,
                          {"service_account", "serviceaccount", "serviceaccountname"},
                      )
                      if service_url:
                          try:
                              with urllib.request.urlopen(
                                  service_url.rstrip("/") + "/health",
                                  timeout=30,
                              ) as response:
                                  raw = response.read().decode("utf-8", "replace")
                                  try:
                                      parsed = json.loads(raw)
                                  except Exception:
                                      parsed = {"text": raw[:3000]}
                                  receipt["endpoint_health"] = {
                                      "http_status": response.status,
                                      "body": redact(parsed),
                                  }
                          except Exception as exc:
                              receipt["endpoint_health"] = {
                                  "error": type(exc).__name__,
                                  "message": str(exc)[:500],
                              }

                      deployment_text = json.dumps(dep_body, sort_keys=True).lower()
                      expected_sa = os.environ["SERVICE_ACCOUNT"].lower()
                      expected_hash = os.environ["ARTIFACT_SHA256"].lower()
                      image_digest = find(
                          target_read,
                          {"image_digest", "imagedigest", "digest", "image"},
                      )
                      proof = {
                          "build_id": bool(build_id),
                          "build_status_SUCCESS": any(
                              contains_terminal_status(item, "SUCCESS")
                              for item in receipt["build_readbacks"]
                          ),
                          "artifact_sha256_acknowledged": expected_hash in deployment_text,
                          "service_url": bool(service_url),
                          "latest_ready_revision": bool(latest_revision),
                          "image_digest_or_digest_pinned_image": bool(
                              image_digest and ("sha256:" in image_digest.lower() or "@sha256:" in image_digest.lower())
                          ),
                          "service_account": bool(deployed_sa),
                          "service_account_matches": bool(
                              deployed_sa and deployed_sa.lower().endswith(expected_sa)
                          ),
                          "health": receipt.get("endpoint_health", {}).get("http_status") == 200,
                          "rollback_ref": bool(receipt["rollback_ref"]),
                          "doc_write_readback": named_evidence_ok(
                              dep_body,
                              {"doc_write_readback", "docwritereadback"},
                          ),
                          "sheet_write_readback": named_evidence_ok(
                              dep_body,
                              {"sheet_write_readback", "sheetwritereadback"},
                          ),
                          "target_read_ok": ok(target_read),
                      }
                      receipt["proof_matrix"] = proof

                      if all(proof.values()):
                          receipt["classification"] = "NEXUS_V3_1_1_COMPLETE_PROOF_PACKET_READY"
                      else:
                          receipt["classification"] = "DEPLOYMENT_EXECUTED_PROOF_INCOMPLETE"
                  else:
                      receipt["classification"] = "DEPLOYMENT_ACTION_FAILED_OR_NO_BUILD_ID"
              else:
                  receipt["classification"] = "AUTHENTICATED_PREFLIGHT_FAILED"
          elif token:
              receipt["classification"] = "BLOCKED_LIVE_ALLOWLIST_MISMATCH"
          elif selected_route == "CANONICAL_WIF" and "invalid_target" in (receipt["token_error"] or "").lower():
              receipt["classification"] = "BLOCKED_CANONICAL_WIF_INVALID_TARGET"

          output = Path("deployments/nexus/NEXUS_OPERATOR_RECOVERY_NOW_RECEIPT.json")
          output.write_text(
              json.dumps(redact(receipt), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(redact(receipt), indent=2, sort_keys=True))
          PY

      - name: Persist receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexus-operator-recovery[bot]"
          git config user.email "nexus-operator-recovery[bot]@users.noreply.github.com"
          git add deployments/nexus/NEXUS_OPERATOR_RECOVERY_NOW_RECEIPT.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record NEXUS operator recovery receipt"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nexus-operator-recovery-now
          if-no-files-found: error
          retention-days: 30
          path: deployments/nexus/NEXUS_OPERATOR_RECOVERY_NOW_RECEIPT.json
