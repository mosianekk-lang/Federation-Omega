name: CFBE Observed Campaign Current Qualification

on:
  pull_request:
    paths:
      - 'federation/cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/bubbles_30_pair_observed_certification_20260830.json'
      - 'tests/test_cfbe_observed_campaign_admission.py'
      - '.github/workflows/cfbe-observed-current-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'federation/cfbe_observed_campaign_admission.py'
      - 'benchmarking/cfbe_omega/bubbles_30_pair_observed_certification_20260830.json'
      - 'tests/test_cfbe_observed_campaign_admission.py'
      - '.github/workflows/cfbe-observed-current-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfbe-observed-current-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify immutable observed campaign admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof
          python -m unittest discover -s tests -p 'test_cfbe_observed_campaign_admission.py' -v
          python -m federation.cfbe_observed_campaign_admission \
            > runtime-proof/observed-campaign-admission.json
          python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/observed-campaign-admission.json', encoding='utf-8'))
          assert receipt['decision'] == 'ADMISSIBLE_AS_SEPARATE_OBSERVED_EMPIRICAL_VALUE_CANDIDATE', receipt
          assert receipt['observed_pair_count'] == 30, receipt
          assert receipt['structural_pass_count'] == 30, receipt
          assert receipt['zero_critical_omissions'] is True, receipt
          assert receipt['empirical_value_candidate'] is True, receipt
          assert receipt['stable_promotion_allowed'] is False, receipt
          assert receipt['provider_authority_granted'] is False, receipt
          assert receipt['runtime_deployment_proven'] is False, receipt
          assert receipt['owner_value_proven'] is False, receipt
          assert receipt['external_effects'] == 0, receipt
          assert receipt['provider_writes'] == 0, receipt
          print('OBSERVED_CAMPAIGN_HISTORICAL_ADMISSION_VERIFIED')
          PY

      - name: Verify historical source is ancestor of exact current head
        shell: bash
        run: |
          set -euo pipefail
          BASE_SOURCE="$(python - <<'PY'
          import json
          receipt = json.load(open('runtime-proof/observed-campaign-admission.json', encoding='utf-8'))
          print(receipt['source_lineage']['base'])
          PY
          )"
          git cat-file -e "${BASE_SOURCE}^{commit}"
          git merge-base --is-ancestor "${BASE_SOURCE}" "${GITHUB_SHA}"
          echo "${BASE_SOURCE}" > runtime-proof/base-source.txt
          git rev-list --count "${BASE_SOURCE}..${GITHUB_SHA}" > runtime-proof/commits-ahead.txt
          echo 'OBSERVED_CAMPAIGN_ANCESTRY_VERIFIED'

      - name: Emit exact-head compatibility receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          admission_path = Path('runtime-proof/observed-campaign-admission.json')
          admission_bytes = admission_path.read_bytes()
          admission = json.loads(admission_bytes)
          base_source = Path('runtime-proof/base-source.txt').read_text(encoding='utf-8').strip()
          commits_ahead = int(Path('runtime-proof/commits-ahead.txt').read_text(encoding='utf-8').strip())

          receipt = {
              'schema': 'CFBE-OBSERVED-CAMPAIGN-CURRENT-COMPATIBILITY-1',
              'source_sha': os.environ['GITHUB_SHA'],
              'historical_observed_source_sha': base_source,
              'historical_admission_receipt_sha256': hashlib.sha256(admission_bytes).hexdigest(),
              'historical_source_is_ancestor': True,
              'commits_ahead_of_historical_source': commits_ahead,
              'observed_pair_count': admission['observed_pair_count'],
              'structural_pass_count': admission['structural_pass_count'],
              'zero_critical_omissions': admission['zero_critical_omissions'],
              'empirical_value_candidate': admission['empirical_value_candidate'],
              'current_source_compatibility_verified': True,
              'provider_authority_granted': False,
              'runtime_deployment_proven': False,
              'owner_value_proven': False,
              'stable_promotion_allowed': False,
              'external_effects': 0,
              'provider_writes': 0,
              'communications': 0,
              'truth_boundary': (
                  'This receipt proves only that the immutable admitted 30-pair observed campaign '
                  'remains ancestry-compatible with this exact tested repository head. It does not '
                  'prove provider deployment, owner value, native ChatGPT runtime behavior, or stable SLOS promotion.'
              ),
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode('utf-8')
          receipt['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('runtime-proof/observed-campaign-current-compatibility.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Publish qualification summary
        if: always()
        shell: bash
        run: |
          if [[ -f runtime-proof/observed-campaign-current-compatibility.json ]]; then
            echo '## CFBE Observed Campaign Current Qualification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat runtime-proof/observed-campaign-current-compatibility.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable compatibility proof
        if: always() && hashFiles('runtime-proof/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfbe-observed-current-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-proof/
          if-no-files-found: error
          retention-days: 90
