name: FUSE Mobile MDTAF v1 Court

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: fuse-mobile-mdtaf-v1
  cancel-in-progress: false

jobs:
  mdtaf-build:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_MDTAF_V1' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact default-branch source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node 20.19
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.x'

      - name: Run MDTAF source contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_fuse_mobile_mdtaf_v1

      - name: Resolve and verify mobile dependencies
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci
          npx expo install --check
          npm audit --audit-level=high
          npm run typecheck
          npx expo-doctor

      - name: Build exact debug APK
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild:android
          test -x android/gradlew || chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon)
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Scan exact APK for credential-like material
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mdtaf-build
          python lab/scan_apk.py \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --output mdtaf-build/apk-security-scan.json
          cp android/app/build/outputs/apk/debug/app-debug.apk mdtaf-build/app-debug.apk
          sha256sum mdtaf-build/app-debug.apk | tee mdtaf-build/apk.sha256
          cp package-lock.json mdtaf-build/package-lock.json

      - name: Upload immutable MDTAF build input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-mdtaf-build-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: mobile/fuse-mobile/mdtaf-build/

  mdtaf-avd:
    needs: mdtaf-build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download exact APK build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fuse-mobile-mdtaf-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/fuse-mobile/mdtaf-build

      - name: Provision clean Android virtual device
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-${API_LEVEL};google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force \
            --name "fuse-mdtaf-api-${API_LEVEL}" \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device "pixel_6"

      - name: Boot AVD and prove readiness
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          mkdir -p mobile/fuse-mobile/mdtaf-evidence
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$SDK_ROOT/emulator/emulator" \
            -avd "fuse-mdtaf-api-${API_LEVEL}" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -cores 2 \
            > "mobile/fuse-mobile/mdtaf-evidence/emulator-api-${API_LEVEL}.log" 2>&1 &
          adb wait-for-device
          ready=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            adb devices -l || true
            tail -200 "mobile/fuse-mobile/mdtaf-evidence/emulator-api-${API_LEVEL}.log" || true
            exit 1
          fi
          adb shell input keyevent 82 || true
          adb shell getprop ro.build.version.sdk | tr -d '\r' | tee "mobile/fuse-mobile/mdtaf-evidence/android-api.txt"
          adb shell getprop ro.product.cpu.abi | tr -d '\r' | tee "mobile/fuse-mobile/mdtaf-evidence/android-abi.txt"

      - name: Run deterministic lifecycle and offline smoke court
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          cp mdtaf-build/apk-security-scan.json mdtaf-evidence/apk-security-scan.json
          bash lab/run_android_smoke.sh \
            --apk mdtaf-build/app-debug.apk \
            --evidence-dir mdtaf-evidence
          python lab/certify.py \
            --evidence-dir mdtaf-evidence \
            --output mdtaf-evidence/fuse-mobile-mdtaf-certificate.json \
            --source-sha "${GITHUB_SHA}"

      - name: Upload immutable MDTAF device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-mdtaf-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: mobile/fuse-mobile/mdtaf-evidence/
