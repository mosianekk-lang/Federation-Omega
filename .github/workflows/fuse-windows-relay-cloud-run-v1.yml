name: FUSE Windows Relay Cloud Run v2.6

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: fuse-windows-relay-cloud-run-v26
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: fuse-windows-relay
  ARTIFACT_REPOSITORY: federation-omega
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  OIDC_ISSUER: ${{ vars.FUSE_OIDC_ISSUER }}
  OIDC_JWKS_URL: ${{ vars.FUSE_OIDC_JWKS_URL }}
  ALLOW_PRODUCTION_PROMOTION: 'false'

jobs:
  deploy-bounded-canary:
    if: >-
      (github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_CLOUD_RUN_V2' ||
       github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_CLOUD_RUN_V1') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate canonical keyless deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud client
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight identity and relay mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          if [[ -n "$OIDC_ISSUER" && -n "$OIDC_JWKS_URL" ]]; then
            [[ "$OIDC_ISSUER" == https://* && "$OIDC_JWKS_URL" == https://* ]]
            echo 'BOOTSTRAP_MODE=FULL_MCP_AGENT' >> "$GITHUB_ENV"
          elif [[ -z "$OIDC_ISSUER" && -z "$OIDC_JWKS_URL" ]]; then
            echo 'BOOTSTRAP_MODE=AGENT_ONLY_BOOTSTRAP' >> "$GITHUB_ENV"
          else
            echo 'Mixed OIDC state is forbidden' >&2
            exit 43
          fi

      - name: Qualify provider prerequisites without secret-manager or cloud-build dependency
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:ARTIFACT_REPOSITORY' >&2; exit 61; }
          gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(name)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:FIRESTORE_DATABASE' >&2; exit 62; }
          gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" --format='value(email)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:RUNTIME_IDENTITY' >&2; exit 64; }
          gcloud run services list --project "$PROJECT_ID" --region "$REGION" --limit=1 --format='value(metadata.name)' >/dev/null || { echo 'RELAY_PREREQ_UNCALLABLE:CLOUD_RUN_READ' >&2; exit 66; }
          echo 'PROVIDER_PREREQS_QUALIFIED=true' >> "$GITHUB_ENV"
          echo 'DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY' >> "$GITHUB_ENV"
          echo 'BUILD_MECHANISM=GITHUB_HOSTED_DOCKER_DIRECT_PUSH' >> "$GITHUB_ENV"

      - name: Build immutable relay image and push directly to Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --file windows_federation_plane/Dockerfile --tag "$IMAGE" windows_federation_plane
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          echo "IMAGE_DIGEST_URI=$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay@$DIGEST" >> "$GITHUB_ENV"

      - name: Deploy isolated-first-service or zero-traffic existing-service canary
        shell: bash
        run: |
          set -euo pipefail
          ENVVARS="FUSE_AGENT_ONLY_BOOTSTRAP=true,FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY"
          if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
            ENVVARS="FUSE_OIDC_ISSUER=$OIDC_ISSUER,FUSE_OIDC_JWKS_URL=$OIDC_JWKS_URL,FUSE_MCP_RESOURCE_URL=https://bootstrap.invalid/mcp,FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY"
          fi

          echo 'PRODUCTION_TRAFFIC_CHANGED=false' >> "$GITHUB_ENV"
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
            TARGET_SERVICE="$SERVICE"
            PREVIOUS="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
            echo 'PRODUCTION_SERVICE_PRESENT=true' >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_TOPOLOGY=TAGGED_ZERO_TRAFFIC_EXISTING_SERVICE' >> "$GITHUB_ENV"
            echo 'CANARY_DELETE_POINTER=' >> "$GITHUB_ENV"
            gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_DIGEST_URI" --service-account "$RUNTIME_SA" --port 8080 --cpu 1 --memory 512Mi --min 0 --max 3 --concurrency 20 --no-traffic --tag relay-canary --no-invoker-iam-check --set-env-vars="$ENVVARS" --quiet
            SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
              gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --no-traffic --tag relay-canary --update-env-vars="FUSE_MCP_RESOURCE_URL=$SERVICE_URL/mcp" --quiet
            fi
            CANARY_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[?tag==`relay-canary`].url)')"
            CANARY_REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[?tag==`relay-canary`].revisionName)')"
          else
            TARGET_SERVICE="${SERVICE}-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            PREVIOUS=''
            echo 'PRODUCTION_SERVICE_PRESENT=false' >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_TOPOLOGY=ISOLATED_CANARY_SERVICE_WHEN_PRODUCTION_ABSENT' >> "$GITHUB_ENV"
            if gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
              echo "ISOLATED_CANARY_ALREADY_EXISTS:$TARGET_SERVICE" >&2
              exit 67
            fi
            gcloud run deploy "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_DIGEST_URI" --service-account "$RUNTIME_SA" --port 8080 --cpu 1 --memory 512Mi --min 0 --max 1 --concurrency 20 --no-invoker-iam-check --set-env-vars="$ENVVARS" --quiet
            SERVICE_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
              gcloud run services update "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --update-env-vars="FUSE_MCP_RESOURCE_URL=$SERVICE_URL/mcp" --quiet
            fi
            CANARY_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            CANARY_REVISION="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
            printf 'CANARY_DELETE_POINTER=gcloud run services delete %q --project %q --region %q --quiet\n' "$TARGET_SERVICE" "$PROJECT_ID" "$REGION" >> "$GITHUB_ENV"
          fi

          test -n "$SERVICE_URL" && test -n "$CANARY_URL" && test -n "$CANARY_REVISION"
          echo "TARGET_SERVICE=$TARGET_SERVICE" >> "$GITHUB_ENV"
          echo "PREVIOUS_REVISION=$PREVIOUS" >> "$GITHUB_ENV"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "CANARY_URL=$CANARY_URL" >> "$GITHUB_ENV"
          echo "CANARY_REVISION=$CANARY_REVISION" >> "$GITHUB_ENV"

      - name: Semantic bounded canary
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error "$CANARY_URL/healthz")"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$HEALTH")" = ok
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["device_auth"])' <<<"$HEALTH")" = ECDSA_P256
          MCP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' "$CANARY_URL/mcp")"
          case "$MCP_CODE" in 401|403|404) ;; *) echo "MCP_FAIL_CLOSED_REQUIRED:$MCP_CODE" >&2; exit 51 ;; esac
          echo 'MCP_FAIL_CLOSED_CHECKED=true' >> "$GITHUB_ENV"
          if [[ "$BOOTSTRAP_MODE" == 'AGENT_ONLY_BOOTSTRAP' ]]; then
            curl --fail --silent --show-error "$CANARY_URL/node" | grep -F 'CONNECT THIS PC' >/dev/null
            curl --fail --silent --show-error "$CANARY_URL/node/worker.js" | grep -F 'B0_EPHEMERAL_LOW_TRUST' >/dev/null
            curl --fail --silent --show-error "$CANARY_URL/node/worker.js" | grep -F 'ECDSA' >/dev/null
            curl --fail --silent --show-error "$CANARY_URL/node/native-bootstrap.ps1" | grep -F 'NonExportable' >/dev/null
            echo 'BROWSER_ENTRYPOINT_CHECKED=true' >> "$GITHUB_ENV"
          fi

          if [[ "$PRODUCTION_SERVICE_PRESENT" == 'true' ]]; then
            ACTIVE="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
            test "$ACTIVE" != "$CANARY_REVISION"
            echo 'ZERO_TRAFFIC_CHECKED=true' >> "$GITHUB_ENV"
            echo 'PRODUCTION_ISOLATION_CHECKED=true' >> "$GITHUB_ENV"
          else
            if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
              echo 'PRODUCTION_SERVICE_UNEXPECTEDLY_CREATED' >&2
              exit 68
            fi
            test "$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')" = "$CANARY_REVISION"
            echo 'ZERO_TRAFFIC_CHECKED=false' >> "$GITHUB_ENV"
            echo 'PRODUCTION_ISOLATION_CHECKED=true' >> "$GITHUB_ENV"
          fi

      - name: Optional explicitly authorised production promotion
        if: env.ALLOW_PRODUCTION_PROMOTION == 'true' && env.PRODUCTION_SERVICE_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$CANARY_REVISION=100" --quiet
          echo 'PRODUCTION_TRAFFIC_CHANGED=true' >> "$GITHUB_ENV"

      - name: Roll back explicitly authorised promotion on failure
        if: failure() && env.PRODUCTION_SERVICE_PRESENT == 'true' && env.PREVIOUS_REVISION != '' && env.ALLOW_PRODUCTION_PROMOTION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$PREVIOUS_REVISION=100" --quiet

      - name: Emit redacted receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuse-windows-relay-receipt
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          truth=lambda name: os.environ.get(name,'').lower()=='true'
          body = {
              "schema": "FUSE-WINDOWS-RELAY-DEPLOYMENT-RECEIPT-V26",
              "source_sha": os.environ.get("GITHUB_SHA"),
              "project_id": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "service": os.environ["SERVICE"],
              "target_service": os.environ.get("TARGET_SERVICE"),
              "deployment_topology": os.environ.get("DEPLOYMENT_TOPOLOGY"),
              "production_service_present": truth("PRODUCTION_SERVICE_PRESENT"),
              "bootstrap_mode": os.environ.get("BOOTSTRAP_MODE"),
              "device_auth_mode": os.environ.get("DEVICE_AUTH_MODE"),
              "build_mechanism": os.environ.get("BUILD_MECHANISM"),
              "provider_prereqs_qualified": truth("PROVIDER_PREREQS_QUALIFIED"),
              "secret_manager_required": False,
              "cloud_build_required": False,
              "image_digest_uri": os.environ.get("IMAGE_DIGEST_URI"),
              "canary_url": os.environ.get("CANARY_URL"),
              "canary_revision": os.environ.get("CANARY_REVISION"),
              "previous_revision": os.environ.get("PREVIOUS_REVISION"),
              "canary_delete_pointer": os.environ.get("CANARY_DELETE_POINTER"),
              "provider_mutation_performed": bool(os.environ.get("IMAGE_DIGEST_URI")),
              "production_traffic_changed": truth("PRODUCTION_TRAFFIC_CHANGED"),
              "zero_traffic_checked": truth("ZERO_TRAFFIC_CHECKED"),
              "production_isolation_checked": truth("PRODUCTION_ISOLATION_CHECKED"),
              "mcp_fail_closed_checked": truth("MCP_FAIL_CLOSED_CHECKED"),
              "browser_entrypoint_checked": truth("BROWSER_ENTRYPOINT_CHECKED"),
              "secret_value_recorded": False,
              "oauth_value_recorded": False,
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          body["receipt_sha256"] = hashlib.sha256(json.dumps(body,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          open('/tmp/fuse-windows-relay-receipt/receipt.json','w').write(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fuse-windows-relay-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
