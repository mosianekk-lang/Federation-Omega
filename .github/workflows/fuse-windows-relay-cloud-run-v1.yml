name: FUSE Windows Relay Cloud Run v2.4

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: fuse-windows-relay-cloud-run-v27
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: fuse-windows-relay
  ARTIFACT_REPOSITORY: federation-omega
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  OIDC_ISSUER: ${{ vars.FUSE_OIDC_ISSUER }}
  OIDC_JWKS_URL: ${{ vars.FUSE_OIDC_JWKS_URL }}
  ALLOW_PRODUCTION_PROMOTION: 'false'

jobs:
  deploy-bounded-canary:
    if: >-
      (github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_CLOUD_RUN_V2' ||
       github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_CLOUD_RUN_V1' ||
       github.event.issue.title == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_EXACT_DIGEST_DIAGNOSTIC_V1') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate canonical keyless deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud client
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight identity and relay mode
        env:
          DISPATCH_TITLE: ${{ github.event.issue.title }}
          DISPATCH_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          if [[ -n "$OIDC_ISSUER" && -n "$OIDC_JWKS_URL" ]]; then
            [[ "$OIDC_ISSUER" == https://* && "$OIDC_JWKS_URL" == https://* ]]
            echo 'BOOTSTRAP_MODE=FULL_MCP_AGENT' >> "$GITHUB_ENV"
          elif [[ -z "$OIDC_ISSUER" && -z "$OIDC_JWKS_URL" ]]; then
            echo 'BOOTSTRAP_MODE=AGENT_ONLY_BOOTSTRAP' >> "$GITHUB_ENV"
          else
            echo 'Mixed OIDC state is forbidden' >&2
            exit 43
          fi

          if [[ "$DISPATCH_TITLE" == '[FO-DISPATCH] FUSE_WINDOWS_RELAY_EXACT_DIGEST_DIAGNOSTIC_V1' ]]; then
            mapfile -t URI_LINES < <(printf '%s\n' "$DISPATCH_BODY" | sed -n 's/^IMAGE_DIGEST_URI=//p')
            mapfile -t DIGEST_LINES < <(printf '%s\n' "$DISPATCH_BODY" | sed -n 's/^IMAGE_DIGEST=//p')
            test "${#URI_LINES[@]}" -eq 1
            test "${#DIGEST_LINES[@]}" -eq 1
            REQUESTED_IMAGE_DIGEST_URI="${URI_LINES[0]}"
            REQUESTED_IMAGE_DIGEST="${DIGEST_LINES[0]}"
            EXPECTED_PACKET_DIGEST='sha256:e24acd4e93a4efd7956bcce0f0452bba9b2f987de98b0316a86fc4335014b29d'
            EXPECTED_PACKET_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay@$EXPECTED_PACKET_DIGEST"
            test "$REQUESTED_IMAGE_DIGEST" = "$EXPECTED_PACKET_DIGEST"
            test "$REQUESTED_IMAGE_DIGEST_URI" = "$EXPECTED_PACKET_URI"
            echo 'EXACT_DIGEST_DIAGNOSTIC=true' >> "$GITHUB_ENV"
            echo "REQUESTED_IMAGE_DIGEST=$REQUESTED_IMAGE_DIGEST" >> "$GITHUB_ENV"
            echo "REQUESTED_IMAGE_DIGEST_URI=$REQUESTED_IMAGE_DIGEST_URI" >> "$GITHUB_ENV"
          else
            echo 'EXACT_DIGEST_DIAGNOSTIC=false' >> "$GITHUB_ENV"
            echo 'REQUESTED_IMAGE_DIGEST=' >> "$GITHUB_ENV"
            echo 'REQUESTED_IMAGE_DIGEST_URI=' >> "$GITHUB_ENV"
          fi

      - name: Qualify provider prerequisites without secret-manager or cloud-build dependency
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:ARTIFACT_REPOSITORY' >&2; exit 61; }
          gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format='value(name)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:FIRESTORE_DATABASE' >&2; exit 62; }
          gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" --format='value(email)' >/dev/null || { echo 'RELAY_PREREQ_MISSING:RUNTIME_IDENTITY' >&2; exit 64; }
          gcloud run services list --project "$PROJECT_ID" --region "$REGION" --limit=1 --format='value(metadata.name)' >/dev/null || { echo 'RELAY_PREREQ_UNCALLABLE:CLOUD_RUN_READ' >&2; exit 66; }
          echo 'PROVIDER_PREREQS_QUALIFIED=true' >> "$GITHUB_ENV"
          echo 'DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY' >> "$GITHUB_ENV"

      - name: Resolve immutable relay image without substitution
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          if [[ "$EXACT_DIGEST_DIAGNOSTIC" == 'true' ]]; then
            test -n "$REQUESTED_IMAGE_DIGEST_URI"
            test -n "$REQUESTED_IMAGE_DIGEST"
            docker pull "$REQUESTED_IMAGE_DIGEST_URI"
            docker image inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$REQUESTED_IMAGE_DIGEST_URI" | grep -Fx "$REQUESTED_IMAGE_DIGEST_URI" >/dev/null
            PROVIDER_DIGEST="$(gcloud artifacts docker images describe "$REQUESTED_IMAGE_DIGEST_URI" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
            test "$PROVIDER_DIGEST" = "$REQUESTED_IMAGE_DIGEST"
            echo "IMAGE_DIGEST_URI=$REQUESTED_IMAGE_DIGEST_URI" >> "$GITHUB_ENV"
            echo "VERIFIED_IMAGE_DIGEST=$PROVIDER_DIGEST" >> "$GITHUB_ENV"
            echo 'BUILD_MECHANISM=IMMUTABLE_DIGEST_PULL_NO_REBUILD' >> "$GITHUB_ENV"
            echo 'ARTIFACT_REGISTRY_PUSH_PERFORMED=false' >> "$GITHUB_ENV"
          else
            IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay:$GITHUB_SHA"
            docker build --file windows_federation_plane/Dockerfile --tag "$IMAGE" windows_federation_plane
            docker push "$IMAGE"
            DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
            test -n "$DIGEST"
            echo "IMAGE_DIGEST_URI=$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/fuse-windows-relay@$DIGEST" >> "$GITHUB_ENV"
            echo "VERIFIED_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
            echo 'BUILD_MECHANISM=GITHUB_HOSTED_DOCKER_DIRECT_PUSH' >> "$GITHUB_ENV"
            echo 'ARTIFACT_REGISTRY_PUSH_PERFORMED=true' >> "$GITHUB_ENV"
          fi

      - name: Exact-image localhost differential before provider deployment
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_CONTAINER="fuse-relay-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          LOCAL_PORT=18080
          LOCAL_CREDENTIAL_PATH=/run/fuse/gcp-credentials.json
          LOCAL_CONTAINER_RUNNING='false'
          LOCAL_CONTAINER_STATUS='NOT_CREATED'
          LOCAL_CONTAINER_EXIT_CODE='UNKNOWN'

          capture_local_evidence() {
            set +e
            mkdir -p /tmp/fuse-relay-local-evidence
            if docker inspect "$LOCAL_CONTAINER" >/tmp/fuse-relay-local-evidence/status.json 2>/dev/null; then
              LOCAL_CONTAINER_RUNNING="$(docker inspect --format='{{.State.Running}}' "$LOCAL_CONTAINER" 2>/dev/null || echo false)"
              LOCAL_CONTAINER_STATUS="$(docker inspect --format='{{.State.Status}}' "$LOCAL_CONTAINER" 2>/dev/null || echo UNKNOWN)"
              LOCAL_CONTAINER_EXIT_CODE="$(docker inspect --format='{{.State.ExitCode}}' "$LOCAL_CONTAINER" 2>/dev/null || echo UNKNOWN)"
              docker logs "$LOCAL_CONTAINER" > /tmp/fuse-relay-local-evidence/startup.log 2>&1 || true
              if [[ "$LOCAL_CONTAINER_RUNNING" == 'true' ]]; then
                docker exec "$LOCAL_CONTAINER" sh -lc '(command -v ss >/dev/null 2>&1 && ss -lntp) || (command -v netstat >/dev/null 2>&1 && netstat -lntp) || true' > /tmp/fuse-relay-local-evidence/listening.txt 2>&1 || true
                docker exec "$LOCAL_CONTAINER" python -c 'import json; from federation_windows_plane.mcp_service import server_from_env; s=server_from_env(); rs=getattr(s,"_custom_starlette_routes",()); print(json.dumps(sorted({str(getattr(r,"path","")) for r in rs if getattr(r,"path",None)}),separators=(",",":")))' > /tmp/fuse-relay-local-evidence/routes.json 2>/tmp/fuse-relay-local-evidence/routes.err || true
              else
                printf '[]\n' > /tmp/fuse-relay-local-evidence/routes.json
                : > /tmp/fuse-relay-local-evidence/listening.txt
              fi
            else
              printf '{"container":"missing"}\n' > /tmp/fuse-relay-local-evidence/status.json
              : > /tmp/fuse-relay-local-evidence/startup.log
              : > /tmp/fuse-relay-local-evidence/listening.txt
              printf '[]\n' > /tmp/fuse-relay-local-evidence/routes.json
            fi
            echo "LOCAL_CONTAINER_RUNNING=$LOCAL_CONTAINER_RUNNING" >> "$GITHUB_ENV"
            echo "LOCAL_CONTAINER_STATUS=$LOCAL_CONTAINER_STATUS" >> "$GITHUB_ENV"
            echo "LOCAL_CONTAINER_EXIT_CODE=$LOCAL_CONTAINER_EXIT_CODE" >> "$GITHUB_ENV"
            echo "LOCAL_STATUS_SHA256=$(sha256sum /tmp/fuse-relay-local-evidence/status.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "LOCAL_STARTUP_LOG_SHA256=$(sha256sum /tmp/fuse-relay-local-evidence/startup.log | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "LOCAL_LISTENING_SHA256=$(sha256sum /tmp/fuse-relay-local-evidence/listening.txt | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "LOCAL_ROUTES_SHA256=$(sha256sum /tmp/fuse-relay-local-evidence/routes.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
            set -e
          }
          cleanup_local_container() {
            capture_local_evidence || true
            docker rm --force "$LOCAL_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_local_container EXIT

          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          docker pull "$IMAGE_DIGEST_URI"
          docker run --detach --name "$LOCAL_CONTAINER" \
            --publish "127.0.0.1:${LOCAL_PORT}:8080" \
            --env "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" \
            --env 'FUSE_AGENT_ONLY_BOOTSTRAP=true' \
            --env 'FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY' \
            --env "GOOGLE_APPLICATION_CREDENTIALS=$LOCAL_CREDENTIAL_PATH" \
            --volume "$GOOGLE_APPLICATION_CREDENTIALS:$LOCAL_CREDENTIAL_PATH:ro" \
            "$IMAGE_DIGEST_URI" >/dev/null
          echo 'LOCAL_IMAGE_DIFFERENTIAL_ATTEMPTED=true' >> "$GITHUB_ENV"

          HEALTH_CODE='000'
          for attempt in $(seq 1 30); do
            HEALTH_CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
              --output /tmp/fuse-relay-local-health.json --write-out '%{http_code}' \
              "http://127.0.0.1:${LOCAL_PORT}/healthz" || true)"
            [[ "$HEALTH_CODE" == '200' ]] && break
            docker inspect --format='{{.State.Running}}' "$LOCAL_CONTAINER" | grep -Fx true >/dev/null || break
            sleep 1
          done

          NODE_CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
            --output /tmp/fuse-relay-local-node.html --write-out '%{http_code}' \
            "http://127.0.0.1:${LOCAL_PORT}/node" || true)"
          MCP_CODE="$(curl --location --silent --show-error --connect-timeout 2 --max-time 5 \
            --output /tmp/fuse-relay-local-mcp.txt --write-out '%{http_code}' \
            "http://127.0.0.1:${LOCAL_PORT}/mcp" || true)"
          PAIR_CODE="$(curl --silent --show-error --connect-timeout 2 --max-time 5 \
            -X POST -H 'content-type: application/json' -d '{}' \
            --output /tmp/fuse-relay-local-pair.json --write-out '%{http_code}' \
            "http://127.0.0.1:${LOCAL_PORT}/agent/enroll/start" || true)"

          capture_local_evidence
          echo "LOCAL_HEALTH_CODE=$HEALTH_CODE" >> "$GITHUB_ENV"
          echo "LOCAL_NODE_CODE=$NODE_CODE" >> "$GITHUB_ENV"
          echo "LOCAL_MCP_CODE=$MCP_CODE" >> "$GITHUB_ENV"
          echo "LOCAL_PAIR_CODE=$PAIR_CODE" >> "$GITHUB_ENV"
          if [[ -f /tmp/fuse-relay-local-health.json ]]; then echo "LOCAL_HEALTH_SHA256=$(sha256sum /tmp/fuse-relay-local-health.json | cut -d' ' -f1)" >> "$GITHUB_ENV"; fi
          if [[ -f /tmp/fuse-relay-local-node.html ]]; then echo "LOCAL_NODE_SHA256=$(sha256sum /tmp/fuse-relay-local-node.html | cut -d' ' -f1)" >> "$GITHUB_ENV"; fi
          if [[ -f /tmp/fuse-relay-local-mcp.txt ]]; then echo "LOCAL_MCP_SHA256=$(sha256sum /tmp/fuse-relay-local-mcp.txt | cut -d' ' -f1)" >> "$GITHUB_ENV"; fi
          if [[ -f /tmp/fuse-relay-local-pair.json ]]; then echo "LOCAL_PAIR_SHA256=$(sha256sum /tmp/fuse-relay-local-pair.json | cut -d' ' -f1)" >> "$GITHUB_ENV"; fi

          if [[ "$LOCAL_CONTAINER_RUNNING" != 'true' ]]; then
            echo 'LOCAL_FAILURE_CLASS=CONTAINER_EARLY_EXIT' >> "$GITHUB_ENV"
            echo "LOCAL_CONTAINER_EARLY_EXIT:status=$LOCAL_CONTAINER_STATUS:exit=$LOCAL_CONTAINER_EXIT_CODE:health=$HEALTH_CODE:node=$NODE_CODE:mcp=$MCP_CODE:pair=$PAIR_CODE" >&2
            exit 72
          fi
          if [[ "$HEALTH_CODE" != '200' ]]; then
            echo 'LOCAL_FAILURE_CLASS=RUNNING_HEALTH_UNHEALTHY' >> "$GITHUB_ENV"
            echo "LOCAL_HEALTH_UNHEALTHY:$HEALTH_CODE" >&2
            exit 73
          fi
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); raise SystemExit(0 if d.get("status")=="ok" and d.get("device_auth")=="ECDSA_P256" else 1)' /tmp/fuse-relay-local-health.json
          test "$NODE_CODE" = '200'
          grep -F 'CONNECT THIS PC' /tmp/fuse-relay-local-node.html >/dev/null
          case "$MCP_CODE" in 401|403|404) ;; *) echo "LOCAL_MCP_FAIL_CLOSED_REQUIRED:$MCP_CODE" >&2; exit 71 ;; esac
          test -f /tmp/fuse-relay-local-pair.json || { echo "LOCAL_PAIR_RESPONSE_MISSING" >&2; exit 75; }
          python3 -c 'import json,sys; status,path=sys.argv[1:3]; d=json.load(open(path,encoding="utf-8")); state=d.get("state"); error=d.get("error"); ok=status=="401" and state=="FAILED_CLOSED" and error=="PAIRING_GRANT_ID_INVALID"; print(f"LOCAL_PAIR_CONTRACT_OBSERVED:status={status}:state={state}:error={error}", file=sys.stderr) if not ok else None; raise SystemExit(0 if ok else 74)' "$PAIR_CODE" /tmp/fuse-relay-local-pair.json
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8")); need={"/healthz","/node","/mcp","/agent/enroll/start","/agent/enroll/complete","/agent/runtime/poll","/agent/runtime/complete"}; raise SystemExit(0 if need.issubset(set(r)) else 1)' /tmp/fuse-relay-local-evidence/routes.json

          echo 'LOCAL_FAILURE_CLASS=NONE' >> "$GITHUB_ENV"
          echo 'LOCAL_IMAGE_DIFFERENTIAL_CHECKED=true' >> "$GITHUB_ENV"

      - name: Deploy isolated-first-service or zero-traffic existing-service canary
        shell: bash
        run: |
          set -euo pipefail
          ENVVARS="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FUSE_AGENT_ONLY_BOOTSTRAP=true,FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY"
          if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
            ENVVARS="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FUSE_OIDC_ISSUER=$OIDC_ISSUER,FUSE_OIDC_JWKS_URL=$OIDC_JWKS_URL,FUSE_MCP_RESOURCE_URL=https://bootstrap.invalid/mcp,FUSE_DEVICE_AUTH_MODE=ECDSA_P256_PUBLIC_KEY"
          fi

          echo 'PRODUCTION_TRAFFIC_CHANGED=false' >> "$GITHUB_ENV"
          echo 'CLOUD_RUN_DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
            TARGET_SERVICE="$SERVICE"
            PREVIOUS="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
            echo 'PRODUCTION_SERVICE_PRESENT=true' >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_TOPOLOGY=TAGGED_ZERO_TRAFFIC_EXISTING_SERVICE' >> "$GITHUB_ENV"
            echo 'CANARY_DELETE_POINTER=' >> "$GITHUB_ENV"
            gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_DIGEST_URI" --service-account "$RUNTIME_SA" --port 8080 --cpu 1 --memory 512Mi --min 0 --max 3 --concurrency 20 --no-traffic --tag relay-canary --no-invoker-iam-check --set-env-vars="$ENVVARS" --quiet
            SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
              gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --no-traffic --tag relay-canary --update-env-vars="FUSE_MCP_RESOURCE_URL=$SERVICE_URL/mcp" --quiet
            fi
            CANARY_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[?tag==`relay-canary`].url)')"
            CANARY_REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[?tag==`relay-canary`].revisionName)')"
          else
            TARGET_SERVICE="${SERVICE}-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            PREVIOUS=''
            echo 'PRODUCTION_SERVICE_PRESENT=false' >> "$GITHUB_ENV"
            echo 'DEPLOYMENT_TOPOLOGY=ISOLATED_CANARY_SERVICE_WHEN_PRODUCTION_ABSENT' >> "$GITHUB_ENV"
            if gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
              echo "ISOLATED_CANARY_ALREADY_EXISTS:$TARGET_SERVICE" >&2
              exit 67
            fi
            gcloud run deploy "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_DIGEST_URI" --service-account "$RUNTIME_SA" --port 8080 --cpu 1 --memory 512Mi --min 0 --max 1 --concurrency 20 --ingress all --default-url --no-invoker-iam-check --set-env-vars="$ENVVARS" --quiet
            SERVICE_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            if [[ "$BOOTSTRAP_MODE" == 'FULL_MCP_AGENT' ]]; then
              gcloud run services update "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --update-env-vars="FUSE_MCP_RESOURCE_URL=$SERVICE_URL/mcp" --quiet
            fi
            CANARY_URL="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
            CANARY_REVISION="$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
            printf 'CANARY_DELETE_POINTER=gcloud run services delete %q --project %q --region %q --quiet\n' "$TARGET_SERVICE" "$PROJECT_ID" "$REGION" >> "$GITHUB_ENV"
          fi

          test -n "$SERVICE_URL" && test -n "$CANARY_URL" && test -n "$CANARY_REVISION"
          echo "TARGET_SERVICE=$TARGET_SERVICE" >> "$GITHUB_ENV"
          echo "PREVIOUS_REVISION=$PREVIOUS" >> "$GITHUB_ENV"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "CANARY_URL=$CANARY_URL" >> "$GITHUB_ENV"
          echo "CANARY_REVISION=$CANARY_REVISION" >> "$GITHUB_ENV"

      - name: Semantic bounded canary and edge-app differential
        shell: bash
        run: |
          set -euo pipefail
          DETERMINISTIC_URL="https://${TARGET_SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          CANDIDATE_URLS=("$CANARY_URL" "$SERVICE_URL" "$DETERMINISTIC_URL")
          SEMANTIC_URL=''
          HEALTH=''
          HEALTH_TRACE=''
          EDGE_HEALTH_CODE=''
          declare -A SEEN_URLS=()

          for attempt in $(seq 1 12); do
            for candidate in "${CANDIDATE_URLS[@]}"; do
              [[ -n "$candidate" ]] || continue
              if [[ -n "${SEEN_URLS[$candidate]:-}" && "$attempt" -eq 1 ]]; then
                continue
              fi
              SEEN_URLS["$candidate"]=1
              CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /tmp/fuse-relay-health-body --write-out '%{http_code}' "$candidate/healthz" || true)"
              BODY="$(cat /tmp/fuse-relay-health-body 2>/dev/null || true)"
              EDGE_HEALTH_CODE="$CODE"
              HEALTH_TRACE="${HEALTH_TRACE}${attempt}:${candidate}:${CODE};"
              if [[ "$CODE" == '200' ]] && python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("status")=="ok" and d.get("device_auth")=="ECDSA_P256" else 1)' <<<"$BODY"; then
                SEMANTIC_URL="$candidate"
                HEALTH="$BODY"
                break 2
              fi
            done
            sleep 5
          done

          if [[ -z "$SEMANTIC_URL" ]]; then
            echo 'EDGE_APP_DIFFERENTIAL_CHECKED=true' >> "$GITHUB_ENV"
            echo "EDGE_HEALTH_CODE=${EDGE_HEALTH_CODE:-UNKNOWN}" >> "$GITHUB_ENV"

            gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/fuse-relay-service.json
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/fuse-relay-service.json', encoding='utf-8'))
          a=(d.get('metadata') or {}).get('annotations') or {}
          print('INGRESS_SETTING='+str(a.get('run.googleapis.com/ingress','')))
          print('DEFAULT_URL_DISABLED='+str(a.get('run.googleapis.com/default-url-disabled','')))
          print('INVOKER_IAM_DISABLED='+str(a.get('run.googleapis.com/invoker-iam-disabled','')))
          PY

            PROXY_PORT=18081
            PROXY_CODE=''
            PROXY_HEALTH=''
            gcloud run services proxy "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --port "$PROXY_PORT" >/tmp/fuse-relay-proxy.log 2>&1 &
            PROXY_PID=$!
            cleanup_proxy() {
              kill "$PROXY_PID" >/dev/null 2>&1 || true
              wait "$PROXY_PID" >/dev/null 2>&1 || true
            }
            trap cleanup_proxy EXIT
            sleep 2

            if ! kill -0 "$PROXY_PID" >/dev/null 2>&1; then
              echo 'PROXY_HEALTH_CODE=UNAVAILABLE' >> "$GITHUB_ENV"
              echo 'EDGE_FAILURE_CLASS=AUTHENTICATED_PROXY_UNCALLABLE' >> "$GITHUB_ENV"
              echo "EDGE_APP_DIFFERENTIAL_FAILED:AUTHENTICATED_PROXY_UNCALLABLE:$HEALTH_TRACE" >&2
              exit 55
            fi

            for proxy_attempt in $(seq 1 12); do
              PROXY_CODE="$(curl --silent --show-error --connect-timeout 3 --max-time 8 --output /tmp/fuse-relay-proxy-health --write-out '%{http_code}' "http://127.0.0.1:${PROXY_PORT}/healthz" || true)"
              PROXY_BODY="$(cat /tmp/fuse-relay-proxy-health 2>/dev/null || true)"
              if [[ "$PROXY_CODE" == '200' ]] && python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("status")=="ok" and d.get("device_auth")=="ECDSA_P256" else 1)' <<<"$PROXY_BODY"; then
                PROXY_HEALTH="$PROXY_BODY"
                break
              fi
              sleep 2
            done
            echo "PROXY_HEALTH_CODE=${PROXY_CODE:-UNKNOWN}" >> "$GITHUB_ENV"

            REQUEST_LOG_COUNT="$(gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$TARGET_SERVICE AND httpRequest.requestUrl:\"/healthz\"" --project "$PROJECT_ID" --freshness=20m --limit=20 --format='value(timestamp)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ' || true)"
            echo "REQUEST_LOG_COUNT=${REQUEST_LOG_COUNT:-UNKNOWN}" >> "$GITHUB_ENV"

            if [[ -n "$PROXY_HEALTH" ]]; then
              echo 'EDGE_FAILURE_CLASS=EDGE_ACCESS_OR_INGRESS_404_APP_HEALTH_VIA_AUTH_PROXY' >> "$GITHUB_ENV"
              echo "EDGE_APP_DIFFERENTIAL_FAILED:EDGE_ACCESS_OR_INGRESS_404_APP_HEALTH_VIA_AUTH_PROXY:$HEALTH_TRACE" >&2
              exit 53
            fi

            echo 'EDGE_FAILURE_CLASS=APPLICATION_ROUTE_OR_PROXY_PATH_UNHEALTHY' >> "$GITHUB_ENV"
            echo "EDGE_APP_DIFFERENTIAL_FAILED:APPLICATION_ROUTE_OR_PROXY_PATH_UNHEALTHY:edge=${EDGE_HEALTH_CODE:-UNKNOWN}:proxy=${PROXY_CODE:-UNKNOWN}:$HEALTH_TRACE" >&2
            exit 54
          fi

          echo "SEMANTIC_URL=$SEMANTIC_URL" >> "$GITHUB_ENV"
          echo 'HEALTH_ROUTE_DIFFERENTIAL_CHECKED=true' >> "$GITHUB_ENV"
          echo 'EDGE_APP_DIFFERENTIAL_CHECKED=true' >> "$GITHUB_ENV"
          echo 'EDGE_FAILURE_CLASS=NONE' >> "$GITHUB_ENV"
          echo "EDGE_HEALTH_CODE=200" >> "$GITHUB_ENV"
          echo "PROXY_HEALTH_CODE=NOT_NEEDED" >> "$GITHUB_ENV"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$HEALTH")" = ok
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["device_auth"])' <<<"$HEALTH")" = ECDSA_P256

          MCP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' "$SEMANTIC_URL/mcp")"
          case "$MCP_CODE" in 401|403|404) ;; *) echo "MCP_FAIL_CLOSED_REQUIRED:$MCP_CODE" >&2; exit 51 ;; esac
          echo 'MCP_FAIL_CLOSED_CHECKED=true' >> "$GITHUB_ENV"
          if [[ "$BOOTSTRAP_MODE" == 'AGENT_ONLY_BOOTSTRAP' ]]; then
            curl --fail --silent --show-error "$SEMANTIC_URL/node" | grep -F 'CONNECT THIS PC' >/dev/null
            curl --fail --silent --show-error "$SEMANTIC_URL/node/worker.js" | grep -F 'B0_EPHEMERAL_LOW_TRUST' >/dev/null
            curl --fail --silent --show-error "$SEMANTIC_URL/node/worker.js" | grep -F 'ECDSA' >/dev/null
            curl --fail --silent --show-error "$SEMANTIC_URL/node/native-bootstrap.ps1" | grep -F 'NonExportable' >/dev/null
            echo 'BROWSER_ENTRYPOINT_CHECKED=true' >> "$GITHUB_ENV"
          fi

          if [[ "$PRODUCTION_SERVICE_PRESENT" == 'true' ]]; then
            ACTIVE="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
            test "$ACTIVE" != "$CANARY_REVISION"
            echo 'ZERO_TRAFFIC_CHECKED=true' >> "$GITHUB_ENV"
            echo 'PRODUCTION_ISOLATION_CHECKED=true' >> "$GITHUB_ENV"
          else
            if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
              echo 'PRODUCTION_SERVICE_UNEXPECTEDLY_CREATED' >&2
              exit 68
            fi
            test "$(gcloud run services describe "$TARGET_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')" = "$CANARY_REVISION"
            echo 'ZERO_TRAFFIC_CHECKED=false' >> "$GITHUB_ENV"
            echo 'PRODUCTION_ISOLATION_CHECKED=true' >> "$GITHUB_ENV"
          fi

      - name: Optional explicitly authorised production promotion
        if: env.ALLOW_PRODUCTION_PROMOTION == 'true' && env.PRODUCTION_SERVICE_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$CANARY_REVISION=100" --quiet
          echo 'PRODUCTION_TRAFFIC_CHANGED=true' >> "$GITHUB_ENV"

      - name: Roll back explicitly authorised promotion on failure
        if: failure() && env.PRODUCTION_SERVICE_PRESENT == 'true' && env.PREVIOUS_REVISION != '' && env.ALLOW_PRODUCTION_PROMOTION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$PREVIOUS_REVISION=100" --quiet

      - name: Emit redacted receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuse-windows-relay-receipt
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          truth=lambda name: os.environ.get(name,'').lower()=='true'
          body = {
              "schema": "FUSE-WINDOWS-RELAY-DEPLOYMENT-RECEIPT-V27",
              "source_sha": os.environ.get("GITHUB_SHA"),
              "project_id": os.environ["PROJECT_ID"],
              "region": os.environ["REGION"],
              "service": os.environ["SERVICE"],
              "target_service": os.environ.get("TARGET_SERVICE"),
              "deployment_topology": os.environ.get("DEPLOYMENT_TOPOLOGY"),
              "production_service_present": truth("PRODUCTION_SERVICE_PRESENT"),
              "bootstrap_mode": os.environ.get("BOOTSTRAP_MODE"),
              "device_auth_mode": os.environ.get("DEVICE_AUTH_MODE"),
              "build_mechanism": os.environ.get("BUILD_MECHANISM"),
              "exact_digest_diagnostic": truth("EXACT_DIGEST_DIAGNOSTIC"),
              "requested_image_digest": os.environ.get("REQUESTED_IMAGE_DIGEST"),
              "verified_image_digest": os.environ.get("VERIFIED_IMAGE_DIGEST"),
              "provider_prereqs_qualified": truth("PROVIDER_PREREQS_QUALIFIED"),
              "secret_manager_required": False,
              "cloud_build_required": False,
              "image_digest_uri": os.environ.get("IMAGE_DIGEST_URI"),
              "artifact_registry_push_performed": truth("ARTIFACT_REGISTRY_PUSH_PERFORMED"),
              "cloud_run_deploy_attempted": truth("CLOUD_RUN_DEPLOY_ATTEMPTED"),
              "local_image_differential_attempted": truth("LOCAL_IMAGE_DIFFERENTIAL_ATTEMPTED"),
              "local_image_differential_checked": truth("LOCAL_IMAGE_DIFFERENTIAL_CHECKED"),
              "local_container_running": truth("LOCAL_CONTAINER_RUNNING"),
              "local_container_status": os.environ.get("LOCAL_CONTAINER_STATUS"),
              "local_container_exit_code": os.environ.get("LOCAL_CONTAINER_EXIT_CODE"),
              "local_failure_class": os.environ.get("LOCAL_FAILURE_CLASS"),
              "local_health_code": os.environ.get("LOCAL_HEALTH_CODE"),
              "local_node_code": os.environ.get("LOCAL_NODE_CODE"),
              "local_mcp_code": os.environ.get("LOCAL_MCP_CODE"),
              "local_pair_code": os.environ.get("LOCAL_PAIR_CODE"),
              "local_health_sha256": os.environ.get("LOCAL_HEALTH_SHA256"),
              "local_node_sha256": os.environ.get("LOCAL_NODE_SHA256"),
              "local_mcp_sha256": os.environ.get("LOCAL_MCP_SHA256"),
              "local_pair_sha256": os.environ.get("LOCAL_PAIR_SHA256"),
              "local_status_sha256": os.environ.get("LOCAL_STATUS_SHA256"),
              "local_listening_sha256": os.environ.get("LOCAL_LISTENING_SHA256"),
              "local_routes_sha256": os.environ.get("LOCAL_ROUTES_SHA256"),
              "local_startup_log_sha256": os.environ.get("LOCAL_STARTUP_LOG_SHA256"),
              "canary_url": os.environ.get("CANARY_URL"),
              "semantic_url": os.environ.get("SEMANTIC_URL"),
              "canary_revision": os.environ.get("CANARY_REVISION"),
              "previous_revision": os.environ.get("PREVIOUS_REVISION"),
              "canary_delete_pointer": os.environ.get("CANARY_DELETE_POINTER"),
              "provider_mutation_performed": truth("ARTIFACT_REGISTRY_PUSH_PERFORMED") or truth("CLOUD_RUN_DEPLOY_ATTEMPTED"),
              "production_traffic_changed": truth("PRODUCTION_TRAFFIC_CHANGED"),
              "zero_traffic_checked": truth("ZERO_TRAFFIC_CHECKED"),
              "production_isolation_checked": truth("PRODUCTION_ISOLATION_CHECKED"),
              "health_route_differential_checked": truth("HEALTH_ROUTE_DIFFERENTIAL_CHECKED"),
              "edge_app_differential_checked": truth("EDGE_APP_DIFFERENTIAL_CHECKED"),
              "edge_health_code": os.environ.get("EDGE_HEALTH_CODE"),
              "proxy_health_code": os.environ.get("PROXY_HEALTH_CODE"),
              "edge_failure_class": os.environ.get("EDGE_FAILURE_CLASS"),
              "ingress_setting": os.environ.get("INGRESS_SETTING"),
              "default_url_disabled": os.environ.get("DEFAULT_URL_DISABLED"),
              "invoker_iam_disabled": os.environ.get("INVOKER_IAM_DISABLED"),
              "request_log_count": os.environ.get("REQUEST_LOG_COUNT"),
              "mcp_fail_closed_checked": truth("MCP_FAIL_CLOSED_CHECKED"),
              "browser_entrypoint_checked": truth("BROWSER_ENTRYPOINT_CHECKED"),
              "secret_value_recorded": False,
              "oauth_value_recorded": False,
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          body["receipt_sha256"] = hashlib.sha256(json.dumps(body,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          open('/tmp/fuse-windows-relay-receipt/receipt.json','w').write(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fuse-windows-relay-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
