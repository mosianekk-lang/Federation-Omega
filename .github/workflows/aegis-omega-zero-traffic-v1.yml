name: AEGIS Omega Private Zero-Traffic Canary v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: aegis-omega-private-canary-v1
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: federation-omega
  SERVICE: aegis-omega
  HMAC_SECRET: aegis-omega-hmac-v1
  SERVICE_AUDIENCE: https://aegis-omega-257649435135.africa-south1.run.app

jobs:
  deploy-private-canary:
    if: >-
      github.event.issue.title == '[FO-DISPATCH] AEGIS_OMEGA_ZERO_TRAFFIC_V1' &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact signed-main source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate canonical keyless deployer
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_AUDIENCE }}

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Re-prove exact identity and minimum runtime authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aegis-provider-proof
          ACTIVE="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTIVE" = "$DEPLOYER_SA"
          test "$NUMBER" = "$PROJECT_NUMBER"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > aegis-provider-proof/project-policy-pre.json
          gcloud artifacts repositories get-iam-policy "$ARTIFACT_REPOSITORY" --location "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/repository-policy-pre.json
          gcloud iam service-accounts get-iam-policy "$RUNTIME_SA" --project "$PROJECT_ID" --format=json > aegis-provider-proof/runtime-sa-policy-pre.json
          gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" --format=json > aegis-provider-proof/firestore-database.json
          for API in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com sts.googleapis.com firestore.googleapis.com secretmanager.googleapis.com; do
            test "$(gcloud services list --enabled --project "$PROJECT_ID" --filter="config.name=$API" --format='value(config.name)')" = "$API"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          deployer='serviceAccount:'+os.environ['DEPLOYER_SA']
          runtime='serviceAccount:'+os.environ['RUNTIME_SA']
          pp=json.loads(Path('aegis-provider-proof/project-policy-pre.json').read_text())
          rp=json.loads(Path('aegis-provider-proof/repository-policy-pre.json').read_text())
          sp=json.loads(Path('aegis-provider-proof/runtime-sa-policy-pre.json').read_text())
          db=json.loads(Path('aegis-provider-proof/firestore-database.json').read_text())
          def has(policy, role, member):
              return any(b.get('role')==role and not b.get('condition') and member in (b.get('members') or []) for b in policy.get('bindings') or [])
          assert has(pp,'roles/run.developer',deployer), 'Cloud Run developer authority missing'
          assert has(pp,'roles/artifactregistry.writer',deployer) or has(rp,'roles/artifactregistry.writer',deployer), 'Artifact Registry writer missing'
          assert has(pp,'roles/iam.serviceAccountUser',deployer) or has(sp,'roles/iam.serviceAccountUser',deployer), 'runtime serviceAccountUser missing'
          assert any(has(pp, role, runtime) for role in {'roles/datastore.user','roles/datastore.owner','roles/editor','roles/owner'}), 'runtime Firestore authority missing'
          assert str(db.get('name') or ''), 'default Firestore database unavailable'
          PY

      - name: Ensure dedicated provenance secret exists without exposing payload
        shell: bash
        run: |
          set -euo pipefail
          set +x
          SECRET_CREATED=false
          VERSION_CREATED=false
          if ! gcloud secrets describe "$HMAC_SECRET" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$HMAC_SECRET" --project "$PROJECT_ID" --replication-policy=automatic --labels=system=aegis-omega,purpose=provenance-hmac >/dev/null
            SECRET_CREATED=true
          fi
          if [[ -z "$(gcloud secrets versions list "$HMAC_SECRET" --project "$PROJECT_ID" --filter='state=ENABLED' --format='value(name)' --limit=1)" ]]; then
            openssl rand -hex 32 | gcloud secrets versions add "$HMAC_SECRET" --project "$PROJECT_ID" --data-file=- >/dev/null
            VERSION_CREATED=true
          fi
          gcloud secrets add-iam-policy-binding "$HMAC_SECRET" --project "$PROJECT_ID" \
            --member="serviceAccount:${RUNTIME_SA}" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
          gcloud secrets describe "$HMAC_SECRET" --project "$PROJECT_ID" --format=json > aegis-provider-proof/secret-metadata.json
          gcloud secrets get-iam-policy "$HMAC_SECRET" --project "$PROJECT_ID" --format=json > aegis-provider-proof/secret-policy.json
          SECRET_CREATED="$SECRET_CREATED" VERSION_CREATED="$VERSION_CREATED" python - <<'PY'
          import json, os
          from pathlib import Path
          policy=json.loads(Path('aegis-provider-proof/secret-policy.json').read_text())
          runtime='serviceAccount:'+os.environ['RUNTIME_SA']
          assert any(b.get('role')=='roles/secretmanager.secretAccessor' and runtime in (b.get('members') or []) for b in policy.get('bindings') or []), 'runtime secretAccessor missing'
          Path('aegis-provider-proof/secret-proof.json').write_text(json.dumps({
              'secret_name':os.environ['HMAC_SECRET'],
              'secret_created':os.environ['SECRET_CREATED']=='true',
              'secret_version_created':os.environ['VERSION_CREATED']=='true',
              'runtime_secret_accessor':True,
              'secret_payload_logged':False,
              'provider_mutation_performed':True,
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Capture pre-deployment service state
        id: pre
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/service-pre.json 2>/dev/null; then
            echo 'service_existed=true' >> "$GITHUB_OUTPUT"
          else
            echo '{}' > aegis-provider-proof/service-pre.json
            echo 'service_existed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable AEGIS image
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/aegis-omega:$SOURCE_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull --file services/aegis_omega/Dockerfile --tag "$IMAGE" services/aegis_omega
          docker push "$IMAGE"
          gcloud artifacts docker images describe "$IMAGE" --format=json > aegis-provider-proof/image.json
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy private candidate revision A without existing production traffic promotion
        id: deploy_a
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SERVICE_EXISTED: ${{ steps.pre.outputs.service_existed }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="ao-${SOURCE_SHA:0:8}-a"
          COMMON=(
            "$SERVICE"
            --image "$IMAGE"
            --project "$PROJECT_ID"
            --region "$REGION"
            --service-account "$RUNTIME_SA"
            --port 8080
            --tag "$TAG"
            --no-allow-unauthenticated
            --set-env-vars "AEGIS_ENV=production,AEGIS_CASE_STORE=firestore,AEGIS_GCP_PROJECT=$PROJECT_ID,AEGIS_PUBSUB_TOPIC=,AEGIS_EVIDENCE_BUCKET=,AEGIS_CANARY_GENERATION=A"
            --set-secrets "AEGIS_HMAC_SECRET=$HMAC_SECRET:latest"
            --min-instances 0
            --max-instances 2
            --quiet
          )
          if [[ "$SERVICE_EXISTED" == "true" ]]; then
            gcloud run deploy "${COMMON[@]}" --no-traffic
          else
            gcloud run deploy "${COMMON[@]}"
          fi
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/service-a.json
          REVISION="$(python - <<'PY'
          import json
          s=json.load(open('aegis-provider-proof/service-a.json'))
          print(s.get('status',{}).get('latestCreatedRevisionName') or '')
          PY
          )"
          test -n "$REVISION"
          gcloud run revisions describe "$REVISION" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/revision-a.json
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prove private IAM, zero-traffic semantics and Secret Manager binding
        shell: bash
        env:
          SERVICE_EXISTED: ${{ steps.pre.outputs.service_existed }}
          REVISION_A: ${{ steps.deploy_a.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/service-policy.json
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > aegis-provider-proof/project-policy-post.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pre=json.loads(Path('aegis-provider-proof/service-pre.json').read_text())
          post=json.loads(Path('aegis-provider-proof/service-a.json').read_text())
          rev=json.loads(Path('aegis-provider-proof/revision-a.json').read_text())
          sp=json.loads(Path('aegis-provider-proof/service-policy.json').read_text())
          pp=json.loads(Path('aegis-provider-proof/project-policy-post.json').read_text())
          public={'allUsers','allAuthenticatedUsers'}
          def public_invoker(policy):
              return any(b.get('role') in {'roles/run.invoker','roles/run.servicesInvoker'} and not b.get('condition') and public.intersection(set(b.get('members') or [])) for b in policy.get('bindings') or [])
          assert not public_invoker(sp), 'service publicly invokable'
          assert not public_invoker(pp), 'project grants public Cloud Run invocation'
          containers=(rev.get('spec',{}).get('containers') or rev.get('spec',{}).get('template',{}).get('spec',{}).get('containers') or [])
          env_items=[item for c in containers for item in (c.get('env') or [])]
          matches=[item for item in env_items if item.get('name')=='AEGIS_HMAC_SECRET']
          assert matches and any('valueFrom' in item for item in matches), 'HMAC secret is not Secret Manager-backed'
          assert all('value' not in item for item in matches), 'raw HMAC secret present in revision config'
          def alloc(service):
              result={}
              for item in service.get('status',{}).get('traffic') or []:
                  if item.get('revisionName'):
                      result[item['revisionName']]=result.get(item['revisionName'],0)+int(item.get('percent') or 0)
              return result
          before=alloc(pre); after=alloc(post); candidate=os.environ['REVISION_A']
          if os.environ['SERVICE_EXISTED']=='true':
              assert after.get(candidate,0)==0, {'candidate_percent':after.get(candidate,0),'traffic':after}
              for name,pct in before.items(): assert after.get(name,0)==pct, {'revision':name,'before':pct,'after':after.get(name,0)}
          else:
              assert not before
          Path('aegis-provider-proof/traffic-proof-a.json').write_text(json.dumps({
              'public_invocation':False,
              'service_existed_before':os.environ['SERVICE_EXISTED']=='true',
              'pre_existing_allocation':before,
              'post_allocation':after,
              'candidate_revision_percent':after.get(candidate,0),
              'production_traffic_changed':False,
              'secret_manager_backed_hmac':True,
              'provider_mutation_performed':True,
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Resolve revision A tagged URL and run defensive synthetic case
        id: case
        shell: bash
        env:
          TAG: ${{ steps.deploy_a.outputs.tag }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          URL="$(python - <<'PY'
          import json, os
          s=json.load(open('aegis-provider-proof/service-a.json'))
          print(next((x.get('url','') for x in s.get('status',{}).get('traffic') or [] if x.get('tag')==os.environ['TAG']),'') )
          PY
          )"
          test -n "$URL"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/healthz" > aegis-provider-proof/health-a.json
          REQUEST_ID="provider-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/aegis-assess.json <<JSON
          {"request_id":"$REQUEST_ID","events":[
            {"event_id":"canary-integrity","device_id":"canary-device","event_class":"device_integrity","severity":0.95,"confidence":0.95,"source":"provider-canary-integrity","consent":true},
            {"event_id":"canary-forensics","device_id":"canary-device","event_class":"forensic_artifact","severity":0.93,"confidence":0.95,"source":"provider-canary-forensics","consent":true},
            {"event_id":"canary-network","device_id":"canary-device","event_class":"network_risk","severity":0.88,"confidence":0.90,"source":"provider-canary-network","consent":true},
            {"event_id":"canary-identity","device_id":"canary-device","event_class":"identity_risk","severity":0.84,"confidence":0.90,"source":"provider-canary-identity","consent":true}
          ]}
          JSON
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/aegis-assess.json "$URL/v1/assess" > aegis-provider-proof/assessment-a.json
          CASE_ID="$(python - <<'PY'
          import json
          a=json.load(open('aegis-provider-proof/assessment-a.json'))
          assert a['requires_human_approval'] is True
          assert a['disposition'] in {'investigate','containment_recommended'}
          print(a['case_id'])
          PY
          )"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/v1/cases/$CASE_ID" > aegis-provider-proof/case-a.json
          echo "case_id=$CASE_ID" >> "$GITHUB_OUTPUT"
          echo "url_a=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy fresh revision B at zero traffic and prove Firestore cross-revision persistence
        id: deploy_b
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.sha }}
          CASE_ID: ${{ steps.case.outputs.case_id }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          TAG="ao-${SOURCE_SHA:0:8}-b"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --project "$PROJECT_ID" --region "$REGION" --service-account "$RUNTIME_SA" --port 8080 \
            --tag "$TAG" --no-allow-unauthenticated --no-traffic \
            --set-env-vars "AEGIS_ENV=production,AEGIS_CASE_STORE=firestore,AEGIS_GCP_PROJECT=$PROJECT_ID,AEGIS_PUBSUB_TOPIC=,AEGIS_EVIDENCE_BUCKET=,AEGIS_CANARY_GENERATION=B" \
            --set-secrets "AEGIS_HMAC_SECRET=$HMAC_SECRET:latest" --min-instances 0 --max-instances 2 --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/service-b.json
          REVISION="$(python - <<'PY'
          import json
          s=json.load(open('aegis-provider-proof/service-b.json'))
          print(s.get('status',{}).get('latestCreatedRevisionName') or '')
          PY
          )"
          test -n "$REVISION"
          URL="$(TAG="$TAG" python - <<'PY'
          import json, os
          s=json.load(open('aegis-provider-proof/service-b.json'))
          print(next((x.get('url','') for x in s.get('status',{}).get('traffic') or [] if x.get('tag')==os.environ['TAG']),'') )
          PY
          )"
          test -n "$URL"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/healthz" > aegis-provider-proof/health-b.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/v1/cases/$CASE_ID" > aegis-provider-proof/case-b.json
          python - <<'PY'
          import json, os
          a=json.load(open('aegis-provider-proof/case-a.json'))
          b=json.load(open('aegis-provider-proof/case-b.json'))
          assert a['assessment']['case_id']==os.environ['CASE_ID']==b['assessment']['case_id']
          assert len(b.get('events') or [])==4
          assert b['response_plan']['approval_required'], 'high-impact response lost approval gate'
          PY
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url_b=$URL" >> "$GITHUB_OUTPUT"

      - name: Roll back validation revision B and re-prove candidate A
        shell: bash
        env:
          REVISION_B: ${{ steps.deploy_b.outputs.revision }}
          TAG_B: ${{ steps.deploy_b.outputs.tag }}
          URL_A: ${{ steps.case.outputs.url_a }}
          CASE_ID: ${{ steps.case.outputs.case_id }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          REVISION_A: ${{ steps.deploy_a.outputs.revision }}
          SERVICE_EXISTED: ${{ steps.pre.outputs.service_existed }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --remove-tags="$TAG_B" --quiet >/dev/null
          gcloud run revisions delete "$REVISION_B" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > aegis-provider-proof/service-final.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL_A/healthz" > aegis-provider-proof/health-a-after-rollback.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL_A/v1/cases/$CASE_ID" > aegis-provider-proof/case-a-after-rollback.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pre=json.loads(Path('aegis-provider-proof/service-pre.json').read_text())
          final=json.loads(Path('aegis-provider-proof/service-final.json').read_text())
          case=json.loads(Path('aegis-provider-proof/case-a-after-rollback.json').read_text())
          def alloc(service):
              result={}
              for item in service.get('status',{}).get('traffic') or []:
                  if item.get('revisionName'):
                      result[item['revisionName']]=result.get(item['revisionName'],0)+int(item.get('percent') or 0)
              return result
          before=alloc(pre); after=alloc(final)
          if os.environ['SERVICE_EXISTED']=='true':
              for name,pct in before.items(): assert after.get(name,0)==pct, {'revision':name,'before':pct,'after':after.get(name,0)}
              assert after.get(os.environ['REVISION_A'],0)==0
          assert case['assessment']['case_id']==os.environ['CASE_ID']
          Path('aegis-provider-proof/final-receipt.json').write_text(json.dumps({
              'schema':'AEGIS_OMEGA_PROVIDER_CANARY_RECEIPT_V1',
              'source_sha':os.environ.get('GITHUB_SHA',''),
              'service':'aegis-omega',
              'project':os.environ['PROJECT_ID'],
              'region':os.environ['REGION'],
              'private_iam_verified':True,
              'public_invocation':False,
              'production_traffic_changed':False,
              'secret_manager_backed_hmac':True,
              'firestore_cross_revision_persistence_verified':True,
              'rollback_revision_deleted':True,
              'candidate_a_alive_after_rollback':True,
              'human_approval_gate_verified':True,
              'provider_mutation_performed':True,
              'gemini_inference_performed':False,
              'fuse_external_effect_performed':False,
              'ten_x_market_superiority_verified':False,
              'case_id':os.environ['CASE_ID'],
              'candidate_revision':os.environ['REVISION_A'],
              'pre_existing_allocation':before,
              'final_allocation':after,
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload provider-native proof without secret payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-omega-provider-proof-${{ github.run_id }}
          path: aegis-provider-proof/
          retention-days: 30
