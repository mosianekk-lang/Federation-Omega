name: EvidenceOps PST v2 Fanout Observer

on:
  workflow_run:
    workflows:
      - EvidenceOps PST v2 Shard Fanout
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: evidenceops-pst-v2-fanout-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture fanout workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/evidenceops-pst-corpus-v2-shard-fanout.yml/runs?per_page=10" > /tmp/runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))
          rows = [
              {key: run.get(key) for key in (
                  'id', 'run_number', 'run_attempt', 'event', 'status',
                  'conclusion', 'head_sha', 'created_at', 'updated_at', 'html_url'
              )}
              for run in payload.get('workflow_runs', [])
          ]
          receipt = {
              'receipt': 'EVIDENCEOPS-PST-V2-FANOUT-OBSERVER',
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'repository': '${{ github.repository }}',
              'observer_run_id': '${{ github.run_id }}',
              'runs': rows,
              'repository_mutation_attempted': False,
          }
          output = Path('deployment_receipts/evidenceops-pst-corpus-v2-fanout-observer.json')
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

      - name: Upload immutable observer receipt
        uses: actions/upload-artifact@v7
        with:
          name: evidenceops-pst-v2-fanout-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment_receipts/evidenceops-pst-corpus-v2-fanout-observer.json
          if-no-files-found: error
          retention-days: 90
