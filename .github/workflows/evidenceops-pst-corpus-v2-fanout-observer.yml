name: EvidenceOps PST v2 Fanout Observer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidenceops-pst-corpus-v2-fanout-observer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture fanout workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/evidenceops-pst-corpus-v2-shard-fanout.yml/runs?per_page=10" > /tmp/runs.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload=json.load(open('/tmp/runs.json',encoding='utf-8'))
          rows=[]
          for r in payload.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ('id','run_number','run_attempt','event','status','conclusion','head_sha','created_at','updated_at','html_url')})
          receipt={'receipt':'EVIDENCEOPS-PST-V2-FANOUT-OBSERVER','recorded_at':datetime.now(timezone.utc).isoformat(),'runs':rows}
          Path('deployment_receipts/evidenceops-pst-corpus-v2-fanout-observer.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Commit observer receipt
        run: |
          set -euo pipefail
          git config user.name 'evidenceops-pst-bot'
          git config user.email 'evidenceops-pst-bot@users.noreply.github.com'
          git add deployment_receipts/evidenceops-pst-corpus-v2-fanout-observer.json
          git commit -m 'Record EvidenceOps PST shard fanout state [skip ci]'
          git push origin HEAD:main
