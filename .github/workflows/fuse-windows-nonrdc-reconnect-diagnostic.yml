name: FUSE Windows Non-RDC Reconnect Diagnostic

on:
  push:
    branches:
      - fuse/windows-nonrdc-reconnect-20260925

permissions:
  contents: read
  id-token: write

concurrency:
  group: fuse-windows-nonrdc-reconnect-20260925
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  DEPLOYER_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  reconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate keyless Google control plane
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install admitted FUSE Windows relay client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet -e windows_federation_plane

      - name: Census enrolled devices and issue one bounded health task
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, time, uuid
          from datetime import datetime, timedelta, timezone
          from federation_windows_plane.firestore_relay import FirestoreRelay

          def z(dt):
              return dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")

          relay = FirestoreRelay(project=os.environ["PROJECT_ID"])
          devices = [d for d in relay.list_devices() if not d.get("disabled")]
          devices.sort(key=lambda d: str(d.get("last_seen_at") or ""), reverse=True)

          report = {
              "schema": "FUSE-WINDOWS-NONRDC-RECONNECT-DIAGNOSTIC-V1",
              "observed_at": z(datetime.now(timezone.utc)),
              "project": os.environ["PROJECT_ID"],
              "device_count": len(devices),
              "devices": [],
              "task": None,
              "connection_state": "NO_ENROLLED_DEVICE",
              "effect": "READ_ONLY_HEALTH_TASK_ONLY",
              "arbitrary_shell": False,
          }
          for d in devices:
              did = str(d.get("device_id") or "")
              report["devices"].append({
                  "device_id_sha256": hashlib.sha256(did.encode()).hexdigest() if did else None,
                  "auth_mode": d.get("auth_mode"),
                  "device_generation": d.get("device_generation"),
                  "enrolled_at": d.get("enrolled_at"),
                  "last_seen_at": d.get("last_seen_at"),
                  "disabled": bool(d.get("disabled")),
              })

          if devices:
              target = devices[0]
              device_id = str(target["device_id"])
              now = datetime.now(timezone.utc)
              task_id = "task-nonrdc-" + uuid.uuid4().hex
              task = {
                  "schema": "FEDERATION-WINDOWS-TASK-V1",
                  "task_id": task_id,
                  "correlation_id": "corr-nonrdc-" + uuid.uuid4().hex,
                  "issued_by": "FUSE/FDOF",
                  "task_type": "health",
                  "issued_at": z(now - timedelta(seconds=1)),
                  "expires_at": z(now + timedelta(minutes=5)),
                  "parameters": {},
                  "effect": "READ_ONLY",
              }
              relay.submit_task(device_id=device_id, task=task, now=now)
              report["connection_state"] = "HEALTH_TASK_QUEUED"
              for _ in range(15):
                  state = relay.status(task_id)
                  if state.get("completed"):
                      doc = relay._collection("tasks").document(task_id).get().to_dict() or {}
                      receipt = doc.get("receipt") or {}
                      report["connection_state"] = "LIVE_OWNER_WINDOWS_RELAY_VERIFIED"
                      report["task"] = {
                          "task_id": task_id,
                          "completed": True,
                          "receipt_sha256": state.get("receipt_sha256"),
                          "runner": receipt.get("runner"),
                          "result": receipt.get("result"),
                          "effect": receipt.get("effect"),
                      }
                      break
                  time.sleep(4)
              else:
                  state = relay.status(task_id)
                  report["task"] = {
                      "task_id": task_id,
                      "completed": bool(state.get("completed")),
                      "receipt_sha256": state.get("receipt_sha256"),
                  }
                  report["connection_state"] = "ENROLLED_DEVICE_PRESENT_BUT_AGENT_NOT_CONSUMING"

          path = "/tmp/fuse-windows-nonrdc-reconnect.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, default=str)
          print("FUSE_WINDOWS_NONRDC_RECONNECT_RESULT=" + json.dumps(report, separators=(",",":"), default=str))
          PY

      - name: Upload reconnect receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-nonrdc-reconnect-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fuse-windows-nonrdc-reconnect.json
          if-no-files-found: error
          retention-days: 7
