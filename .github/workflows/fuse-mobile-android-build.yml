name: FUSE Mobile Android Build Court

on:
  push:
    branches: [main]
    paths:
      - "mobile/fuse-mobile/**"
      - ".github/workflows/fuse-mobile-android-build.yml"
      - "governance/fuse_mobile_mdtaf_v1.json"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: fuse-mobile-android-build-v1
  cancel-in-progress: false

jobs:
  android-build:
    if: >-
      github.event_name == 'push' ||
      ((github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_ANDROID_BUILD_V1' ||
        github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_MDTAF_V1') &&
       github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact default-branch source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node 20.19
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.x'

      - name: Verify runner Android prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

      - name: Run MDTAF source contract tests for automatic or explicit MDTAF courts
        if: github.event_name == 'push' || github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_MDTAF_V1'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_fuse_mobile_mdtaf_v1 \
            tests.test_fuse_mobile_mdtaf_avd_readiness \
            tests.test_fuse_mobile_mdtaf_sdk_toolchain_resolution \
            tests.test_fuse_mobile_mdtaf_emulator_host_dependencies \
            tests.test_fuse_mobile_mdtaf_semantic_ui_v1 \
            tests.test_fuse_mobile_version_contract

      - name: Resolve real dependency graph and generate lock
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          test -s package-lock.json
          sha256sum package-lock.json | tee /tmp/fuse-mobile-lock.sha256

      - name: Clean install and dependency health
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx expo install --check
          npm audit --audit-level=high

      - name: Typecheck Expo Doctor and Android export
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx expo-doctor
          npm run export:android

      - name: Generate native Android project and build standalone release-variant test APK
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild:android
          test -x android/gradlew || chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/fuse-mobile-apk-members.txt
          grep -Fx 'assets/index.android.bundle' /tmp/fuse-mobile-apk-members.txt >/dev/null
          BUNDLE_BYTES="$(unzip -p "$APK" assets/index.android.bundle | wc -c | tr -d ' ')"
          test "$BUNDLE_BYTES" -gt 1024
          printf 'EMBEDDED_JS_BUNDLE_PRESENT bytes=%s\n' "$BUNDLE_BYTES" | tee /tmp/fuse-mobile-bundle-proof.txt
          sha256sum "$APK" | tee /tmp/fuse-mobile-apk.sha256

      - name: Scan generated APK and archive members for embedded credential material
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          python lab/scan_apk.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --output fuse-mobile-apk-security-scan.json

      - name: Emit immutable Android build receipt
        working-directory: mobile/fuse-mobile
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          lock = Path('package-lock.json')
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          scan_path = Path('fuse-mobile-apk-security-scan.json')
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          scan = json.loads(scan_path.read_text(encoding='utf-8'))
          apk_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          with zipfile.ZipFile(apk) as archive:
              members = set(archive.namelist())
              assert 'assets/index.android.bundle' in members, 'EMBEDDED_JS_BUNDLE_MISSING'
              bundle_bytes = len(archive.read('assets/index.android.bundle'))
          assert bundle_bytes > 1024, bundle_bytes
          assert scan['state'] == 'APK_CREDENTIAL_SCAN_CLEAN', scan
          assert scan['apk_sha256'] == apk_sha, {'scan_sha': scan['apk_sha256'], 'apk_sha': apk_sha}
          receipt = {
              'schema': 'FUSE_MOBILE_ANDROID_BUILD_RECEIPT_V2',
              'state': 'ANDROID_STANDALONE_TEST_APK_GENERATED_VERIFIED',
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'app_version': package['version'],
              'package_id': 'com.federationomega.fusemobile',
              'lock_sha256': hashlib.sha256(lock.read_bytes()).hexdigest(),
              'apk_sha256': apk_sha,
              'apk_size_bytes': apk.stat().st_size,
              'build_variant': 'release',
              'embedded_js_bundle': True,
              'embedded_js_bundle_path': 'assets/index.android.bundle',
              'embedded_js_bundle_bytes': bundle_bytes,
              'apk_credential_scan_state': scan['state'],
              'apk_credential_scan_apk_sha256': scan['apk_sha256'],
              'apk_credential_scan_receipt_sha256': hashlib.sha256(scan_path.read_bytes()).hexdigest(),
              'production_signing_proven': False,
              'test_artifact_only': True,
              'repository_write_performed': False,
              'oidc_used': False,
              'provider_effect_executed': False,
              'production_traffic_changed': False,
          }
          Path('fuse-mobile-android-build-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload lock standalone APK and proof receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-android-v1-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/fuse-mobile/package-lock.json
            mobile/fuse-mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/fuse-mobile/fuse-mobile-apk-security-scan.json
            mobile/fuse-mobile/fuse-mobile-android-build-receipt.json

  mdtaf-avd:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_MDTAF_V1' &&
       github.event.issue.author_association == 'OWNER')
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - name: Checkout exact default-branch source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download exact shared Android build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fuse-mobile-android-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/fuse-mobile/mdtaf-build-input

      - name: Provision clean Android virtual device in stable AVD namespace
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="mobile/fuse-mobile/mdtaf-evidence"
          mkdir -p "$EVIDENCE_DIR"
          SDK_TOOLS_ENV="$RUNNER_TEMP/fuse-mobile-sdk-tools-${API_LEVEL}.env"
          bash mobile/fuse-mobile/lab/resolve_android_sdk_tools.sh --output-env "$SDK_TOOLS_ENV"
          # shellcheck disable=SC1090
          source "$SDK_TOOLS_ENV"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          printf '%s\n' "$SDK_ROOT" > "$EVIDENCE_DIR/sdk-root-api-${API_LEVEL}.txt"
          printf '%s\n' "$CMDLINE_TOOLS_ROOT" > "$EVIDENCE_DIR/cmdline-tools-root-api-${API_LEVEL}.txt"
          printf '%s\n' "$CMDLINE_TOOLS_REVISION" > "$EVIDENCE_DIR/cmdline-tools-revision-api-${API_LEVEL}.txt"
          ANDROID_AVD_HOME="$RUNNER_TEMP/fuse-mdtaf-avd-${API_LEVEL}"
          mkdir -p "$ANDROID_AVD_HOME"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-${API_LEVEL};google_apis;x86_64" \
            2>&1 | tee "$EVIDENCE_DIR/sdkmanager-install-api-${API_LEVEL}.log"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          if [[ ! -x "$ADB" || ! -x "$EMULATOR" ]]; then
            {
              echo "SDK_ROOT=$SDK_ROOT"
              echo "ADB=$ADB"
              echo "EMULATOR=$EMULATOR"
              ls -la "$SDK_ROOT/platform-tools" 2>&1 || true
              ls -la "$SDK_ROOT/emulator" 2>&1 || true
            } > "$EVIDENCE_DIR/sdk-runtime-tools-missing-api-${API_LEVEL}.txt"
            echo "sdkmanager completed but exact platform-tools/emulator executables are unavailable" >&2
            exit 42
          fi
          QEMU="$SDK_ROOT/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$QEMU"
          printf 'ImageOS=%s\nImageVersion=%s\nKernel=%s\n' \
            "${ImageOS:-UNKNOWN}" "${ImageVersion:-UNKNOWN}" "$(uname -r)" \
            > "$EVIDENCE_DIR/runner-host-provenance-api-${API_LEVEL}.txt"
          ldd "$QEMU" | tee "$EVIDENCE_DIR/emulator-host-libs-before-api-${API_LEVEL}.txt"
          if grep -Fq 'libpulse.so.0 => not found' "$EVIDENCE_DIR/emulator-host-libs-before-api-${API_LEVEL}.txt"; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpulse0
          fi
          dpkg-query -W -f='${Package}=${Version}\n' libpulse0 \
            | tee "$EVIDENCE_DIR/emulator-host-package-provenance-api-${API_LEVEL}.txt"
          bash mobile/fuse-mobile/lab/validate_emulator_host_dependencies.sh \
            --sdk-root "$SDK_ROOT" --evidence-dir "$EVIDENCE_DIR" --api-level "$API_LEVEL"
          AVD_NAME="fuse-mdtaf-api-${API_LEVEL}"
          echo no | "$AVDMANAGER" create avd --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device "pixel_6"
          test -s "$ANDROID_AVD_HOME/${AVD_NAME}.ini"
          "$EMULATOR" -list-avds | tee "$EVIDENCE_DIR/emulator-list-avds-provision-api-${API_LEVEL}.txt"
          grep -Fx -- "$AVD_NAME" "$EVIDENCE_DIR/emulator-list-avds-provision-api-${API_LEVEL}.txt" >/dev/null
          printf '%s\n' "$ANDROID_AVD_HOME" > "$EVIDENCE_DIR/android-avd-home-api-${API_LEVEL}.txt"

      - name: Boot AVD through bounded exact-SDK readiness court
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
          EVIDENCE_DIR: mobile/fuse-mobile/mdtaf-evidence
          DEVICE_TIMEOUT_SECONDS: '180'
          BOOT_TIMEOUT_SECONDS: '240'
          POLL_INTERVAL_SECONDS: '2'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$ADB"
          ADB_BIN="$ADB" bash mobile/fuse-mobile/lab/resolve_sdk_adb.sh >/tmp/fuse-mdtaf-adb-path.txt
          test "$(cat /tmp/fuse-mdtaf-adb-path.txt)" = "$(realpath -e "$ADB")"
          test -n "${ANDROID_AVD_HOME:-}"
          test -s "$ANDROID_AVD_HOME/fuse-mdtaf-api-${API_LEVEL}.ini"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          bash mobile/fuse-mobile/lab/boot_avd_bounded.sh

      - name: Resolve exact shared standalone APK and security receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT=mobile/fuse-mobile/mdtaf-build-input
          APK="$(find "$ROOT" -type f -path '*/android/app/build/outputs/apk/release/app-release.apk' -print -quit)"
          SCAN="$(find "$ROOT" -type f -name 'fuse-mobile-apk-security-scan.json' -print -quit)"
          BUILD_RECEIPT="$(find "$ROOT" -type f -name 'fuse-mobile-android-build-receipt.json' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$SCAN" && test -s "$SCAN"
          test -n "$BUILD_RECEIPT" && test -s "$BUILD_RECEIPT"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle' >/dev/null
          cp "$APK" mobile/fuse-mobile/mdtaf-evidence/app-release.apk
          cp "$SCAN" mobile/fuse-mobile/mdtaf-evidence/apk-security-scan.json
          cp "$BUILD_RECEIPT" mobile/fuse-mobile/mdtaf-evidence/android-build-receipt.json
          sha256sum mobile/fuse-mobile/mdtaf-evidence/app-release.apk | tee mobile/fuse-mobile/mdtaf-evidence/apk.sha256

      - name: Run deterministic lifecycle fault recovery and semantic UI court
        working-directory: mobile/fuse-mobile
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          ADB_BIN="$SDK_ROOT/platform-tools/adb"
          test -x "$ADB_BIN"
          ADB_BIN="$ADB_BIN" bash lab/run_android_smoke.sh \
            --apk mdtaf-evidence/app-release.apk \
            --evidence-dir mdtaf-evidence
          python lab/certify.py \
            --evidence-dir mdtaf-evidence \
            --output mdtaf-evidence/fuse-mobile-mdtaf-certificate.json \
            --source-sha "${GITHUB_SHA}"

      - name: Upload immutable MDTAF device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-mdtaf-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: mobile/fuse-mobile/mdtaf-evidence/

  web-pwa:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.title == '[FO-DISPATCH] FUSE_MOBILE_MDTAF_V1' &&
       github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact default-branch source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node 20.19
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.x'

      - name: Run source contracts and export exact Web PWA
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_fuse_mobile_web_cfbe_v1
          cd mobile/fuse-mobile
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npx expo-doctor
          npm run verify:web
          test -s dist-web/index.html
          test -s dist-web/manifest.webmanifest
          test -s dist-web/sw.js

      - name: Render exact Web PWA and require semantic FUSE UI
        working-directory: mobile/fuse-mobile
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --version | tee web-browser-version.txt
          python3 -m http.server 4173 --directory dist-web > web-http-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 \
            --dump-dom http://127.0.0.1:4173/ > web-rendered-dom.html
          grep -Eiq 'FUSE' web-rendered-dom.html
          grep -Eiq 'Connect owner|Ask FUSE|LIVE DIAGNOSTICS|Proof-before-claim|Owner connection required' web-rendered-dom.html
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('dist-web/manifest.webmanifest').read_text(encoding='utf-8'))
          sw = Path('dist-web/sw.js').read_text(encoding='utf-8').lower()
          dom = Path('web-rendered-dom.html').read_text(encoding='utf-8', errors='replace')
          assert manifest.get('display') == 'standalone', manifest
          assert manifest.get('start_url') == '/', manifest
          assert 'authorization' in sw and 'x-fuse-authorization' in sw
          assert "request.method !== 'get'" in sw
          assert 'url.origin !== self.location.origin' in sw
          semantic = any(marker.lower() in dom.lower() for marker in (
              'Connect owner', 'Ask FUSE', 'LIVE DIAGNOSTICS', 'Proof-before-claim', 'Owner connection required'
          ))
          assert 'fuse' in dom.lower() and semantic
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt = {
              'schema': 'FUSE_MOBILE_WEB_PWA_RUNTIME_RECEIPT_V1',
              'state': 'WEB_PWA_RENDERED_SEMANTIC_PASS',
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'index_sha256': sha('dist-web/index.html'),
              'manifest_sha256': sha('dist-web/manifest.webmanifest'),
              'service_worker_sha256': sha('dist-web/sw.js'),
              'rendered_dom_sha256': sha('web-rendered-dom.html'),
              'semantic_fuse_ui': True,
              'authorized_api_cache_bypass_contract': True,
              'hosted_provider_runtime_proven': False,
              'provider_effect_executed': False,
          }
          Path('fuse-mobile-web-pwa-runtime-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload immutable Web PWA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-web-pwa-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/fuse-mobile/dist-web/
            mobile/fuse-mobile/web-rendered-dom.html
            mobile/fuse-mobile/web-browser-version.txt
            mobile/fuse-mobile/web-http-server.log
            mobile/fuse-mobile/fuse-mobile-web-pwa-runtime-receipt.json
