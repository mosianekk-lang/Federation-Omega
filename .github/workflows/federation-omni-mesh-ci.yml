name: Federation Omni-Mesh CI

on:
  pull_request:
    paths:
      - 'federation_omni_mesh_v1/**'
      - 'tests/test_federation_omni_mesh_v1.py'
      - 'deployment/mesh/**'
      - 'docs/mesh/**'
      - '.github/workflows/federation-omni-mesh-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Omni-Mesh tests
        run: python -m pytest -q tests/test_federation_omni_mesh_v1.py
