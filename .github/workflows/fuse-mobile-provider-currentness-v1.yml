name: FUSE Mobile Provider Currentness V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuse-mobile-provider-currentness-v1.yml"
      - "tests/test_fuse_mobile_provider_currentness_v1.py"
      - "tests/test_fuse_mobile_provider_permission_census_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fuse-mobile-provider-currentness-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: fuse-mobile-gateway
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  READ_SA: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com

jobs:
  observe-provider-currentness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate existing keyless WIF identity without provider mutation
        id: wif_auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.READ_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned gcloud client
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read Cloud Run and classify IAP currentness only
        shell: bash
        env:
          WIF_AUTH_OUTCOME: ${{ steps.wif_auth.outcome }}
        run: |
          set -euo pipefail
          set +x
          ROOT=/tmp/fuse-mobile-provider-currentness
          mkdir -p "$ROOT"
          for name in service run-policy iap-settings iap-policy iap-api; do
            : > "$ROOT/$name.err"
          done

          SERVICE_RC=99
          RUN_POLICY_RC=99
          IAP_SETTINGS_RC=99
          IAP_POLICY_RC=99
          IAP_API_RC=99

          if [[ "$WIF_AUTH_OUTCOME" == "success" ]]; then
            set +e
            gcloud run services describe "$SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" --format=json \
              > "$ROOT/service.json" 2> "$ROOT/service.err"
            SERVICE_RC=$?

            gcloud run services get-iam-policy "$SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" --format=json \
              > "$ROOT/run-policy.json" 2> "$ROOT/run-policy.err"
            RUN_POLICY_RC=$?

            gcloud iap settings get \
              --project "$PROJECT_ID" --resource-type=cloud-run --region "$REGION" --service "$SERVICE" --format=json \
              > "$ROOT/iap-settings.json" 2> "$ROOT/iap-settings.err"
            IAP_SETTINGS_RC=$?

            gcloud iap web get-iam-policy \
              --project "$PROJECT_ID" --resource-type=cloud-run --region "$REGION" --service "$SERVICE" --format=json \
              > "$ROOT/iap-policy.json" 2> "$ROOT/iap-policy.err"
            IAP_POLICY_RC=$?

            gcloud services list --enabled --project "$PROJECT_ID" \
              --filter="config.name=iap.googleapis.com" --format="value(config.name)" \
              > "$ROOT/iap-api.txt" 2> "$ROOT/iap-api.err"
            IAP_API_RC=$?
            set -e
          fi

          export ROOT SERVICE_RC RUN_POLICY_RC IAP_SETTINGS_RC IAP_POLICY_RC IAP_API_RC WIF_AUTH_OUTCOME
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['ROOT'])

          def read_json(name):
              path = root / name
              if not path.exists():
                  return {}
              raw = path.read_text(encoding='utf-8', errors='replace').strip()
              if not raw:
                  return {}
              try:
                  value = json.loads(raw)
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          def read_text(name):
              path = root / name
              return path.read_text(encoding='utf-8', errors='replace').strip() if path.exists() else ''

          def error_sha(name):
              path = root / name
              raw = path.read_bytes() if path.exists() else b''
              return hashlib.sha256(raw).hexdigest() if raw else None

          def error_class(name, rc):
              if rc == 0:
                  return 'OK'
              raw = read_text(name).lower()
              if not raw:
                  return 'NO_ERROR_TEXT'
              if 'permission_denied' in raw or 'permission denied' in raw or 'does not have permission' in raw or 'required permission' in raw:
                  return 'PERMISSION_DENIED'
              if 'serviceusage.services.use' in raw:
                  return 'SERVICE_USAGE_PERMISSION_DENIED'
              if 'service_disabled' in raw or 'api has not been used' in raw or 'api is disabled' in raw or 'it is disabled' in raw:
                  return 'API_DISABLED'
              if 'not_found' in raw or 'not found' in raw or '404' in raw:
                  return 'RESOURCE_NOT_FOUND'
              if 'invalid_argument' in raw or 'invalid argument' in raw or 'unrecognized arguments' in raw:
                  return 'INVALID_ARGUMENT'
              if 'unauthenticated' in raw or 'invalid authentication credentials' in raw:
                  return 'AUTHENTICATION_FAILED'
              return 'OTHER_ERROR'

          def sha(value):
              return hashlib.sha256(str(value).encode('utf-8')).hexdigest()

          def first_key(obj, names):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in names and value not in (None, ''):
                          return value
                  for value in obj.values():
                      found = first_key(value, names)
                      if found not in (None, ''):
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = first_key(value, names)
                      if found not in (None, ''):
                          return found
              return None

          service = read_json('service.json')
          run_policy = read_json('run-policy.json')
          iap_settings = read_json('iap-settings.json')
          iap_policy = read_json('iap-policy.json')

          service_rc = int(os.environ['SERVICE_RC'])
          run_policy_rc = int(os.environ['RUN_POLICY_RC'])
          iap_settings_rc = int(os.environ['IAP_SETTINGS_RC'])
          iap_policy_rc = int(os.environ['IAP_POLICY_RC'])
          iap_api_rc = int(os.environ['IAP_API_RC'])
          auth_outcome = os.environ.get('WIF_AUTH_OUTCOME', '')

          error_classes = {
              'service': error_class('service.err', service_rc),
              'run_policy': error_class('run-policy.err', run_policy_rc),
              'iap_settings': error_class('iap-settings.err', iap_settings_rc),
              'iap_policy': error_class('iap-policy.err', iap_policy_rc),
              'iap_api': error_class('iap-api.err', iap_api_rc),
          }

          api_text = read_text('iap-api.txt') if iap_api_rc == 0 else ''
          iap_api_enabled = ('iap.googleapis.com' in {line.strip() for line in api_text.splitlines() if line.strip()}) if iap_api_rc == 0 else None

          public_invoker = False
          run_bindings = []
          for binding in run_policy.get('bindings') or []:
              role = str(binding.get('role') or '')
              members = [str(x) for x in (binding.get('members') or [])]
              if role == 'roles/run.invoker' and any(m in {'allUsers', 'allAuthenticatedUsers'} for m in members):
                  public_invoker = True
              run_bindings.append({
                  'role': role,
                  'member_count': len(members),
                  'member_sha256': sorted(sha(m) for m in members),
              })

          access = iap_settings.get('accessSettings') or iap_settings.get('access_settings') or {}
          oauth = access.get('oauthSettings') or access.get('oauth_settings') or {}
          client_id = str(oauth.get('clientId') or oauth.get('client_id') or '').strip()
          programmatic = oauth.get('programmaticClients') or oauth.get('programmatic_clients') or []
          if not isinstance(programmatic, list):
              programmatic = []

          iap_bindings = []
          for binding in iap_policy.get('bindings') or []:
              role = str(binding.get('role') or '')
              members = [str(x) for x in (binding.get('members') or [])]
              iap_bindings.append({
                  'role': role,
                  'member_count': len(members),
                  'member_sha256': sorted(sha(m) for m in members),
              })

          service_name = first_key(service, {'name'})
          latest_ready = first_key(service, {'latestReadyRevision', 'latestReadyRevisionName', 'latest_ready_revision'})
          ingress = first_key(service, {'ingress'})
          raw_iap_enabled = first_key(service, {'iapEnabled', 'iap_enabled'})
          iap_enabled_effective = (bool(raw_iap_enabled) if raw_iap_enabled is not None else False) if service_rc == 0 else None
          invoker_iam_disabled = first_key(service, {'invokerIamDisabled', 'invoker_iam_disabled'})
          default_uri_disabled = first_key(service, {'defaultUriDisabled', 'default_uri_disabled'})

          all_reads_ok = all(rc == 0 for rc in (service_rc, run_policy_rc, iap_settings_rc, iap_policy_rc, iap_api_rc))
          if auth_outcome != 'success':
              state = 'WIF_AUTH_FAILED'
          elif iap_api_enabled is False:
              state = 'IAP_API_NOT_ENABLED'
          elif iap_enabled_effective is False:
              state = 'IAP_DISABLED_AT_CLOUD_RUN_SERVICE'
          elif all_reads_ok:
              state = 'PROVIDER_READBACK_VERIFIED'
          elif 'PERMISSION_DENIED' in {error_classes['iap_settings'], error_classes['iap_policy']}:
              state = 'IAP_READ_PERMISSION_DENIED'
          elif 'RESOURCE_NOT_FOUND' in {error_classes['iap_settings'], error_classes['iap_policy']}:
              state = 'IAP_RESOURCE_NOT_FOUND'
          else:
              state = 'PROVIDER_READBACK_PARTIAL_OR_DENIED'

          receipt = {
              'schema': 'FUSE_MOBILE_PROVIDER_CURRENTNESS_V1',
              'diagnostic_version': 2,
              'source_sha': os.environ.get('GITHUB_SHA'),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'state': state,
              'target': {
                  'project_id': os.environ.get('PROJECT_ID'),
                  'project_number': os.environ.get('PROJECT_NUMBER'),
                  'region': os.environ.get('REGION'),
                  'service': os.environ.get('SERVICE'),
              },
              'auth': {
                  'route': 'EXISTING_GITHUB_OIDC_WIF',
                  'outcome': auth_outcome,
                  'workload_identity_provider_sha256': sha(os.environ.get('WIF_PROVIDER', '')),
                  'service_account_sha256': sha(os.environ.get('READ_SA', '')),
                  'credential_value_recorded': False,
              },
              'read_status': {
                  'service': service_rc,
                  'run_policy': run_policy_rc,
                  'iap_settings': iap_settings_rc,
                  'iap_policy': iap_policy_rc,
                  'iap_api': iap_api_rc,
              },
              'service_observation': {
                  'service_name_sha256': sha(service_name) if service_name else None,
                  'latest_ready_revision_sha256': sha(latest_ready) if latest_ready else None,
                  'iap_enabled': iap_enabled_effective,
                  'ingress': ingress,
                  'invoker_iam_disabled': invoker_iam_disabled,
                  'default_uri_disabled': default_uri_disabled,
                  'public_invoker_present': public_invoker if run_policy_rc == 0 else None,
                  'run_policy_binding_count': len(run_bindings) if run_policy_rc == 0 else None,
                  'run_policy_bindings': run_bindings if run_policy_rc == 0 else [],
              },
              'iap_observation': {
                  'iap_api_enabled': iap_api_enabled,
                  'oauth_resource_client_id_present': bool(client_id) if iap_settings_rc == 0 else None,
                  'oauth_resource_client_id_sha256': sha(client_id) if client_id and iap_settings_rc == 0 else None,
                  'programmatic_client_count': len(programmatic) if iap_settings_rc == 0 else None,
                  'programmatic_client_sha256': sorted(sha(x) for x in programmatic) if iap_settings_rc == 0 else [],
                  'iap_policy_binding_count': len(iap_bindings) if iap_policy_rc == 0 else None,
                  'iap_policy_bindings': iap_bindings if iap_policy_rc == 0 else [],
                  'error_class': {
                      'settings': error_classes['iap_settings'],
                      'policy': error_classes['iap_policy'],
                      'api_listing': error_classes['iap_api'],
                  },
              },
              'error_sha256': {
                  'service': error_sha('service.err'),
                  'run_policy': error_sha('run-policy.err'),
                  'iap_settings': error_sha('iap-settings.err'),
                  'iap_policy': error_sha('iap-policy.err'),
                  'iap_api': error_sha('iap-api.err'),
              },
              'raw_error_text_recorded': False,
              'provider_mutation_performed': False,
              'iam_mutation_performed': False,
              'oauth_mutation_performed': False,
              'secret_read_or_mutation_performed': False,
              'traffic_change_performed': False,
              'service_invocation_performed': False,
              'model_inference_performed': False,
          }

          body = dict(receipt)
          receipt['receipt_sha256'] = hashlib.sha256(
              json.dumps(body, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()

          for key in (
              'provider_mutation_performed',
              'iam_mutation_performed',
              'oauth_mutation_performed',
              'secret_read_or_mutation_performed',
              'traffic_change_performed',
              'service_invocation_performed',
              'model_inference_performed',
              'raw_error_text_recorded',
          ):
              assert receipt[key] is False
          assert receipt['auth']['credential_value_recorded'] is False

          out = root / 'PROVIDER_CURRENTNESS_RECEIPT.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'state': state,
              'service_read_status': service_rc,
              'run_policy_read_status': run_policy_rc,
              'iap_settings_read_status': iap_settings_rc,
              'iap_policy_read_status': iap_policy_rc,
              'iap_api_read_status': iap_api_rc,
              'iap_api_enabled': iap_api_enabled,
              'iap_enabled': iap_enabled_effective,
              'iap_settings_error_class': error_classes['iap_settings'],
              'iap_policy_error_class': error_classes['iap_policy'],
              'public_invoker_present': receipt['service_observation']['public_invoker_present'],
              'programmatic_client_count': receipt['iap_observation']['programmatic_client_count'],
              'raw_error_text_recorded': False,
              'provider_mutation_performed': False,
              'model_inference_performed': False,
          }, sort_keys=True))
          PY

      - name: Read exact Phase-A permissions only
        shell: bash
        env:
          WIF_AUTH_OUTCOME: ${{ steps.wif_auth.outcome }}
        run: |
          set -euo pipefail
          set +x
          ROOT=/tmp/fuse-mobile-provider-currentness
          mkdir -p "$ROOT"
          export ROOT WIF_AUTH_OUTCOME
          ACCESS_TOKEN=""
          if [[ "$WIF_AUTH_OUTCOME" == "success" ]]; then
            ACCESS_TOKEN="$(gcloud auth print-access-token)"
            echo "::add-mask::$ACCESS_TOKEN"
          fi
          export ACCESS_TOKEN
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          project = os.environ['PROJECT_ID']
          region = os.environ['REGION']
          service = os.environ['SERVICE']
          token = os.environ.get('ACCESS_TOKEN', '')
          auth_outcome = os.environ.get('WIF_AUTH_OUTCOME', '')

          project_permissions = ['serviceusage.services.enable']
          run_permissions = ['run.services.update', 'run.services.setIamPolicy']

          def sha(value):
              return hashlib.sha256(str(value).encode('utf-8')).hexdigest()

          def test_permissions(url, requested):
              payload = {'permissions': requested}
              data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              if not token:
                  raw = b''
                  return {
                      'http_status': 0,
                      'granted': [],
                      'response_sha256': hashlib.sha256(raw).hexdigest(),
                  }
              req = urllib.request.Request(
                  url,
                  data=data,
                  method='POST',
                  headers={
                      'authorization': f'Bearer {token}',
                      'content-type': 'application/json',
                      'x-goog-user-project': project,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      body = json.loads(raw.decode('utf-8', 'replace')) if raw else {}
                      granted = body.get('permissions') or []
                      return {
                          'http_status': int(response.status),
                          'granted': [str(x) for x in granted if str(x) in requested],
                          'response_sha256': hashlib.sha256(raw).hexdigest(),
                      }
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  return {
                      'http_status': int(exc.code),
                      'granted': [],
                      'response_sha256': hashlib.sha256(raw).hexdigest(),
                  }
              except Exception as exc:
                  raw = type(exc).__name__.encode('utf-8')
                  return {
                      'http_status': 0,
                      'granted': [],
                      'response_sha256': hashlib.sha256(raw).hexdigest(),
                  }

          project_url = f'https://cloudresourcemanager.googleapis.com/v1/projects/{project}:testIamPermissions'
          run_url = f'https://run.googleapis.com/v2/projects/{project}/locations/{region}/services/{service}:testIamPermissions'

          project_result = test_permissions(project_url, project_permissions)
          run_result = test_permissions(run_url, run_permissions)
          tested = project_permissions + run_permissions
          granted = sorted(set(project_result['granted'] + run_result['granted']))
          missing = [permission for permission in tested if permission not in granted]
          statuses = [project_result['http_status'], run_result['http_status']]
          phase_a_state = 'READY' if not missing and all(status == 200 for status in statuses) else 'PERMISSION_HELD'

          receipt = {
              'schema': 'FUSE_MOBILE_PHASE_A_PERMISSION_CENSUS_V1',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'target': {
                  'project_id': project,
                  'project_number': os.environ.get('PROJECT_NUMBER'),
                  'region': region,
                  'service': service,
              },
              'auth': {
                  'route': 'EXISTING_GITHUB_OIDC_WIF',
                  'outcome': auth_outcome,
                  'service_account_sha256': sha(os.environ.get('READ_SA', '')),
                  'credential_value_recorded': False,
              },
              'tested_permissions': tested,
              'granted_permissions': granted,
              'missing_permissions': missing,
              'http_status': {
                  'project_test_iam_permissions': project_result['http_status'],
                  'cloud_run_service_test_iam_permissions': run_result['http_status'],
              },
              'response_sha256': {
                  'project_test_iam_permissions': project_result['response_sha256'],
                  'cloud_run_service_test_iam_permissions': run_result['response_sha256'],
              },
              'phase_a_state': phase_a_state,
              'raw_response_body_recorded': False,
              'provider_mutation_performed': False,
              'iam_mutation_performed': False,
              'api_mutation_performed': False,
              'traffic_change_performed': False,
              'secret_access_performed': False,
              'model_inference_performed': False,
          }
          body = dict(receipt)
          receipt['receipt_sha256'] = hashlib.sha256(
              json.dumps(body, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          out = root / 'PHASE_A_PERMISSION_RECEIPT.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'schema': receipt['schema'],
              'phase_a_state': phase_a_state,
              'tested_permissions': tested,
              'granted_permissions': granted,
              'missing_permissions': missing,
              'http_status': receipt['http_status'],
              'receipt_sha256': receipt['receipt_sha256'],
              'provider_mutation_performed': False,
          }, sort_keys=True))
          PY
          unset ACCESS_TOKEN

      - name: Upload immutable redacted provider-currentness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-mobile-provider-currentness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fuse-mobile-provider-currentness/PROVIDER_CURRENTNESS_RECEIPT.json
            /tmp/fuse-mobile-provider-currentness/PHASE_A_PERMISSION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
