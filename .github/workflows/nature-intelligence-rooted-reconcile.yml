name: Nature Intelligence ROOTED Gate Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kimmie_seed/nature_intelligence/reconcile_rooted_gates.py'
      - '.github/workflows/nature-intelligence-rooted-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: nature-intelligence-rooted-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip rooted-reconcile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile verified gates
        run: python kimmie_seed/nature_intelligence/reconcile_rooted_gates.py

      - name: Verify canonical outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('kimmie_seed/registry.json').read_text())
          checkpoint = json.loads(Path('kimmie_seed/checkpoints/KSA-20260803-024.json').read_text())
          receipt = json.loads(Path('evidenceops/innovation_engine/receipts/lane-watch-receipt-028.json').read_text())
          child = next(item for item in registry['child_lanes'] if item['lane_id'] == 'LANE-KIMMIE-NATURE-INTELLIGENCE')
          assert registry['registry_version'] == '1.14.0'
          assert registry['max_technical_capability']['state'] == 'ACTIVE_VERIFIED_EXECUTION_PROFILE'
          assert child['verified_stage'] == 'GERMINATED'
          assert child['next_stage_gate']['stable_translation_runtime'].startswith('VERIFIED')
          assert child['next_stage_gate']['controlled_recovery'].startswith('VERIFIED')
          assert child['next_stage_gate']['persistent_schedule_triggered_monitoring'] == 'NOT_YET_VERIFIED'
          assert checkpoint['child_promotion'] == 'NONE'
          assert receipt['status'] == 'PASS'
          print(json.dumps({'registry_version': registry['registry_version'], 'checkpoint_sha256': checkpoint['checkpoint_sha256'], 'receipt_sha256': receipt['receipt_sha256']}))
          PY

      - name: Persist reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kimmie_seed/registry.json
          git add kimmie_seed/checkpoints/KSA-20260803-024.json
          git add evidenceops/innovation_engine/receipts/lane-watch-receipt-028.json
          if git diff --cached --quiet; then
            echo 'No reconciliation state change.'
          else
            git commit -m 'Reconcile MAX-Technical Nature ROOTED gates [skip rooted-reconcile] [skip nature-rooted]'
            git push
          fi
