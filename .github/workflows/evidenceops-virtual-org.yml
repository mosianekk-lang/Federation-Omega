name: EvidenceOps Virtual Organization

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'virtual-org/operate.py'
      - 'virtual-org/lane-registry.json'
      - '.github/workflows/evidenceops-virtual-org.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: evidenceops-virtual-organization
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run virtual organisation cycle
        run: python virtual-org/operate.py

      - name: Commit status updates
        run: |
          git config user.name "evidenceops-virtual-org"
          git config user.email "actions@users.noreply.github.com"
          git add virtual-org/status virtual-org/runtime
          git diff --cached --quiet || git commit -m "EvidenceOps virtual organization cycle"
          git pull --rebase
          git push
