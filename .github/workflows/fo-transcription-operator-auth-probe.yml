name: FO Transcription Operator Authentication Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fo-transcription-operator-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fo-transcription-operator-auth-probe
  cancel-in-progress: false

env:
  OPERATOR_URL: https://federation-omega-operator-257649435135.africa-south1.run.app

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run redacted authentication canary
        env:
          FO_ADMIN_TOKEN: ${{ secrets.FO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p deployment_receipts
          TOKEN="$FO_ADMIN_TOKEN"
          if [[ -n "$TOKEN" ]]; then echo "::add-mask::$TOKEN"; fi
          export PROBE_TOKEN="$TOKEN"
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base=os.environ['OPERATOR_URL'].rstrip('/')
          token=os.environ.get('PROBE_TOKEN','')

          def call(path, body=None, authenticated=False):
              headers={'accept':'application/json'}
              data=None
              if body is not None:
                  headers['content-type']='application/json'
                  data=json.dumps(body,separators=(',',':')).encode()
              if authenticated and token:
                  headers['x-fo-admin-token']=token
              req=urllib.request.Request(base+path,data=data,headers=headers,method='POST' if body is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=45) as response:
                      raw=response.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed={'text':raw[:2000]}
                      return {'http_status':response.status,'body':parsed}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except Exception: parsed={'text':raw[:2000]}
                  return {'http_status':exc.code,'body':parsed}
              except Exception as exc:
                  return {'transport_error':type(exc).__name__,'message':str(exc)[:500]}

          public=call('/')
          auth=None
          classification='BLOCKED_DIRECT_SECRET_ABSENT'
          if token:
              auth=call('/execute',{
                  'action':'STATUS',
                  'payload':{
                      'purpose':'FO transcription bridge authentication canary',
                      'mutation':'NONE'
                  }
              },True)
              if auth.get('http_status')==200 and auth.get('body',{}).get('ok') is True:
                  classification='AUTHENTICATED_OPERATOR_STATUS_PROVEN'
              else:
                  classification='AUTHENTICATED_OPERATOR_STATUS_FAILED'

          receipt={
              'receipt':'FO-TRANSCRIPTION-OPERATOR-AUTH-PROBE',
              'recorded_at':datetime.now(timezone.utc).isoformat(),
              'operator_url':base,
              'public_contract':public,
              'direct_secret_present':bool(token),
              'secret_value_recorded':False,
              'authenticated_status':auth,
              'mutation_attempted':False,
              'deployment_attempted':False,
              'classification':classification
          }
          Path('deployment_receipts/fo-transcription-operator-auth-probe.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Publish redacted receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fo-transcription-auth-probe[bot]'
          git config user.email 'fo-transcription-auth-probe[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add deployment_receipts/fo-transcription-operator-auth-probe.json
          git commit -m 'Record FO transcription operator authentication probe [skip ci]' || exit 0
          git push origin HEAD:main

      - uses: actions/upload-artifact@v7
        with:
          name: fo-transcription-operator-auth-probe
          if-no-files-found: error
          retention-days: 30
          path: deployment_receipts/fo-transcription-operator-auth-probe.json
