name: Alpha Omega Maintenance Fabric

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'alpha_omega_v21/scripts/run_maintenance.py'
      - 'alpha_omega_v21/tests/test_maintenance_runner.py'
      - '.github/workflows/alpha-omega-maintenance.yml'
  pull_request:
    paths:
      - 'alpha_omega_v21/**'
      - '.github/workflows/alpha-omega-maintenance.yml'

jobs:
  maintenance-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha_omega_v21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python scripts/run_maintenance.py --workspace ./maintenance_workspace
      - run: test -f ./maintenance_workspace/maintenance_receipt.json
      - run: test -f ./maintenance_workspace/heartbeat.jsonl
      - run: test -f ./maintenance_workspace/learning_ledger.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-omega-maintenance-proof
          path: |
            alpha_omega_v21/maintenance_workspace/maintenance_receipt.json
            alpha_omega_v21/maintenance_workspace/heartbeat.jsonl
            alpha_omega_v21/maintenance_workspace/learning_ledger.jsonl
          if-no-files-found: error
