name: EvidenceOps PST v2 Drive Remote Verify

on:
  push:
    branches: [main]
    paths:
      - 'deployment_manifests/evidenceops-pst-v2-composite-proof.json'
      - 'ops/evidenceops_pst_v2_composite_verify.py'
      - '.github/workflows/evidenceops-pst-v2-drive-remote-verify.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: evidenceops-pst-v2-drive-remote-verify
  cancel-in-progress: false

jobs:
  remote-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover runner disk capacity
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean
          df -h

      - name: Independently verify composite corpus proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ops/evidenceops_pst_v2_composite_verify.py
          test "$(python -c "import json; print(json.load(open('deployment_receipts/evidenceops-pst-corpus-v2-drive-completion.json'))['status'])")" = "COMPLETE_VERIFIED"

      - name: Upload verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: evidenceops-pst-v2-composite-completion-${{ github.run_id }}
          path: |
            deployment_receipts/evidenceops-pst-corpus-v2-remote-verification.json
            deployment_receipts/evidenceops-pst-corpus-v2-drive-completion.json
            deployment_manifests/evidenceops-pst-v2-composite-proof.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Commit verified receipts
        run: |
          set -euo pipefail
          git config user.name 'evidenceops-pst-bot'
          git config user.email 'evidenceops-pst-bot@users.noreply.github.com'
          git add \
            deployment_receipts/evidenceops-pst-corpus-v2-remote-verification.json \
            deployment_receipts/evidenceops-pst-corpus-v2-drive-completion.json
          if git diff --cached --quiet; then
            echo 'Verified receipts already current.'
            exit 0
          fi
          git commit -m 'Record PST corpus v2 composite remote completion receipt [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          exit 1
