name: Alpha Omega Commercial Provider Dispatch Fencing Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-dispatch-fencing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run provider dispatch fencing and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute provider dispatch fencing proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_dispatch_fencing
          --output artifacts

      - name: Validate contract checkpoint projection and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'provider_dispatch_fencing_contract.json').read_text())
          checkpoint = json.loads((root / 'provider_dispatch_fencing_checkpoint.json').read_text())
          projection = json.loads((root / 'canonical_commercial_api_effective_v13.json').read_text())
          receipt = json.loads(Path('artifacts/provider-dispatch-fencing-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-FENCING-V13'
          assert contract['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert contract['depends_on']['pull_request'] == 142
          assert contract['depends_on']['merge_commit'] == '45a4a9108039067491d3646e0c5168e57ab6ded8'
          assert contract['depends_on']['google_drive_release_readback_verified'] is True
          assert contract['depends_on']['google_drive_release_owner_only'] is True
          rules = contract['fencing_rules']
          assert rules['prepared_v11_dispatch_required'] is True
          assert rules['v12_claim_lease_required'] is True
          assert rules['lease_renewal_supported'] is True
          assert rules['renewal_requires_current_unexpired_claim'] is True
          assert rules['renewal_must_extend_current_lease'] is True
          assert rules['minimum_lease_seconds'] == 5
          assert rules['maximum_lease_seconds'] == 900
          assert rules['one_started_attempt_per_claim'] is True
          assert rules['monotonic_fencing_epoch_per_claim_attempt'] is True
          assert rules['attempt_envelope_hash_bound'] is True
          assert rules['receipt_bound_to_current_fenced_attempt'] is True
          assert rules['stale_fencing_receipt_rejected'] is True
          assert rules['terminal_failure_releases_claim'] is True
          assert rules['provider_native_fencing_proven'] is False
          assert rules['distributed_provider_exactly_once_proven'] is False
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          dependency = checkpoint['dependency_checkpoint']
          assert dependency['preceding_pull_request'] == 142
          assert dependency['preceding_drive_readback_verified'] is True
          assert dependency['preceding_drive_owner_only'] is True
          assert dependency['programme_dependency_order_verified'] is True
          assert dependency['institution_state_preserved'] is True
          assert checkpoint['status'] in {
              'PROVIDER_DISPATCH_RENEWAL_AND_FENCING_IMPLEMENTED_PROVIDER_CI_PENDING_EXTERNAL_GATES_UNCHANGED',
              'PROVIDER_DISPATCH_RENEWAL_AND_FENCING_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED',
              'PROVIDER_DISPATCH_RENEWAL_AND_FENCING_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED',
          }
          candidate = checkpoint['candidate_projection']
          assert candidate['capability_revision'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-FENCING-V13'
          assert candidate['canonical_class'] == 'FencedProviderDispatchCommercialControlPlane'
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['provider_native_fencing_proven'] is False
          assert checkpoint['commercial_truth']['distributed_provider_exactly_once_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False
          assert checkpoint['institution_projection']['P13'] == 'CROSS_PROGRAMME_RECONCILIATION_VERIFIED_NO_PROVIDER_WRITEBACK'
          assert checkpoint['institution_projection']['P15'] == 'INSTITUTIONAL_READINESS_PRESERVED_EXTERNAL_COMPLETION_BLOCKED'

          assert projection['effective_canonical_class'] == 'FencedProviderDispatchCommercialControlPlane'
          dispatch = projection['provider_dispatch']
          assert dispatch['lease_renewal_supported'] is True
          assert dispatch['renewal_must_extend_current_lease'] is True
          assert dispatch['one_started_attempt_per_claim'] is True
          assert dispatch['monotonic_fencing_epoch_per_claim_attempt'] is True
          assert dispatch['attempt_envelope_hash_bound'] is True
          assert dispatch['receipt_bound_to_current_fenced_attempt'] is True
          assert dispatch['stale_fencing_receipt_rejected'] is True
          assert dispatch['terminal_failure_releases_claim'] is True
          assert dispatch['provider_native_fencing'] == 'PROVIDER_PROOF_REQUIRED'
          assert dispatch['distributed_provider_exactly_once'] == 'NOT_PROVEN'
          assert projection['verified_live_revenue_events'] == 0
          assert projection['full_commercial_maturity'] is False

          assert receipt['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-FENCING-V13'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          safety = receipt['provider_dispatch_fencing_safety']
          assert safety['lease_renewal_supported'] is True
          assert safety['one_started_attempt_per_claim'] is True
          assert safety['monotonic_fencing_epoch_per_claim_attempt'] is True
          assert safety['attempt_envelope_hash_bound'] is True
          assert safety['receipt_bound_to_current_fenced_attempt'] is True
          assert safety['stale_fencing_receipt_rejected'] is True
          assert safety['terminal_failure_releases_claim'] is True
          assert safety['provider_native_fencing_proven'] is False
          assert safety['external_mutation_performed'] is False
          assert safety['live_provider_operation_proven'] is False
          assert safety['distributed_provider_exactly_once_proven'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_dispatch_fencing.py'),
              Path('alpha_omega_commercial/prove_provider_dispatch_fencing.py'),
              Path('alpha_omega_commercial/test_provider_dispatch_fencing.py'),
              Path('alpha_omega_commercial/provider_dispatch_fencing_contract.json'),
              Path('alpha_omega_commercial/provider_dispatch_fencing_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v13.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable provider dispatch fencing proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alpha-omega-commercial-provider-dispatch-fencing-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
