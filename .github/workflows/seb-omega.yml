name: SEB Omega Qualification and Zero-Traffic Canary

on:
  pull_request:
    paths:
      - 'sovereign_execution_boundary/**'
      - '.github/workflows/seb-omega.yml'
      - 'governance/github_airlock_policy.json'
  push:
    branches: [main]
    paths:
      - 'sovereign_execution_boundary/**'
      - '.github/workflows/seb-omega.yml'
      - 'governance/github_airlock_policy.json'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_SEB_OMEGA_ZERO_TRAFFIC'
        required: true
      promote:
        description: 'Promote traffic only after tagged canary readback'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: seb-omega-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign_execution_boundary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m compileall -q seb tests
      - run: python -m unittest discover -s tests -v
      - run: docker build --pull -t seb-omega:${{ github.sha }} .
      - run: docker run --rm --read-only --tmpfs /tmp --tmpfs /app/data:rw,uid=65532,gid=65532,mode=1770 seb-omega:${{ github.sha }} -m unittest discover -s tests -v
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: seb-omega:${{ github.sha }}
          format: spdx-json
          output-file: seb-omega.spdx.json
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: seb-omega:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  zero-traffic-canary:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: qualify
    runs-on: ubuntu-latest
    environment: seb-omega-canary
    concurrency:
      group: seb-omega-cloud-run-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify explicit canary authority
        if: github.event_name == 'workflow_dispatch'
        run: test '${{ inputs.confirmation }}' = 'DEPLOY_SEB_OMEGA_ZERO_TRAFFIC'
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: sov-hybrid-suite
          workload_identity_provider: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
          service_account: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://seb-omega-257649435135.us-central1.run.app
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Build immutable image
        run: |
          set -euo pipefail
          gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet
          IMAGE_TAG=africa-south1-docker.pkg.dev/sov-hybrid-suite/federation-omega/seb-omega:${GITHUB_SHA}
          docker build --pull -t "$IMAGE_TAG" sovereign_execution_boundary
          docker push "$IMAGE_TAG" >/dev/null
          IMAGE=$(gcloud artifacts docker images describe "$IMAGE_TAG" --project sov-hybrid-suite --format='value(image_summary.digest)')
          [[ "$IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_URI=africa-south1-docker.pkg.dev/sov-hybrid-suite/federation-omega/seb-omega" >> "$GITHUB_ENV"
      - name: Deploy immutable zero-traffic revision
        run: |
          set -euo pipefail
          mkdir -p /tmp/seb-proof
          test "$(gcloud config get-value project)" = "sov-hybrid-suite"
          gcloud run services describe seb-omega --project sov-hybrid-suite --region us-central1 --format=json > /tmp/seb-proof/pre.json 2>/dev/null || printf '{"metadata":{"generation":0},"status":{"traffic":[]}}\n' > /tmp/seb-proof/pre.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/seb-proof/pre.json'))
          traffic=sorted(({k:x[k] for k in ('revisionName','percent','tag') if k in x} for x in p.get('status',{}).get('traffic',[])),key=lambda x:(x.get('tag',''),x.get('revisionName','')))
          json.dump(traffic,open('/tmp/seb-proof/pre-traffic.json','w'),sort_keys=True,separators=(',',':'))
          PY
          TAG=canary-${GITHUB_RUN_ID}
          if python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/seb-proof/pre.json')).get('metadata',{}).get('generation',0)==0 else 1)"; then
            DEPLOY_MODE=PRIVATE_BOOTSTRAP
            TRAFFIC_FLAGS=()
          else
            DEPLOY_MODE=ZERO_TRAFFIC_UPDATE
            TRAFFIC_FLAGS=(--no-traffic)
          fi
          export DEPLOY_MODE
          echo "DEPLOY_MODE=$DEPLOY_MODE" >> "$GITHUB_ENV"
          gcloud run deploy seb-omega --project sov-hybrid-suite --region us-central1 --image "${IMAGE_URI}@${IMAGE_DIGEST}" "${TRAFFIC_FLAGS[@]}" --tag "$TAG" --service-account superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com --no-allow-unauthenticated --quiet
          gcloud run services describe seb-omega --project sov-hybrid-suite --region us-central1 --format=json > /tmp/seb-proof/post.json
          export TAG
          python - <<'PY' > /tmp/seb-proof/runtime.env
          import json,os
          p=json.load(open('/tmp/seb-proof/post.json')); status=p['status']; meta=p['metadata']
          assert status.get('observedGeneration') == meta.get('generation'), (status.get('observedGeneration'),meta.get('generation'))
          row=next(x for x in status['traffic'] if x.get('tag')==os.environ['TAG'])
          revision=row['revisionName']; url=row['url']
          expected=100 if os.environ['DEPLOY_MODE']=='PRIVATE_BOOTSTRAP' else 0
          assert row.get('percent',0)==expected, (row,expected)
          ready=next(x for x in status.get('conditions',[]) if x.get('type')=='Ready')
          assert ready.get('status')=='True', ready
          print(f'CANARY_REVISION={revision}'); print(f'CANARY_URL={url}'); print(f'CANARY_TAG={os.environ["TAG"]}')
          PY
          cat /tmp/seb-proof/runtime.env >> "$GITHUB_ENV"
          source /tmp/seb-proof/runtime.env
          gcloud run revisions describe "$CANARY_REVISION" --project sov-hybrid-suite --region us-central1 --format=json > /tmp/seb-proof/revision.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/seb-proof/revision.json'))
          observed=p.get('status',{}).get('imageDigest','')
          expected=f"{os.environ['IMAGE_URI']}@{os.environ['IMAGE_DIGEST']}"
          assert observed==expected, (observed,expected)
          PY
          SERVICE_URL=$(python -c "import json; print(json.load(open('/tmp/seb-proof/post.json'))['status']['url'])")
          TOKEN='${{ steps.auth.outputs.id_token }}'
          test -n "$TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$CANARY_URL/health" | tee /tmp/seb-proof/health.json
          unset TOKEN
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/seb-proof/health.json'))
          assert p.get('status')=='ok' and p.get('ledger_valid') is True and p.get('external_effects') is False, p
          assert p.get('revision')==os.environ['CANARY_REVISION'], (p,os.environ['CANARY_REVISION'])
          PY
      - name: Promote only after explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        run: |
          set -euo pipefail
          restore() {
            SPEC=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/seb-proof/pre-traffic.json'))
          print(','.join(f"{x['revisionName']}={x['percent']}" for x in rows if x.get('percent',0)>0))
          PY
          )
            if [[ -n "$SPEC" ]]; then
              gcloud run services update-traffic seb-omega --project sov-hybrid-suite --region us-central1 --to-revisions "$SPEC" --quiet
            fi
          }
          trap restore ERR
          gcloud run services update-traffic seb-omega --project sov-hybrid-suite --region us-central1 --to-tags "${CANARY_TAG}=100" --quiet
          gcloud run services describe seb-omega --project sov-hybrid-suite --region us-central1 --format=json > /tmp/seb-proof/promoted.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/seb-proof/promoted.json'))
          row=next(x for x in p['status']['traffic'] if x.get('revisionName')==os.environ['CANARY_REVISION'] and x.get('percent')==100)
          assert row
          PY
          trap - ERR
      - name: Build deployment receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('/tmp/seb-proof')
          def load(name):
            p=root/name
            return json.loads(p.read_text()) if p.exists() else None
          receipt={'schema':'SEB-OMEGA-CLOUD-RUN-PROOF-1','source_sha':os.getenv('GITHUB_SHA'),'image_digest':os.getenv('IMAGE_DIGEST'),'deploy_mode':os.getenv('DEPLOY_MODE'),'canary_revision':os.getenv('CANARY_REVISION'),'canary_url_hash':hashlib.sha256(os.getenv('CANARY_URL','').encode()).hexdigest(),'health':load('health.json'),'pre_traffic':load('pre-traffic.json'),'promotion_requested':os.getenv('INPUT_PROMOTE','false')=='true'}
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          root.mkdir(parents=True,exist_ok=True); (root/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
        env:
          INPUT_PROMOTE: ${{ inputs.promote }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seb-omega-cloud-run-proof-${{ github.run_id }}
          path: /tmp/seb-proof
          retention-days: 90
