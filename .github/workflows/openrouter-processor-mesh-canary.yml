name: OpenRouter Processor Mesh Canary

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/openrouter-processor-mesh-canary.yml"
      - "governance/openrouter_processor_mesh_canary_v1.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openrouter-processor-mesh-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-cost-provider-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Run zero-cost OpenRouter processor-mesh canary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import os
          import struct
          import sys
          import time
          import urllib.error
          import urllib.request
          import wave

          BASE = "https://openrouter.ai/api/v1"
          KEY = os.environ.get("OPENROUTER_API_KEY", "")
          if not KEY:
              print("OPENROUTER_CANARY_RECEIPT=" + json.dumps({
                  "schema":"OPENROUTER_PROCESSOR_MESH_CANARY_V1",
                  "state":"FAIL_NO_SECRET_BINDING",
                  "secret_value_exposed":False,
              }, sort_keys=True, separators=(",", ":")))
              raise SystemExit(2)

          def sha(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def headers(json_body=True):
              h = {
                  "Authorization": f"Bearer {KEY}",
                  "HTTP-Referer": "https://github.com/mosianekk-lang/Federation-Omega",
                  "X-Title": "Federation-Omega OpenRouter Processor Mesh Canary",
              }
              if json_body:
                  h["Content-Type"] = "application/json"
              return h

          def http(method, path, payload=None, *, raw=False, attempts=3, timeout=90):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              last = None
              for n in range(attempts):
                  req = urllib.request.Request(BASE + path, data=data, headers=headers(payload is not None), method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          body = resp.read()
                          meta = {"http_status": resp.status}
                          gen = resp.headers.get("X-Generation-Id")
                          if gen:
                              meta["generation_id"] = gen
                          if raw:
                              return body, meta
                          return json.loads(body.decode("utf-8")), meta
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")[:1500]
                      last = {"http_status": exc.code, "error_sha256": sha(body.encode()), "error_preview": body[:300]}
                      if exc.code not in (408, 409, 425, 429, 500, 502, 503, 504) or n == attempts - 1:
                          raise RuntimeError(json.dumps(last, sort_keys=True))
                  except Exception as exc:
                      last = {"error_type": type(exc).__name__, "error_sha256": sha(str(exc).encode())}
                      if n == attempts - 1:
                          raise
                  time.sleep(2 ** n)
              raise RuntimeError(json.dumps(last or {"error":"unknown"}))

          def cost_of(obj):
              usage = obj.get("usage") or {}
              for key in ("cost", "total_cost"):
                  value = usage.get(key)
                  if isinstance(value, (int, float)) and math.isfinite(float(value)):
                      return float(value)
              return None

          def chat(label, model, content, **extra):
              payload = {"model":model, "messages":[{"role":"user", "content":content}], "max_tokens":extra.pop("max_tokens", 80)}
              payload.update(extra)
              obj, meta = http("POST", "/chat/completions", payload)
              choice = (obj.get("choices") or [{}])[0]
              msg = choice.get("message") or {}
              text = msg.get("content")
              result = {
                  "state":"PASS" if choice else "FAIL",
                  "http_status":meta["http_status"],
                  "requested_model":model,
                  "resolved_model":obj.get("model"),
                  "provider":obj.get("provider"),
                  "generation_id":obj.get("id") or meta.get("generation_id"),
                  "output_sha256":sha(str(text).encode()) if text is not None else None,
                  "output_nonempty":bool(str(text or "").strip()),
                  "prompt_tokens":(obj.get("usage") or {}).get("prompt_tokens"),
                  "completion_tokens":(obj.get("usage") or {}).get("completion_tokens"),
                  "cost_usd":cost_of(obj),
              }
              if msg.get("tool_calls") is not None:
                  result["tool_call_count"] = len(msg.get("tool_calls") or [])
              if msg.get("annotations") is not None:
                  result["annotation_count"] = len(msg.get("annotations") or [])
              return result, obj

          receipt = {
              "schema":"OPENROUTER_PROCESSOR_MESH_CANARY_V1",
              "synthetic_public_data_only":True,
              "secret_value_exposed":False,
              "provider_mutation":False,
              "paid_generation_authorized":False,
              "tests":{},
              "discovery":{},
          }

          # 1) Credential validation and account readback without revealing the key.
          key_obj, key_meta = http("GET", "/key")
          kd = key_obj.get("data") or key_obj
          receipt["credential"] = {
              "state":"VALID" if key_meta["http_status"] == 200 else "INVALID",
              "http_status":key_meta["http_status"],
              "label_sha256":sha(str(kd.get("label", "")).encode()) if kd.get("label") else None,
              "usage":kd.get("usage"),
              "limit":kd.get("limit"),
              "limit_remaining":kd.get("limit_remaining"),
              "is_free_tier":kd.get("is_free_tier"),
          }

          # 2) Live authenticated zero-cost text inference.
          r, _ = chat("text", "openrouter/free", "Reply with exactly OPENROUTER_CANARY_OK and nothing else.", max_tokens=24)
          receipt["tests"]["text_inference"] = r

          # 3) Image input through the free router using a public synthetic/reference image.
          image_content = [
              {"type":"text", "text":"Describe this image in one short sentence."},
              {"type":"image_url", "image_url":{"url":"https://live.staticflickr.com/3851/14825276609_098cac593d_b.jpg"}},
          ]
          r, _ = chat("image", "openrouter/free", image_content, max_tokens=60)
          receipt["tests"]["image_input"] = r

          # 4) Audio input with a generated non-personal sine-wave WAV on a free omni model.
          audio_buf = io.BytesIO()
          with wave.open(audio_buf, "wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(8000)
              frames = bytearray()
              for i in range(1600):
                  sample = int(6000 * math.sin(2 * math.pi * 440 * i / 8000))
                  frames.extend(struct.pack("<h", sample))
              wf.writeframes(bytes(frames))
          audio_b64 = base64.b64encode(audio_buf.getvalue()).decode()
          omni = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
          audio_content = [
              {"type":"text", "text":"Confirm you can process this synthetic audio; answer briefly."},
              {"type":"input_audio", "input_audio":{"data":audio_b64, "format":"wav"}},
          ]
          r, _ = chat("audio", omni, audio_content, max_tokens=60)
          receipt["tests"]["audio_input"] = r

          # 5) Video input using OpenRouter's documented public sample URL on the same free omni model.
          video_content = [
              {"type":"text", "text":"Describe the main subject of this video briefly."},
              {"type":"video_url", "video_url":{"url":"https://storage.googleapis.com/cloud-samples-data/video/JaneGoodall.mp4"}},
          ]
          r, _ = chat("video", omni, video_content, max_tokens=60)
          receipt["tests"]["video_input"] = r

          # 6) PDF input with the explicitly-free Cloudflare parser and free model router.
          pdf_content = [
              {"type":"text", "text":"State the title/topic of this document briefly."},
              {"type":"file", "file":{"filename":"bitcoin.pdf", "file_data":"https://bitcoin.org/bitcoin.pdf"}},
          ]
          r, _ = chat("pdf", "openrouter/free", pdf_content,
                      plugins=[{"id":"file-parser", "pdf":{"engine":"cloudflare-ai"}}], max_tokens=60)
          receipt["tests"]["pdf_input"] = r

          # 7) Tool-calling route: require a harmless local tool proposal; do not execute it.
          tools = [{"type":"function","function":{"name":"return_canary_marker","description":"Return a fixed canary marker","parameters":{"type":"object","properties":{"marker":{"type":"string"}},"required":["marker"],"additionalProperties":False}}}]
          r, obj = chat("tools", "openrouter/free", "Call return_canary_marker with marker OPENROUTER_TOOL_OK. Do not answer normally.", tools=tools, tool_choice="required", max_tokens=80)
          r["state"] = "PASS" if r.get("tool_call_count", 0) >= 1 else "FAIL_NO_TOOL_CALL"
          receipt["tests"]["tool_calling"] = r

          # 8) Structured output route on free compatible model selection.
          schema = {"name":"openrouter_canary","strict":True,"schema":{"type":"object","properties":{"status":{"type":"string","enum":["OPENROUTER_JSON_OK"]}},"required":["status"],"additionalProperties":False}}
          r, _ = chat("structured", "openrouter/free", "Return the required JSON status.", response_format={"type":"json_schema","json_schema":schema}, max_tokens=40)
          receipt["tests"]["structured_output"] = r

          # 9) Free embeddings endpoint.
          emb, emeta = http("POST", "/embeddings", {"model":"liquid/lfm-2.5-embedding-350m:free", "input":"synthetic openrouter processor mesh canary"})
          vec = (((emb.get("data") or [{}])[0]).get("embedding") or [])
          receipt["tests"]["embeddings"] = {
              "state":"PASS" if len(vec) > 0 else "FAIL",
              "http_status":emeta["http_status"],
              "resolved_model":emb.get("model"),
              "dimensions":len(vec),
              "vector_sha256":sha(json.dumps(vec[:32], separators=(",", ":")).encode()) if vec else None,
              "cost_usd":cost_of(emb),
          }

          # 10) Free TTS endpoint; store only byte count/hash and generation id.
          speech, smeta = http("POST", "/audio/speech", {"model":"deepgram/flux-tts:free", "input":"OpenRouter processor mesh canary.", "voice":"flux-alexis-en", "response_format":"mp3"}, raw=True)
          receipt["tests"]["tts"] = {
              "state":"PASS" if len(speech) > 100 else "FAIL",
              "http_status":smeta["http_status"],
              "audio_bytes":len(speech),
              "audio_sha256":sha(speech),
              "generation_id":smeta.get("generation_id"),
              "cost_usd":0.0,
          }

          # 11) Capability discovery for paid-only generation/STT surfaces; no paid requests are submitted.
          for name, path in (
              ("models", "/models"),
              ("image_models", "/images/models"),
              ("video_models", "/videos/models"),
              ("embedding_models", "/embeddings/models"),
          ):
              try:
                  obj, meta = http("GET", path)
                  data = obj.get("data") if isinstance(obj, dict) else None
                  receipt["discovery"][name] = {"state":"PASS", "http_status":meta["http_status"], "count":len(data) if isinstance(data, list) else None}
              except Exception as exc:
                  receipt["discovery"][name] = {"state":"FAIL", "error_sha256":sha(str(exc).encode())}

          # Key usage after zero-cost calls. This proves the same credential remains callable.
          key_after, kameta = http("GET", "/key")
          kad = key_after.get("data") or key_after
          receipt["credential"]["post_canary_http_status"] = kameta["http_status"]
          receipt["credential"]["post_canary_usage"] = kad.get("usage")
          receipt["credential"]["post_canary_limit_remaining"] = kad.get("limit_remaining")

          required = ["text_inference","image_input","audio_input","video_input","pdf_input","tool_calling","structured_output","embeddings","tts"]
          failures = [name for name in required if receipt["tests"].get(name,{}).get("state") != "PASS"]
          observed_costs = [v.get("cost_usd") for v in receipt["tests"].values() if isinstance(v,dict) and isinstance(v.get("cost_usd"),(int,float))]
          receipt["observed_cost_usd_sum"] = round(sum(observed_costs), 10)
          receipt["required_test_failures"] = failures
          receipt["state"] = "PROVEN_ZERO_COST_CORE" if not failures and receipt["credential"]["state"] == "VALID" else "PARTIAL_OR_FAILED"

          # No raw model outputs, prompts beyond fixed synthetic canaries, or credential values are emitted.
          print("OPENROUTER_CANARY_RECEIPT=" + json.dumps(receipt, sort_keys=True, separators=(",", ":")))
          if receipt["credential"]["state"] != "VALID" or receipt["tests"]["text_inference"]["state"] != "PASS":
              raise SystemExit(3)
          PY
