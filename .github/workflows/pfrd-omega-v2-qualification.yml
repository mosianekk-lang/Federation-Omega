name: PFRD Omega v2 Qualification

on:
  push:
    branches: ["pfrd-omega-deploy-20260729"]
    paths:
      - "systems/pfrd-omega/**"
      - ".github/workflows/pfrd-omega-v2-qualification.yml"
  pull_request:
    paths:
      - "systems/pfrd-omega/**"
      - ".github/workflows/pfrd-omega-v2-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pfrd-omega-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHIVE_NAME: PFRD_OMEGA_Model_Independent_Prevention_Kernel_v2.1.0.zip
  OPA_VERSION: 1.18.2

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct sealed source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/${ARCHIVE_NAME}"
          cat systems/pfrd-omega/${ARCHIVE_NAME}.b64.part* | base64 --decode > "${ARCHIVE}"
          cd /tmp
          sha256sum --check "$GITHUB_WORKSPACE/systems/pfrd-omega/PFRD_OMEGA_Model_Independent_Prevention_Kernel_v2.1.0_SHA256.txt"
          mkdir -p "$GITHUB_WORKSPACE/systems/pfrd-omega/runtime"
          unzip -q "${ARCHIVE}" -d "$GITHUB_WORKSPACE/systems/pfrd-omega/runtime"

      - name: Verify source manifest
        working-directory: systems/pfrd-omega/runtime
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root / 'MANIFEST_SHA256.json').read_text())
          failures = []
          for rel, expected in manifest['files'].items():
              path = root / rel
              if not path.is_file():
                  failures.append(f'missing:{rel}')
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  failures.append(f'hash:{rel}:{actual}:{expected}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f"Manifest verified: {manifest['file_count']} source files")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: systems/pfrd-omega/runtime/pyproject.toml

      - name: Install
        working-directory: systems/pfrd-omega/runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile
        working-directory: systems/pfrd-omega/runtime
        run: python -m compileall -q pfrd services scripts

      - name: Unit and adversarial tests
        working-directory: systems/pfrd-omega/runtime
        run: pytest -q

      - name: OPA policy validation
        working-directory: systems/pfrd-omega/runtime
        run: docker run --rm -v "$PWD/policies:/policies:ro" "openpolicyagent/opa:${OPA_VERSION}" check /policies/pfrd_release.rego

      - name: Local external-gateway qualification
        working-directory: systems/pfrd-omega/runtime
        run: python scripts/qualify_local.py

      - name: Distributed Docker and OPA qualification
        working-directory: systems/pfrd-omega/runtime
        run: python scripts/qualify_compose.py

      - name: Build wheel
        working-directory: systems/pfrd-omega/runtime
        run: python -m pip wheel --no-build-isolation --no-deps . -w dist

      - name: Upload qualification records
        uses: actions/upload-artifact@v4
        with:
          name: pfrd-omega-v2-qualification
          if-no-files-found: error
          retention-days: 30
          path: |
            systems/pfrd-omega/runtime/qualification/*.json
            systems/pfrd-omega/runtime/dist/*.whl
            systems/pfrd-omega/runtime/MANIFEST_SHA256.json

  image:
    needs: qualify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct sealed source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/${ARCHIVE_NAME}"
          cat systems/pfrd-omega/${ARCHIVE_NAME}.b64.part* | base64 --decode > "${ARCHIVE}"
          cd /tmp
          sha256sum --check "$GITHUB_WORKSPACE/systems/pfrd-omega/PFRD_OMEGA_Model_Independent_Prevention_Kernel_v2.1.0_SHA256.txt"
          mkdir -p "$GITHUB_WORKSPACE/systems/pfrd-omega/runtime"
          unzip -q "${ARCHIVE}" -d "$GITHUB_WORKSPACE/systems/pfrd-omega/runtime"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: systems/pfrd-omega/runtime
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/federation-omega-pfrd-omega:2.1.0
            ghcr.io/${{ github.repository_owner }}/federation-omega-pfrd-omega:${{ github.sha }}
