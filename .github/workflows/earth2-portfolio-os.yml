name: EARTH 2.0 Portfolio OS

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'earth2-portfolio/portfolio-os.py'
      - 'earth2-portfolio/config.json'
      - 'earth2-portfolio/portfolio.json'
      - '.github/workflows/earth2-portfolio-os.yml'

permissions:
  contents: write

concurrency:
  group: earth2-portfolio-os
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portfolio cycle
        run: python earth2-portfolio/portfolio-os.py
      - name: Commit verified state
        run: |
          git config user.name "earth2-portfolio-os"
          git config user.email "actions@users.noreply.github.com"
          git add earth2-portfolio/portfolio.json earth2-portfolio/state earth2-portfolio/reports
          git diff --cached --quiet || git commit -m "EARTH 2.0 portfolio cycle"
          git pull --rebase
          git push
