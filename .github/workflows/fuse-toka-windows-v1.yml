name: FUSE Toka Windows v1
on:
  pull_request:
    paths:
      - 'fuse_toka/**'
      - 'fuse_toka_control_plane/**'
      - '.github/workflows/fuse-toka-windows-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./fuse_toka pyinstaller
      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s fuse_toka/tests -v
      - name: Build FUSE-Toka.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FUSE-Toka --paths fuse_toka/src fuse_toka/src/fuse_toka/app.py
          if (!(Test-Path dist/FUSE-Toka.exe)) { throw 'FUSE_TOKA_EXE_MISSING' }
          Get-FileHash -Algorithm SHA256 dist/FUSE-Toka.exe | Format-List
      - name: Build CLI smoke executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name fuse-toka-cli --paths fuse_toka/src fuse_toka/src/fuse_toka/cli.py
          ./dist/fuse-toka-cli.exe status
          ./dist/fuse-toka-cli.exe catalog | Out-File -Encoding utf8 dist/catalog-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: fuse-toka-windows-${{ github.sha }}
          path: |
            dist/FUSE-Toka.exe
            dist/fuse-toka-cli.exe
            dist/catalog-smoke.json
          if-no-files-found: error
          retention-days: 14
