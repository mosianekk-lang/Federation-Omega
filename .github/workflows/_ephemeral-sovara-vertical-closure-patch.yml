name: Ephemeral SOVARA Vertical Closure Patch

on:
  push:
    branches:
      - sovara/creative-vertical-closure-hardening-v1-20260901

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, 'remove ephemeral vertical closure patch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply exact persistence and learning patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) FileVersionTreeStore: serialize the load->compare->replace critical
          # section across OS processes while preserving immutable object writes,
          # refs hash checks, atomic replace and restart readback.
          path = Path('sovara/creative/version_tree_store.py')
          text = path.read_text(encoding='utf-8')
          old = 'from dataclasses import dataclass\nfrom hashlib import sha256\n'
          new = 'from contextlib import contextmanager\nfrom dataclasses import dataclass\nfrom hashlib import sha256\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''def _canonical_json_bytes(value: object) -> bytes:\n    return (_stable_json(value) + "\\n").encode("utf-8")\n\n\ndef _fsync_dir(path: Path) -> None:\n'''
          insert = '''def _canonical_json_bytes(value: object) -> bytes:\n    return (_stable_json(value) + "\\n").encode("utf-8")\n\n\n@contextmanager\ndef _exclusive_process_lock(path: Path):\n    """Serialize refs mutations across processes without creating a new store.\n\n    The lock file contains no authority or state; refs.json remains the only mutable\n    authoritative pointer. POSIX uses flock and Windows uses the stdlib msvcrt byte\n    lock. The file may persist between runs; the OS lock itself is released on close.\n    """\n\n    path.parent.mkdir(parents=True, exist_ok=True)\n    handle = open(path, "a+b")\n    try:\n        if os.name == "nt":\n            import msvcrt\n\n            handle.seek(0, os.SEEK_END)\n            if handle.tell() == 0:\n                handle.write(b"\\0")\n                handle.flush()\n            handle.seek(0)\n            msvcrt.locking(handle.fileno(), msvcrt.LK_LOCK, 1)\n        else:\n            import fcntl\n\n            fcntl.flock(handle.fileno(), fcntl.LOCK_EX)\n        yield\n    finally:\n        try:\n            if os.name == "nt":\n                import msvcrt\n\n                handle.seek(0)\n                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n            else:\n                import fcntl\n\n                fcntl.flock(handle.fileno(), fcntl.LOCK_UN)\n        finally:\n            handle.close()\n\n\ndef _fsync_dir(path: Path) -> None:\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insert, 1)

          old = '        self.refs_path = self.asset_dir / "refs.json"\n'
          new = '        self.refs_path = self.asset_dir / "refs.json"\n        self.lock_path = self.asset_dir / "refs.lock"\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if self.refs_path.exists() and (\n            self.refs_path.is_symlink() or not self.refs_path.is_file()\n        ):\n            raise StoreCorruptionError("refs.json must be a regular file")\n'''
          new = '''        if self.refs_path.exists() and (\n            self.refs_path.is_symlink() or not self.refs_path.is_file()\n        ):\n            raise StoreCorruptionError("refs.json must be a regular file")\n        if self.lock_path.exists() and (\n            self.lock_path.is_symlink() or not self.lock_path.is_file()\n        ):\n            raise StoreCorruptionError("refs.lock must be a regular file")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          start = text.index('    def initialize(\n')
          end = text.index('    def _node_payload(', start)
          replacement = '''    def initialize(\n        self,\n        *,\n        content: bytes,\n        branch: str = "main",\n        metadata: Mapping[str, Any] | None = None,\n    ) -> tuple[VersionTree, LocalStoreReceipt]:\n        self._ensure_layout()\n        with _exclusive_process_lock(self.lock_path):\n            self._guard_layout()\n            if self.refs_path.exists():\n                raise StoreAlreadyInitializedError(\n                    "version tree store already initialized"\n                )\n            tree = VersionTree(self.asset_id)\n            tree.create_root(content=content, branch=branch, metadata=metadata)\n            self._persist_immutable_objects(tree)\n            refs = self._refs_document(\n                tree=tree, generation=1, previous_refs_sha256=None\n            )\n            self._replace_refs_guarded(\n                refs, expected_current_refs_sha256=None\n            )\n            loaded, receipt = self.load()\n            if loaded.receipt().receipt_sha256 != tree.receipt().receipt_sha256:\n                raise StoreCorruptionError(\n                    "restart readback does not match initialized tree"\n                )\n            return loaded, receipt\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('    def _mutate(\n')
          end = text.index('    def commit(\n', start)
          replacement = '''    def _mutate(\n        self, operation: str, **kwargs: Any\n    ) -> tuple[VersionTree, LocalStoreReceipt]:\n        self._ensure_layout()\n        with _exclusive_process_lock(self.lock_path):\n            tree, prior_receipt = self.load()\n            _, _, expected_refs_sha = self._read_refs()\n            if expected_refs_sha != prior_receipt.refs_sha256:\n                raise StoreConcurrentMutationError(\n                    "refs changed between readback steps"\n                )\n\n            if operation == "commit":\n                tree.commit(**kwargs)\n            elif operation == "create_branch":\n                tree.create_branch(**kwargs)\n            elif operation == "merge":\n                tree.merge(**kwargs)\n            elif operation == "rollback":\n                tree.rollback(**kwargs)\n            else:\n                raise VersionTreeStoreError(\n                    f"unsupported mutation: {operation}"\n                )\n\n            self._persist_immutable_objects(tree)\n            refs = self._refs_document(\n                tree=tree,\n                generation=prior_receipt.generation + 1,\n                previous_refs_sha256=expected_refs_sha,\n            )\n            self._replace_refs_guarded(\n                refs, expected_current_refs_sha256=expected_refs_sha\n            )\n            loaded, receipt = self.load()\n            if loaded.receipt().receipt_sha256 != tree.receipt().receipt_sha256:\n                raise StoreCorruptionError(\n                    "post-mutation restart readback mismatch"\n                )\n            return loaded, receipt\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          # 2) Performance learning: keep low-context observations descriptive,
          # but only permit learning_ready when exact mission/cohort/channel,
          # attribution, freshness, repetition and distinct-asset gates all pass.
          path = Path('sovara/creative/supply_chain.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('@dataclass(frozen=True, slots=True)\nclass PerformanceObservation:')
          tail = '''@dataclass(frozen=True, slots=True)\nclass PerformanceObservation:\n    observation_id: str\n    asset_id: str\n    tags: tuple[str, ...]\n    reward: float\n    sequence: int\n    source: str = "OBSERVED_PERFORMANCE"\n    synthetic: bool = False\n    mission_id: str = ""\n    cohort_id: str = ""\n    channel: str = ""\n    attribution_ref: str = ""\n    observed_at: str = ""\n    fresh: bool = False\n\n\n@dataclass(frozen=True, slots=True)\nclass DiscoveryRecommendation:\n    tag: str\n    score: float\n    observation_count: int\n    distinct_asset_count: int = 0\n    mission_id: str = ""\n    cohort_id: str = ""\n    channel: str = ""\n\n\n@dataclass(frozen=True, slots=True)\nclass DiscoveryReceipt:\n    schema: str\n    eligible_observation_count: int\n    qualified_observation_count: int\n    recommendation_count: int\n    recommendations: tuple[DiscoveryRecommendation, ...]\n    learning_ready: bool\n    context_bound: bool\n    descriptive_only: bool\n    state_sha256: str\n    authority_inherited: bool = False\n    external_effect_performed: bool = False\n\n\nclass CreativeDiscoveryGraph:\n    """Bounded, cohort-aware performance-learning graph for content tags.\n\n    Unbound or incompletely attributed observations are retained for descriptive\n    analysis but cannot set ``learning_ready``. Production-influencing learning\n    requires an exact mission/cohort/channel context, fresh provider attribution,\n    repeated signal and distinct assets. The graph itself never publishes, routes\n    spend or mutates production policy.\n    """\n\n    def __init__(\n        self,\n        *,\n        min_observations: int = 3,\n        min_distinct_assets: int = 2,\n        mission_id: str = "",\n        cohort_id: str = "",\n        channel: str = "",\n    ) -> None:\n        if min_observations < 1:\n            raise ValueError("min_observations must be positive")\n        if min_distinct_assets < 1:\n            raise ValueError("min_distinct_assets must be positive")\n        context = tuple(str(item).strip() for item in (mission_id, cohort_id, channel))\n        if any(context) and not all(context):\n            raise ValueError("mission_id, cohort_id and channel must be bound together")\n        self.min_observations = int(min_observations)\n        self.min_distinct_assets = int(min_distinct_assets)\n        self.mission_id, self.cohort_id, self.channel = context\n        self.context_bound = bool(all(context))\n        self._observations: dict[str, PerformanceObservation] = {}\n\n    def observe(self, observation: PerformanceObservation) -> None:\n        oid = _clean(observation.observation_id, field="observation_id")\n        if oid in self._observations:\n            raise ValueError(f"duplicate observation_id: {oid}")\n        if not -1.0 <= float(observation.reward) <= 1.0:\n            raise ValueError("reward must be in [-1, 1]")\n        if observation.sequence < 0:\n            raise ValueError("sequence must be non-negative")\n        tags = _clean_tuple(item.lower() for item in observation.tags)\n        if not tags:\n            raise ValueError("at least one tag is required")\n\n        mission = str(observation.mission_id).strip()\n        cohort = str(observation.cohort_id).strip()\n        channel = str(observation.channel).strip().lower()\n        if self.context_bound:\n            if mission != self.mission_id:\n                raise ValueError("observation mission context mismatch")\n            if cohort != self.cohort_id:\n                raise ValueError("observation cohort context mismatch")\n            if channel != self.channel.lower():\n                raise ValueError("observation channel context mismatch")\n\n        self._observations[oid] = PerformanceObservation(\n            observation_id=oid,\n            asset_id=_clean(observation.asset_id, field="asset_id"),\n            tags=tags,\n            reward=float(observation.reward),\n            sequence=int(observation.sequence),\n            source=_clean(observation.source, field="source"),\n            synthetic=bool(observation.synthetic),\n            mission_id=mission,\n            cohort_id=cohort,\n            channel=channel,\n            attribution_ref=str(observation.attribution_ref).strip(),\n            observed_at=str(observation.observed_at).strip(),\n            fresh=bool(observation.fresh),\n        )\n\n    def observations(self) -> tuple[PerformanceObservation, ...]:\n        return tuple(sorted(self._observations.values(), key=lambda item: (item.sequence, item.observation_id)))\n\n    def _qualifies_for_learning(self, item: PerformanceObservation) -> bool:\n        return bool(\n            self.context_bound\n            and not item.synthetic\n            and item.mission_id == self.mission_id\n            and item.cohort_id == self.cohort_id\n            and item.channel == self.channel.lower()\n            and item.attribution_ref\n            and item.observed_at\n            and item.fresh\n        )\n\n    def receipt(self, *, limit: int = 10) -> DiscoveryReceipt:\n        if limit < 1:\n            raise ValueError("limit must be positive")\n        eligible = tuple(item for item in self.observations() if not item.synthetic)\n        qualified = tuple(item for item in eligible if self._qualifies_for_learning(item))\n\n        scores: dict[str, list[PerformanceObservation]] = {}\n        for item in qualified:\n            for tag in item.tags:\n                scores.setdefault(tag, []).append(item)\n\n        rows: list[DiscoveryRecommendation] = []\n        for tag, observations in scores.items():\n            assets = {item.asset_id for item in observations}\n            if len(observations) < self.min_observations or len(assets) < self.min_distinct_assets:\n                continue\n            rows.append(\n                DiscoveryRecommendation(\n                    tag=tag,\n                    score=round(sum(item.reward for item in observations) / len(observations), 12),\n                    observation_count=len(observations),\n                    distinct_asset_count=len(assets),\n                    mission_id=self.mission_id,\n                    cohort_id=self.cohort_id,\n                    channel=self.channel.lower(),\n                )\n            )\n        recommendations = tuple(\n            sorted(rows, key=lambda item: (-item.score, item.tag))[:limit]\n        )\n        learning_ready = bool(recommendations)\n        state = {\n            "schema": "SOVARA_SC_DISCOVERY_GRAPH_RECEIPT_V2",\n            "eligible_observation_count": len(eligible),\n            "qualified_observation_count": len(qualified),\n            "recommendations": [\n                {\n                    "tag": item.tag,\n                    "score": item.score,\n                    "observation_count": item.observation_count,\n                    "distinct_asset_count": item.distinct_asset_count,\n                    "mission_id": item.mission_id,\n                    "cohort_id": item.cohort_id,\n                    "channel": item.channel,\n                }\n                for item in recommendations\n            ],\n            "learning_ready": learning_ready,\n            "context_bound": self.context_bound,\n            "descriptive_only": not self.context_bound,\n            "authority_inherited": False,\n            "external_effect_performed": False,\n        }\n        return DiscoveryReceipt(\n            schema=state["schema"],\n            eligible_observation_count=len(eligible),\n            qualified_observation_count=len(qualified),\n            recommendation_count=len(recommendations),\n            recommendations=recommendations,\n            learning_ready=learning_ready,\n            context_bound=self.context_bound,\n            descriptive_only=not self.context_bound,\n            state_sha256=_digest(state),\n            authority_inherited=False,\n            external_effect_performed=False,\n        )\n'''
          text = text[:start] + tail
          path.write_text(text, encoding='utf-8')

          # 3) Update the two legacy discovery tests to bind real cohort context.
          path = Path('tests/test_sovara_creative_supply_chain.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_discovery_graph_excludes_synthetic_and_requires_repeated_signal(self):')
          end = text.index('\n\nif __name__ == "__main__":', start)
          replacement = '''    def test_discovery_graph_excludes_synthetic_and_requires_repeated_signal(self):\n        graph = CreativeDiscoveryGraph(\n            min_observations=2,\n            min_distinct_assets=2,\n            mission_id="mission-supply",\n            cohort_id="cohort-1",\n            channel="instagram",\n        )\n        common = dict(\n            mission_id="mission-supply",\n            cohort_id="cohort-1",\n            channel="instagram",\n            attribution_ref="provider:analytics",\n            observed_at="2026-09-01T10:00:00+02:00",\n            fresh=True,\n        )\n        graph.observe(\n            PerformanceObservation("perf-1", "asset-1", ("luxury", "silk"), 0.8, 1, **common)\n        )\n        graph.observe(\n            PerformanceObservation("perf-2", "asset-2", ("luxury",), 0.6, 2, **common)\n        )\n        graph.observe(\n            PerformanceObservation(\n                "synthetic-1", "asset-x", ("neon",), 1.0, 3, synthetic=True, **common\n            )\n        )\n        receipt = graph.receipt()\n        self.assertTrue(receipt.learning_ready)\n        self.assertTrue(receipt.context_bound)\n        self.assertEqual(receipt.eligible_observation_count, 2)\n        self.assertEqual(receipt.qualified_observation_count, 2)\n        self.assertEqual(tuple(item.tag for item in receipt.recommendations), ("luxury",))\n        self.assertEqual(receipt.recommendations[0].score, 0.7)\n        self.assertEqual(receipt.recommendations[0].distinct_asset_count, 2)\n        self.assertFalse(receipt.external_effect_performed)\n\n    def test_discovery_graph_does_not_promote_one_off_signal(self):\n        graph = CreativeDiscoveryGraph(\n            min_observations=2,\n            mission_id="mission-supply",\n            cohort_id="cohort-1",\n            channel="instagram",\n        )\n        graph.observe(\n            PerformanceObservation(\n                "perf-1",\n                "asset-1",\n                ("luxury",),\n                1.0,\n                1,\n                mission_id="mission-supply",\n                cohort_id="cohort-1",\n                channel="instagram",\n                attribution_ref="provider:analytics",\n                observed_at="2026-09-01T10:00:00+02:00",\n                fresh=True,\n            )\n        )\n        receipt = graph.receipt()\n        self.assertFalse(receipt.learning_ready)\n        self.assertEqual(receipt.recommendations, ())\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused SOVARA hardening courts
        shell: bash
        run: >-
          python -m unittest -v
          tests.test_sovara_creative_canary
          tests.test_sovara_creative_openrouter_processor_mesh
          tests.test_sovara_creative_commercial_value_hardening
          tests.test_sovara_creative_route_convergence
          tests.test_sovara_creative_version_tree_store
          tests.test_sovara_creative_version_tree_process_lock
          tests.test_sovara_creative_supply_chain
          tests.test_sovara_creative_performance_learning_hardening

      - name: Commit exact patch if tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sovara/creative/version_tree_store.py sovara/creative/supply_chain.py tests/test_sovara_creative_supply_chain.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(sovara): apply vertical closure hardening patches'
          git push origin HEAD:sovara/creative-vertical-closure-hardening-v1-20260901
