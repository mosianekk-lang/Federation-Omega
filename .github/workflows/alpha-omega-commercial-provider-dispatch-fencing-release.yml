name: Alpha Omega Commercial Provider Reconciliation Recovery v17 Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-reconciliation-recovery-v17-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run v17 release and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_reconciliation_recovery_release
          alpha_omega_commercial.test_provider_reconciliation_recovery
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault_release
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault
          alpha_omega_commercial.test_provider_reconciliation_challenge_release
          alpha_omega_commercial.test_provider_reconciliation_challenge
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute v17 release reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_recovery_release
          --root .
          --output artifacts

      - name: Revalidate v17 implementation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_recovery
          --root .
          --output artifacts

      - name: Revalidate v16 release proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_evidence_vault_release
          --root .
          --output artifacts

      - name: Validate release truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-reconciliation-recovery-v17-release-proof.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-RECOVERY-V17-RELEASE-PROOF'
          assert proof['checks_required'] == 19 and proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          assert proof['provider_proof']['all_triggered_workflows'] == 31
          assert proof['provider_proof']['regression_tests_passed'] == 59
          assert proof['google_drive_release']['readback_verified'] is True
          assert proof['google_drive_release']['shared'] is False
          truth = proof['commercial_truth']
          assert truth['verified_live_revenue_events'] == 0
          assert truth['payment_provider_operation_proven'] is False
          assert truth['cloud_run_operation_proven'] is False
          assert truth['provider_native_reconciliation_proven'] is False
          assert truth['full_commercial_maturity'] is False
          PY

      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_reconciliation_recovery.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_recovery.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_recovery_release.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_recovery.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_recovery_release.py'),
              Path('alpha_omega_commercial/provider_reconciliation_recovery_checkpoint.json'),
              Path('alpha_omega_commercial/provider_reconciliation_recovery_release_checkpoint.json'),
              Path('alpha_omega_commercial/provider_reconciliation_recovery_release_receipt.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v17.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v17.json'),
              Path('alpha_omega_commercial/C15_PROVIDER_RECONCILIATION_RECOVERY_V17.md'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable v17 release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-reconciliation-recovery-v17-release-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
