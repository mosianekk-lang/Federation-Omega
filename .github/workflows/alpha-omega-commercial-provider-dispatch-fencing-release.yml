name: Alpha Omega Commercial Provider Dispatch Outcome Reconciliation

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-dispatch-outcome-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run outcome reconciliation and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute deterministic outcome reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_dispatch_outcome_reconciliation
          --output artifacts

      - name: Validate proof receipt and commercial truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('artifacts/provider-dispatch-outcome-reconciliation-receipt.json').read_text()
          )
          assert receipt['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTCOME-RECONCILIATION-V14'
          assert receipt['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert receipt['checks_required'] == 12
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          assert receipt['operational_slice']['durable_submission_marker'] is True
          assert receipt['operational_slice']['expired_submitted_attempt_quarantined'] is True
          assert receipt['operational_slice']['unresolved_outcome_blocks_retry'] is True
          assert receipt['operational_slice']['provider_native_reconciliation_proven'] is False
          assert receipt['operational_slice']['external_mutation_performed'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify candidate checkpoint and effective API projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation_checkpoint.json').read_text())
          projection = json.loads(Path('alpha_omega_commercial/canonical_commercial_api_effective_v14.json').read_text())
          assert checkpoint['status'] == 'IMPLEMENTED_PROVIDER_NATIVE_CI_PENDING'
          assert checkpoint['candidate_projection']['canonical_class'] == 'OutcomeReconciledProviderDispatchCommercialControlPlane'
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False
          assert projection['capability_revision'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTCOME-RECONCILIATION-V14'
          assert projection['service_enabled_platform_prioritised'] is True
          assert projection['self_service_saas_held'] is True
          assert projection['external_maturity_gates_advanced'] is False
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation.py'),
              Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v14.json'),
              Path('alpha_omega_commercial/prove_provider_dispatch_outcome_reconciliation.py'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable provider proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-dispatch-outcome-reconciliation-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
