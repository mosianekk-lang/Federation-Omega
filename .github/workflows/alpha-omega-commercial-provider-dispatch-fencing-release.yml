name: Alpha Omega Commercial Provider Reconciliation Recovery Completion v18

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-reconciliation-recovery-completion-v18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run v18 and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_reconciliation_recovery_completion
          alpha_omega_commercial.test_provider_reconciliation_recovery_release
          alpha_omega_commercial.test_provider_reconciliation_recovery
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault_release
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault
          alpha_omega_commercial.test_provider_reconciliation_challenge_release
          alpha_omega_commercial.test_provider_reconciliation_challenge
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute v18 operational proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_recovery_completion
          --root .
          --output artifacts

      - name: Revalidate v17 release proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_recovery_release
          --root .
          --output artifacts

      - name: Revalidate v17 implementation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_recovery
          --root .
          --output artifacts

      - name: Validate v18 truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-reconciliation-recovery-completion-v18-receipt.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-RECOVERY-COMPLETION-V18'
          assert proof['checks_required'] == 14 and proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          operational = proof['operational_slice']
          assert operational['post_resolution_receipt_repair'] is True
          assert operational['atomic_content_addressed_completion_receipt'] is True
          assert operational['exact_retry_idempotency'] is True
          assert operational['reconciliation_reexecution_on_receipt_repair'] is False
          assert operational['provider_native_reconciliation_proven'] is False
          assert operational['external_mutation_performed'] is False
          truth = proof['commercial_truth']
          assert truth['verified_live_revenue_events'] == 0
          assert truth['customer_demand_proven'] is False
          assert truth['signed_customer_contract_proven'] is False
          assert truth['payment_provider_operation_proven'] is False
          assert truth['cloud_run_operation_proven'] is False
          assert truth['provider_native_reconciliation_proven'] is False
          assert truth['full_commercial_maturity'] is False
          PY

      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_reconciliation_recovery_completion.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_recovery_completion.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_recovery_completion.py'),
              Path('alpha_omega_commercial/provider_reconciliation_recovery_completion_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v18.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v18.json'),
              Path('alpha_omega_commercial/C15_PROVIDER_RECONCILIATION_RECOVERY_COMPLETION_V18.md'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable v18 provider proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-reconciliation-recovery-completion-v18-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
