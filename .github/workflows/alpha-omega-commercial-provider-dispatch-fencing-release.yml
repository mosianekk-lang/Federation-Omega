name: Alpha Omega Commercial Provider Reconciliation Evidence Vault v16

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-reconciliation-evidence-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run v16 and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault
          alpha_omega_commercial.test_provider_reconciliation_challenge_release
          alpha_omega_commercial.test_provider_reconciliation_challenge
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute v16 deterministic proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_evidence_vault
          --root .
          --output artifacts

      - name: Validate v16 proof and commercial truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-reconciliation-evidence-vault-v16-receipt.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-EVIDENCE-VAULT-V16'
          assert proof['status'] == 'PROVIDER_RECONCILIATION_EVIDENCE_VAULT_CONFORMANCE_VERIFIED_PROVIDER_NATIVE_RECONCILIATION_BLOCKED'
          assert proof['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert proof['checks_required'] == 12
          assert proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          operational = proof['operational_slice']
          assert operational['content_addressed_evidence_package'] is True
          assert operational['atomic_publish_before_outcome_resolution'] is True
          assert operational['restart_requires_referenced_evidence'] is True
          assert operational['provider_native_reconciliation_proven'] is False
          truth = proof['commercial_truth']
          assert truth['service_enabled_platform_prioritised'] is True
          assert truth['self_service_saas_held'] is True
          assert truth['verified_live_revenue_events'] == 0
          assert truth['payment_provider_operation_proven'] is False
          assert truth['cloud_run_operation_proven'] is False
          assert truth['full_commercial_maturity'] is False
          assert proof['external_gate_effect'] == 'UNCHANGED'
          assert proof['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Validate predecessor and pending promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          checkpoint = json.loads((root / 'provider_reconciliation_evidence_vault_checkpoint.json').read_text())
          predecessor = json.loads((root / 'provider_reconciliation_challenge_release_checkpoint.json').read_text())
          api = json.loads((root / 'canonical_commercial_api_effective_v16.json').read_text())
          maturity = json.loads((root / 'programme_maturity_effective_v16.json').read_text())
          assert predecessor['status'] == 'PROVIDER_RECONCILIATION_CHALLENGE_V15_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert predecessor['release_receipt_sha256'] == '29dd3f5e7b3eea53bd48af6c855c3a89d59736c13c406f821fc0159190072271'
          assert checkpoint['dependency_predecessor']['repair_pull_request'] == 155
          assert checkpoint['dependency_predecessor']['repair_merge_commit'] == 'b123a4415bb14d12a1c5c9de8f5a5f04d27bf2bd'
          assert checkpoint['dependency_predecessor']['google_drive_readback_verified'] is True
          assert api['canonical_class'] == 'VaultedProviderDispatchCommercialControlPlane'
          assert api['controls']['provider_native_reconciliation'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert maturity['verified_live_revenue_events'] == 0
          assert maturity['full_commercial_maturity'] is False
          assert checkpoint['provider_native_ci']['checks_required'] == 12
          PY

      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v16.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v16.json'),
              Path('alpha_omega_commercial/C15_PROVIDER_RECONCILIATION_EVIDENCE_VAULT_V16.md'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable v16 provider proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-reconciliation-evidence-v16-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
