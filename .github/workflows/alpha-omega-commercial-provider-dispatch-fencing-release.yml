name: Alpha Omega Commercial Provider Reconciliation Evidence Vault v16 Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-reconciliation-evidence-v16-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run v16 release and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault_release
          alpha_omega_commercial.test_provider_reconciliation_evidence_vault
          alpha_omega_commercial.test_provider_reconciliation_challenge_release
          alpha_omega_commercial.test_provider_reconciliation_challenge
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute v16 implementation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_evidence_vault
          --root .
          --output artifacts

      - name: Execute v16 release reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_evidence_vault_release
          --root .
          --output artifacts

      - name: Validate v16 implementation truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-reconciliation-evidence-vault-v16-receipt.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-EVIDENCE-VAULT-V16'
          assert proof['checks_required'] == 12 and proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          assert proof['operational_slice']['content_addressed_evidence_package'] is True
          assert proof['operational_slice']['atomic_publish_before_outcome_resolution'] is True
          assert proof['operational_slice']['restart_requires_referenced_evidence'] is True
          assert proof['operational_slice']['provider_native_reconciliation_proven'] is False
          assert proof['commercial_truth']['verified_live_revenue_events'] == 0
          assert proof['commercial_truth']['payment_provider_operation_proven'] is False
          assert proof['commercial_truth']['cloud_run_operation_proven'] is False
          assert proof['commercial_truth']['full_commercial_maturity'] is False
          PY

      - name: Validate exact release proof and Drive readback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-reconciliation-evidence-vault-v16-release-proof.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-EVIDENCE-VAULT-V16-RELEASE-PROOF'
          assert proof['status'] == 'PROVIDER_RECONCILIATION_EVIDENCE_VAULT_V16_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert proof['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert proof['checks_required'] == 18 and proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          provider = proof['provider_proof']
          drive = proof['google_drive_release']
          assert provider['workflow_run'] == 30922901781
          assert provider['workflow_job'] == 92037777846
          assert provider['artifact_id'] == 8897842921
          assert provider['artifact_digest'] == 'sha256:639663bfda09ea790237ca9b6e59dbadbaec205dfeb0f12f5d7455fe8286b91f'
          assert provider['receipt_file_sha256'] == '8fb3732dfeb5b0e17b53e57c67c6faa6596857819fb17f1a6cd30c31649b8e2f'
          assert provider['checks_required'] == 12 and provider['checks_failed'] == 0
          assert provider['job_steps_readback_verified'] is True
          assert provider['all_triggered_workflows'] == 31
          assert provider['all_conclusions_success'] is True
          assert drive['file_id'] == '1BaghI8fHt42GTehodoXo0IJoRmYD0j-7NYMkmhS5gW0'
          assert drive['created_time'] == '2026-08-04T15:14:08.748Z'
          assert drive['modified_time'] == '2026-08-04T15:14:31.804Z'
          assert drive['export_size_bytes'] == 4666
          assert drive['export_sha256'] == '88b43753d53d5291a89da26962b911d51265654492651c7086483e9c2223f578'
          assert drive['readback_verified'] is True and drive['shared'] is False
          assert drive['owner'] == 'mosianekk@gmail.com'
          assert proof['release_receipt_sha256'] == '85b170cdbda11d903898b2106356641505283512b85548abbe79c1321ccecbe4'
          assert proof['commercial_truth']['verified_live_revenue_events'] == 0
          assert proof['commercial_truth']['full_commercial_maturity'] is False
          assert proof['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_evidence_vault_release.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_evidence_vault.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_evidence_vault_release.py'),
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault_checkpoint.json'),
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault_release_receipt.json'),
              Path('alpha_omega_commercial/provider_reconciliation_evidence_vault_release_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v16.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v16.json'),
              Path('alpha_omega_commercial/C15_PROVIDER_RECONCILIATION_EVIDENCE_VAULT_V16.md'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable v16 release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-reconciliation-evidence-v16-release-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
