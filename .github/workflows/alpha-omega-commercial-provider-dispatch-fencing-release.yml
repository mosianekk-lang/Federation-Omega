name: Alpha Omega Commercial Provider Reconciliation Challenge v15

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-reconciliation-challenge-v15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run v15 and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_reconciliation_challenge
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute deterministic v15 proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_reconciliation_challenge
          --root .
          --output artifacts

      - name: Validate proof receipt and commercial truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('artifacts/provider-reconciliation-challenge-receipt.json').read_text())
          assert receipt['control_id'] == 'AO-COMMERCIAL-PROVIDER-RECONCILIATION-CHALLENGE-V15'
          assert receipt['status'] == 'PROVIDER_RECONCILIATION_CHALLENGE_BINDING_CONFORMANCE_VERIFIED_PROVIDER_NATIVE_RECONCILIATION_BLOCKED'
          assert receipt['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert receipt['checks_required'] == 12
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          operational = receipt['operational_slice']
          assert operational['durable_hash_chained_challenge_history'] is True
          assert operational['exact_unknown_attempt_binding'] is True
          assert operational['bounded_challenge_freshness'] is True
          assert operational['one_time_challenge_consumption'] is True
          assert operational['mock_provider_conformance'] is True
          assert operational['provider_native_reconciliation_authority'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert operational['provider_native_reconciliation_proven'] is False
          assert operational['external_mutation_performed'] is False
          truth = receipt['commercial_truth']
          assert truth['service_enabled_platform_prioritised'] is True
          assert truth['self_service_saas_held'] is True
          assert truth['verified_live_revenue_events'] == 0
          assert truth['payment_provider_operation_proven'] is False
          assert truth['cloud_run_operation_proven'] is False
          assert truth['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Validate checkpoint, predecessor proof and maturity projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          checkpoint = json.loads((root / 'provider_reconciliation_challenge_checkpoint.json').read_text())
          api = json.loads((root / 'canonical_commercial_api_effective_v15.json').read_text())
          maturity = json.loads((root / 'programme_maturity_effective_v15.json').read_text())
          predecessor = json.loads((root / 'provider_dispatch_outcome_reconciliation_release_checkpoint.json').read_text())
          assert checkpoint['status'] in {
              'IMPLEMENTED_PROVIDER_NATIVE_CI_PENDING',
              'PROVIDER_RECONCILIATION_CHALLENGE_BINDING_PROVIDER_PROOF_VERIFIED',
          }
          assert checkpoint['dependency_predecessor']['pull_request'] == 151
          assert checkpoint['dependency_predecessor']['merge_commit'] == 'd61219cc28806e4d08bc46a5243b4ee72b3190f1'
          assert checkpoint['dependency_predecessor']['google_drive_file_id'] == '1RkHNK4WDim8BKjEvd-_lUF_EIeA6zqrMAcFhNZGF-30'
          assert checkpoint['dependency_predecessor']['google_drive_readback_verified'] is True
          assert 'PROVIDER_PROOF_VERIFIED' in predecessor['status']
          assert api['canonical_class'] == 'ChallengeBoundProviderDispatchCommercialControlPlane'
          assert api['controls']['provider_native_reconciliation'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert api['external_maturity_gates_advanced'] is False
          assert maturity['verified_live_revenue_events'] == 0
          assert maturity['full_commercial_maturity'] is False
          assert maturity['service_enabled_platform_first'] is True
          assert maturity['self_service_saas_held'] is True
          PY

      - name: Verify no credential-shaped material is present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_reconciliation_challenge.py'),
              Path('alpha_omega_commercial/test_provider_reconciliation_challenge.py'),
              Path('alpha_omega_commercial/prove_provider_reconciliation_challenge.py'),
              Path('alpha_omega_commercial/provider_reconciliation_challenge_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v15.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v15.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable v15 provider proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-reconciliation-challenge-v15-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
