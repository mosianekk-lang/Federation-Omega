name: Alpha Omega Commercial Provider Dispatch Outcome Reconciliation Release

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-provider-dispatch-fencing-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-provider-dispatch-outcome-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run release and inherited regressions
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation_release
          alpha_omega_commercial.test_provider_dispatch_outcome_reconciliation
          alpha_omega_commercial.test_provider_dispatch_fencing
          alpha_omega_commercial.test_provider_dispatch_claim_lease
          alpha_omega_commercial.test_provider_dispatch_outbox
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute release reconciliation proof
        run: >-
          python -m alpha_omega_commercial.prove_provider_dispatch_outcome_reconciliation_release
          --root .
          --output artifacts

      - name: Validate release proof and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('artifacts/provider-dispatch-outcome-reconciliation-release-proof.json').read_text())
          assert proof['control_id'] == 'AO-COMMERCIAL-PROVIDER-DISPATCH-OUTCOME-RECONCILIATION-V14-RELEASE-PROOF'
          assert proof['status'] == 'PROVIDER_DISPATCH_OUTCOME_RECONCILIATION_RELEASE_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert proof['stage_scope'] == ['C03', 'C06', 'C07', 'C11', 'C14', 'C15']
          assert proof['checks_required'] == 20
          assert proof['checks_failed'] == 0
          assert all(proof['checks'].values())
          truth = proof['commercial_truth']
          assert truth['service_enabled_platform_prioritised'] is True
          assert truth['self_service_saas_held'] is True
          assert truth['verified_live_revenue_events'] == 0
          assert truth['provider_native_reconciliation_proven'] is False
          assert truth['payment_provider_operation_proven'] is False
          assert truth['cloud_run_operation_proven'] is False
          assert truth['full_commercial_maturity'] is False
          assert proof['external_gate_effect'] == 'UNCHANGED'
          assert proof['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert proof['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Validate exact provider proof and Drive readback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          checkpoint = json.loads((root / 'provider_dispatch_outcome_reconciliation_checkpoint.json').read_text())
          receipt = json.loads((root / 'provider_dispatch_outcome_reconciliation_release_receipt.json').read_text())
          release = json.loads((root / 'provider_dispatch_outcome_reconciliation_release_checkpoint.json').read_text())
          maturity = json.loads((root / 'programme_maturity_effective_v14.json').read_text())
          api = json.loads((root / 'canonical_commercial_api_effective_v14.json').read_text())
          gate = checkpoint['operational_proof_gate']
          drive = checkpoint['google_drive_release']
          assert checkpoint['status'] == 'PROVIDER_DISPATCH_UNKNOWN_OUTCOME_QUARANTINE_AND_MOCK_RECONCILIATION_PROVIDER_PROOF_VERIFIED'
          assert checkpoint['implementation_release']['pull_request'] == 150
          assert checkpoint['implementation_release']['merge_commit'] == '6afd09e31dcea910f4e64de59ca776aae834d261'
          assert gate['workflow_run'] == 30913614473
          assert gate['workflow_job'] == 92006113662
          assert gate['artifact_id'] == 8894094769
          assert gate['checks_required'] == 12 and gate['checks_failed'] == 0
          assert drive['file_id'] == '1RkHNK4WDim8BKjEvd-_lUF_EIeA6zqrMAcFhNZGF-30'
          assert drive['modified_time'] == '2026-08-04T13:28:37.044Z'
          assert drive['readback_verified'] is True and drive['shared'] is False
          assert drive['export_size_bytes'] == 7731
          assert drive['export_sha256'] == 'd43584cebbd41f3ac6c36c2a2ab1557c502ec6725c03e29573f4e0837f29336f'
          assert receipt['receipt_sha256'] == release['release_receipt_sha256']
          assert maturity['verified_live_revenue_events'] == 0
          assert maturity['full_commercial_maturity'] is False
          assert api['canonical_class'] == 'OutcomeReconciledProviderDispatchCommercialControlPlane'
          assert api['external_maturity_gates_advanced'] is False
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation_checkpoint.json'),
              Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation_release_receipt.json'),
              Path('alpha_omega_commercial/provider_dispatch_outcome_reconciliation_release_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api_effective_v14.json'),
              Path('alpha_omega_commercial/programme_maturity_effective_v14.json'),
              Path('alpha_omega_commercial/prove_provider_dispatch_outcome_reconciliation_release.py'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable release reconciliation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-provider-dispatch-outcome-reconciliation-release-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
