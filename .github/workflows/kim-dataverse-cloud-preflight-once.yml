name: Kim DataVerse Cloud Preflight Once

on:
  pull_request:
    paths:
      - ".github/workflows/kim-dataverse-cloud-preflight-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kim-dataverse-cloud-preflight-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  REGION: africa-south1
  REPOSITORY: federation-omega
  RUNTIME_SERVICE_ACCOUNT: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: superior-logic-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github

jobs:
  readonly-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prove exact WIF identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACCOUNT" = "$DEPLOYER_SERVICE_ACCOUNT"
          echo "WIF_IDENTITY_OK=true"
      - name: Prove billing visibility and enabled state
        shell: bash
        run: |
          set -euo pipefail
          BILLING="$(gcloud beta billing projects describe "$PROJECT_ID" --format='value(billingEnabled)')"
          test "$BILLING" = "True"
          echo "BILLING_ENABLED=true"
      - name: Prove required APIs
        shell: bash
        run: |
          set -euo pipefail
          ENABLED="$(gcloud services list --project "$PROJECT_ID" --enabled --format='value(config.name)')"
          for api in aiplatform.googleapis.com run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com; do
            grep -Fxq "$api" <<<"$ENABLED"
          done
          echo "REQUIRED_APIS_OK=true"
      - name: Prove Artifact Registry and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/dev/null
          RUNTIME="$(gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" --project "$PROJECT_ID" --format='value(email)')"
          test "$RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
          echo "ARTIFACT_REPOSITORY_OK=true"
          echo "RUNTIME_IDENTITY_OK=true"
      - name: Prove runtime Vertex role
        shell: bash
        run: |
          set -euo pipefail
          ROLE="$(gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:$RUNTIME_SERVICE_ACCOUNT AND bindings.role:roles/aiplatform.user" --format='value(bindings.role)' | head -n 1)"
          test "$ROLE" = "roles/aiplatform.user"
          echo "RUNTIME_VERTEX_ROLE_OK=true"
      - name: Read-only completion
        run: echo "READ_ONLY_PREFLIGHT_COMPLETE=true"
