name: Alpha Omega Commercial Institution Reconciliation

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - 'alpha_omega_v30/programme.json'
      - 'alpha_omega_v30/checkpoint_20260803.json'
      - '.github/workflows/alpha-omega-commercial-institution-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - 'alpha_omega_v30/programme.json'
      - 'alpha_omega_v30/checkpoint_20260803.json'
      - '.github/workflows/alpha-omega-commercial-institution-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-institution-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial and institution packages
        run: python -m compileall -q alpha_omega_commercial alpha_omega_v30

      - name: Run institution reconciliation tests
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_institution_reconciliation

      - name: Execute C15 P13 P15 reconciliation proof
        run: >-
          python alpha_omega_commercial/prove_institution_reconciliation.py
          --output alpha_omega_commercial/artifacts/c15/institution-reconciliation/institution-reconciliation-receipt.json

      - name: Validate receipt and programme truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          receipt = json.loads((root / 'artifacts/c15/institution-reconciliation/institution-reconciliation-receipt.json').read_text())
          checkpoint = json.loads((root / 'institution_reconciliation_checkpoint.json').read_text())
          programme = json.loads((root / 'programme.json').read_text())
          institution = json.loads(Path('alpha_omega_v30/checkpoint_20260803.json').read_text())

          assert receipt['status'] == 'COMMERCIAL_INSTITUTION_RECONCILIATION_VERIFIED_SCOPE_BOUNDARIES_PRESERVED'
          assert all(receipt['checks'].values())
          assert receipt['commercial_projection']['verified_live_revenue_events'] == 0
          assert receipt['commercial_projection']['full_commercial_maturity'] is False
          assert receipt['scope_projection']['institution_v3_google_drive_publication'] == 'UNVERIFIED_SCOPE_HELD'
          assert receipt['scope_projection']['cloud_run_operation'] == 'NOT_PROVEN'
          assert checkpoint['status'] in {
              'IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'COMMERCIAL_INSTITUTION_RECONCILIATION_PROVIDER_VERIFIED',
          }
          assert checkpoint['programme_projection']['service_enabled_platform_first'] is True
          assert checkpoint['programme_projection']['self_service_saas_held'] is True
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['cloud_run_operation_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False
          assert programme['canonical_status'] == 'COMMERCIAL_READINESS_VERIFIED_EXTERNAL_MATURITY_GATES_OPEN'
          assert programme['external_gate_evidence'] == {}
          assert institution['provider_authority']['google_drive_write'] == 'UNVERIFIED'
          assert institution['provider_authority']['cloud_run'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/institution_reconciliation.py'),
              Path('alpha_omega_commercial/prove_institution_reconciliation.py'),
              Path('alpha_omega_commercial/test_institution_reconciliation.py'),
              Path('alpha_omega_commercial/institution_reconciliation_checkpoint.json'),
              Path('alpha_omega_commercial/artifacts/c15/institution-reconciliation'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable institution reconciliation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-institution-reconciliation-proof
          path: alpha_omega_commercial/artifacts/c15/institution-reconciliation
          if-no-files-found: error
          retention-days: 90
