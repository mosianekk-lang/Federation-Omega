name: FUSE Windows Execution Plane v1

on:
  pull_request:
    paths:
      - "windows_federation_plane/**"
      - "product/windows_lifecycle/**"
      - ".github/workflows/fuse-windows-execution-plane-v1.yml"
      - "governance/fuse_windows_execution_plane_v1.json"
      - "tests/test_fuse_windows_execution_plane_v1.py"
      - "tests/test_fuse_windows_product_lifecycle_binding_v1.py"
  workflow_dispatch:
    inputs:
      task:
        description: "Allowlisted Windows task"
        required: true
        type: choice
        default: health
        options: [health, inventory, hash_workspace_file, product_lifecycle_court]
      relative_path:
        description: "Repository-relative path for hash_workspace_file"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fuse-windows-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-plane:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FEDERATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FUSE_LIFECYCLE_COURT_SHA256: 55dec3033c284f0329fba4d4059d7749eaebf4fca408648dd83d000f69445a2a
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ (inputs.task || 'health') != 'product_lifecycle_court' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked relay test dependencies
        if: ${{ (inputs.task || 'health') != 'product_lifecycle_court' }}
        run: python -m pip install --require-hashes -r windows_federation_plane/requirements-relay.lock

      - name: Run Windows failure-first court
        if: ${{ (inputs.task || 'health') != 'product_lifecycle_court' }}
        run: ./windows_federation_plane/scripts/Test-FederationWindowsPlane.ps1

      - name: Execute allowlisted Windows task
        if: ${{ (inputs.task || 'health') != 'product_lifecycle_court' }}
        env:
          REQUESTED_TASK: ${{ inputs.task || 'health' }}
          REQUESTED_RELATIVE_PATH: ${{ inputs.relative_path || '' }}
        run: |
          $task = $env:REQUESTED_TASK
          if ($task -eq 'hash_workspace_file') {
            if (-not $env:REQUESTED_RELATIVE_PATH) { throw 'RELATIVE_PATH_REQUIRED' }
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -RelativePath $env:REQUESTED_RELATIVE_PATH -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          } else {
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          }

      - name: Verify immutable semantic receipt
        if: ${{ (inputs.task || 'health') != 'product_lifecycle_court' }}
        run: |
          $env:PYTHONPATH = "$PWD/windows_federation_plane/src"
          python -c "import json,sys; from federation_windows_plane.models import verify_receipt_mapping; verify_receipt_mapping(json.load(open(sys.argv[1], encoding='utf-8')), expected_source_sha=sys.argv[2])" windows_federation_plane/receipts/hosted-windows-receipt.json $env:FEDERATION_SOURCE_SHA

      - name: Verify sealed product lifecycle court
        if: ${{ inputs.task == 'product_lifecycle_court' }}
        run: |
          $court = 'product/windows_lifecycle/FUSE_TwoVersion_Windows_Lifecycle_Court_R10.zip'
          $actual = (Get-FileHash -LiteralPath $court -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FUSE_LIFECYCLE_COURT_SHA256) { throw 'LIFECYCLE_COURT_SHA256_MISMATCH' }

      - name: Execute sealed two-version product lifecycle court
        if: ${{ inputs.task == 'product_lifecycle_court' }}
        run: |
          $court = 'product/windows_lifecycle/FUSE_TwoVersion_Windows_Lifecycle_Court_R10.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'fuse-two-version-lifecycle-court'
          if (Test-Path $dst) { Remove-Item -LiteralPath $dst -Recurse -Force }
          Expand-Archive -LiteralPath $court -DestinationPath $dst
          & (Join-Path $dst 'court/run-two-version-lifecycle.ps1') | Out-Host
          Copy-Item -LiteralPath (Join-Path $dst 'court/native-windows-receipt.json') -Destination 'windows_federation_plane/receipts/hosted-windows-product-lifecycle-receipt.json'

      - name: Verify product lifecycle receipt and cleanup
        if: ${{ inputs.task == 'product_lifecycle_court' }}
        run: |
          $path = 'windows_federation_plane/receipts/hosted-windows-product-lifecycle-receipt.json'
          $r = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($r.schema -ne 'FUSE_TWO_VERSION_WINDOWS_LIFECYCLE_RECEIPT_V1') { throw 'LIFECYCLE_RECEIPT_SCHEMA_INVALID' }
          if ($r.result -ne 'PASS') { throw 'LIFECYCLE_RECEIPT_NOT_PASS' }
          if ($r.host_class -ne 'HOSTED_WINDOWS_GITHUB_ACTIONS') { throw 'HOST_CLASS_INVALID' }
          if ($r.owner_pc_proven -ne $false) { throw 'HOSTED_RUN_MUST_NOT_PROVE_OWNER_PC' }
          if ($r.code_signing_proven -ne $false) { throw 'HOSTED_RUN_MUST_NOT_PROVE_SIGNING' }
          if ($r.r9_sha256 -ne 'be02fba0a9f794d775e563eabefc01412f5975fee6dc12ae56b1060ae67a3979') { throw 'R9_HASH_MISMATCH' }
          if ($r.r10_sha256 -ne '63fc293db2dd945aa60943a3ec3b87d9230d171c3b5b76087aa0feb5ef9d1c18') { throw 'R10_HASH_MISMATCH' }
          $required = @('R9_INSTALL','R9_VERIFY','R9_CORRUPT_EXPECT_VERIFY_FAIL','R9_REPAIR','R9_VERIFY_AFTER_REPAIR','R10_UPGRADE','R10_VERIFY','R10_ROLLBACK','R9_VERIFY_AFTER_ROLLBACK','R10_UPGRADE_AGAIN','R10_VERIFY_AGAIN','R10_UNINSTALL')
          $observed = @($r.steps | ForEach-Object { $_.step })
          foreach ($s in $required) { if ($observed -notcontains $s) { throw "MISSING_LIFECYCLE_STEP:$s" } }
          foreach ($s in $r.steps) { if ($s.result -ne 'PASS') { throw "FAILED_LIFECYCLE_STEP:$($s.step)" } }
          $installRoot = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'FUSE/ControlCenter'
          if (Test-Path $installRoot) { throw 'FUSE_INSTALL_RESIDUE_PRESENT' }

      - name: Upload Windows execution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-plane-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows_federation_plane/receipts/hosted-windows-receipt.json
            windows_federation_plane/receipts/hosted-windows-product-lifecycle-receipt.json
          if-no-files-found: error
          retention-days: 7
