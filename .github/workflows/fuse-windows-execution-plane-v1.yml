name: FUSE Windows Execution Plane v1

on:
  pull_request:
    paths:
      - "windows_federation_plane/**"
      - ".github/workflows/fuse-windows-execution-plane-v1.yml"
      - "governance/fuse_windows_execution_plane_v1.json"
      - "tests/test_fuse_windows_execution_plane_v1.py"
  workflow_dispatch:
    inputs:
      task:
        description: "Allowlisted Windows task"
        required: true
        type: choice
        default: health
        options: [health, inventory, hash_workspace_file]
      relative_path:
        description: "Repository-relative path for hash_workspace_file"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fuse-windows-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-plane:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run Windows failure-first court
        run: ./windows_federation_plane/scripts/Test-FederationWindowsPlane.ps1

      - name: Execute allowlisted Windows task
        env:
          REQUESTED_TASK: ${{ inputs.task || 'health' }}
          REQUESTED_RELATIVE_PATH: ${{ inputs.relative_path || '' }}
        run: |
          $task = $env:REQUESTED_TASK
          if ($task -eq 'hash_workspace_file') {
            if (-not $env:REQUESTED_RELATIVE_PATH) { throw 'RELATIVE_PATH_REQUIRED' }
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -RelativePath $env:REQUESTED_RELATIVE_PATH -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          } else {
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          }

      - name: Verify immutable semantic receipt
        run: |
          $receipt = Get-Content windows_federation_plane/receipts/hosted-windows-receipt.json -Raw | ConvertFrom-Json
          if ($receipt.schema -ne 'FEDERATION-WINDOWS-RECEIPT-V1') { throw 'RECEIPT_SCHEMA_INVALID' }
          if ($receipt.state -ne 'COMPLETED_VERIFIED_LOCAL') { throw 'RECEIPT_STATE_INVALID' }
          if ($receipt.runner.os -ne 'Windows') { throw 'WINDOWS_RUNNER_NOT_PROVEN' }
          if (-not $receipt.runner.github_actions) { throw 'GITHUB_ACTIONS_HOST_NOT_PROVEN' }
          if ($receipt.effect -ne 'READ_ONLY') { throw 'UNEXPECTED_EFFECT' }
          if ($receipt.task_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'TASK_HASH_INVALID' }
          if ($receipt.result_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'RESULT_HASH_INVALID' }

      - name: Upload Windows execution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-plane-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows_federation_plane/receipts/hosted-windows-receipt.json
          if-no-files-found: error
          retention-days: 7
