name: FUSE Windows Execution Plane v1

on:
  pull_request:
    paths:
      - "windows_federation_plane/**"
      - "fuse_toka/**"
      - "fuse_toka_control_plane/**"
      - ".github/workflows/fuse-windows-execution-plane-v1.yml"
      - "governance/fuse_windows_execution_plane_v1.json"
      - "tests/test_fuse_windows_execution_plane_v1.py"
  workflow_dispatch:
    inputs:
      task:
        description: "Allowlisted Windows task"
        required: true
        type: choice
        default: health
        options: [health, inventory, hash_workspace_file]
      relative_path:
        description: "Repository-relative path for hash_workspace_file"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fuse-windows-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-plane:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FEDERATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked relay test dependencies
        run: python -m pip install --require-hashes -r windows_federation_plane/requirements-relay.lock

      - name: Compile F273 native relay diagnostic
        run: |
          $project = Join-Path $PWD 'windows_federation_plane\native\Fuse.Windows.Native.csproj'
          $diagOut = Join-Path $PWD 'windows_federation_plane\native\diag-out'
          Remove-Item -LiteralPath $diagOut -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish $project --nologo -c Release -r win-x64 --self-contained false -o $diagOut -p:Deterministic=true -p:ContinuousIntegrationBuild=true "-p:FederationSourceSha=$env:FEDERATION_SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'F273_DIAGNOSTIC_NATIVE_PUBLISH_FAILED' }
          $exe = Join-Path $diagOut 'Fuse.Windows.Native.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'F273_DIAGNOSTIC_NATIVE_EXE_MISSING' }

      - name: Run F273 Python relay unit court
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'windows_federation_plane\src'
          python -m unittest discover -s windows_federation_plane/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F273_PYTHON_RELAY_UNIT_COURT_FAILED' }

      - name: Run F273 hosted native relay adversarial court
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'windows_federation_plane\src'
          $env:FUSE_NATIVE_EXE = Join-Path $PWD 'windows_federation_plane\native\diag-out\Fuse.Windows.Native.exe'
          $env:FUSE_TEST_ALLOW_LOOPBACK_HTTP = '1'
          python -m unittest discover -s windows_federation_plane/tests -p 'test_native_relay_client.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F273_NATIVE_RELAY_ADVERSARIAL_COURT_FAILED' }

      - name: Run Windows failure-first court and native trunk proof
        run: ./windows_federation_plane/scripts/Test-FederationWindowsPlane.ps1

      - name: Upload native Windows trunk exact bytes and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-native-trunk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows_federation_plane/native/out/Fuse.Windows.Native.exe
            windows_federation_plane/native/out/Fuse.Windows.Native.dll
            windows_federation_plane/native/out/Fuse.Windows.Native.deps.json
            windows_federation_plane/native/out/Fuse.Windows.Native.runtimeconfig.json
            windows_federation_plane/native/artifacts/fuse-windows-native.zip
            windows_federation_plane/native/artifacts/native-build-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Execute allowlisted Windows task
        env:
          REQUESTED_TASK: ${{ inputs.task || 'health' }}
          REQUESTED_RELATIVE_PATH: ${{ inputs.relative_path || '' }}
        run: |
          $task = $env:REQUESTED_TASK
          if ($task -eq 'hash_workspace_file') {
            if (-not $env:REQUESTED_RELATIVE_PATH) { throw 'RELATIVE_PATH_REQUIRED' }
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -RelativePath $env:REQUESTED_RELATIVE_PATH -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          } else {
            ./windows_federation_plane/scripts/Invoke-FederationWindowsTask.ps1 -Task $task -ReceiptPath windows_federation_plane/receipts/hosted-windows-receipt.json
          }

      - name: Verify immutable semantic receipt
        run: |
          $env:PYTHONPATH = "$PWD/windows_federation_plane/src"
          python -c "import json,sys; from federation_windows_plane.models import verify_receipt_mapping; verify_receipt_mapping(json.load(open(sys.argv[1], encoding='utf-8')), expected_source_sha=sys.argv[2])" windows_federation_plane/receipts/hosted-windows-receipt.json $env:FEDERATION_SOURCE_SHA

      - name: Upload Windows execution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-windows-plane-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows_federation_plane/receipts/hosted-windows-receipt.json
          if-no-files-found: error
          retention-days: 7

  toka-windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned FUSE Toka build dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ./fuse_toka
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Run FUSE Toka regression tests
        run: python -m unittest discover -s fuse_toka/tests -v

      - name: Build FUSE Toka Windows executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FUSE-Toka --paths fuse_toka/src fuse_toka/src/fuse_toka_gui.py
          if (!(Test-Path dist/FUSE-Toka.exe)) { throw 'FUSE_TOKA_EXE_MISSING' }
          python -m PyInstaller --noconfirm --clean --onefile --name fuse-toka-cli --paths fuse_toka/src fuse_toka/src/fuse_toka_cli.py
          if (!(Test-Path dist/fuse-toka-cli.exe)) { throw 'FUSE_TOKA_CLI_EXE_MISSING' }

      - name: Smoke-test packaged CLI and write artifact hashes
        run: |
          ./dist/fuse-toka-cli.exe status
          if ($LASTEXITCODE -ne 0) { throw 'FUSE_TOKA_CLI_STATUS_FAILED' }
          ./dist/fuse-toka-cli.exe catalog | Out-File -Encoding utf8 dist/catalog-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'FUSE_TOKA_CLI_CATALOG_FAILED' }
          $gui = (Get-FileHash -Algorithm SHA256 dist/FUSE-Toka.exe).Hash.ToLowerInvariant()
          $cli = (Get-FileHash -Algorithm SHA256 dist/fuse-toka-cli.exe).Hash.ToLowerInvariant()
          @{source_sha='${{ github.event.pull_request.head.sha || github.sha }}';gui_sha256=$gui;cli_sha256=$cli} |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8 dist/fuse-toka-build-proof.json

      - name: Upload FUSE Toka Windows exact bytes and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuse-toka-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/FUSE-Toka.exe
            dist/fuse-toka-cli.exe
            dist/catalog-smoke.json
            dist/fuse-toka-build-proof.json
          if-no-files-found: error
          retention-days: 30
