name: Superior v0.4.0 Operator Extension

on:
  pull_request:
    paths:
      - 'operator_extensions/superior_v040/**'
      - 'tests/test_superior_v040_operator_extension.py'
      - 'contracts/superior_v040_operator_allowlist.json'
      - '.github/workflows/superior-v040-operator-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q operator_extensions/superior_v040 tests/test_superior_v040_operator_extension.py
      - name: Run failure-first and semantic tests
        run: python -m unittest -v tests/test_superior_v040_operator_extension.py
      - name: Verify locked A2 binding and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('contracts/superior_v040_operator_allowlist.json').read_text())
          assert contract['action']=='DEPLOY_SUPERIOR_V040_CANARY'
          assert contract['authorityClass']=='A2'
          assert contract['runtimeInstallation']=='PENDING_PROVIDER_CANARY'
          assert contract['externalEffectOnImport'] is False
          print('SOURCE_BINDING_PROVEN_RUNTIME_INSTALLATION_PENDING')
          PY
