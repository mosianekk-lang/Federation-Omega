name: EvidenceOps Sovereign Runtime

on:
  push:
    paths:
      - 'evidenceops/runtime_service/**'
      - 'evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json'
      - 'evidenceops/tests/test_runtime_service.py'
      - '.github/workflows/evidenceops-sovereign-runtime.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'africa-south1' }}
  SERVICE_NAME: evidenceops-sovereign-runtime

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evidenceops/runtime_service/requirements.txt
      - run: pytest -q evidenceops/tests/test_runtime_service.py
      - name: Build container
        run: docker build -t evidenceops-sovereign-runtime:canary evidenceops/runtime_service

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${{ vars.KIM_DATAVERSE_URL }}" ]]; then
            EXTRA_ARGS+=(--set-env-vars="KIM_DATAVERSE_URL=${{ vars.KIM_DATAVERSE_URL }}")
          fi
          if [[ -n "${{ vars.KIM_DATAVERSE_MISSION_TABLE }}" ]]; then
            EXTRA_ARGS+=(--set-env-vars="KIM_DATAVERSE_MISSION_TABLE=${{ vars.KIM_DATAVERSE_MISSION_TABLE }}")
          fi
          if [[ -n "${{ vars.KIM_DATAVERSE_SECRET_NAME }}" ]]; then
            EXTRA_ARGS+=(--set-secrets="KIM_DATAVERSE_ACCESS_TOKEN=${{ vars.KIM_DATAVERSE_SECRET_NAME }}:latest")
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project='${{ vars.GCP_PROJECT_ID }}' \
            --region="$GCP_REGION" \
            --source=evidenceops/runtime_service \
            --allow-unauthenticated \
            --quiet \
            "${EXTRA_ARGS[@]}"
      - name: Verify service and Dataverse state
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE_NAME" --project='${{ vars.GCP_PROJECT_ID }}' --region="$GCP_REGION" --format='value(status.url)')
          curl --fail --retry 10 --retry-delay 6 "$URL/health" | tee health.json
          python - <<'PY'
          import json
          data=json.load(open('health.json'))
          assert data['status']=='ok'
          assert data['active_contract']=='EMSIT-KDV-FEVX-IPFL-EVI-FPFE-v3.2'
          print(json.dumps(data, indent=2))
          PY
