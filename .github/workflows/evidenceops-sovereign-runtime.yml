name: EvidenceOps Sovereign Runtime

on:
  push:
    paths:
      - 'evidenceops/runtime_service/**'
      - 'evidenceops/runtime/ACTIVE_SOVEREIGN_TRANSLATOR.json'
      - 'evidenceops/runtime/kim_dataverse_inplace_bridge.json'
      - 'evidenceops/runtime/boundary_resolution_state.json'
      - 'evidenceops/tests/test_runtime_service.py'
      - 'evidenceops/tests/test_sovereign_runtime_production_readiness.py'
      - '.github/workflows/evidenceops-sovereign-runtime.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'africa-south1' }}
  SERVICE_NAME: evidenceops-sovereign-runtime

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r evidenceops/runtime_service/requirements.txt
      - name: Run runtime and private-reference regressions
        run: |
          pytest -q \
            evidenceops/tests/test_runtime_service.py \
            evidenceops/tests/test_sovereign_runtime_production_readiness.py
      - name: Build container
        run: docker build -t evidenceops-sovereign-runtime:canary evidenceops/runtime_service
      - name: Run container canary and verify non-disclosing health
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d \
            --name evidenceops-runtime-canary \
            -p 8080:8080 \
            -e KIM_CANONICAL_BACKEND_ID=ci-private-backend-reference \
            -e KIM_CANONICAL_RECEIPT_ID=ci-private-receipt-reference \
            -e KIM_CANONICAL_BACKEND_STATUS=WRITE_AND_READBACK_VERIFIED \
            evidenceops-sovereign-runtime:canary
          trap 'docker rm -f evidenceops-runtime-canary >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health > health.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          data = json.load(open('health.json', encoding='utf-8'))
          serialised = json.dumps(data, sort_keys=True)
          assert data['status'] == 'ok'
          assert data['active_contract'] == 'EMSIT-KDV-FEVX-IPFL-EVI-FPFE-v3.2'
          assert data['mission_delta_owner'] == 'WORKFORCE'
          assert data['canonical_backend']['verified'] is True
          assert data['canonical_backend']['identifier_present'] is True
          assert data['canonical_backend']['receipt_present'] is True
          assert data['canonical_backend']['private_values_echoed'] is False
          assert 'ci-private-backend-reference' not in serialised
          assert 'ci-private-receipt-reference' not in serialised
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - name: Persist test receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time
          paths = [
              'evidenceops/runtime_service/main.py',
              'evidenceops/runtime_service/active_manifest.json',
              'evidenceops/runtime_service/Dockerfile',
              'evidenceops/tests/test_runtime_service.py',
              'evidenceops/tests/test_sovereign_runtime_production_readiness.py',
          ]
          receipt = {
              'receipt_id': 'RCP-SOV-RUNTIME-CI-' + os.environ['GITHUB_RUN_ID'],
              'commit': os.environ['GITHUB_SHA'],
              'result': 'TESTS_CONTAINER_HEALTH_AND_NON_DISCLOSURE_VERIFIED',
              'canonical_backend_receipt_ref': 'KIM_CANONICAL_RECEIPT_ID',
              'private_values_persisted': False,
              'files': {
                  path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
                  for path in paths
              },
              'verified_at_epoch': int(time.time()),
          }
          pathlib.Path('sovereign-runtime-ci-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-runtime-ci-receipt
          path: |
            health.json
            sovereign-runtime-ci-receipt.json

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      ${{
        vars.GCP_RUNTIME_DEPLOY_ENABLED == 'true' &&
        vars.GCP_PROJECT_ID != '' &&
        vars.GCP_WIF_PROVIDER != '' &&
        vars.GCP_SERVICE_ACCOUNT != '' &&
        vars.KIM_CANONICAL_BACKEND_ID_SECRET_NAME != '' &&
        vars.KIM_CANONICAL_RECEIPT_ID_SECRET_NAME != '' &&
        vars.KIM_CANONICAL_STATUS_SECRET_NAME != ''
      }}
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy private Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=(
            --set-secrets="KIM_CANONICAL_BACKEND_ID=${{ vars.KIM_CANONICAL_BACKEND_ID_SECRET_NAME }}:latest,KIM_CANONICAL_RECEIPT_ID=${{ vars.KIM_CANONICAL_RECEIPT_ID_SECRET_NAME }}:latest,KIM_CANONICAL_BACKEND_STATUS=${{ vars.KIM_CANONICAL_STATUS_SECRET_NAME }}:latest"
          )
          if [[ -n "${{ vars.KIM_DATAVERSE_URL }}" ]]; then
            EXTRA_ARGS+=(--set-env-vars="KIM_DATAVERSE_URL=${{ vars.KIM_DATAVERSE_URL }}")
          fi
          if [[ -n "${{ vars.KIM_DATAVERSE_MISSION_TABLE }}" ]]; then
            EXTRA_ARGS+=(--set-env-vars="KIM_DATAVERSE_MISSION_TABLE=${{ vars.KIM_DATAVERSE_MISSION_TABLE }}")
          fi
          if [[ -n "${{ vars.KIM_DATAVERSE_SECRET_NAME }}" ]]; then
            EXTRA_ARGS+=(--set-secrets="KIM_DATAVERSE_ACCESS_TOKEN=${{ vars.KIM_DATAVERSE_SECRET_NAME }}:latest")
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project='${{ vars.GCP_PROJECT_ID }}' \
            --region="$GCP_REGION" \
            --source=evidenceops/runtime_service \
            --no-allow-unauthenticated \
            --quiet \
            "${EXTRA_ARGS[@]}"
      - name: Verify private service and canonical backend
        shell: bash
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project='${{ vars.GCP_PROJECT_ID }}' \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          TOKEN=$(gcloud auth print-identity-token --audiences="$URL")
          curl --fail --retry 10 --retry-delay 6 \
            -H "Authorization: Bearer $TOKEN" \
            "$URL/health" | tee deployed-health.json
          python - <<'PY'
          import json
          data = json.load(open('deployed-health.json', encoding='utf-8'))
          assert data['status'] == 'ok'
          assert data['active_contract'] == 'EMSIT-KDV-FEVX-IPFL-EVI-FPFE-v3.2'
          assert data['canonical_backend']['verified'] is True
          assert data['canonical_backend']['identifier_present'] is True
          assert data['canonical_backend']['receipt_present'] is True
          assert data['canonical_backend']['private_values_echoed'] is False
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-runtime-deployment-readback
          path: deployed-health.json
