name: Mosiane Live Thread CI

on:
  pull_request:
    paths:
      - 'superior_logic/live_thread.py'
      - 'superior_logic/live_thread_ui.py'
      - 'superior_logic/live_service.py'
      - 'tests/test_live_thread.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/live-thread-ci.yml'
      - '.github/workflows/live-thread-autodeploy.yml'
  push:
    branches:
      - main
    paths:
      - 'superior_logic/live_thread.py'
      - 'superior_logic/live_thread_ui.py'
      - 'superior_logic/live_service.py'
      - 'tests/test_live_thread.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/live-thread-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile live-thread modules
        run: python -m py_compile superior_logic/live_thread.py superior_logic/live_thread_ui.py superior_logic/live_service.py
      - name: Run live-thread regression tests
        run: python -m pytest -q tests/test_live_thread.py
