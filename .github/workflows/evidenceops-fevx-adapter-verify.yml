name: EvidenceOps FEVX Adapter Verify

on:
  pull_request:
    paths:
      - 'evidenceops/fevx_mcoe/PROVIDER_ACTIVATION_RECEIPT.json'
      - 'runtime/evidenceops_fevx_adapter/**'
      - '.github/workflows/evidenceops-fevx-adapter-verify.yml'
  push:
    branches: [main]
    paths:
      - 'evidenceops/fevx_mcoe/PROVIDER_ACTIVATION_RECEIPT.json'
      - 'runtime/evidenceops_fevx_adapter/**'
      - '.github/workflows/evidenceops-fevx-adapter-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidenceops-fevx-adapter-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-installed-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify provider evidence chain and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane-output/fevx
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          activation_path = Path('evidenceops/fevx_mcoe/PROVIDER_ACTIVATION_RECEIPT.json')
          root = Path('runtime/evidenceops_fevx_adapter')
          result_path = root / 'results/latest.json'
          heartbeat_path = root / 'heartbeat/latest.json'
          proof_path = root / 'proofs/proof_chain_head.json'
          state_path = root / 'state/actual_state.json'

          required = [activation_path, result_path, heartbeat_path, proof_path, state_path]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, {'missing_provider_evidence': missing}

          activation = json.loads(activation_path.read_text(encoding='utf-8'))
          result = json.loads(result_path.read_text(encoding='utf-8'))
          heartbeat = json.loads(heartbeat_path.read_text(encoding='utf-8'))
          proof = json.loads(proof_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))

          assert activation['provider_result'] == result_path.as_posix(), activation
          assert activation['provider_heartbeat'] == heartbeat_path.as_posix(), activation
          assert activation['provider_proof_chain'] == proof_path.as_posix(), activation
          assert activation['provider_state'] == state_path.as_posix(), activation

          assert result['status'] == 'VERIFIED', result
          assert result['provider'] == 'github_actions', result
          assert result['checks_passed'] == 20 and result['check_count'] == 20, result
          assert all(result['checks'].values()), result
          assert result['combined_module_count'] == 20, result
          assert result['rollback_test'] is True, result
          assert result['reapply_test'] is True, result
          assert result['idempotent_recurrence'] is True, result
          assert result['external_effect'] is False, result
          assert result['source_write'] is False, result
          assert result['verified_fact_write'] is False, result
          assert result['cross_case_access'] is False, result
          assert result['level_6_eligible'] is False, result
          assert result['real_case_accuracy_evidence'] is False, result

          assert heartbeat['runtime_state'] == 'OPERATIONAL', heartbeat
          assert heartbeat['verified'] is True, heartbeat
          assert heartbeat['drift'] == 'IN_SYNC', heartbeat
          assert heartbeat['external_effect'] is False, heartbeat
          assert heartbeat['source_write'] is False, heartbeat
          assert heartbeat['verified_fact_write'] is False, heartbeat

          assert state['runtime_state'] == 'OPERATIONAL', state
          assert state['integration_state'] == activation['integration_state'], state
          assert state['external_effect'] is False, state
          assert state['source_write'] is False, state
          assert state['verified_fact_write'] is False, state
          assert state['cross_case_access'] is False, state
          assert state['level_6_eligible'] is False, state

          proof_hashes = {
              result['provider_proof_hash'],
              heartbeat['provider_proof_hash'],
              proof['head_hash'],
          }
          proof_ids = {
              result['provider_proof_id'],
              heartbeat['provider_proof_id'],
              proof['proof_id'],
          }
          database_hashes = {
              result['database_dump_sha256'],
              heartbeat['database_dump_sha256'],
              state['database_dump_sha256'],
          }
          assert len(proof_hashes) == 1, proof_hashes
          assert len(proof_ids) == 1, proof_ids
          assert len(database_hashes) == 1, database_hashes
          assert result['provider_event']['repository'] == 'mosianekk-lang/Federation-Omega', result

          report = {
              'receipt': 'EVIDENCEOPS-FEVX-INSTALLED-STATE-VERIFICATION',
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': '${{ github.sha }}',
              'status': 'VERIFIED',
              'provider_proof_id': next(iter(proof_ids)),
              'provider_proof_hash': next(iter(proof_hashes)),
              'database_dump_sha256': next(iter(database_hashes)),
              'checks_passed': result['checks_passed'],
              'module_count': result['combined_module_count'],
              'external_effect': False,
              'source_write': False,
              'verified_fact_write': False,
              'repository_mutation_attempted': False,
              'truth_boundary': activation['truth_boundary'],
          }
          output = Path('control-plane-output/fevx/verification.json')
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

      - name: Upload immutable provider-state verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidenceops-fevx-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane-output/fevx/verification.json
          if-no-files-found: error
          retention-days: 90
