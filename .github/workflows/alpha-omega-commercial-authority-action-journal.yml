name: Alpha Omega Commercial Authority Action Journal Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-journal.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-action-journal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run journal safety and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute authority action journal proof
        run: >-
          python -m alpha_omega_commercial.prove_authority_action_journal
          --output artifacts

      - name: Validate contract checkpoint API and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'authority_action_journal_contract.json').read_text())
          checkpoint = json.loads((root / 'authority_action_journal_checkpoint.json').read_text())
          api = json.loads((root / 'canonical_commercial_api.json').read_text())
          receipt = json.loads(Path('artifacts/authority-action-journal-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-JOURNAL-V8'
          assert contract['stage_scope'] == ['C03', 'C11', 'C12', 'C13', 'C15']
          assert contract['depends_on']['pull_request'] == 130
          assert contract['depends_on']['merge_commit'] == 'ad135c04c0f1353b7b17476cbcb0b30faec22526'
          rules = contract['journal_rules']
          assert rules['legacy_jsonl_prefix_frozen'] is True
          assert rules['new_event_atomic_publication'] is True
          assert rules['one_event_per_file'] is True
          assert rules['event_filename_hash_bound'] is True
          assert rules['event_content_hash_bound'] is True
          assert rules['event_file_fsync'] is True
          assert rules['atomic_rename_required'] is True
          assert rules['journal_directory_fsync'] is True
          assert rules['incomplete_publication_removed_before_recovery'] is True
          assert rules['prepared_without_terminal_rolls_back_after_restart'] is True
          assert rules['published_event_tampering_fails_closed'] is True
          assert rules['legacy_and_new_event_chain_continuous'] is True
          assert rules['torn_transaction_event_visible_after_process_crash'] is False
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          assert api['api_id'] == 'AO-COMMERCIAL-CANONICAL-API-V3'
          journal_revision = 'AO-COMMERCIAL-AUTHORITY-ACTION-JOURNAL-V8'
          journal_class = 'JournalSafeAtomicAuthoritySnapshotCommercialControlPlane'
          assert journal_revision in api['capability_lineage']
          assert journal_class in api['canonical_lineage']
          assert api['current_capability_revision'] in api['capability_lineage']
          assert api['current_canonical_class'] in api['canonical_lineage']
          assert api['capability_lineage'].index(api['current_capability_revision']) <= api['capability_lineage'].index(journal_revision)
          assert api['canonical_lineage'].index(api['current_canonical_class']) <= api['canonical_lineage'].index(journal_class)
          assert api['authority_use']['atomic_transaction_event_publication_required'] is True
          assert api['authority_use']['legacy_transaction_jsonl_prefix_frozen'] is True
          assert api['authority_use']['transaction_event_filename_hash_bound'] is True
          assert api['authority_use']['transaction_event_content_hash_bound'] is True
          assert api['authority_use']['incomplete_event_publication_removed_before_recovery'] is True
          assert api['authority_use']['torn_transaction_event_visible_after_process_crash'] is False
          assert api['persistence']['authority_action_transaction_journal'] == 'ATOMIC_HASH_BOUND_EVENT_FILES_WITH_FROZEN_LEGACY_PREFIX'
          assert api['service_first_strategy'] == 'SERVICE_ENABLED_PLATFORM_BEFORE_SELF_SERVICE_SAAS'
          assert api['verified_live_revenue_events'] == 0
          assert api['full_commercial_maturity'] is False

          assert checkpoint['dependency_checkpoint']['preceding_pull_request'] == 130
          assert checkpoint['dependency_checkpoint']['preceding_merge_commit'] == 'ad135c04c0f1353b7b17476cbcb0b30faec22526'
          assert checkpoint['dependency_checkpoint']['preceding_drive_readback_verified'] is True
          assert checkpoint['status'] in {
              'AUTHORITY_ACTION_JOURNAL_IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'AUTHORITY_ACTION_JOURNAL_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED',
          }
          assert checkpoint['canonical_api_candidate']['current_capability_revision'] == journal_revision
          assert checkpoint['canonical_api_candidate']['current_canonical_class'] == journal_class
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['cloud_run_operation_proven'] is False
          assert checkpoint['commercial_truth']['payment_provider_operation_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert receipt['status'] == 'AUTHORITY_ACTION_JOURNAL_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          journal = receipt['journal_safety']
          assert journal['legacy_jsonl_prefix_frozen'] is True
          assert journal['new_event_atomic_publication'] is True
          assert journal['event_file_fsync'] is True
          assert journal['journal_directory_fsync'] is True
          assert journal['event_filename_hash_bound'] is True
          assert journal['event_content_hash_bound'] is True
          assert journal['incomplete_publication_removed_before_recovery'] is True
          assert journal['prepared_without_terminal_rolls_back_after_restart'] is True
          assert journal['torn_transaction_event_visible_after_process_crash'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_action_journal.py'),
              Path('alpha_omega_commercial/prove_authority_action_journal.py'),
              Path('alpha_omega_commercial/test_authority_action_journal.py'),
              Path('alpha_omega_commercial/authority_action_journal_contract.json'),
              Path('alpha_omega_commercial/authority_action_journal_checkpoint.json'),
              Path('alpha_omega_commercial/canonical_commercial_api.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable authority action journal proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-authority-action-journal-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
