name: KIOAS MetaExecutor Exact Source Repair Once

on:
  push:
    branches:
      - kioas/apps-script-authority-hardening-v1-20260903

permissions:
  contents: write

concurrency:
  group: kioas-metaexecutor-exact-source-repair-once
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_SHA256: 035984c7d41b92a1b86056c1a3d4e8c6394011be3462501d2407ce0dd6fa824a
  TARGET_PATH: apps_script/architron_hardening/MetaExecutor_v2_1.gs

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Restore exact source from deterministic embedded payload
        shell: bash
        env:
          SOURCE_GZIP_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,os,pathlib
          raw=gzip.decompress(base64.b64decode(os.environ['SOURCE_GZIP_B64']))
          raw.decode('utf-8')
          actual=hashlib.sha256(raw).hexdigest()
          expected=os.environ['EXPECTED_SOURCE_SHA256']
          if actual != expected:
              raise SystemExit(f'source sha mismatch: {actual} != {expected}')
          pathlib.Path(os.environ['TARGET_PATH']).write_bytes(raw)
          print(f'EXACT_SOURCE_VERIFIED {actual} bytes={len(raw)}')
          PY

      - name: Run failure-first KIOAS repair court
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_metaexecutor_authority_hardening.py
          git diff --check

      - name: Commit exact repair and self-delete one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Federation Omega Repair Bot"
          git config user.email "mosianekk@gmail.com"
          git rm .github/workflows/kioas-metaexecutor-exact-source-repair-once.yml
          git add "${TARGET_PATH}" tests/test_metaexecutor_authority_hardening.py
          git commit -m "KIOAS: complete exact UTF-8 MetaExecutor repair for PR #1128"
          git push origin "HEAD:${GITHUB_REF_NAME}"
