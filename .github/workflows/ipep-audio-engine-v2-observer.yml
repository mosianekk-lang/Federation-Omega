name: Observe IPEP Audio Engine v2 CI

on:
  workflow_run:
    workflows: ['IPEP Audio Engine v2 CI']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ipep-audio-engine-v2-observer
  cancel-in-progress: true

jobs:
  publish-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Write workflow observation
        env:
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_URL: ${{ github.event.workflow_run.html_url || github.server_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual_dispatch' }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          python - <<'PY' > deployment_receipts/ipep-audio-engine-v2-observation.json
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
            'receipt': 'IPEP-AUDIO-ENGINE-V2-WORKFLOW-OBSERVATION',
            'observed_at': datetime.now(timezone.utc).isoformat(),
            'run_id': os.environ['RUN_ID'],
            'run_url': os.environ['RUN_URL'],
            'conclusion': os.environ['RUN_CONCLUSION'],
            'source_sha': os.environ['SOURCE_SHA'],
            'repository_mutation_attempted': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload immutable observation
        uses: actions/upload-artifact@v4
        with:
          name: ipep-audio-engine-v2-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment_receipts/ipep-audio-engine-v2-observation.json
          if-no-files-found: error
          retention-days: 90
