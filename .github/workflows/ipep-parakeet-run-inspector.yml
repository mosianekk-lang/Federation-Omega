name: Inspect IPEP Parakeet Runtime Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipep-parakeet-run-inspector.yml'
      - 'ipep/audio_engine_v3/parakeet-inspector-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ipep-parakeet-run-inspector
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Query latest target workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p deployment_receipts
          gh api "repos/${REPOSITORY}/actions/workflows/ipep-parakeet-ctc-cpu-runtime.yml/runs?per_page=5" > /tmp/cpu-runs.json
          gh api "repos/${REPOSITORY}/actions/workflows/ipep-parakeet-ctc-cli-runtime.yml/runs?per_page=5" > /tmp/cli-runs.json
          gh api "repos/${REPOSITORY}/actions/workflows/ipep-parakeet-ctc-cli-runtime-v2.yml/runs?per_page=5" > /tmp/cli-v2-runs.json
          python - <<'PY' > /tmp/run_ids.txt
          import json
          for path in ['/tmp/cpu-runs.json','/tmp/cli-runs.json','/tmp/cli-v2-runs.json']:
              data=json.load(open(path,encoding='utf-8'))
              for run in data.get('workflow_runs',[]):
                  print(run['id'])
          PY
          : > /tmp/jobs.jsonl
          : > /tmp/artifacts.jsonl
          while read -r RUN_ID; do
            test -n "$RUN_ID" || continue
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" | jq -c --arg run_id "$RUN_ID" '{run_id:($run_id|tonumber),jobs:.jobs}' >> /tmp/jobs.jsonl
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" | jq -c --arg run_id "$RUN_ID" '{run_id:($run_id|tonumber),artifacts:.artifacts}' >> /tmp/artifacts.jsonl
          done < /tmp/run_ids.txt
          python - <<'PY' > deployment_receipts/ipep-parakeet-run-inspection-latest.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          jobs={}
          for line in Path('/tmp/jobs.jsonl').read_text().splitlines():
              row=json.loads(line); jobs[row['run_id']]=row['jobs']
          artifacts={}
          for line in Path('/tmp/artifacts.jsonl').read_text().splitlines():
              row=json.loads(line); artifacts[row['run_id']]=row['artifacts']

          def compact(path, workflow_file):
              data=json.load(open(path,encoding='utf-8'))
              out=[]
              for run in data.get('workflow_runs',[]):
                  rid=run['id']
                  job_rows=[]
                  for job in jobs.get(rid,[]):
                      job_rows.append({
                          'id':job.get('id'),
                          'name':job.get('name'),
                          'status':job.get('status'),
                          'conclusion':job.get('conclusion'),
                          'steps':[{
                              'number':s.get('number'),
                              'name':s.get('name'),
                              'status':s.get('status'),
                              'conclusion':s.get('conclusion')
                          } for s in job.get('steps',[])]
                      })
                  art_rows=[{
                      'id':a.get('id'),
                      'name':a.get('name'),
                      'size_in_bytes':a.get('size_in_bytes'),
                      'expired':a.get('expired'),
                      'digest':a.get('digest')
                  } for a in artifacts.get(rid,[])]
                  out.append({
                      'workflow_file':workflow_file,
                      'id':rid,
                      'name':run.get('name'),
                      'status':run.get('status'),
                      'conclusion':run.get('conclusion'),
                      'event':run.get('event'),
                      'head_sha':run.get('head_sha'),
                      'created_at':run.get('created_at'),
                      'updated_at':run.get('updated_at'),
                      'html_url':run.get('html_url'),
                      'jobs':job_rows,
                      'artifacts':art_rows,
                  })
              return out

          payload={
              'receipt':'IPEP-PARAKEET-DIRECT-RUN-INSPECTION',
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'cpu_runs':compact('/tmp/cpu-runs.json','ipep-parakeet-ctc-cpu-runtime.yml'),
              'cli_runs':compact('/tmp/cli-runs.json','ipep-parakeet-ctc-cli-runtime.yml'),
              'cli_v2_runs':compact('/tmp/cli-v2-runs.json','ipep-parakeet-ctc-cli-runtime-v2.yml'),
          }
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Publish inspection receipt
        run: |
          set -euo pipefail
          git config user.name 'ipep-parakeet-inspector[bot]'
          git config user.email 'ipep-parakeet-inspector[bot]@users.noreply.github.com'
          git add deployment_receipts/ipep-parakeet-run-inspection-latest.json
          git commit -m 'Record Parakeet runtime run inspection [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
