name: Alpha Omega Commercial Authority Action Idempotency Proof

on:
  pull_request:
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-idempotency.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_omega_commercial/**'
      - '.github/workflows/alpha-omega-commercial-authority-action-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-omega-commercial-authority-action-idempotency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile commercial package
        run: python -m compileall -q alpha_omega_commercial

      - name: Run idempotency and authority regression suite
        run: >-
          python -m unittest -v
          alpha_omega_commercial.test_authority_action_idempotency
          alpha_omega_commercial.test_authority_action_coordination
          alpha_omega_commercial.test_authority_action_journal
          alpha_omega_commercial.test_authority_action_crash_recovery
          alpha_omega_commercial.test_authority_action_atomicity
          alpha_omega_commercial.test_authority_snapshot_action_binding
          alpha_omega_commercial.test_authority_snapshot_anti_rollback
          alpha_omega_commercial.test_authority_snapshot_control_plane
          alpha_omega_commercial.test_governed_commercial_assurance

      - name: Execute authority action idempotency proof
        run: >-
          python -m alpha_omega_commercial.prove_authority_action_idempotency
          --output artifacts

      - name: Validate contract checkpoint and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial')
          contract = json.loads((root / 'authority_action_idempotency_contract.json').read_text())
          checkpoint = json.loads((root / 'authority_action_idempotency_checkpoint.json').read_text())
          receipt = json.loads(Path('artifacts/authority-action-idempotency-receipt.json').read_text())

          assert contract['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-IDEMPOTENCY-V10'
          assert contract['stage_scope'] == ['C03', 'C11', 'C12', 'C13', 'C15']
          assert contract['depends_on']['pull_request'] == 135
          assert contract['depends_on']['merge_commit'] == 'bc0982c176ea543799b9a12b98e136b3f0fc0285'
          assert contract['depends_on']['google_drive_release_readback_verified'] is True
          rules = contract['idempotency_rules']
          assert rules['object_identity_is_idempotency_key'] is True
          assert rules['canonical_intent_hash_required'] is True
          assert rules['exact_retry_returns_committed_record'] is True
          assert rules['exact_retry_consumes_owner_authority_again'] is False
          assert rules['exact_retry_creates_new_transaction'] is False
          assert rules['conflicting_object_identity_reuse_rejected'] is True
          assert rules['idempotency_seal_committed_inside_atomic_action'] is True
          assert rules['restart_safe'] is True
          assert rules['historical_unsealed_commit_replayed'] is False
          assert rules['tampered_seal_fails_closed'] is True
          assert rules['distributed_provider_exactly_once_proven'] is False
          assert contract['verified_live_revenue_events'] == 0
          assert contract['full_commercial_maturity'] is False

          dependency = checkpoint['dependency_checkpoint']
          assert dependency['preceding_pull_request'] == 135
          assert dependency['preceding_merge_commit'] == 'bc0982c176ea543799b9a12b98e136b3f0fc0285'
          assert dependency['preceding_drive_readback_verified'] is True
          assert dependency['programme_dependency_order_verified'] is True
          assert dependency['institution_state_preserved'] is True
          assert checkpoint['status'] in {
              'AUTHORITY_ACTION_IDEMPOTENCY_IMPLEMENTED_PROVIDER_PROOF_REQUIRED',
              'AUTHORITY_ACTION_IDEMPOTENCY_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED',
          }
          assert checkpoint['candidate_projection']['capability_revision'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-IDEMPOTENCY-V10'
          assert checkpoint['candidate_projection']['canonical_class'] == 'IdempotentCoordinatedAuthoritySnapshotCommercialControlPlane'
          assert all(value is False for value in checkpoint['external_gates'].values())
          assert checkpoint['commercial_truth']['verified_live_revenue_events'] == 0
          assert checkpoint['commercial_truth']['cloud_run_operation_proven'] is False
          assert checkpoint['commercial_truth']['payment_provider_operation_proven'] is False
          assert checkpoint['commercial_truth']['distributed_provider_exactly_once_proven'] is False
          assert checkpoint['commercial_truth']['full_commercial_maturity'] is False

          assert receipt['control_id'] == 'AO-COMMERCIAL-AUTHORITY-ACTION-IDEMPOTENCY-V10'
          assert receipt['status'] == 'AUTHORITY_ACTION_IDEMPOTENCY_PROVIDER_PROOF_VERIFIED_EXTERNAL_GATES_UNCHANGED'
          assert receipt['checks_required'] == len(receipt['checks'])
          assert receipt['checks_failed'] == 0
          assert all(receipt['checks'].values())
          safety = receipt['idempotency_safety']
          assert safety['exact_retry_returns_committed_record'] is True
          assert safety['retry_consumes_owner_authority_again'] is False
          assert safety['conflicting_object_identity_reuse_rejected'] is True
          assert safety['idempotency_seal_committed_in_atomic_transaction'] is True
          assert safety['restart_safe'] is True
          assert safety['distributed_provider_exactly_once_proven'] is False
          assert receipt['commercial_truth']['verified_live_revenue_events'] == 0
          assert receipt['commercial_truth']['cloud_run_operation_proven'] is False
          assert receipt['commercial_truth']['payment_provider_operation_proven'] is False
          assert receipt['commercial_truth']['full_commercial_maturity'] is False
          assert receipt['external_gate_effect'] == 'UNCHANGED'
          assert receipt['owner_authority']['financial_commitments'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['contracts'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['external_communications'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['consequential_releases'] == 'OWNER_RESERVED'
          assert receipt['owner_authority']['revenue_recognition'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          PY

      - name: Verify no secret-shaped values are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('alpha_omega_commercial/authority_action_idempotency.py'),
              Path('alpha_omega_commercial/prove_authority_action_idempotency.py'),
              Path('alpha_omega_commercial/test_authority_action_idempotency.py'),
              Path('alpha_omega_commercial/authority_action_idempotency_contract.json'),
              Path('alpha_omega_commercial/authority_action_idempotency_checkpoint.json'),
              Path('artifacts'),
          ]
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for root in roots:
              paths = root.rglob('*') if root.is_dir() else [root]
              for path in paths:
                  if path.is_file():
                      assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - name: Upload immutable authority action idempotency proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-omega-commercial-authority-action-idempotency-proof
          path: artifacts
          if-no-files-found: error
          retention-days: 90
