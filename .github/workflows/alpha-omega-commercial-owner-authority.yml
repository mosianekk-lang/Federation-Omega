name: Alpha Omega Commercial Owner Authority Receipts Proof

on:
  pull_request:
    paths:
      - "alpha_omega_commercial/owner_authority.py"
      - "alpha_omega_commercial/external_evidence.py"
      - "alpha_omega_commercial/test_external_evidence.py"
      - "alpha_omega_commercial/prove_external_evidence.py"
      - "alpha_omega_commercial/OWNER_AUTHORITY_RECEIPTS.md"
      - "alpha_omega_commercial/owner_authority_receipt_contract.json"
      - ".github/workflows/alpha-omega-commercial-owner-authority.yml"
  push:
    branches: [main]
    paths:
      - "alpha_omega_commercial/owner_authority.py"
      - "alpha_omega_commercial/external_evidence.py"
      - "alpha_omega_commercial/test_external_evidence.py"
      - "alpha_omega_commercial/prove_external_evidence.py"
      - "alpha_omega_commercial/OWNER_AUTHORITY_RECEIPTS.md"
      - "alpha_omega_commercial/owner_authority_receipt_contract.json"
      - ".github/workflows/alpha-omega-commercial-owner-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile owner authority controls
        run: python -m compileall -q alpha_omega_commercial

      - name: Run owner authority and external evidence tests
        working-directory: alpha_omega_commercial
        run: python -m unittest -v test_external_evidence.py

      - name: Execute fail-closed owner authority proof
        run: >-
          python alpha_omega_commercial/prove_external_evidence.py
          --output alpha_omega_commercial/artifacts/owner-authority-receipts

      - name: Validate operational proof and truth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('alpha_omega_commercial/artifacts/owner-authority-receipts')
          receipt = json.loads((root / 'external-evidence-admission-receipt.json').read_text())
          projection = json.loads((root / 'external-maturity-projection.json').read_text())
          authority = json.loads((root / 'commercial-provider-authority.json').read_text())

          assert receipt['status'] == 'OWNER_AUTHORITY_RECEIPT_CONTROL_VERIFIED_GATES_UNCHANGED'
          assert all(receipt['gates'].values())
          assert receipt['gates']['boolean_owner_confirmation_rejected']
          assert receipt['gates']['owner_decision_receipt_required']
          assert receipt['gates']['external_case_study_owner_receipt_required']
          assert not any(projection['external_gates'].values())
          assert not projection['full_commercial_maturity']
          assert projection['consumed_owner_receipts'] == {}
          assert projection['ledger_integrity']
          assert authority['owner_decision']['state'] == 'OWNER_RESERVED_PROVIDER_RECEIPT_REQUIRED'
          assert authority['payment_provider']['state'] == 'PROVIDER_BLOCKED_NO_FRESH_AUTHORITY'
          assert authority['cloud_run']['state'] == 'PROVIDER_BLOCKED_CANONICAL_IDENTITY_AUTHORITY_UNAVAILABLE'
          PY

      - name: Verify artifact contains no secret-shaped material
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('alpha_omega_commercial/artifacts/owner-authority-receipts')
          forbidden = re.compile(r'(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})')
          for path in root.rglob('*'):
              if path.is_file():
                  assert not forbidden.search(path.read_text(errors='ignore')), f'credential-shaped material in {path}'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-omega-commercial-owner-authority-receipts-proof
          path: alpha_omega_commercial/artifacts/owner-authority-receipts
          retention-days: 90
          if-no-files-found: error
