name: Federation Omega Operator Candidate CI
on:
  pull_request:
    paths:
      - "operator/federation-omega-operator/**"
      - ".github/workflows/federation-omega-operator-ci.yml"
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Static, regression, and contract proof
        working-directory: operator/federation-omega-operator
        run: |
          set -euo pipefail
          node --check src/wif-inventory.js
          node --check src/operator-service.js
          node --check src/http-app.js
          node --check src/server.js
          node --test
          node scripts/check-build-contract.mjs
      - name: Production-source credential leak guard
        working-directory: operator/federation-omega-operator
        run: |
          set -euo pipefail
          if grep -RInE '(iamcredentials|accessSecretVersion|private_key|privateKeyData|jwksJson|idpMetadataXml|trustStore|oauth2ClientId|secretEnv|substitutions)' src; then
            exit 1
          fi
