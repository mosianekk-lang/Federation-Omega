name: Live Bible Capture Reconciliation v2

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-bible-reconciliation-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Live Bible capture tests
        run: python -m unittest -v evidenceops.capability_heartbeat.tests.test_live_bible_capture

      - name: Reconcile GitHub source cursor
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m evidenceops.capability_heartbeat.reconcile_repository \
            --contract evidenceops/capability_heartbeat/live_bible_capture_contract.json \
            --state evidenceops/capability_heartbeat/live_bible_runtime/latest_state.json \
            --receipt evidenceops/capability_heartbeat/live_bible_runtime/latest_receipt.json

      - name: Verify no secret-shaped content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"AIza[0-9A-Za-z_-]{20,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          for path in Path("evidenceops/capability_heartbeat/live_bible_runtime").glob("*.json"):
              text = path.read_text(encoding="utf-8")
              assert not any(pattern.search(text) for pattern in patterns), path
          print("LIVE_BIBLE_SECRET_GUARD_OK")
          PY

      - name: Persist material reconciliation state
        run: |
          if git diff --quiet -- evidenceops/capability_heartbeat/live_bible_runtime; then
            echo "No material provider delta."
            exit 0
          fi
          git config user.name "federation-live-bible-worker"
          git config user.email "actions@users.noreply.github.com"
          git add evidenceops/capability_heartbeat/live_bible_runtime
          git commit -m "chore: persist Live Bible reconciliation state [skip ci]"
          git push
