apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kim-dataverse-gemini-connector
  labels:
    app.kubernetes.io/name: kim-dataverse-gemini-connector
    app.kubernetes.io/part-of: kim-dataverse
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      serviceAccountName: superior-logic-runtime@sov-hybrid-suite.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 300
      containers:
        - image: africa-south1-docker.pkg.dev/sov-hybrid-suite/federation-omega/kim-dataverse-gemini-connector:REPLACE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: KDV_PROVIDER
              value: vertex
            - name: GOOGLE_CLOUD_PROJECT
              value: sov-hybrid-suite
            - name: GOOGLE_CLOUD_LOCATION
              value: africa-south1
            - name: KDV_DEFAULT_MODEL
              value: gemini-2.5-flash
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 1
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
