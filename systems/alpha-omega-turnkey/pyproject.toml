[project]
name = "alpha-omega-turnkey-engine"
version = "1.1.0"
description = "Proof-bound concept-to-system engine with Formation-driven multi-path planning and safe multi-stream execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alpha-omega = "alpha_omega.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
