[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-autonomous-strategy"
version = "0.1.0"
description = "Stateful access-before-ask and predictive legal strategy engine"
requires-python = ">=3.11"

[project.scripts]
lex-strategy = "lex_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
