[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceops-audio-processing"
version = "2.0.0"
description = "Proof-carrying, provider-independent evidence audio processing for IPEP/EvidenceOps"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evidenceops-audio = "evidenceops_audio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidenceops_audio*"]
