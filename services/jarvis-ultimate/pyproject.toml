[project]
name = "jarvis-ultimate-federation"
version = "1.2.0"
description = "Governed interactive Gemini and Federation intelligence system"
requires-python = ">=3.11,<3.15"
dependencies = ["google-genai==2.6.0", "google-adk==2.1.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
jarvis = ["resources/*.json", "resources/*.html"]
