[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ultimate-federation"
version = "1.0.0"
description = "Governed interactive Gemini and Federation intelligence system"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.0.0", "google-adk>=2.0.0"]

[project.optional-dependencies]
google-workspace = ["google-auth>=2.0.0", "google-api-python-client>=2.0.0"]
test = ["pytest>=8.0.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
exclude = ["tests*", "web*"]

[tool.setuptools.package-data]
jarvis = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
