[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-omega"
version = "0.3.0"
description = "Defensive, evidence-first mobile threat-defense control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "google-cloud-firestore==2.30.0",
  "google-cloud-pubsub==2.40.0",
  "google-cloud-storage==3.13.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
