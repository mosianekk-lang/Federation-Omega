name: Release Federation Omega GCP Admin MCP v0.2.2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_FEDERATION_OMEGA_GCP_ADMIN_MCP_V022'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: federation-omega-gcp-admin-mcp-production
  cancel-in-progress: false

env:
  PROJECT_ID: sov-hybrid-suite
  PROJECT_NUMBER: '257649435135'
  REGION: africa-south1
  SERVICE: federation-omega-gcp-admin-mcp
  REPOSITORY: federation-omega
  DEPLOYER_SA: federation-omega-deployer@sov-hybrid-suite.iam.gserviceaccount.com
  RUNTIME_SA: federation-omega-admin@sov-hybrid-suite.iam.gserviceaccount.com
  WIF_PROVIDER: projects/257649435135/locations/global/workloadIdentityPools/github-federation-omega/providers/github
  GITHUB_REPOSITORY_ID: '1292795464'
  GITHUB_OWNER_ID: '261966700'

jobs:
  integrity:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require exact release request and immutable source
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'DEPLOY_FEDERATION_OMEGA_GCP_ADMIN_MCP_V022'
          test "$ACTUAL_REPOSITORY_ID" = "$GITHUB_REPOSITORY_ID"
          test "$ACTUAL_OWNER_ID" = "$GITHUB_OWNER_ID"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/release-gcp-admin-mcp-v022.yml@refs/heads/main"
          cd services/federation-omega-gcp-admin-mcp
          sha256sum -c RELEASE_MANIFEST.sha256

  authority:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Provider-native read-only authority proof
        run: services/federation-omega-gcp-admin-mcp/ops/verify_gcp_admin_mcp_wif.sh

  deploy:
    needs: [integrity, authority]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Submit one fenced transactional Cloud Build
        run: |
          set -euo pipefail
          release_fence="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          gcloud builds submit services/federation-omega-gcp-admin-mcp \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --config=services/federation-omega-gcp-admin-mcp/cloudbuild.v022.yaml \
            --substitutions="_RELEASE_FENCE=${release_fence},_REGION=${REGION},_SERVICE=${SERVICE},_RUNTIME_SA=${RUNTIME_SA},_ATTEST_PROJECT=${PROJECT_ID},_ATTEST_REGION=${REGION},_ATTEST_SERVICE=${SERVICE},_SERVER_VERSION=0.2.2"
