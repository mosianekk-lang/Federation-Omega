[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfbe-chatperf"
version = "1.0.0"
description = "Proof-gated controls for resilient, observable chat and agent workstreams"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cfbe-chatperf = "cfbe_chatperf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
