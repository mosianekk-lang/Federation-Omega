<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatBridge Companion Ω4.9 settings</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:16px/1.5 system-ui;color:#17211f}label{display:block;margin:18px 0}input[type=number]{width:180px;padding:7px}button{padding:9px 15px;border:0;border-radius:8px;background:#10a37f;color:white}small{display:block;color:#52605d}.notice{padding:12px;border:1px solid #ccd8d4;border-radius:8px;background:#f6faf8}</style></head>
<body><h1>ChatBridge Companion Ω4.9</h1><p class="notice">The adapter stores the governed rendered conversation ledger in extension-local storage, with append-only revisions and a SHA-256 event chain. It does not claim access to hidden provider events. Press <strong>Alt+Shift+B</strong> to checkpoint and <strong>Alt+Shift+E</strong> to export the current ledger.</p><form id="settings"><label><input id="autoSend" type="checkbox"> Automatically deliver ordered restore packets in the successor chat</label><label>Maximum characters per replay packet <input id="maxReplayChars" type="number" min="12000" max="120000" step="1000"><small>Default: 28,000</small></label><label>Pre-limit token estimate <input id="tokenThreshold" type="number" min="8000" max="200000" step="1000"></label><label>Pre-limit rendered message count <input id="messageThreshold" type="number" min="20" max="500" step="10"></label><label>Write-ahead capture interval in milliseconds <input id="captureIntervalMs" type="number" min="10000" max="300000" step="5000"></label><button type="submit">Save settings</button> <span id="status" role="status"></span></form><script src="options.js"></script></body></html>
